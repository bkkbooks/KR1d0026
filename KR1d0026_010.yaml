body:
  text: 覲禮第十覲禮第十覲禮至于郊王使人皮辨用璧勞侯氏亦皮辨迎于帷門之外再拜使者不答拜遂執玉三揖至于階使者不讓先升侯氏升聽命降再拜稽首遂升受玉使者左還而立侯氏還璧使者受侯氏降再拜稽首使者乃出侯氏乃止使者使者乃入侯氏與之讓升侯氏先升授几侯氏拜送几使者設几答拜侯氏用束帛乘馬儐使者使者再拜受侯氏再拜送幣使者降以左驂出侯氏送于門外再拜侯氏遂從之天子賜舍曰伯父女順命于王所賜伯父舍侯氏再拜稽首儐之束帛乘馬天子使大夫戒曰某日伯父帥乃初事侯氏再拜稽首諸侯前朝皆受舍于朝同姓西面北上異姓東面北上侯氏裨冕釋幣于禰乘墨車載龍旗弧韣乃朝以瑞玉有繅天子設斧依於戶牖之閒左右几天子袞冕負斧依嗇夫承命告于天子天子曰非他伯父實來豫一人嘉之伯父其入豫一人將受之侯氏入門右坐奠圭再拜稽首擯者謁侯氏坐取圭升致命王受之玉侯氏降階東北面再拜稽首擯者延之曰升升成拜乃出四享皆束帛加璧庭實唯國所有奉束帛匹馬卓上九馬隨之中庭西上奠幣再拜稽首擯者曰豫一人將受之侯氏升致命王撫玉侯氏降自西階東面授宰幣西階前再拜稽首以馬出授人九馬隨之事畢乃右肉袒于廟門之東乃入門右北面立告聽事擯者謁諸天子天子辭於侯氏曰伯父無事歸寧乃邦侯氏再拜稽首出自屏南適門西遂入門左北面立王勞之再拜稽首擯者延之曰升升成拜降出天子賜侯氏以車服迎于外門外再拜路先設西上路下四亞之重賜無數在車南諸公奉篋服加命書于其上升自西階東面大史是右侯氏升西面立大史述命侯氏降兩階之閒北面再拜稽首升成拜大史加書于服上侯氏受使者出侯氏送再拜儐使者諸公賜服者束帛四馬儐大史亦如之同姓大國則曰伯父其異姓則曰伯舅同姓小邦則曰叔父其異姓則曰叔舅饗禮乃歸諸侯覲于天子為宮方三百步四門壇十有二尋深四尺加方明于其上方明者木也方四尺設六色東方青南方赤西方白北方黑上玄下黃設六玉上圭下璧南方璋西方琥北方璜東方圭上介皆奉其君之旗置于宮尚左公侯伯子男皆就其旗而立四傳擯天子乘龍載大旗象日月升龍降龍出拜日於東門之外反祀方明禮日於南門外禮月與四瀆於北門外禮山川丘陵於西門外祭天燔柴祭山丘陵升祭川沈祭地瘞記几俟于東箱偏駕不入王門奠圭于繅上
