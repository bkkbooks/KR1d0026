body:
  text: 燕禮第六燕禮第六燕禮小臣戒與者膳宰具官饌于寢東樂人縣設洗篚于阼階東南當東霤罍水在東篚在洗西南肆設膳篚在其北西面司宮尊于東楹之西兩方壺左玄酒南上公尊瓦大兩有豐幂用綌若錫在尊南南上尊士旅食于門西兩圜壺司宮筵賓于戶西東上無加席也射人告具小臣設公席于阼階上西鄉設加席公升即位于席西鄉小臣納卿大夫卿大夫皆入門右北面東上士立于西方東面北上祝史立于門東北面東上小臣師一人在東堂下南面士旅食者立于門西東上公降立于阼階之東南南鄉爾卿卿西面北上爾大夫大夫皆少進射人請賓公曰命某為賓射人命賓賓少進禮辭反命又命之賓再拜稽首許諾射人反命賓出立于門外東面公揖卿大夫乃升就席小臣自阼階下北面請執幂者與羞膳者乃命執幂者執幂者升自西階立於尊南北面東上膳宰請羞于諸公卿者射人納賓賓入及庭公降一等揖之公升就席賓升自西階主人亦升自西階賓右北面至再拜賓答再拜主人降洗洗南西北面賓降階西東面主人辭降賓對主人北面盥坐取觚洗賓少進辭洗主人坐奠觚于篚興對賓反位主人卒洗賓揖乃升主人升賓拜洗主人賓右奠觚答拜降盥賓降主人辭賓對卒盥賓揖升主人升坐取觚執幂者舉幂主人酌膳執幂者反幂主人筵前獻賓賓西階上拜筵前受爵反位主人賓右拜送爵膳宰薦脯醢賓升筵膳宰設折俎賓坐左執爵右祭脯醢奠爵于薦右興取肺坐絶祭嚌之興加于俎坐挩手執爵遂祭酒興席末坐啐酒降席坐奠爵拜告旨執爵興主人答拜賓西階上北面坐卒爵興坐奠爵遂拜主人答拜賓以虛爵降主人降賓洗南坐奠觚少進辭降主人東面對賓坐取觚奠于篚下盥洗主人辭洗賓坐奠觚于篚興對卒洗及階揖升主人升拜洗如賓禮賓降盥主人降賓辭降卒盥揖升酌膳執幂如初以酢主人于西階上主人北面拜受爵賓主人之左拜送爵主人坐祭不啐酒不拜酒不告旨遂卒爵興坐奠爵拜執爵興賓答拜主人不崇酒以虛爵降奠于篚賓降立于西階西射人升賓賓升立于序內東面主人盥洗象觚升實之東北面獻于公公拜受爵主人降自西階阼階下北面拜送爵士薦脯醢膳宰設折俎升自西階公祭如賓禮膳宰贊授肺不拜酒立卒爵坐奠爵拜執爵興主人答拜升受爵以降奠于膳篚更爵洗升酌膳酒以降酢于阼階下北面坐奠爵再拜稽首公答再拜主人坐祭遂卒爵再拜稽首公答再拜主人奠爵于篚主人盥洗升媵觚于賓酌散西階上坐奠爵拜賓賓降筵北面答拜主人坐祭遂飲賓辭卒爵拜賓答拜主人降洗賓降主人辭降賓辭洗卒洗揖升不拜洗主人酌膳賓西階上拜受爵于筵前反位主人拜送爵賓升席坐祭酒遂奠于薦東主人降復位賓降筵西東南面立小臣自阼階下請媵爵者公命長小臣作下大夫二人媵爵媵爵者阼階下皆北面再拜稽首公答再拜媵爵者立于洗南西面北上序進盥洗角觶升自西階序進酌散交于楹北降阼階下皆奠觶再拜稽首執觶興公答再拜媵爵者皆坐祭遂卒觶興坐奠觶再拜稽首執觶興公答再拜媵爵者執觶待于洗南小臣請致者若君命皆致則序進奠觶于篚阼階下皆再拜稽首公答再拜媵爵者洗象觶升實之序進坐奠于薦南北上降阼階下皆再拜稽首送觶公答再拜公坐取大夫所媵觶興以酬賓賓降西階下再拜稽首公命小臣辭賓升成拜公坐奠觶答再拜執觶興立卒觶賓下拜小臣辭賓升再拜稽首公坐奠觶答再拜執觶興賓進受虛爵降奠于篚易觶洗公有命則不易不洗反升酌膳觶下拜小臣辭賓升再拜稽首公答再拜賓以旅酬於西階上射人作大夫長升受旅賓大夫之右坐奠觶拜執觶興大夫答拜賓坐祭立飲卒觶不拜若膳觶也則降更觶洗升實散大夫拜受賓拜送大夫辨受酬如受賓酬之禮不祭卒受者以虛觶降奠于篚主人洗升實散獻卿于西階上司宮兼卷重席設于賓左東上卿升拜受觚主人拜送觚卿辭重席司宮徹之乃薦脯醢卿升席坐左執爵右祭脯醢遂祭酒不啐酒降席西階上北面坐卒爵興坐奠爵拜執爵興主人答拜受爵卿降復位辨獻卿主人以虛爵降奠于篚射人乃升卿卿皆升就席若有諸公則先卿獻之如獻卿之禮席于阼階西北面東上無加席小臣又請媵爵者二大夫媵爵如初請致者若命長致則媵爵者奠觶于篚一人待于洗南長致致者阼階下再拜稽首公答再拜洗象觶升實之坐奠于薦南降與立于洗南者二人皆再拜稽首送觶公答再拜公又行一爵若賓若長唯公所酬以旅于西階上如初大夫卒受者以虛觶降奠于篚主人洗升獻大夫于西階上大夫升拜受觚主人拜送觚大夫坐祭立卒爵不拜既爵主人受爵大夫降復位胥薦主人于洗北西面脯醢無脀辨獻大夫遂薦之繼賓以西東上卒射人乃升大夫大夫皆升就席席工于西階上少東樂正先升北面立于其西小臣納工工四人二瑟小臣左何瑟面鼓執越內弦右手相入升自西階北面東上坐小臣坐授瑟乃降工歌鹿鳴四牡皇皇者華卒歌主人洗升獻工工不興左瑟一人拜受爵主人西階上拜送爵薦脯醢使人相祭卒受不拜主人受爵衆工不拜受爵坐祭遂卒爵辨有脯醢不祭主人受爵降奠于篚公又舉奠觶唯公所賜以旅于西階上如初卒笙入立于縣中奏南陔白華華黍主人洗升獻笙于西階上一人拜盡階不升堂受爵降主人拜送爵階前坐祭立卒爵不拜既爵升授主人衆笙不拜受爵降坐祭立卒爵辨有脯醢不祭乃閒歌魚麗笙由庚歌南有嘉魚笙崇丘歌南山有臺笙由儀遂歌鄉樂周南關雎葛覃卷耳召南鵲巢采蘩采蘋大師告于樂正曰正歌備樂正由楹內東楹之東告于公乃降復位射人自阼階下請立司正公許射人遂為司正司正洗角觶南面坐奠于中庭升東楹之東受命西階上北面命卿大夫君曰以我安卿大夫皆對曰諾敢不安司正降自西階南面坐取觶升酌散降南面坐奠觶右還北面少立坐取觶興坐不祭卒觶奠之興再拜稽首左還南面坐取觶洗南面反奠于其所升自西階東楹之東請徹俎降公許告于賓賓北面取俎以出膳宰徹公俎降自阼階以東卿大夫皆降東面北上賓反入及卿大夫皆說屨升就席公以賓及卿大夫皆坐乃安羞庶羞大夫祭薦司正升受命皆命君曰無不醉賓及卿大夫皆興對曰諾敢不醉皆反坐主人洗升獻士于西階上士長升拜受觶主人拜送觶士坐祭立飲不拜既爵其他不拜坐祭立飲乃薦司正與射人一人司士一人執幂二人立于觶南東上辨獻士士既獻者立于東方西面北上乃薦士祝史小臣師亦就其位而薦之主人就旅食之尊而獻之旅食不拜受爵坐祭立飲若射則大射正為司射如鄉射之禮賓降洗升媵觚于公酌散下拜公降一等小臣辭賓升再拜稽首公答再拜賓坐祭卒爵再拜稽首公答再拜賓降洗象觶升酌膳坐奠于薦南降拜小臣辭賓升成拜公答再拜賓反位公坐取賓所媵觶興唯公所賜受者如初受酬之禮降更爵洗升酌膳下拜小臣辭升成拜公答拜乃就席坐行之有執爵者唯受于公者拜司正命執爵者爵辨卒受者興以酬士大夫卒受者以爵興西階上酬士士升大夫奠爵拜士答拜大夫立卒爵不拜實之士拜受大夫拜送士旅于西階上辨士旅酌卒主人洗升自西階獻庶子于阼階上如獻士之禮辨降洗遂獻左右正與內小臣皆於阼階上如獻庶子之禮無算爵士也有執膳爵者有執散爵者執膳爵者酌以進公公不拜受執散爵者酌以之公命所賜所賜者興受爵降席下奠爵再拜稽首公答拜受賜爵者以爵就席坐公卒爵然後飲執膳爵者受公爵酌反奠之受賜爵者興授執散爵執散爵者乃酌行之唯受爵於公者拜卒受爵者興以酬士于西階上士升大夫不拜乃飲實爵士不拜受爵大夫就席士旅酌亦如之公有命徹幂則卿大夫皆降西階下北面東上再拜稽首公命小臣辭公答再拜大夫皆辟遂升反坐士終旅於上如初無算樂宵則庶子執燭於阼階上司宮執燭於西階上甸人執大燭於庭𨵽人為燭於門外賓醉北面坐取其薦脯以降奏陔賓所執脯以賜鍾人于門內霤遂出卿大夫皆出公不送公與客燕曰寡君有不腆之酒以請吾子之與寡君須臾焉使某也以請對曰寡君君之私也君無所辱賜于使臣臣敢辭寡君固曰不腆使某固以請寡君君之私也君無所辱賜于使臣臣敢固辭寡君固曰不腆使某固以請某固辭不得命敢不從致命曰寡君使某有不腆之酒以請吾子之與寡君須臾焉君貺寡君多矣又辱賜于使臣臣敢拜賜命記燕朝服於寢其牲狗也亨于門外東方若與四方之賓燕則公迎之于大門內揖讓升賓為苟敬席于阼階之西北面有脀不嚌肺不啐酒其介為賓無膳尊無膳爵與卿燕則大夫為賓與大夫燕亦大夫為賓羞膳者與執幂者皆士也羞卿者小膳宰也若以樂納賓則賓及庭奏肆夏賓拜酒主人答拜而樂闋公拜受爵而奏肆夏公卒爵主人升受爵以下而樂闋升歌鹿鳴下管新宮笙入三成遂合鄉樂若舞則勺唯公與賓有俎獻公曰臣敢奏爵以聽命凡公所辭皆栗階凡栗階不過二等凡公所酬既拜請旅侍臣凡薦與羞者小膳宰也有內羞君與射則為下射袒朱襦樂作而后就物小臣以巾授矢稍屬不以樂志既發則小臣受弓以授弓人上射退于物一笴既發則答君而俟若飲君燕則夾爵君在大夫射則肉袒若與四方之賓燕媵爵曰臣受賜矣臣請贊執爵者相者對曰吾子無自辱焉有房中之樂
