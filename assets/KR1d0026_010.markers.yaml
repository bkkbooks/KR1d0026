  - {type: variant, offset: 765, length: 0, content: '', SBCK: 置於宮者建之豫爲其君見王之位也諸公中階之前北面東上諸侯東階之東西面北上諸伯西階之西東面北上諸子門東北面東上諸男門西北面東上尚左建旂公東上侯先伯伯先子子先男而位皆上東方也諸侯入壝門或左或右各就其旂而立王降階南郷見之三揖土揖庶姓時揖異姓天揖同姓見揖位乃定古文尚作上}
