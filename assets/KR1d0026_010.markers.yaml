  - {type: variant, offset: 794, length: 0, content: '', SBCK: 此謂㑹同以春者也馬八尺以上爲龍大斾大常也王建大常縿首畫日月其下及旒交畫升龍降龍朝事儀曰天子冕而執鎮圭尺有二寸繅籍尺有二寸搢大圭乗大路建大常十有二旒樊纓十有二就貳車十有二乗帥諸侯而朝日於東郊所以教尊尊也退而朝諸侯由此二者言之己祀方明乃以㑹同之禮見諸侯也凡㑹同者不恊而盟司盟職曰凡􅀖國有疑㑹同則掌其盟約之載書及其禮儀北面詔明神旣盟則藏之言北面詔明神則明神有象也象者其方明乎及盟時又加於壇上乃以載辭告焉詛祝掌其祝號}
