  - {type: variant, offset: 768, length: 0, content: '', SBCK: 王旣揖五者升壇設擯升諸侯以㑹同之禮其奠瑞玉及享幣公拜於上等侯伯於中等子男於下等擯者毎延之升堂致命王受玉撫玉降拜於下等及請事勞皆如覲禮是以記之覲云四傳擯者毎一位畢擯者以告乃更陳列而升其次公也侯也伯也各一位子男俠門而俱東上亦一位也至庭乃設擯則諸侯初入門王官之伯帥之耳古文傳作􅀓}
