  - {type: variant, offset: 818, length: 0, content: '', SBCK: 此謂㑹同以夏冬秋者也變拜言禮者客祀也禮月於北郊者月太隂之精以爲地神也盟神必云日月山川焉者尚著明也詩曰謂子不信有如皦日春秋傳曰縱子忘之山川神祗其忘諸乎比皆用明神爲信也}
