  - {type: variant, offset: 695, length: 0, content: '', SBCK: 四時朝覲受之於廟此謂時㑹殷同也宫謂壝土爲埒以象墻壁也爲宫者於國外春㑹同則於東方夏㑹同則於南方秋㑹同則於西方冬㑹同則於北方八尺曰㝷十有二㝷則方九十六尺也深謂髙也從上曰深司儀職曰爲壇三成成猶重也三重者自下差之爲三等而上有堂焉堂上方二丈四尺上等中等下等毎面十二尺方明者上下四方神明之象也上下四方之神者所謂神明也㑹同而盟明神監之則謂之天之司盟有象者猶宗廟之有主乎王廵守至于方嶽之下諸侯㑹之亦爲此宫以見之司儀職曰將㑹諸侯則㑹爲壇三成宫旁一門詔王儀南郷見諸侯也}
