  - {type: variant, offset: 833, length: 1, content: 記, SBCK: 升沉必就祭者也就祭則是謂王廵守及諸侯之盟祭也其盟愒其著明者燔柴升沉瘞祭禮終矣備矣郊特牲曰郊之祭也迎長日之至也大報天而主日也宗伯職曰以實柴祀日月星辰則燔柴祭天謂祭日也柴爲祭日則祭地􅄟者祭月也日月而云天地靈之也王制曰王廵守至於岱宗柴是王廵守之盟其神主日也春秋傳曰晉文公爲踐土之盟而傳云山川之神是諸侯之盟其神主山川也月者太隂之精上爲天使臣道莫貴焉是王官之伯㑹諸侯而盟其神主月與古文􅄟作殪設}
