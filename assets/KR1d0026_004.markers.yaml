  - {type: variant, offset: 1567, length: 0, content: '', SBCK: 閒代也謂一歌則一吹六者皆小雅篇也魚麗言太平年豐物多也此采其物多酒旨所以優賔也南有嘉魚言太平君子有酒樂與賢者共之也此采其能以禮下賢者賢者纍蔓而歸之與之燕樂也南山有臺言太平之治以賢者爲本此采其愛友賢者爲􅀖家之基民之父母旣欲其身之壽考又欲其名德之長也由庚崇丘由儀今亡其義未聞}
