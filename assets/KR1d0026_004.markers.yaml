  - {type: variant, offset: 1586, length: 0, content: '', SBCK: 合樂謂歌樂與衆聲俱作周南召南國風篇也王后國君夫人房中之樂歌也關雎言后妃之德葛覃言后妃之職卷耳言后妃之志鵲巢言國君夫人之德采蘩言國君夫人不失職采蘋言卿大夫之妻能脩其法度昔大王王季居于岐山之陽躬行召南之教以興王業及文王而行周南之教以受命大雅云刑于寡妻至于兄弟以御于家􅀖謂此也其始一國耳文王作邑于豐以故地爲卿士之采地乃分爲二國周周公罰所食召召公所食於時文王三分天下有其巳一德化被于南土是以其詩有仁賢之風者屬之召南焉有聖人之風者屬之周南焉夫婦之道生民之本王政之端此六篇者其教之原也故國君與其臣下及四方之賔燕用之合樂也鄕樂者風也小雅爲諸侯之樂大雅頌爲天子之樂鄕飮酒升歌小雅禮盛者可以進取也燕合鄕樂禮輕者可以逮下也春秋傳曰肆夏繫遏渠天子所以享元侯也文王大明緜兩君相見之樂也然則諸侯相與燕升歌大雅合小雅天子與次國小國之君燕亦如之與大國之君燕升歌頌合大雅其笙間之篇未聞}
