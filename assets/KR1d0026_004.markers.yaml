  - {type: variant, offset: 28, length: 0, content: '', SBCK: 謂諸侯之鄕大夫也先生鄕中致仕者賔介處士賢者周禮大司徒之職以鄕三物教萬民而賔興之一曰六德知仁聖義忠和二曰六行孝友睦姻任恤三曰六藝禮樂射御書數鄕大夫以正月之吉受法于司徒退而頒之于其鄕吏使各以教其所治以考其德行察其道藝及三年大比而興賢者能者鄕老及鄕大夫帥其吏與其衆寡以禮禮賔之厥明獻賢能之書於王是禮乃三年正月而一行也諸侯之鄕大夫貢士於其君蓋如此云古者年七十而致仕老於鄕里大夫名曰父師士名曰少師而敎學焉恒知鄕人之賢者是以大夫就而謀之賢者爲賔其次爲介又其次爲衆賔而與之飮酒是亦將獻之以禮禮賔之也今郡國十月行此飮酒禮以黨正毎歲􅀖索􅀑神而祭祀則以禮屬民而飮酒于序以正齒位之􅀃然此篇無正齒位之事焉凡鄉黨飮酒必於民聚之時欲其見化知尚賢尊長也孟子曰天下有逹尊三爵也德也齒也主人}
