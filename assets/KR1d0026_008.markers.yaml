  - {type: variant, offset: 1067, length: 0, content: '', SBCK: 擯謂主國之君所使出接賔者也紹繼也其位相承繼而出也主君公也則擯者五人侯伯也則擯者四人子男也則擯者三人聘義曰介紹而傳命君子於其所尊不敢質敬之至也旣知其所爲來之事復請之者賔來當與主君爲禮爲其謙不敢厈尊者啓發以進之於是時賔出次直闑西北面上擯在闑東閾外西面其相去也公之使者七十歩侯伯之使者五十歩子男之使者三十歩此旅擯耳不傳命上介在賔西北東面承擯在上擯東南西面各自次序而下末介末擯旁相去三丈六尺上擯之請事進南面揖賔俱前賔至末介上擯至末擯亦相去三丈六尺止揖而請事還入告于公天子諸侯朝覲乃命介紹傳命耳其儀各鄉本受命反面傳而下及末則鄉受之反面傳而上又受命傳而下亦如之此三丈六尺者門容二徹參个旁加各一歩也今文無擯}
