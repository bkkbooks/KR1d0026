  - {type: variant, offset: 4456, length: 0, content: '', SBCK: 祖始也旣受聘享之禮行出國門止陳車􅀐釋酒脯之奠於軷爲行始也詩傳曰軷道祭也謂祭道路之神春秋傳曰軷渉山川然則軷山行之名也道路以險阻爲難是以委土爲山或伏牲其上使者爲軷祭酒脯祈告也卿大夫處者於是餞之飲酒於其側禮畢乗車轢之而遂行舎於近郊矣其牲犬羊可也古文軷作祓}
