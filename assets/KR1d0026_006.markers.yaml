  - {type: variant, offset: 1739, length: 0, content: '', SBCK: 三者皆小雅篇也鹿鳴君與臣下及四方之賔宴講道修政之樂歌也此采其巳有旨酒以召嘉賔嘉賔旣來示我以善道又樂嘉賔有孔昭之明德可則傚也四牡君勞使臣之來樂歌也此采其勤苦王事念將父母懷歸傷悲忠孝之至以勞賔也皇皇者華君遣使臣之樂歌也此采其更自勞苦自以爲不及欲諮謀於賢知而以自光明也}
