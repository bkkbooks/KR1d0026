  - {type: variant, offset: 1836, length: 0, content: '', SBCK: 以笙播此三篇之詩縣中縣中央也鄕飮酒禮曰磬南北面奏南陔白華華􅁰皆小雅篇也今亡其義未聞昔周之興也周公制禮作樂采時世之詩以爲樂歌所以通情相風切也其有此篇明矣後世衰微幽厲尤甚禮樂之書稍稍廢棄孔子曰吾自衛反魯然後樂正雅頌各得其所謂當時在者而復重雜亂者也惡能存其亡者乎且正考父校商之名頌十二篇于周大師歸以祀其先王至孔子二百年之間五篇而巳此其信也}
