  - {type: 'tls:seg', offset: 1939, content: '', id: KR1d0026_CHANT_006-19a.11}
  - {type: variant, offset: 1939, length: 0, content: '', SBCK: 周南召南國風篇也王后國君夫人房中之樂歌也􅀜雎言后妃之德􅁑覃言后妃之職卷耳言后妃之志鵲巢言國君夫人之德采蘩言國君夫人不失職也采蘋言卿大夫之妻能修其法度也昔大王王季居于岐山之陽躬行召南之敎以興王業及文王而行周南之敎以受命大雅云刑于寡妻至于兄弟以御于家􅀖謂此也其始一國爾文王作邑于豐以故地爲􅀸士之采地乃分爲二國周周公所食也召召公所食也於時文王三分天下有其二德化􅀍于南土是以其詩有仁賢之風者屬之召南焉有聖人之風者屬之周南焉夫婦之道者生民之本王政之端此六篇者其敎之原也故國君與其臣下及四方之賔燕用之合樂也鄕樂者風也小雅爲諸侯之樂大雅頌爲天子之樂鄕飮酒升歌小雅禮盛者可以進取燕合鄕樂者禮輕者可以逮下也春秋傳曰肆夏䌓遏渠天子所以享元侯也文王大明緜兩君相見之樂也然則諸侯相與燕升歌大雅合小稚也天子與次國小國之君燕亦如之與大國之君燕升歌頌合大雅其笙間之篇未聞}
  - {type: page-break, offset: 1939, content: '', id: KR1d0026_SBCK_006-13a}
  - {type: variant, offset: 1939, length: 0, content: '', krp: 周南召南國風篇也王后國君夫人房中之樂歌也關雎言后妃之德葛覃言后妃之職卷耳言后妃之志鵲巢言國君夫人之德采蘩言國君夫人不失職也采蘋言卿大夫之妻能修其法度也昔大王王季居于岐山之陽躬行召南之敎以興王業及文王而行周南之敎以受命大雅云刑于寡妻至于兄弟以御于家邦謂此也其始一國爾文王作邑于豐以故地爲卿士之采地乃分爲二國周周公所食也召召公所食也於時文王三分天下有其二德化𬒳于南土是以其詩有仁賢之風者屬之召南焉有聖人之風者屬之周南焉夫婦之道者生民之本王政之端此六篇者其敎之原也故國君與其臣下及四方之賔燕用之合樂也鄕樂者風也小雅爲諸侯之樂大雅頌爲天子之樂鄕飮酒升歌小雅禮盛者可以進取燕合鄕樂者禮輕者可以逮下也春秋傳曰肆夏䌓遏渠天子所以享元侯也文王大明緜兩君相見之樂也然則諸侯相與燕升歌大雅合小稚也天子與次國小國之君燕亦如之與大國之君燕升歌頌合大雅其笙間之篇未聞}
