  - {type: variant, offset: 283, length: 0, content: '', SBCK: 盈手曰搹搹扼也中人之扼圍九寸以五分一爲殺者象五服之數也爵謂天子諸侯􅀸大夫士也無爵謂庻人也擔猶假也無爵者假之以杖尊其爲主也非主謂衆子也屬猶著也通屈一條繩爲武垂下爲纓著之冠也布八十縷爲升升字當爲登登成也今之禮皆以登爲升俗誤巳行久矣雜記曰䘮冠條屬以別吉凶三年之練冠亦條屬右縫小功以下左縫外畢者冠前後屈而出縫於武也二十兩曰溢爲米一升二十四分升之一楣謂之梁柱楣所謂梁闇䟽猶麤也舎外寢於中門之外屋下壘墼爲之不􅂗墍所謂堊室也素猶故也謂復平生時食也斬衰不書受月者天子諸侯卿大夫士虞卒哭異數}
