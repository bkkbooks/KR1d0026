  - {type: variant, offset: 4099, length: 0, content: '', SBCK: 朋友雖無親有同道之恩相爲服緦之絰帶檀弓曰羣居則絰出則否其服弔服也周禮曰凡弔當事則弁絰服弁絰者如爵弁而素加環絰也其服有三錫衰也緦衰也疑衰也王爲三公六􅀸錫衰爲諸侯緦衰爲大夫士疑衰諸侯及􅀸大夫亦以錫衰爲弔服當事乃弁絰否則皮弁辟天子也士以緦衰爲䘮服其弔服則疑衰也舊􅀃以爲士弔服布上素下或曰素委貌冠加朝服論語曰緇衣羔裘又曰羔裘玄冠不以弔何朝服之有乎然則二者皆有似也此實疑衰也其弁絰皮弁之時則如􅀸大夫然又改其裳以素辟諸侯也朋友之相爲服卽上弔服疑衰素裳庶人不爵弁則其弔服素冠委貌}
  - {type: page-break, offset: 4099, content: '', id: KR1d0026_SBCK_011-25a}
