body:
  text: 聘禮第八聘禮第八聘禮君與卿圖事遂命使者使者再拜稽首辭君不許乃退既圖事戒上介亦如之宰命司馬戒衆介衆介皆逆命不辭宰書幣命宰夫官具及夕幣使者朝服帥衆介夕管人布幕于寢門外官陳幣皮北首西上加其奉於左皮上馬則北面奠幣于其前使者北面衆介立于其左東上卿大夫在幕東西面北上宰入告具于君君朝服出門左南鄉史讀書展幣宰執書告備具于君授使者使者受書授上介公揖入官載其幣舍于朝上介視載者所受書以行厥明賓朝服釋幣于禰有司筵几于室中祝先入主人從入主人在右再拜祝告又再拜釋幣制玄纁束奠于几下出主人立于戶東祝立于牖西又入取幣降卷幣實于笲埋于西階東又釋幣于行遂受命上介釋幣亦如之上介及衆介俟于使者之門外使者載旜帥以受命于朝君朝服南鄉卿大夫西面北上君使卿進使者使者入及衆介隨入北面東上君揖使者進之上介立于其左接聞命賈人西面坐啓櫝取圭垂繅不起而授宰宰執圭屈繅自公左授使者使者受圭同面垂繅以受命既述命同面授上介上介受圭屈繅出授賈人衆介不從受享束帛加璧受夫人之聘璋享玄纁束帛加琮皆如初遂行舍于郊斂旜若過邦至于竟使次介假道束帛將命于朝曰請帥奠幣下大夫取以入告出許遂受幣餼之以其禮上賓大牢積唯芻禾介皆有餼士帥沒其竟誓于其竟賓南面上介西面衆介北面東上史讀書司馬執策立于其後未入竟一肄為壝壇畫階帷其北無宮朝服無主無執也介皆與北面西上習享士執庭實習夫人之聘享亦如之習公事不習私事及竟張旜誓乃謁關人關人問從者幾人以介對君使士請事遂以入入竟斂旜乃展布幕賓朝服立于幕東西面介皆北面東上賈人北面坐拭圭遂執展之上介北面視之退復位退圭陳皮北首西上又拭璧展之會諸其幣加于左皮上上介視之退馬則幕南北面奠幣于其前展夫人之聘享亦如之賈人告于上介上介告于賓有司展群幣以告及郊又展如初及館展幣於賈人之館如初賓至于近郊張旜君使下大夫請行反君使卿朝服用束帛勞上介出請入告賓禮辭迎于舍門之外再拜勞者不答拜賓揖先入受于舍門內勞者奉幣入東面致命賓北面聽命還少退再拜稽首受幣勞者出授老幣出迎勞者勞者禮辭賓揖先入勞者從之乘皮設賓用束錦儐勞者勞者再拜稽首受賓再拜稽首送幣勞者揖皮出乃退賓送再拜夫人使下大夫勞以二竹簋方玄被纁裏有蓋其實棗蒸栗擇兼執之以進賓受棗大夫二手授栗賓之受如初禮儐之如初下大夫勞者遂以賓入至于朝主人曰不腆先君之祧既拚以俟矣賓曰俟間大夫帥至于館卿致館賓迎再拜卿致命賓再拜稽首卿退賓送再拜宰夫朝服設飧飪一牢在西鼎九羞鼎三腥一牢在東鼎七堂上之饌八西夾六門外米禾皆二十車薪芻倍禾上介飪一牢在西鼎七羞鼎三堂上之饌六門外米禾皆十車薪芻倍禾衆介皆少牢厥明訝賓于館賓皮辨聘至于朝賓入于次乃陳幣卿為上擯大夫為承擯士為紹擯擯者出請事公皮辨迎賓于大門內大夫納賓賓入門左公再拜賓辟不答拜公揖入每門每曲揖及廟門公揖入立于中庭賓立接西孰几筵既設擯者出請命賈人東面坐啓櫝取圭垂繅不起而授上介上介不襲執圭屈繅授賓賓襲執圭擯者入告出辭玉納賓賓入門左介皆入門左北面西上三揖至于階三讓公升二等賓升西楹西東面擯者退中庭賓致命公左還北鄉擯者進公當楣再拜賓三退負序公側襲受玉于中堂與東楹之間擯者退負東孰而立賓降介逆出賓出公側授宰玉裼降立擯者出請賓裼奉束帛加璧享擯者入告出許庭實皮則攝之毛在內內攝之入設也賓入門左揖讓如初升致命張皮公再拜受幣士受皮者自後右客賓出當之坐攝之公側授宰幣皮如入右首而東聘于夫人用璋享用琮如初禮若有言則以束帛如享禮擯者出請事賓告事畢賓奉束錦以請覿擯者入告出辭請禮賓賓禮辭聽命擯者入告宰夫徹几改筵公出迎賓以入揖讓如初公升側受几于序端宰夫內拂几三奉兩端以進公東南鄉外拂几三卒振袂中攝之進西鄉擯者告賓進訝受几于筵前東面俟公一拜送賓以几辟北面設几不降階上答再拜稽首宰夫實觶以醴加柶于觶面枋公側受醴賓不降一拜進筵前受醴復位公拜送醴宰夫薦籩豆脯醢賓升筵擯者退負東孰賓祭脯醢以柶祭醴三庭實設降筵北面以柶兼諸觶尚擸坐啐醴公用束帛建柶北面奠于薦東擯者進相幣賓降辭幣公降一等辭栗階升聽命降拜公辭升再拜稽首受幣當東楹北面退東面俟公一拜賓降也公再拜賓執左馬以出上介受賓幣從者訝受馬賓覿奉束錦總乘馬二人贊入門右北面奠幣再拜稽首擯者辭賓出擯者坐取幣出有司二人牽馬以從出門西面于東孰南擯者請受賓禮辭聽命牽馬右之入設賓奉幣入門左介皆入門左西上公揖讓如初升公北面再拜賓三退反還負序振幣進授當東楹北面士受馬者自前還牽者後適其右受牽馬者自前西乃出賓降階東拜送君辭拜也君降一等辭擯者曰寡君從子雖將拜起也栗階升公西鄉賓階上再拜稽首公少退賓降出公側授宰幣馬出公降立擯者出請上介奉束錦士介四人皆奉玉錦束請覿擯者入告出許上介奉幣儷皮二人贊皆入門右東上奠幣皆再拜稽首擯者辭介逆出擯者執上幣士執衆幣有司二人舉皮從其幣出請受委皮南面執幣者西面北上擯者請受介禮辭聽命皆進訝受其幣上介奉幣皮先入門左奠皮公再拜介振幣自皮西進北面授幣退復位再拜稽首送幣介出宰自公左受幣有司二人坐舉皮以東擯者又納士介士介入門右奠幣再拜稽首擯者辭介逆出擯者執上幣以出禮請受賓固辭公答再拜擯者出立于門中以相拜士介皆辟士三人東上坐取幣立擯者進宰夫受幣于中庭以東執幣者序從之擯者出請賓告事畢擯者入告公出送賓及大門內公問君賓對公再拜公問大夫賓對公勞賓賓再拜稽首公答拜公勞介介皆再拜稽首公答拜賓出公再拜送賓不顧賓請有事於大夫公禮辭許賓即館卿大夫勞賓賓不見大夫奠鴈再拜上介受勞上介亦如之君使卿韋辨歸饔餼五牢上介請事賓朝服禮辭有司入陳饔飪一牢鼎九設于西階前陪鼎當內廉東面北上上當碑南陳牛羊豕魚臘腸胃同鼎膚鮮魚鮮臘設扃冪膷臐膮蓋陪牛羊豕腥二牢鼎二七無鮮魚鮮臘設于阼階前西面南陳如飪鼎二列堂上八豆設于戶西西陳皆二以並東上韭菹其南醓醢屈八簋繼之黍其南稷錯六鉶繼之牛以西羊豕豕南牛以東羊豕兩簠繼之粱在北八壺設于西序北上二以並南陳西夾六豆設于西墉下北上韭菹其東醓醢屈六簋繼之黍其東稷錯四鉶繼之牛以南羊羊東豕豕以北牛兩簠繼之粱在西皆二以並南陳六壺西上二以並東陳饌于東方亦如之西北上壺東上西陳醯醢百甕夾碑十以為列醯在東餼二牢陳于門西北面東上牛以西羊豕豕西牛羊豕米百筥筥半斛設于中庭十以為列北上黍粱稻皆二行稷四行門外米三十車車秉有五籔設于門東為三列東陳禾三十車車三秅設于門西西陳薪芻倍禾賓皮辨迎大夫于外門外再拜大夫不答拜揖入及廟門賓揖入大夫奉束帛入三揖皆行至于階讓大夫先升一等賓從升堂北面聽命大夫東面致命賓降階西再拜稽首拜餼亦如之大夫辭升成拜受幣堂中西北面大夫降出賓降授老幣出迎大夫大夫禮辭許入揖讓如初賓升一等大夫從升堂庭實設馬乘賓降堂受老束錦大夫止賓奉幣西面大夫東面賓致幣大夫對北面當楣再拜稽首受幣于楹間南面退東面俟賓再拜稽首送幣大夫降執左馬以出賓送于外門外再拜明日賓拜于朝拜饔與餼皆再拜稽首上介饔餼三牢飪一牢在西鼎七羞鼎三腥一牢在東鼎七堂上之饌六西夾亦如之筥及甕如上賓餼一牢門外米禾視死牢牢十車薪芻倍禾凡其實與陳如上賓下大夫韋辨用束帛致之上介韋辨以受如賓禮儐之兩馬束錦士介四人皆餼大牢米百筥設于門外宰夫朝服牽牛以致之士介朝服北面再拜稽首受無擯賓朝服問卿卿受于祖廟下大夫擯擯者出請事大夫朝服迎于外門外再拜賓不答拜揖大夫先入每門每曲揖及廟門大夫揖入擯者請命庭實設四皮賓奉束帛入三揖皆行至于階讓賓升一等大夫從升堂北面聽命賓東面致命大夫降階西再拜稽首賓辭升成拜受幣堂中西北面賓降出大夫降授老幣無擯擯者出請事賓面如覿幣賓奉幣庭實從入門右大夫辭賓遂左庭實設揖讓如初大夫升一等賓從之大夫西面賓稱面大夫對北面當楣再拜受幣于楹間南面退西面立賓當楣再拜送幣降出大夫降授老幣擯者出請事上介特面幣如覿介奉幣皮二人贊入門右奠幣再拜大夫辭擯者反幣庭實設介奉幣入大夫揖讓如初介升大夫再拜受介降拜大夫降辭介升再拜送幣擯者出請衆介面如覿幣入門右奠幣皆再拜大夫辭介逆出擯者執上幣出禮請受賓辭大夫答再拜擯者執上幣立于門中以相拜士介皆辟老受擯者幣于中庭士三人坐取群幣以從之擯者出請事賓出大夫送于外門外再拜賓不顧擯者退大夫拜辱下大夫嘗使至者幣及之上介朝服三介問下大夫下大夫如卿受幣之禮其面如賓面于卿之禮大夫若不見君使大夫各以其爵為之受如主人受幣禮不拜夕夫人使下大夫韋辨歸禮堂上籩豆六設于戶東西上二以並東陳壺設于東序北上二以並南陳醙黍清皆兩壺大夫以束帛致之賓如受饔之禮儐之乘馬束錦上介四豆四籩四壺受之如賓禮儐之兩馬束錦明日賓拜禮於朝大夫餼賓大牢米八筐賓迎再拜老牽牛以致之賓再拜稽首受老退賓再拜送上介亦如之衆介皆少牢米六筐皆士牽羊以致之公於賓一食再饗燕與羞俶獻無常數賓介皆明日拜于朝上介一食一饗若不親食使大夫各以其爵朝服致之以侑幣如致饔無儐致饗以酬幣亦如之大夫於賓一饗一食上介若食若饗若不親饗則公作大夫致之以酬幣致食以侑幣君使卿皮辨還玉于館賓皮辨襲迎于外門外不拜帥大夫以入大夫升自西階鉤楹賓自碑內聽命升自西階自左南面受圭退負右房而立大夫降中庭賓降自碑內東面授上介于阼階東上介出請賓迎大夫還璋如初入賓裼迎大夫賄用束紡禮玉束帛乘皮皆如還玉禮大夫出賓送不拜公館賓賓辟上介聽命聘享夫人之聘享問大夫送賓公皆再拜公退賓從請命于朝公辭賓退賓三拜乘禽於朝訝聽之遂行舍于郊公使卿贈如覿幣受于舍門外如受勞禮無儐使下大夫贈上介亦如之使士贈衆介如其覿幣大夫親贈如其面幣無儐贈上介亦如之使人贈衆介如其面幣士送至于竟使者歸及郊請反命朝服載旜禳乃入乃入陳幣于朝西上上賓之公幣私幣皆陳上介公幣陳他介皆否束帛各加其庭實皮左公南鄉卿進使者使者執圭垂繅北面上介執璋屈繅立于其左反命曰以君命聘于某君某君受幣于某宮某君再拜以享某君某君再拜宰自公左受玉受上介璋致命亦如之執賄幣以告曰某君使某子賄授宰禮玉亦如之執禮幣以盡言賜禮公曰然而不善乎授上介幣再拜稽首公答再拜私幣不告君勞之再拜稽首君答再拜若有獻則曰某君之賜也君其以賜乎上介徒以公賜告如上賓之禮君勞之再拜稽首君答拜勞士介亦如之君使宰賜使者幣使者再拜稽首賜介介皆再拜稽首乃退介皆送至于使者之門乃退揖使者拜其辱釋幣于門乃至于禰筵几于室薦脯醢觴酒陳席于阼薦脯醢三獻一人舉爵獻從者行酬乃出上介至亦如之聘遭喪入竟則遂也不郊勞不筵几不禮賓主人畢歸禮賓唯饔餼之受不賄不禮玉不贈遭夫人世子之喪君不受使大夫受于廟其他如遭君喪遭喪將命于大夫主人長衣練冠以受聘君若薨于後入竟則遂赴者未至則哭于巷衰于館受禮不受饗食赴者至則衰而出唯稍受之歸執圭復命于殯升自西階不升堂子即位不哭辨復命如聘子臣皆哭與介入北鄉哭出袒括髮入門右即位踊若有私喪則哭于館衰而居不饗食歸使衆介先衰而從之賓入竟而死遂也主人為之具而殯介攝其命君弔介為主人主人歸禮幣必以用介受賓禮無辭也不饗食歸介復命柩止于門外介卒復命出奉柩送之君弔卒殯若大夫介卒亦如之士介死為之棺斂之君不弔焉若賓死未將命則既斂于棺造于朝介將命若介死歸復命唯上介造于朝若介死雖士介賓既復命往卒殯乃歸小聘曰問不享有獻不及夫人主人不筵几不禮面不升不郊勞其禮如為介三介記久無事則聘焉若有故則卒聘束帛加書將命百名以上書於策不及百名書於方主人使人與客讀諸門外客將歸使大夫以其束帛反命于館明日君館之既受行出遂見宰問幾月之資使者既受行日朝同位出祖釋軷祭酒脯乃飲酒于其側所以朝天子圭與繅皆九寸剡上寸半厚半寸博三寸繅三采六等朱白倉問諸侯朱緑繅八寸皆玄纁繫長尺絢組問大夫之幣俟于郊為肆又齎皮馬辭無常孫而説辭多則史少則不達辭苟足以達義之至也辭曰非禮也敢對曰非禮也敢辭卿館於大夫大夫館於士士館於工商管人為客三日具沐五日具浴飧不致賓不拜沐浴而食之卿大夫訝大夫士訝士皆有訝賓即館訝將公命又見之以其摯賓既將公事復見之以其摯凡四器者唯其所寶以聘可也宗人授次次以帷少退于君之次上介執圭如重授賓賓入門皇升堂讓將授志趨授如爭承下如送君還而后退下階發氣怡焉再三舉足又趨及門正焉執圭入門鞠躬焉如恐失之及享發氣焉盈容衆介北面蹌焉私覿愈愈焉出如舒鴈皇且行入門主敬升堂主慎凡庭實隨入左先皮馬相間可也賓之幣唯馬出其餘皆東多貨則傷于德幣美則沒禮賄在聘于賄凡執玉無藉者襲禮不拜至醴尊于東箱瓦大一有豐薦脯五膱祭半膱橫之祭醴再扱始扱一祭卒再祭主人之庭實則主人遂以出賓之士訝受之既覿賓若私獻奉獻將命擯者入告出禮辭賓東面坐奠獻再拜稽首擯者東面坐取獻舉以入告出禮請受賓固辭公答再拜擯者立于閾外以相拜賓辟擯者授宰夫于中庭若兄弟之國則問夫人若君不見使大夫受自下聽命自西階升受負右房而立賓降亦降不禮幣之所及皆勞不釋服賜饔唯羹飪筮一尸若昭若穆僕為祝祝曰孝孫某孝子某薦嘉禮于皇祖某甫皇考某子如饋食之禮假器於大夫朌肉及廋車聘日致饔明日問大夫夕夫人歸禮既致饔旬而稍宰夫始歸乘禽日如其饔餼之數士中日則二雙凡獻執一雙委其餘于面禽羞俶獻比歸大禮之日既受饔餼請觀訝帥之自下門入各以其爵朝服士無饔無饔者無擯大夫不敢辭君初為之辭矣凡致禮皆用其饗之加籩豆無饔者無饗禮凡餼大夫黍粱稷筐五斛既將公事賓請歸凡賓拜于朝訝聽之燕則上介為賓賓為苟敬宰夫獻無行則重賄反幣曰子以君命在寡君寡君拜君命之辱君以社稷故在寡小君拜君貺寡君延及二三老拜又拜送賓於館堂楹間釋四皮束帛賓不致主人不拜大夫來使無罪饗之過則餼之其介為介有大客後至則先客不饗食致之唯大聘有几筵十斗曰斛十六斗曰籔十籔曰秉二百四十斗四秉曰筥十筥曰稯十稯曰秅四百秉為一秅
