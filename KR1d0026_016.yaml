body:
  text: 少牢饋食禮第十六少牢饋食禮第十六少牢饋食之禮日用丁己筮旬有一日筮於廟門之外主人朝服西面于門東史朝服左執筮右抽上韇兼與筮執之東面受命于主人主人曰孝孫某來日丁亥用薦歲事于皇祖伯某以某妃配某氏尚饗史曰諾西面于門西抽下韇左執筮右兼執韇以擊筮遂述命曰假爾大筮有常孝孫某來日丁亥用薦歲事于皇祖伯某以某妃配某氏尚饗乃釋韇立筮卦者在左坐卦以木卒筮乃書卦于木示主人乃退占吉則史韇筮史兼執筮與卦以告于主人占曰從乃官戒宗人命滌宰命為酒乃退若不吉則及遠日又筮日如初宿前宿一日宿戒尸明日朝筮尸如筮日之禮命曰孝孫某來日丁亥用薦歲事于皇祖伯某以某妃配某氏以某之某為尸尚饗筮卦占如初吉則乃遂宿尸祝擯主人再拜稽首祝告曰孝孫某來日丁亥用薦歲事于皇祖伯某以某妃配某氏敢宿尸拜許諾主人又再拜稽首主人退尸送揖不拜若不吉則遂改筮尸既宿尸反為期于廟門之外主人門東南面宗人朝服北面曰請祭期主人曰比於子宗人曰旦明行事主人曰諾乃退明日主人朝服即位于廟門之外東方南面宰宗人西面北上牲北首東上司馬刲羊司士擊豕宗人告備乃退雍人溉鼎匕俎于雍爨雍爨在門東南北上廩人溉甑甗匕與敦于廩爨廩爨在雍爨之北司宮溉豆籩勺爵觚觶几洗篚于東堂下勺爵觚觶實于篚卒溉饌豆籩與篚于房中放于西方設洗于阼階東南當東榮羹定雍人陳鼎五三鼎在羊鑊之西二鼎在豕鑊之西司馬升羊右胖髀不升肩臂臑膞骼正脊一脡脊一橫脊一短脅一正脅一代脅一皆二骨以並腸三胃三舉肺一祭肺三實于一鼎司士升豕右胖髀不升肩臂臑膞骼正脊一脡脊一橫脊一短脅一正脅一代脅一皆二骨以並舉肺一祭肺三實于一鼎雍人倫膚九實于一鼎司士又升魚臘魚十有五而鼎臘一純而鼎臘用麋卒脀皆設扃冪乃舉陳鼎于廟門之外東方北面北上司宮尊兩甒于房戶之閒同棜皆有幂甒有玄酒司宮設罍水于洗東有枓設篚于洗西南肆改饌豆籩于房中南面如饋之設實豆籩之實小祝設槃匜與簞巾于西階東主人朝服即位于阼階東西面司宮筵于奧祝設几于筵上右之主人出迎鼎除冪士盥舉鼎主人先入司宮取二勺于篚洗之兼執以升乃啓二尊之蓋幂奠于棜上加二勺于二尊覆之南柄鼎序入雍正執一匕以從雍府執四匕以從司士合執二俎以從司士贊者二人皆合執二俎以相從入陳鼎于東方當序南于洗西皆西面北上膚為下匕皆加于鼎東枋俎皆設于鼎西西肆肵俎在羊俎之北亦西肆宗人遣賓就主人皆盥于洗長朼佐食上利升牢心舌載于肵俎心皆安下切上午割勿沒其載于肵俎末在上舌皆切本末亦午割勿沒其載于肵橫之皆如初為之于爨也佐食遷肵俎于阼階西西縮乃反佐食二人上利升羊載右胖髀不升肩臂臑膞骼正脊一脡脊一橫脊一短脅一正脅一代脅一皆二骨以並腸三胃三長皆及俎拒舉肺一長終肺祭肺三皆切肩臂臑膞骼在兩端脊脅肺肩在上下利升豕其載如羊無腸胃體其載于俎皆進下司士三人升魚臘膚魚用鮒十有五而俎縮載右首進腴臘一純而俎亦進下肩在上膚九而俎亦橫載革順卒脀祝盥于洗升自西階主人盥升自阼階祝先入南面主人從戶內西面主婦被錫衣移袂薦自東房韭菹醓醢坐奠于筵前主婦贊者一人亦被錫衣移袂執葵菹螺醢以授主婦主婦不興遂受陪設于東韭菹在南葵菹在北主婦興入于房佐食上利執羊俎下利執豕俎司士三人執魚臘膚俎序升自西階相從入設俎羊在豆東豕亞其北魚在羊東臘在豕東特膚當俎北端主婦自東房執一金敦黍有蓋坐設于羊俎之南婦贊者執敦稷以授主婦主婦興受坐設于魚俎南又興受贊者敦黍坐設于稷南又興受贊者敦稷坐設于黍南敦皆南首主婦興入于房祝酌奠遂命佐食啓會佐食啓會蓋二以重設于敦南主人西面祝在左主人再拜稽首祝祝曰孝孫某敢用柔毛剛鬣嘉薦普淖用薦歲事于皇祖伯某以某妃配某氏尚饗主人又再拜稽首祝出迎尸于廟門之外主人降立于阼階東西面祝先入門右尸入門左宗人奉槃東面于庭南一宗人奉匜水西面于槃東一宗人奉簞巾南面于槃北乃沃尸盥于槃上卒盥坐奠簞取巾興振之三以授尸坐取簞興以受尸巾祝延尸尸升自西階入祝從主人升自阼階祝先入主人從尸升筵祝主人西面立于戶內祝在左祝主人皆拜妥尸尸不言尸答拜遂坐祝反南面尸取韭菹辨㨎于三豆祭于豆閒上佐食取黍稷于四敦下佐食取牢一切肺于俎以授上佐食上佐食兼與黍以授尸尸受同祭于豆祭上佐食舉尸牢肺正脊以授尸上佐食爾上敦黍于筵上右之主人羞肵俎升自阼階置于膚北上佐食羞兩鉶取一羊鉶于房中坐設于韭菹之南下佐食又取一豕鉶于房中以從上佐食受坐設于羊鉶之南皆芼皆有柶尸扱以柶祭羊鉶遂以祭豕鉶嘗羊鉶食舉三飯上佐食舉尸牢幹尸受振祭嚌之佐食受加于肵上佐食羞胾兩瓦豆有醢亦用瓦豆設于薦豆之北尸又食食胾上佐食舉尸一魚尸受振祭嚌之佐食受加于肵橫之又食上佐食舉尸臘肩尸受振祭嚌之上佐食受加于肵又食上佐食舉尸牢骼如初又食尸告飽祝西面于主人之南獨侑不拜侑曰皇尸未實侑尸又食上佐食舉尸牢肩尸受振祭嚌之佐食受加于肵尸不飯告飽祝西面于主人之南主人不言拜侑尸又三飯上佐食受尸牢肺正脊加于肵主人降洗爵升北面酌酒乃酳尸尸拜受主人西面拜送尸祭酒啐酒賓長羞牢肝用俎縮執俎肝亦縮進末鹽在右尸左執爵右兼取肝㨎于俎鹽振祭嚌之加于菹豆卒爵主人拜受尸爵尸答拜祝酌受尸尸醋主人主人拜受爵尸答拜主人西面奠爵又拜上佐食取四敦黍稷下佐食取牢一切肺以授上佐食上佐食以綏祭主人左執爵右受佐食坐祭之又祭酒不興遂啐酒祝與二佐食皆出盥于洗入二佐食各取黍于一敦上佐食兼受摶之以授尸尸執以命祝卒命祝祝受以東北面于戶西以嘏于主人曰皇尸命工祝承致多福無疆于女孝孫來女孝孫使女受祿于天宜稼于田眉壽萬年勿替引之主人坐奠爵興再拜稽首興受黍坐振祭嚌之詩懷之實于左袂挂于季指執爵以興坐卒爵執爵以興坐奠爵拜尸答拜執爵以興出宰夫以籩受嗇黍主人嘗之納諸內主人獻祝設席南面祝拜于席上坐受主人西面答拜薦兩豆菹醢佐食設俎牢髀橫脊一短脅一腸一胃一膚三魚一橫之臘兩髀屬于尻祝取菹㨎于醢祭于豆閒祝祭俎祭酒啐酒肝牢從祝取肝㨎于鹽振祭嚌之不興加于俎卒爵興主人酌獻上佐食上佐食戶內牖東北面拜坐受爵主人西面答拜佐食祭酒卒爵拜坐授爵興俎設于兩階之閒其俎折一膚主人又獻下佐食亦如之其脀亦設于階閒西上亦折一膚有司贊者取爵于篚以升授主婦贊者于房戶婦贊者受以授主婦主婦洗于房中出酌入戶西面拜獻尸尸拜受主婦主人之北西面拜送爵尸祭酒卒爵主婦拜祝受尸爵尸答拜易爵洗酌授尸主婦拜受爵尸答拜上佐食綏祭主婦西面于主人之北受祭祭之其綏祭如主人之禮不嘏卒爵拜尸答拜主婦以爵出贊者受易爵于篚以授主婦于房中主婦洗酌獻祝祝拜坐受爵主婦答拜于主人之北卒爵不興坐授主婦主婦受酌獻上佐食于戶內佐食北面拜坐受爵主婦西面答拜祭酒卒爵坐授主婦主婦獻下佐食亦如之主婦受爵以入于房賓長洗爵獻于尸尸拜受爵賓戶西北面拜送爵尸祭酒卒爵賓拜祝受尸爵尸答拜祝酌授尸賓拜受爵尸拜送爵賓坐奠爵遂拜執爵以興坐祭遂飲卒爵執爵以興坐奠爵拜尸答拜賓酌獻祝祝拜坐受爵賓北面答拜祝祭酒啐酒奠爵于其筵前主人出立于阼階上西面祝出立于西階上東面祝告曰利成祝入尸謖主人降立于阼階東西面祝先尸從遂出于廟門祝反復位于室中主人亦入于室復位祝命佐食徹肵俎降設于堂下阼階南司宮設對席乃四人𦿉上佐食盥升下佐食對之賓長二人備司士進一敦黍于上佐食又進一敦黍于下佐食皆右之于席上資黍于羊俎兩端兩下是餕司士乃辨舉𦿉者皆祭黍祭舉主人西面三拜𦿉者𦿉者奠舉于俎皆答拜皆反取舉司士進一鉶于上𦿉又進一鉶于次𦿉又進二豆湆于兩下乃皆食食舉卒食主人洗一爵升酌以授上𦿉贊者洗三爵酌主人受于戶內以授次𦿉若是以辨皆不拜受爵主人西面三拜𦿉者𦿉者奠爵皆答拜皆祭酒卒爵奠爵皆拜主人答一拜𦿉者三人興出上𦿉止主人受上𦿉爵酌以酢于戶內西面坐奠爵拜上𦿉答拜坐祭酒啐酒上𦿉親嘏曰主人受祭之福胡壽保建家室主人興坐奠爵拜執爵以興坐卒爵拜上𦿉答拜上𦿉興出主人送乃退
