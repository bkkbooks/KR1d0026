body:
  text: 喪服第十一子夏傳喪服第十一子夏傳喪服斬衰裳苴絰杖絞帶冠繩纓菅屨者傳曰斬者何不緝也苴絰者麻之有蕡者也苴絰大搹左本在下去五分一以為帶齊衰之絰斬衰之帶也去五分一以為帶大功之絰齊衰之帶也去五分一以為帶小功之絰大功之帶也去五分一以為帶緦麻之絰小功之帶也去五分一以為帶苴杖竹也削杖桐也杖各齊其心皆下本杖者何爵也無爵而杖者何擔主也非主而杖者何輔病也童子何以不杖不能病也婦人何以不杖亦不能病也絞帶者繩帶也冠繩纓條屬冠六升外畢鍛而勿灰衰三升菅屨者菅菲也外納居倚廬寢苫枕塊哭晝夜無時歠粥朝一溢米夕一溢米寢不說絰帶既虞翦屏柱楣寢有席食疏食水飲朝一哭夕一哭而已既練舍外寢始食菜果飯素食哭無時父傳曰為父何以斬衰也父至尊也諸侯為天子傳曰天子至尊也君傳曰君至尊也父為長子傳曰何以三年也正體於上又乃將所傳重也庶子不得為長子三年不繼祖也為人後者傳曰何以三年也受重者必以尊服服之何如而可為之後同宗則可為之後何如而可以為人後支子可也為所後者之祖父母妻妻之父母昆弟昆弟之子若子妻為夫傳曰夫至尊也妾為君傳曰君至尊也女子子在室為父布總箭笄髽衰三年傳曰總六升長六寸箭笄長尺吉笄尺二寸子嫁反在父之室為父三年公士大夫之眾臣為其君布帶繩屨傳曰大夫室老士貴臣其餘皆眾臣也君謂有地者也眾臣杖不以即位近臣君服斯服矣繩屨者繩菲也疏衰裳齊牡麻絰冠布纓削杖布帶疏屨三年者傳曰齊者何緝也牡麻者枲麻也牡麻絰右本在上冠者沽功也疏屨者藨蒯之菲也父卒則為母繼母如母傳曰繼母何以如母繼母之配父與因母同故孝子不敢殊也慈母如母傳曰慈母者何也傳曰妾之無子者妾子之無母者父命妾曰女以為子命子曰女以為母若是則生養之終其身如母死則喪之三年如母貴父之命也母為長子傳曰何以三年也父之所不降母亦不敢降也疏衰裳齊牡麻絰冠布纓削杖布帶疏屨期者傳曰問者曰何冠也曰齊衰大功冠其受也緦麻小功冠其衰也帶緣各視其冠父在為母傳曰何以期也屈也至尊在不敢伸其私尊也父必三年然後娶達子之志也妻傳曰為妻何以期也妻至親也出妻之子為母傳曰出妻之子為母期則為外祖父母無服傳曰絕族無施服親者屬出妻之子為父後者則為出母無服傳曰與尊者為一體不敢服其私親也父卒繼母嫁從為之服報傳曰何以期也貴終也不杖麻屨者祖父母傳曰何以期也至尊也世父母叔父母傳曰世父叔父何以期也與尊者一體也然則昆弟之子何以亦期也旁尊也不足以加尊焉故報之也父子一體也夫妻一體也昆弟一體也故父子首足也夫妻牉合也昆弟四體也故昆弟之義無分然而有分者則辟子之私也子不私其父則不成為子故有東宮有西宮有南宮有北宮異居而同財有餘則歸之宗不足則資之宗世母叔母何以亦期也以名服也大夫之適子為妻傳曰何以期也父之所不降子亦不敢降也何以不杖也父在則為妻不杖昆弟為眾子昆弟之子傳曰何以期也報之也大夫之庶子為適昆弟傳曰何以期也父之所不降子亦不敢降也適孫傳曰何以期也不敢降其適也有適子者無適孫孫婦亦如之為人後者為其父母報傳曰何以期也不貳斬也何以不貳斬也持重於大宗者降其小宗也為人後者孰後後大宗也曷為後大宗大宗者尊之統也禽獸知母而不知父野人曰父母何筭焉都邑之士則知尊禰矣大夫及學士則知尊祖矣諸侯及其大祖天子及其始祖之所自出尊者尊統上卑者尊統下大宗者尊之統也大宗者收族者也不可以絕故族人以支子後大宗也適子不得後大宗女子子適人者為其父母昆弟之為父後者傳曰為父何以期也婦人不貳斬也婦人不貳斬者何也婦人有三從之義無專用之道故未嫁從父既嫁從夫夫死從子故父者子之天也夫者妻之天也婦人不貳斬者猶曰不貳天也婦人不能貳尊也為昆弟之為父後者何以亦期也婦人雖在外必有歸宗曰小宗故服期也繼父同居者傳曰何以期也傳曰夫死妻稺子幼子無大功之親與之適人而所適者亦無大功之親所適者以其貨財為之築宮廟歲時使之祀焉妻不敢與焉若是則繼父之道也同居則服齊衰期異居則服齊衰三月必嘗同居然後為異居未嘗同居則不為異居為夫之君傳曰何以期也從服也姑姊妹女子子適人無主者姑姊妹報傳曰無主者謂其無祭主者也何以期也為其無祭主故也為君之父母妻長子祖父母傳曰何以期也從服也父母長子君服斬妻則小君也父卒然後為祖後者服斬妾為女君傳曰何以期也妾之事女君與婦之事舅姑等婦為舅姑傳曰何以期也從服也夫之昆弟之子傳曰何以期也報之也公妾大夫之妾為其子傳曰何以期也妾不得體君為其子得遂也女子子為祖父母傳曰何以期也不敢降其祖也大夫之子為世父母叔父母子昆弟昆弟之子姑姊妹女子子無主者為大夫命婦者唯子不報傳曰大夫者其男子之為大夫者也命婦者其婦人之為大夫妻者也無主者命婦之無祭主者也何以言唯子不報也女子子適人者為其父母期故言不報也言其餘皆報也何以期也父之所不降子亦不敢降也大夫曷為不降命婦也夫尊於朝妻貴於室矣大夫為祖父母適孫為士者傳曰何以期也大夫不敢降其祖與適也公妾以及士妾為其父母傳曰何以期也妾不得體君得為其父母遂也䟽衰裳齊牡麻絰無受者寄公為所寓傳曰寄公者何也失地之君也何以為所寓服齊衰三月也言與民同也丈夫婦人為宗子宗子之母妻傳曰何以服齊衰三月也尊祖也尊祖故敬宗敬宗者尊祖之義也宗子之母在則不為宗子之妻服也為舊君君之母妻傳曰為舊君者孰謂也仕焉而已者也何以服齊衰三月也言與民同也君之母妻則小君也庶人為國君大夫在外其妻長子為舊國君傳曰何以服齊衰三月也妻言與民同也長子言未去也繼父不同居者曾祖父母傳曰何以齊衰三月也小功者兄弟之服也不敢以兄弟之服服至尊也大夫為宗子傳曰何以服齊衰三月也大夫不敢降其宗也舊君傳曰大夫為舊君何以服齊衰三月也大夫去君埽其宗廟故服齊衰三月也言與民同也何大夫之謂乎言其以道去君而猶未絕也曾祖父母為士者如眾人傳曰何以齊衰三月也大夫不敢降其祖也女子子嫁者未嫁者為曾祖父母傳曰嫁者其嫁於大夫者也未嫁者其成人而未嫁者也何以服齊衰三月不敢降其祖也大功布衰裳牡麻絰無受者子女子子之長殤中殤傳曰何以大功也未成人也何以無受也喪成人者其文縟喪未成人者其文不縟故殤之絰不摎垂蓋未成人也年十九至十六為長殤十五至十二為中殤十一至八歲為下殤不滿八歲以下皆為無服之殤無服之殤以日易月以日易月之殤殤而無服故子生三月則父名之死則哭之未名則不哭也叔父之長殤中殤姑姊妹之長殤中殤昆弟之長殤中殤夫之昆弟之子女子子之長殤中殤適孫之長殤中殤大夫之庶子為適昆弟之長殤中殤公為適子之長殤中殤大夫為適子之長殤中殤其長殤皆九月纓絰其中殤七月不纓絰大功布衰裳牡麻絰纓布帶三月受以小功衰即葛九月者傳曰大功布九升小功布十一升姑姊妹女子子適人者傳曰何以大功也出也從父昆弟為人後者為其昆弟傳曰何以大功也為人後者降其昆弟也庶子適婦傳曰何以大功也不降其適也女子子適人者為眾昆弟姪丈夫婦人報傳曰姪者何也謂吾姑者吾謂之姪夫之祖父母世父母叔父母傳曰何以大功也從服也夫之昆弟何以無服也其夫屬乎父道者妻皆母道也其夫屬乎子道者妻皆婦道也謂弟之妻婦者是嫂亦可謂之母乎故名者人治之大者也可無慎乎大夫為世父母叔父母子昆弟昆弟之子為士者傳曰何以大功也尊不同也尊同則得服其親服公之庶昆弟大夫之庶子為母妻昆弟傳曰何以大功也先君餘尊之所厭不得過大功也大夫之庶子則從乎大夫而降也父之所不降子亦不敢降也皆為其從父昆弟之為大夫者為夫之昆弟之婦人子適人者大夫之妾為君之庶子女子子嫁者未嫁者為世父母叔父母姑姊妹傳曰嫁者其嫁於大夫者也未嫁者成人而未嫁者也何以大功也妾為君之黨服得與女君同下言為世父母叔父母姑姊妹者謂妾自服其私親也大夫大夫之妻大夫之子公之昆弟為姑姊妹女子子嫁於大夫者君為姑姊妹女子子嫁於國君者傳曰何以大功也尊同也尊同則得服其親服諸侯之子稱公子公子不得禰先君公子之子稱公孫公孫不得祖諸侯此自卑別於尊者也若公子之子孫有封為國君者則世世祖是人也不祖公子此自尊別於卑者也是故始封之君不臣諸父昆弟封君之子不臣諸父而臣昆弟封君之孫盡臣諸父昆弟故君之所為服子亦不敢不服也君之所不服子亦不敢服也繐衰裳牡麻絰既葬除之者傳曰繐衰者何以小功之繐也諸侯之大夫為天子傳曰何以繐衰也諸侯之大夫以時接見乎天子小功布衰裳澡麻帶絰五月者叔父之下殤適孫之下殤昆弟之下殤大夫庶子為適昆弟之下殤為姑姊妹女子子之下殤為人後者為其昆弟從父昆弟之長殤傳曰問者曰中殤何以不見也大功之殤中從上小功之殤中從下為夫之叔父之長殤昆弟之子女子子夫之昆弟之子女子子之下殤為姪庶孫丈夫婦人之長殤大夫公之昆弟大夫之子為其昆弟庶子姑姊妹女子子之長殤大夫之妾為庶子之長殤小功布衰裳牡麻絰即葛五月者從祖祖父母從祖父母報從祖昆弟從父姊妹孫適人者為人後者為其姊妹適人者為外祖父母傳曰何以小功也以尊加也從母丈夫婦人報傳曰何以小功也以名加也外親之服皆緦也夫之姑姊妹娣姒婦報傳曰娣姒婦者弟長也何以小功也以為相與居室中則生小功之親焉大夫大夫之子公之昆弟為從父昆弟庶孫姑姊妹女子子適士者大夫之妾為君之庶子適人者庶婦君母之父母從母傳曰何以小功也君母在則不敢不從服君母不在則不服君子子為庶母慈己者傳曰君子子者貴人之子也為庶母何以小功也以慈己加也緦麻三月者傳曰緦者十五升抽其半有事其縷無事其布曰緦族曾祖父母族祖父母族父母族昆弟庶孫之婦庶孫之中殤從祖姑姊妹適人者報從祖父從祖昆弟之長殤外孫從父昆弟姪之下殤夫之叔父之中殤下殤從母之長殤報庶子為父後者為其母傳曰何以緦也傳曰與尊者為一體不敢服其私親也然則何以服緦也有死於宮中者則為之三月不舉祭因是以服緦也士為庶母傳曰何以緦也以名服也大夫以上為庶母無服貴臣貴妾傳曰何以緦也以其貴也乳母傳曰何以緦也以名服也從祖昆弟之子曾孫父之姑從母昆弟傳曰何以緦也以名服也甥傳曰甥者何也謂吾舅者吾謂之甥何以緦也報之也壻傳曰何以緦報之也妻之父母傳曰何以緦從服也姑之子傳曰何以緦報之也舅傳曰何以緦從服也舅之子傳曰何以緦從服也夫之姑姊妹之長殤夫之諸祖父母報君母之昆弟傳曰何以緦從服也從父昆弟之子之長殤昆弟之孫之長殤為夫之從父昆弟之妻傳曰何以緦也以為相與同室則生緦之親焉長殤中殤降一等下殤降二等齊衰之殤中從上大功之殤中從下記公子為其母練冠麻麻衣縓緣為其妻縓冠葛絰帶麻衣縓緣皆既葬除之傳曰何以不在五服之中也君之所不服子亦不敢服也君之所為服子亦不敢不服也大夫公之昆弟大夫之子於兄弟降一等為人後者於兄弟降一等報於所為後之兄弟之子若子兄弟皆在他邦加一等不及知父母與兄弟居加一等傳曰何如則可謂之兄弟傳曰小功以下為兄弟朋友皆在他邦袒免歸則已朋友麻君之所為兄弟服室老降一等夫之所為兄弟服妻降一等庶子為後者為其外祖父母從母舅無服不為後如邦人宗子孤為殤大功衰小功衰皆三月親則月筭如邦人改葬緦童子唯當室緦傳曰不當室則無緦服也凡妾為私兄弟如邦人大夫弔於命婦錫衰命婦弔於大夫亦錫衰傳曰錫者何也麻之有錫者也錫者十五升抽其半無事其縷有事其布曰錫女子子適人者為其父母婦為舅姑惡笄有首以髽卒哭子折笄首以笄布總傳曰笄有首者惡笄之有首也惡笄者櫛笄也折笄首者折吉笄之首也吉笄者象笄也何以言子折笄首而不言婦終之也妾為女君君之長子惡笄有首布總凡衰外削幅裳內削幅幅三袧若齊裳內衰外負廣出於適寸適博四寸出於衰衰長六寸博四寸衣帶下尺衽二尺有五寸袂屬幅衣二尺有二寸袪尺二寸衰三升三升有半其冠六升以其冠為受受冠七升齊衰四升其冠七升以其冠為受受冠八升繐衰四升有半其冠八升大功八升若九升小功十升若十一升
