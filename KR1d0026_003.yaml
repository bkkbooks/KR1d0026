body:
  text: 士相見禮第三士相見禮第三士相見之禮摯冬用雉夏用腒左頭奉之曰某也願見無由達某子以命命某見主人對曰某子命某見吾子有辱請吾子之就家也某將走見賓對曰某不足以辱命請終賜見主人對曰某不敢為儀固請吾子之就家也某將走見賓對曰某不敢為儀固以請主人對曰某也固辭不得命將走見聞吾子稱摯敢辭摯賓對曰某不以摯不敢見主人對曰某不足以習禮敢固辭賓對曰某也不依於摯不敢見固以請主人對曰某也固辭不得命敢不敬從出迎于門外再拜賓答再拜主人揖入門右賓奉摯入門左主人再拜受賓再拜送摯出主人請見賓反見退主人送于門外再拜主人復見之以其摯曰嚮者吾子辱使某見請還摯於將命者主人對曰某也既得見矣敢辭賓對曰某也非敢求見請還摯于將命者主人對曰某也既得見矣敢固辭賓對曰某不敢以聞固以請於將命者主人對曰某也固辭不得命敢不從賓奉摯入主人再拜受賓再拜送摯出主人送于門外再拜士見於大夫終辭其摯於其入也一拜其辱也賓退送再拜若嘗為臣者則禮辭其摯曰某也辭不得命不敢固辭賓入奠摯再拜主人答一拜賓出使擯者還其摯于門外曰某也使某還摯賓對曰某也既得見矣敢辭擯者對曰某也命某某非敢為儀也敢以請賓對曰某也夫子之賤私不足以踐禮敢固辭擯者對曰某也使某不敢為儀也固以請賓對曰某固辭不得命敢不從再拜受下大夫相見以鴈飾之以布維之以索如執雉上大夫相見以羔飾之以布四維之結于面左頭如麛執之如士相見之禮始見于君執摯至下容彌蹙庶人見於君不為容進退走士大夫則奠摯再拜稽首君答一拜若他邦之人則使擯者還其摯曰寡君使某還摯賓對曰君不有其外臣臣不敢辭再拜稽首受凡燕見于君必辨君之南面若不得則正方不疑君君在堂升見無方階辨君所在凡言非對也妥而後傳言與君言言使臣與大人言言事君與老者言言使弟子與幼者言言孝弟於父兄與衆言言忠信慈祥與居官者言言忠信凡與大人言始視面中視抱卒視面毋改衆皆若是若父則遊目毋上於面毋下於帶若不言立則視足坐則視膝凡侍坐於君子君子缺伸問日之早晏以食具告改居則請退可也夜侍坐問夜膳葷請退可也若君賜之食則君祭先飯遍嘗膳飲而俟君命之食然後食若有將食者則俟君之食然後食若君賜之爵則下席再拜稽首受爵升席祭卒爵而俟君卒爵然後授虛爵退坐取屨隱辟而后屨君為之興則曰君無為興臣不敢辭君若降送之則不敢顧辭遂出大夫則辭退下比及門三辭若先生異爵者請見之則辭辭不得命則曰某無以見辭不得命將走見先見之非以君命使則不稱寡大夫寡君之老凡執幣者不趨容彌蹙以為儀執玉者則唯舒武舉前曳踵凡自稱於君士大夫則曰下臣宅者在邦則曰市井之臣在野則曰草茅之臣庶人則曰刺草之臣他國之人則曰外臣
