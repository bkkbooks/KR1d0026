body:
  text: 士昏禮第二士昏禮第二昏禮下達納采用鴈主人筵于戶西西上右几使者玄端至擯者出請事入告主人如賓服迎于門外再拜賓不答拜揖入至于廟門揖入三揖至于階三讓主人以賓升西面賓升西階當阿東面致命主人阼階上北面再拜授于楹間南面賓降出主人降授老鴈擯者出請賓執鴈請問名主人許賓入授如初禮擯者出請賓告事畢入告出請醴賓賓禮辭許主人徹几改筵東上側尊甒醴于房中主人迎賓于廟門外揖讓如初升主人北面再拜賓西階上北面答拜主人拂几授校拜送賓以几辟北面設于坐左之西階上答拜贊者酌醴加角柶面葉出于房主人受醴面枋筵前西北面賓拜受醴復位主人阼階上拜送贊者薦脯醢賓即筵坐左執觶祭脯醢以柶祭醴三西階上北面坐啐醴建柶興坐奠觶遂拜主人答拜賓即筵奠于薦左降筵北面坐取脯主人辭賓降授人脯出主人送于門外再拜納吉用鴈如納采禮納徵玄纁束帛儷皮如納吉禮請期用鴈主人辭賓許告期如納徵禮期初昏陳三鼎于寢門外東方北面北上其實特豚合升去蹄舉肺脊二祭肺二魚十有四臘一肫髀不升皆飪設扃冪設洗于阼階東南饌于房中醯醬二豆菹醢四豆兼巾之黍稷四敦皆蓋大羹湆在爨尊于室中北墉下有禁玄酒在西綌幂加勺皆南枋尊于房戶之東無玄酒篚在南實四爵合卺主人爵辨纁裳緇袘從者畢玄端乘墨車從車二乘執燭前馬婦車亦如之有裧至于門外主人筵于戶西西上右几女次純衣纁袡立于房中南面姆纚笄宵衣在其右女從者畢袗玄纚笄被顈黼在其後主人玄端迎于門外西面再拜賓東面答拜主人揖入賓執鴈從至于廟門揖入三揖至于階三讓主人升西面賓升北面奠鴈再拜稽首降出婦從降自西階主人不降送壻御婦車授綏姆辭不受婦乘以几姆加景乃驅御者代壻乘其車先俟于門外婦至主人揖婦以入及寢門揖入升自西階媵席于奧夫入于室即席婦尊西南面媵御沃盥交贊者徹尊幂舉者盥出除幂舉鼎入陳于阼階南西面北上匕俎從設北面載執而俟匕者逆退復位于門東北面西上贊者設醬于席前菹醢在其北俎入設于豆東魚次臘特于俎北贊設黍于醬東稷在其東設湆于醬南設對醬于東菹醢在其南北上設黍于臘北其西稷設湆于醬北御布對席贊啓會卻于敦南對敦于北贊告具揖婦即對筵皆坐皆祭祭薦黍稷肺贊爾黍授肺脊皆食以湆醬皆祭舉食舉也三飯卒食贊洗爵酌酳主人主人拜受贊戶內北面答拜酳婦亦如之皆祭贊以肝從皆振祭嚌肝皆實于菹豆卒爵皆拜贊答拜受爵再酳如初無從三酳用卺亦如之贊洗爵酌于戶外尊入戶西北面奠爵拜皆答拜坐祭卒爵拜皆答拜興主人出婦復位乃徹于房中如設于室尊否主人説服于房媵受婦説服于室御受姆授巾御衽于奧媵衽良席在東皆有枕北止主人入親説婦之纓燭出媵餕主人之餘御餕婦餘贊酌外尊酳之媵侍于戶外呼則聞夙興婦沐浴纚笄宵衣以俟見質明贊見婦于舅姑席于阼舅即席席于房外南面姑即席婦執笲棗栗自門入升自西階進拜奠于席舅坐撫之興答拜婦還又拜降階受笲腶修升進北面拜奠于席姑坐舉以興拜授人贊醴婦席于戶牖間側尊甒醴于房中婦疑立于席西贊者酌醴加柶面枋出房席前北面婦東面拜受贊西階上北面拜送婦又拜薦脯醢婦升席左執觶右祭脯醢以柶祭醴三降席東面坐啐醴建柶興拜贊答拜婦又拜奠于薦東北面坐取脯降出授人于門外舅姑入于室婦盥饋特豚合升側載無魚臘無稷並南上其他如取女禮婦贊成祭卒食一酳無從席于北墉下婦徹設席前如初西上婦餕舅辭易醬婦餕姑之饌御贊祭豆黍肺舉肺脊乃食卒姑酳之婦拜受姑拜送坐祭卒爵姑受奠之婦徹于房中媵御餕姑酳之雖無娣媵先於是與始飯之錯舅姑共饗婦以一獻之禮舅洗于南洗姑洗于北洗奠酬舅姑先降自西階婦降自阼階歸婦俎于婦氏人舅饗送者以一獻之禮酬以束錦姑饗婦人送者酬以束錦若異邦則贈丈夫送者以束錦若舅姑既沒則婦入三月乃奠菜席于廟奧東面右几席于北方南面祝盥婦盥于門外婦執笲菜祝帥婦以入祝告稱婦之姓曰某氏來婦敢奠嘉菜于皇舅某子婦拜扱地坐奠菜于几東席上還又拜如初婦降堂取笲菜入祝曰某氏來婦敢告于皇姑某氏奠菜于席如初禮婦出祝闔牖戶老醴婦于房中南面如舅姑醴婦之禮壻饗婦送者丈夫婦人如舅姑饗禮記士昏禮凡行事必用昏昕受諸禰廟辭無不腆無辱摯不用死皮帛必可制臘必用鮮魚用鮒殽必全女子許嫁笄而醴之稱字祖廟未毀教于公宮三月若祖廟已毀則教于宗室問名主人受鴈還西面對賓受命乃降祭醴始扱一祭又扱再祭賓右取脯左奉之乃歸執以反命納徵執皮攝之內文兼執足左首隨入西上參分庭一在南賓致命釋外足見文主人受幣士受皮者自東出于後自左受遂坐攝皮逆退適東壁父醴女而俟迎者母南面于房外女出于母左父西面戒之必有正焉若衣若笄母戒諸西階上不降婦乘以几從者二人坐持几相對婦入寢門贊者徹尊幂酌玄酒三屬于尊棄餘水于堂下階間加勺笲緇被纁裏加于橋舅答拜宰徹笲婦席薦饌于房饗婦姑薦焉婦洗在北堂直室東隅篚在東北面盥婦酢舅更爵自薦不敢辭洗舅降則辟于房不敢拜洗凡婦人相饗無降婦入三月然後祭行庶婦則使人醮之婦不饋昏辭曰吾子有惠貺室某也某有先人之禮使某也請納采對曰某之子憃愚又弗能教吾子命之某不敢辭致命曰敢納采問名曰某既受命將加諸卜敢請女為誰氏對曰吾子有命且以備數而擇之某不敢辭醴曰子為事故至於某之室某有先人之禮請醴從者對曰某既得將事矣敢辭先人之禮敢固以請某辭不得命敢不從也納吉曰吾子有貺命某加諸卜占曰吉使某也敢告對曰某之子不教唯恐弗堪子有吉我與在某不敢辭納徵曰吾子有嘉命貺室某也某有先人之禮儷皮束帛使某也請納徵致命曰某敢納徵對曰吾子順先典貺某重禮某不敢辭敢不承命請期曰吾子有賜命某既申受命矣惟是三族之不虞使某也請吉日對曰某既前受命矣唯命是聽曰某命某聽命于吾子對曰某固唯命是聽使者曰某使某受命吾子不許某敢不告期曰某日對曰某敢不敬須凡使者歸反命曰某既得將事矣敢以禮告主人曰聞命矣父醮子命之曰往迎爾相承我宗事勗帥以敬先妣之嗣若則有常子曰諾唯恐弗堪不敢忘命賓至擯者請對曰吾子命某以茲初昏使某將請承命對曰某固敬具以須父送女命之曰戒之敬之夙夜毋違命母施襟結帨曰勉之敬之夙夜無違宮事庶母及門內施鞶申之以父母之命命之曰敬恭聽宗爾父母之言夙夜無愆視諸襟鞶壻授綏姆辭曰未教不足與為禮也宗子無父母命之親皆沒己躬命之支子則稱其宗弟稱其兄若不親迎則婦入三月然後壻見曰某以得為外昏姻請覿主人對曰某以得為外昏姻之數某之子未得濯溉於祭祀是以未敢見今吾子辱請吾子之就宮某將走見對曰某以非他故不足以辱命請終賜見對曰某得以為昏姻之故不敢固辭敢不從主人出門左西面壻入門東面奠摯再拜出擯者以摯出請受壻禮辭許受摯入主人再拜受壻再拜送出見主婦主婦闔扉立于其內壻立于門外東面主婦一拜壻答再拜主婦又拜壻出主人請醴及揖讓入醴以一獻之禮主婦薦奠酬無幣壻出主人送再拜
