body:
  text: 有司第十七有司第十七有司徹掃堂司宮攝酒乃燅尸俎卒燅乃升羊豕魚三鼎無臘與膚乃設扃冪陳鼎于門外如初乃議侑于賓以異姓宗人戒侑侑出俟于廟門之外司宮筵于戶西南面又筵于西序東面尸與侑北面于廟門之外西上主人出迎尸侑宗人擯主人拜尸答拜主人又拜侑侑答拜主人揖先入門右尸入門左侑從亦左揖乃讓主人先升自阼階尸侑升自西階西楹西北面東上主人東楹東北面拜至尸答拜主人又拜侑侑答拜乃舉司馬舉羊鼎司士舉豕鼎舉魚鼎以入陳鼎如初雍正執一匕以從雍府執二匕以從司士合執二俎以從司士贊者亦合執二俎以從匕皆加于鼎東枋二俎設于羊鼎西西縮二俎皆設于二鼎西亦西縮雍人合執二俎陳于羊俎西並皆西縮覆二疏匕于其上皆縮俎西枋主人降受宰几尸侑降主人辭尸對宰授几主人受二手橫執几揖尸主人升尸侑升復位主人西面左手執几縮之以右袂推拂几三二手橫執几進授尸于筵前尸進二手受于手間主人退尸還几縮之右手執外廉北面奠于筵上左之南縮不坐主人東楹東北面拜尸復位尸與侑皆北面答拜主人降洗尸侑降尸辭洗主人對卒洗揖主人升尸侑升尸西楹西北面拜洗主人東楹東北面奠爵答拜降盥尸侑降主人辭尸對卒盥主人揖升尸侑升主人坐取爵酌獻尸尸北面拜受爵主人東楹東北面拜送爵主婦自東房薦韭菹醢坐奠于筵前菹在西方婦贊者執昌菹醢以授主婦主婦不興受陪設于南昌在東方興取籩于房麷蕡坐設于豆西當外列麷在東方婦贊者執白黑以授主婦主婦不興受設于初籩之南白在西方興退乃升司馬朼羊亦司馬載載右體肩臂肫骼臑正脊一脡脊一橫脊一短脅一正脅一代脅一腸一胃一祭肺一載于一俎羊肉湆臑折正脊一正脅一腸一胃一嚌肺一載于南俎司士朼豕亦司士載亦右體肩臂肫骼臑正脊一脡脊一橫脊一短脅一正脅一代脅一膚五嚌肺一載于一俎侑俎羊左肩左肫正脊一脅一腸一胃一切肺一載于一俎侑俎豕左肩折正脊一脅一膚三切肺一載于一俎阼俎羊肺一祭肺一載于一俎羊肉湆臂一脊一脅一腸一胃一嚌肺一載于一俎豕脀臂一脊一脅一膚三嚌肺一載于一俎主婦俎羊左臑脊一脅一腸一胃一膚一嚌羊肺一載于一俎司士朼魚亦司士載尸俎五魚橫載之侑主人皆一魚亦橫載之皆加膴祭于其上卒升賓長設羊俎于豆南賓降尸升筵自西方坐左執爵右取韭菹㨎于三豆祭于豆間尸取麷蕡宰夫贊者取白黑以授尸尸受兼祭于豆祭雍人授次賓疏匕與俎受于鼎西左手執俎左廉縮之卻右手執匕枋縮于俎上以東面受于羊鼎之西司馬在羊鼎之東二手執桃匕枋以挹湆注于疏匕若是者三尸興左執爵右取肺坐祭之祭酒興左執爵次賓縮執匕俎以升若是以授尸尸卻手受匕枋坐祭嚌之興覆手以授賓賓亦覆手以受縮匕于俎上以降尸席末坐啐酒興坐奠爵拜告旨執爵以興主人北面于東楹東答拜司馬羞羊肉湆縮執俎尸坐奠爵興取肺坐絶祭嚌之興反加于俎司馬縮奠俎于羊湆俎南乃載于羊俎卒載俎縮執俎以降尸坐執爵以興次賓羞羊燔縮執俎縮一燔于俎上鹽在右尸左執爵受燔㨎于鹽坐振祭嚌之興加于羊俎賓縮執俎以降尸降筵北面于西楹西坐卒爵執爵以興坐奠爵拜執爵以興主人北面于東楹東答拜主人受爵尸升筵立于筵末主人酌獻侑侑西楹西北面拜受爵主人在其右北面答拜主婦薦韭菹醢坐奠于筵前醢在南方婦贊者執二籩麷蕡以授主婦主婦不興受之奠麷于醢南蕡在麷東主婦入于房侑升筵自北方司馬橫執羊俎以升設于豆東侑坐左執爵右取菹㨎于醢祭于豆間又取麷蕡同祭于豆祭興左執爵右取肺坐祭之祭酒興左執爵次賓羞羊燔如尸禮侑降筵自北方北面于西楹西坐卒爵執爵以興坐奠爵拜主人答拜尸受侑爵降洗侑降立于西階西東面主人降自阼階辭洗尸坐奠爵于篚興對卒洗主人升尸升自西階主人拜洗尸北面于西楹西坐奠爵答拜降盥主人降尸辭主人對卒盥主人升尸升坐取爵酌司宮設席于東序西面主人東楹東北面拜受爵尸西楹西北面答拜主婦薦韭菹醢坐奠于筵前菹在北方婦贊者執二籩麷蕡主婦不興受設麷于菹西北蕡在麷西主人升筵自北方主婦入于房長賓設羊俎于豆西主人坐左執爵祭豆籩如侑之祭興左執爵右取肺坐祭之祭酒興次賓羞匕湆如尸禮席末坐啐酒執爵以興司馬羞羊肉湆縮執俎主人坐奠爵于左興受肺坐絶祭嚌之興反加于湆俎司馬縮奠湆俎于羊俎西乃載之卒載縮執虛俎以降主人坐取爵以興次賓羞燔主人受如尸禮主人降筵自北方北面于阼階上坐卒爵執爵以興坐奠爵拜執爵以興尸西楹西答拜主人坐奠爵于東序南侑升尸侑皆北面于西楹西主人北面于東楹東再拜崇酒尸侑皆答再拜主人及尸侑皆升就筵司宮取爵于篚以授婦贊者于房東以授主婦主婦洗于房中出實爵尊南西面拜獻尸尸拜于筵上受主婦西面于主人之席北拜送爵入于房取一羊鉶坐奠于韭菹西主婦贊者執豕鉶以從主婦不興受設于羊鉶之西興入于房取糗與腶修執以出坐設之糗在蕡西修在白西興立于主人席北西面尸坐左執爵祭糗修同祭于豆祭以羊鉶之柶挹羊鉶遂以挹豕鉶祭于豆祭祭酒次賓羞豕匕湆如羊匕湆之禮尸坐啐酒左執爵嘗上鉶執爵以興坐奠爵拜主婦答拜執爵以興司士羞豕脀尸坐奠爵興受如羊肉湆之禮坐取爵興次賓羞豕燔尸左執爵受燔如羊燔之禮坐卒爵拜主婦答拜受爵酌獻侑侑拜受爵主婦主人之北西面答拜主婦羞糗修坐奠糗于麷南修在蕡南侑坐左執爵取糗修兼祭于豆祭司士縮執豕脀以升侑興取肺坐祭之司士縮奠豕脀于羊俎之東載于羊俎卒乃縮執俎以降侑興次賓羞豕燔侑受如尸禮坐卒爵拜主婦答拜受爵酌以致于主人主人筵上拜受爵主婦北面于阼階上答拜主婦設二鉶與糗修如尸禮主人其祭糗修祭鉶祭酒受豕匕湆拜啐酒皆如尸禮嘗鉶不拜其受豕脀受豕燔亦如尸禮坐卒爵拜主婦北面答拜受爵尸降筵受主婦爵以降主人降侑降主婦入于房主人立于洗東北西面侑東面于西階西南尸易爵于篚盥洗爵主人揖尸侑主人升尸升自西階侑從主人北面立于東楹東侑西楹西北面立尸酌主婦出于房西面拜受爵尸北面于侑東答拜主婦入于房司宮設席于房中南面主婦立于西席婦贊者薦韭菹醢坐奠于筵前菹在西方婦人贊者執麷蕡以授婦贊者婦贊者不興受設麷于菹西蕡在麷南主婦升筵司馬設羊俎于豆南主婦坐左執爵右取菹㨎于醢祭于豆間又取麷蕡兼祭于豆祭主婦奠爵興取肺坐絶祭嚌之興加于俎坐挩手祭酒啐酒次賓羞羊燔主婦興受燔如主人之禮主婦執爵以出于房西面于主人席北立卒爵執爵拜尸西楹西北面答拜主婦入立于房尸主人及侑皆就筵上賓洗爵以升酌獻尸尸拜受爵賓西楹西北面拜送爵尸奠爵于薦左賓降主人降洗觶尸侑降主人奠爵于篚辭尸對卒洗揖尸升侑不升主人實觶酬尸東楹東北面坐奠爵拜尸西楹西北面答拜坐祭遂飲卒爵拜尸答拜降洗尸降辭主人奠爵于篚對卒洗主人升尸升主人實觶尸拜受爵主人反位答拜尸北面坐奠爵于薦左尸侑主人皆升筵乃羞宰夫羞房中之羞于尸侑主人主婦皆右之司士羞庶羞于尸侑主人主婦皆左之主人降南面拜衆賓于門東三拜衆賓門東北面皆答一拜主人洗爵長賓辭主人奠爵于篚興對卒洗升酌獻賓于西階上長賓升拜受爵主人在其右北面答拜宰夫自東房薦脯醢醢在西司士設俎于豆北羊骼一腸一胃一切肺一膚一賓坐左執爵右取肺㨎于醢祭之執爵興取肺坐祭之祭酒遂飲卒爵執爵以興坐奠爵拜執爵以興主人答拜受爵賓坐取祭以降西面坐委于西階西南宰夫執薦以從設于祭東司士執俎以從設于薦東衆賓長升拜受爵主人答拜坐祭立飲卒爵不拜既爵宰夫贊主人酌若是以辨辨受爵其薦脯醢與脀設于其位其位繼上賓而南皆東面其脀體儀也乃升長賓主人酌酢于長賓西階上北面賓在左主人坐奠爵拜執爵以興賓答拜坐祭遂飲卒爵執爵以興坐奠爵拜賓答拜賓降宰夫洗觶以升主人受酌降酬長賓于西階南北面賓在左主人坐奠爵拜賓答拜坐祭遂飲卒爵拜賓答拜主人洗賓辭主人坐奠爵于篚對卒洗升酌降復位賓拜受爵主人拜送爵賓西面坐奠爵于薦左主人洗升酌獻兄弟于阼階上兄弟之長升拜受爵主人在其右答拜坐祭立飲不拜既爵皆若是以辨辨受爵其位在洗東西面北上升受爵其薦脀設于其位其先生之脀折脅一膚一其衆儀也主人洗獻內賓于房中南面拜受爵主人南面于其右答拜坐祭立飲不拜既爵若是以辨亦有薦脀主人降洗升獻私人于阼階上拜于下升受主人答其長拜乃降坐祭立飲不拜既爵若是以辨宰夫贊主人酌主人於其群私人不答拜其位繼兄弟之南亦北上亦有薦脀主人就筵尸作三獻之爵司士羞湆魚縮執俎以升尸取膴祭祭之祭酒卒爵司士縮奠俎于羊俎南橫載于羊俎卒乃縮執俎以降尸奠爵拜三獻北面答拜受爵酌獻侑侑拜受三獻北面答拜司馬羞湆魚一如尸禮卒爵拜三獻答拜受爵酌致主人主人拜受爵三獻東楹東北面答拜司士羞一湆魚如尸禮卒爵拜三獻答拜受爵尸降筵受三獻爵酌以醋之三獻西楹西北面拜受爵尸在其右以授之尸升筵南面答拜坐祭遂飲卒爵拜尸答拜執爵以降實于篚二人洗觶升實爵西楹西北面東上坐奠爵拜執爵以興尸侑答拜坐祭遂飲卒爵執爵以興坐奠爵拜尸侑答拜皆降洗升酌反位尸侑皆拜受爵舉觶者皆拜送侑奠觶于右尸遂執觶以興北面于阼階上酬主人主人在右坐奠爵拜主人答拜不祭立飲卒爵不拜既爵酬就于阼階上酬主人主人拜受爵尸拜送尸就筵主人以酬侑于西楹西侑在左坐奠爵拜執爵興侑答拜不祭立飲卒爵不拜既爵酌復位侑拜受主人拜送主人復筵乃升長賓侑酬之如主人之禮至于衆賓遂及兄弟亦如之皆飲于上遂及私人拜受者升受下飲卒爵升酌以之其位相酬辨卒飲者實爵于篚乃羞庶羞于賓兄弟內賓及私人兄弟之後生者舉觶于其長洗升酌降北面立于阼階南長在左坐奠爵拜執爵以興長答拜坐祭遂飲卒爵執爵以興坐奠爵拜執爵以興長答拜洗升酌降長拜受于其位舉爵者東面答拜爵止賓長獻于尸如初無湆爵不止賓一人舉爵于尸如初亦遂之於下賓及兄弟交錯其酬皆遂及私人爵無算尸出侑從主人送于廟門之外拜尸不顧拜侑與長賓亦如之衆賓從司士歸尸侑之俎主人退有司徹若不儐尸則祝侑亦如之尸食乃盛俎臑臂肫脡脊橫脊短脅代脅皆牢魚七臘辨無髀卒盛乃舉牢肩尸受振祭嚌之佐食受加于肵佐食取一俎于堂下以入奠于羊俎東乃托于魚臘俎俎釋三個其餘皆取之實于一俎以出祝主人之魚臘取于是尸不飯告飽主人拜侑不言尸又三飯佐食受牢舉如儐主人洗酌酳尸賓羞肝皆如儐禮卒爵主人拜祝受尸爵尸答拜祝酌授尸尸以醋主人亦如儐其綏祭其嘏亦如儐其獻祝與二佐食其位其薦脀皆如儐主婦其洗獻于尸亦如儐主婦反取籩于房中執棗糗坐設之棗在稷南糗在棗南婦贊者執栗脯主婦不興受設之栗在糗東脯在棗東主婦興反位尸左執爵取棗糗祝取栗脯以授尸尸兼祭于豆祭祭酒啐酒次賓羞牢燔用俎鹽在右尸兼取燔㨎于鹽振祭嚌之祝受加于肵卒爵主婦拜祝受尸爵尸答拜祝易爵洗酌授