body:
  text: 公食大夫禮第九公食大夫禮第九公食大夫之禮使大夫戒各以其爵上介出請入告三辭賓出拜辱大夫不答拜將命賓再拜稽首大夫還賓不拜送遂從之賓朝服即位于大門外如聘即位具羹定甸人陳鼎七當門南面西上設扃冪冪若束若編設洗如饗小臣具槃匜在東堂下宰夫設筵加席几無尊飲酒漿飲俟于東房凡宰夫之具饌于東房公如賓服迎賓于大門內大夫納賓公入門左公再拜賓辟再拜稽首公揖入賓從及廟門公揖入賓入三揖至于階三讓公升二等賓升大夫立于東夾南西面北上士立于門東北面西上小臣東堂下南面西上宰東夾北西面南上內官之士在宰東北西面南上介門西北面西上公當楣北鄉至一拜賓降也公再拜賓西階東北面答拜擯者辭拜也公降一等辭曰寡君從子雖將拜興也栗階升不拜命之成拜階上北面再拜稽首士舉鼎去幂于外次入陳鼎于碑南南面西上右人抽扃坐奠于鼎西南順出自鼎西左人待載雍人以俎入陳于鼎南旅人南面加匕于鼎退大夫長盥洗東南西面北上序進盥退者與進者交于前卒盥序進南面匕載者西面魚臘飪載體進奏魚七縮俎寢右腸胃七同俎倫膚七腸胃膚皆橫諸俎垂之大夫既匕匕奠于鼎逆退復位公降盥賓降公辭卒盥公一揖一讓公升賓升宰夫自東房授醯醬公設之賓辭北面坐遷而東遷所公立于序內西鄉賓立于階西疑立宰夫自東房薦豆六設于醬東西上韭菹以東醓醢昌本昌本南麋臡以西菁菹鹿臡士設俎于豆南西上牛羊豕魚在牛西臘腸胃亞之膚以為特旅人取匕甸人舉鼎順出奠于其所宰夫設黍稷六簋于俎西二以並東北上黍當牛俎其西稷錯以終南陳大羹湆不和實于鐙宰右執鐙左執蓋由門入升自阼階盡階不升堂授公以蓋降出入反位公設之于醬西賓辭坐遷之宰夫設鉶四于豆西東上牛以西羊羊南豕豕以東牛飲酒實于觶加于豐宰夫右執觶左執豐進設于豆東宰夫東面坐啓簋會各卻于其西贊者負東房南面告具于公公再拜揖食賓降拜公辭賓升再拜稽首賓升席坐取韭菹以辨擩于醢上豆之閒祭贊者東面坐取黍實于左手辨又取稷辨反于右手興以授賓賓祭之三牲之肺不離贊者辨取之一以授賓賓興受坐祭挩手扱上鉶以柶辨擩之上鉶之閒祭祭飲酒於上豆之閒魚臘醬湆不祭宰夫授公飯粱公設之于湆西賓北面辭坐遷之公與賓皆復初位宰夫膳稻于粱西士羞庶羞皆有大蓋執豆如宰先者反之由門入升自西階先者一人升設于稻南簋西閒容人旁四列西北上膷以東臐膮牛炙炙南醢以西牛胾醢牛鮨鮨南羊炙以東羊胾醢豕炙炙南醢以西豕胾芥醬魚膾衆人騰羞者盡階不升堂授以蓋降出贊者負東房告備于公贊升賓賓坐席末取粱即稻祭于醬湆閒贊者北面坐奠取庶羞之大興一以授賓賓受兼一祭之賓降拜公辭賓升再拜稽首公答再拜賓北面自閒坐左擁簠粱右執湆以降公辭賓西面坐奠于階西東面對西面坐取之栗階升北面反奠于其所降辭公公許賓升公揖退于箱擯者退負東孰而立賓坐遂卷加席公不辭賓三飯以湆醬宰夫執觶漿飲與其豐以進賓挩手興受宰夫設其豐于稻西庭實設賓坐祭遂飲奠於豐上公受宰夫束帛以侑西鄉立賓降筵北面擯者進相幣賓降辭幣升聽命降拜公辭賓升再拜稽首受幣當東楹北面退西楹西東面立公一拜賓降也公再拜介逆出賓北面揖執庭實以出公降立上介受賓幣從者訝受皮賓入門左沒霤北面再拜稽首公辭揖讓如初升賓再拜稽首公答再拜賓降辭公如初賓升公揖退于箱賓卒食會飯三飲不以醬湆挩手興北面坐取粱與醬以降西面坐奠于階西東面再拜稽首公降再拜介逆出賓出公逆于大門內再拜賓不顧有司卷三牲之俎歸于賓館魚臘不與明日賓朝服拜賜于朝拜食與侑幣皆再拜稽首訝聽之上大夫八豆八簋六鉶九俎魚臘皆二俎魚腸胃倫膚若九若十有一下大夫則若七若九庶羞西東毋過四列上大夫庶羞二十加於下大夫以雉兔鶉鴽若不親食使大夫各以其爵朝服以侑幣致之豆實實于罋陳于楹外二以並北陳簋實實于筐陳于楹內兩楹閒二以並南陳庶羞陳于碑內庭實陳于碑外牛羊豕陳于門內西方東上賓朝服以受如受饔禮無擯明日賓朝服以拜賜于朝訝聽命大夫相食親戒速迎賓于門外拜至皆如饗拜降盥受醬湆侑幣束錦也皆自阼階降堂受授者升一等賓止也賓執粱與湆之西序端主人辭賓反之卷加席主人辭賓反之辭幣降一等主人從受侑幣再拜稽首主人送幣亦然辭於主人降一等主人從卒食徹于西序端東面再拜降出其他皆如公食大夫之禮若不親食則公作大夫朝服以侑幣致之賓受于堂無擯記不宿戒戒不速不授几無阼席亨于門外東方司宮具几與蒲筵常緇布純加萑席尋玄帛純皆卷自末宰夫筵出自東房賓之乘車在大門外西方北面立鉶芼牛藿羊苦豕薇皆有滑贊者盥從俎升簠有蓋幂凡炙無醬上大夫蒲筵加萑席其純皆如下大夫純卿擯由下上贊下大夫也上大夫庶羞酒飲漿飲庶羞可也拜食與侑幣皆再拜稽首
