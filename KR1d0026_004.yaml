body:
  text: 鄉飲酒禮第四鄉飲酒禮第四鄉飲酒之禮主人就先生而謀賓介主人戒賓賓拜辱主人答拜乃請賓賓禮辭許主人再拜賓答拜主人退賓拜辱介亦如之乃席賓主人介衆賓之席皆不屬焉尊兩壺于房戶間斯禁有玄酒在西設篚于禁南東肆加二勺于兩壺設洗于阼階東南南北以堂深東西當東榮水在洗東篚在洗西南肆羹定主人速賓賓拜辱主人答拜還賓拜辱介亦如之賓及衆賓皆從之主人一相迎于門外再拜賓賓答拜拜介介答拜揖衆賓主人揖先入賓厭介入門左介厭衆賓入衆賓皆入門左北上主人與賓三揖至于階三讓主人升賓升主人阼階上當楣北面再拜賓西階上當楣北面答拜主人坐取爵于篚降洗賓降主人坐奠爵于階前辭賓對主人坐取爵興適洗南面坐奠爵于篚下盥洗賓進東北面辭洗主人坐奠爵于篚興對賓復位當西序東面主人坐取爵沃洗者西北面卒洗主人一揖一讓升賓拜洗主人坐奠爵遂拜降盥賓降主人辭賓對復位當西序卒盥揖讓升賓西階上疑立主人坐取爵實之賓之席前西北面獻賓賓西階上拜主人少退賓進受爵以復位主人阼階上拜送爵賓少退薦脯醢賓升席自西方乃設折俎主人阼階東疑立賓坐左執爵祭脯醢奠爵于薦西興右手取肺卻左手執本坐弗繚右絶末以祭尚左手嚌之興加于俎坐挩手遂祭酒興席末坐啐酒降席坐奠爵拜告旨執爵興主人阼階上答拜賓西階上北面坐卒爵興坐奠爵遂拜執爵興主人阼階上答拜賓降洗主人降賓坐奠爵興辭主人對賓坐取爵適洗南北面主人阼階東南面辭洗賓坐奠爵于篚興對主人復阼階東西面賓東北面盥坐取爵卒洗揖讓如初升主人拜洗賓答拜興降盥如主人禮賓實爵主人之席前東南面酢主人主人阼階上拜賓少退主人進受爵復位賓西階上拜送爵薦脯醢主人升席自北方設折俎祭如賓禮不告旨自席前適阼階上北面坐卒爵興坐奠爵遂拜執爵興賓西階上答拜主人坐奠爵于序端阼階上北面再拜崇酒賓西階上答拜主人坐取觶于篚降洗賓降主人辭降賓不辭洗立當西序東面卒洗揖讓升賓西階上疑立主人實觶酬賓阼階上北面坐奠觶遂拜執觶興賓西階上答拜坐祭遂飲卒觶興坐奠觶遂拜執觶興賓西階上答拜主人降洗賓降辭如獻禮升不拜洗賓西階上立主人實觶賓之席前北面賓西階上拜主人少退卒拜進坐奠觶于薦西賓辭坐取觶復位主人阼階上拜送賓北面坐奠觶于薦東復位主人揖降賓降立于階西當序東面主人以介揖讓升拜如賓禮主人坐取爵于東序端降洗介降主人辭降介辭洗如賓禮升不拜洗介西階上立主人實爵介之席前西南面獻介介西階上北面拜主人少退介進北面受爵復位主人介右北面拜送爵介少退主人立于西階東薦脯醢介升席自北方設折俎祭如賓禮不嚌肺不啐酒不告旨自南方降席北面坐卒爵興坐奠爵遂拜執爵興主人介右答拜介降洗主人復阼階降辭如初卒洗主人盥介揖讓升授主人爵于兩楹之間介西階上立主人實爵酢于西階上介右坐奠爵遂拜執爵興介答拜主人坐祭遂飲卒爵興坐奠爵遂拜執爵興介答拜主人坐奠爵于西楹南介右再拜崇酒介答拜主人復阼階揖降介降立于賓南主人西南面三拜衆賓衆賓皆答一拜主人揖升坐取爵于西楹下降洗升實爵于西階上獻衆賓衆賓之長升拜受者三人主人拜送坐祭立飲不拜既爵授主人爵降復位衆賓獻則不拜受爵坐祭立飲每一人獻則薦諸其席衆賓辨有脯醢主人以爵降奠于篚揖讓升賓厭介升介厭衆賓升衆賓序升即席一人洗升舉觶于賓實觶西階上坐奠觶遂拜執觶興賓席末答拜坐祭遂飲卒觶興坐奠觶遂拜執觶興賓答拜降洗升實觶立于西階上賓拜進坐奠觶于薦西賓辭坐受以興舉觶者西階上拜送賓坐奠觶于其所舉觶者降設席于堂廉東上工四人二瑟瑟先相者二人皆左何瑟後首挎越內弦右手相樂正先升立于西階東工入升自西階北面坐相者東面坐遂授瑟乃降工歌鹿鳴四牡皇皇者華卒歌主人獻工工左瑟一人拜不興受爵主人阼階上拜送爵薦脯醢使人相祭工飲不拜既爵授主人爵衆工則不拜受爵祭飲辨有脯醢不祭大師則為之洗賓介降主人辭降工不辭洗笙入堂下磬南北面立樂南陔白華華黍主人獻之于西階上一人拜盡階不升堂受爵主人拜送爵階前坐祭立飲不拜既爵升授主人爵衆笙則不拜受爵坐祭立飲辨有脯醢不祭乃間歌魚麗笙由庚歌南有嘉魚笙崇丘歌南山有臺笙由儀乃合樂周南關雎葛覃卷耳召南鵲巢采蘩采蘋工告于樂正曰正歌備樂正告于賓乃降主人降席自南方側降作相為司正司正禮辭許諾主人拜司正答拜主人升復席司正洗觶升自西階阼階上北面受命于主人主人曰請安于賓司正告于賓賓禮辭許司正告于主人主人阼階上再拜賓西階上答拜司正立于楹間以相拜皆揖復席司正實觶降自西階階間北面坐奠觶退共少立坐取觶不祭遂飲卒觶興坐奠觶遂拜執觶興盥洗北面坐奠觶于其所退立于觶南賓北面坐取俎西之觶阼階上北面酬主人主人降席立于賓東賓坐奠觶遂拜執觶興主人答拜不祭立飲不拜卒觶不洗實觶東南面授主人主人阼階上拜賓少退主人受觶賓拜送于主人之西賓揖復席主人西階上酬介介降席自南方立于主人之西如賓酬主人之禮主人揖復席司正升相旅曰某子受酬受酬者降席司正退立于序端東面受酬者自介右衆受酬者受自左拜興飲皆如賓酬主人之禮辨卒受者以觶降坐奠于篚司正降復位使二人舉觶于賓介洗升實觶于西階上皆坐奠觶遂拜執觶興賓介席末答拜皆坐祭遂飲卒觶興坐奠觶遂拜執觶興賓介席末答拜逆降洗升實觶皆立于西階上賓介皆拜皆進薦西奠之賓辭坐取觶以興介則薦南奠之介坐受以興退皆拜送降賓介奠于其所司正升自西階受命于主人主人曰請坐于賓賓辭以俎主人請徹俎賓許司正降階前命弟子俟徹俎司正升立于序端賓降席北面主人降席阼階上北面介降席西階上北面遵者降席席東南面賓取俎還授司正司正以降賓從之主人取俎還授弟子弟子以降自西階主人降自阼階介取俎還授弟子弟子以降介從之若有諸公大夫則使人受俎如賓禮衆賓皆降説屨揖讓如初升坐乃羞無算爵無算樂賓出奏陔主人送于門外再拜賓若有遵者諸公大夫則既一人舉觶乃入席于賓東公三重大夫再重公如大夫入主人降賓介降衆賓皆降復初位主人迎揖讓升公升如賓禮辭一席使一人去之大夫則如介禮有諸公則辭加席委于席端主人不徹無諸公則大夫辭加席主人對不去加席明日賓服鄉服以拜賜主人如賓服以拜辱主人釋服乃息司正無介不殺薦脯醢羞唯所有徵唯所欲以告於先生君子可也賓介不與鄉樂唯欲記鄉朝服而謀賓介皆使能不宿戒蒲筵緇布純尊綌幂賓至徹之其牲狗也亨于堂東北獻用爵其他用觶薦脯五挺橫祭于其上出自左房俎由東壁自西階升賓俎脊脅肩肺主人俎脊脅臂肺介俎脊脅肫胳肺肺皆離皆右體進腠以爵拜者不徒作坐卒爵者拜既爵立卒爵者不拜既爵凡奠者於左將舉於右衆賓之長一人辭洗如賓禮立者東面北上若有北面者則東上樂正與立者皆薦以齒凡舉爵三作而不徒爵樂作大夫不入獻工與笙取爵于上篚既獻奠于下篚其笙則獻諸西階上磬階間縮霤北面鼓之主人介凡升席自北方降自南方司正既舉觶而薦諸其位凡旅不洗不洗者不祭既旅士不入徹俎賓介遵者之俎受者以降遂出授從者主人之俎以東樂正命奏陔賓出至于階陔作若有諸公則大夫於主人之北西面主人之贊者西面北上不與無算爵然後與
