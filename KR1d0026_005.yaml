body:
  text: 鄉射禮第五鄉射禮第五鄉射之禮主人戒賓賓出迎再拜主人答再拜乃請賓禮辭許主人再拜賓答再拜主人退賓送再拜無介乃席賓南面東上衆賓之席繼而西席主人於阼階上西面尊於賓席之東兩壺斯禁左玄酒皆加勺篚在其南東肆設洗于阼階東南南北以堂深東西當東榮水在洗東篚在洗西南肆縣于洗東北西面乃張侯下綱不及地武不繫左下綱中掩束之乏參侯道之一居侯黨西五步羹定主人朝服乃速賓賓朝服出迎再拜主人答再拜退賓送再拜賓及衆賓遂從之及門主人一相出迎于門外再拜賓答再拜揖衆賓主人以賓揖先入賓厭衆賓衆賓皆入門左東面北上賓少進主人以賓三揖皆行及階三讓主人升一等賓升主人阼階上當楣北面再拜賓西階上當楣北面答再拜主人坐取爵於上篚以降賓降主人阼階前西面坐奠爵興辭降賓對主人坐取爵興適洗南面坐奠爵于篚下盥洗賓進東北面辭洗主人坐奠爵于篚興對賓反位主人卒洗一揖一讓以賓升賓西階上北面拜洗主人阼階上北面奠爵遂答拜乃降賓降主人辭降賓對主人卒盥一揖一讓升賓升西階上疑立主人坐取爵實之賓席之前西北面獻賓賓西階上北面拜主人少退賓進受爵于席前復位主人阼階上拜送爵賓少退薦脯醢賓升席自西方乃設折俎主人阼階東疑立賓坐左執爵右祭脯醢奠爵于薦西興取肺坐絶祭尚左手嚌之興加于俎坐挩手執爵遂祭酒興席末坐啐酒降席坐奠爵拜告旨執爵興主人阼階上答拜賓西階上北面坐卒爵興坐奠爵遂拜執爵興主人阼階上答拜賓以虛爵降主人降賓西階前東面坐奠爵興辭降主人對賓坐取爵適洗南北面坐奠爵于篚下興盥洗主人阼階之東南面辭洗賓坐奠爵于篚興對主人反位賓卒洗揖讓如初升主人拜洗賓答拜興降盥如主人之禮賓升實爵主人之席前東南面酢主人主人阼階上拜賓少退主人進受爵復位賓西階上拜送爵薦脯醢主人升席自北方乃設折俎祭如賓禮不告旨自席前適阼階上北面坐卒爵興坐奠爵遂拜執爵興賓西階上北面答拜主人坐奠爵于序端阼階上再拜崇酒賓西階上答再拜主人坐取觶于篚以降賓降主人奠觶辭降賓對東面立主人坐取觶洗賓不辭洗卒洗揖讓升賓西階上疑立主人實觶酬之阼階上北面坐奠觶遂拜執觶興賓西階上北面答拜主人坐祭遂飲卒觶興坐奠觶遂拜執觶興賓西階上北面答拜主人降洗賓降辭如獻禮升不拜洗賓西階上立主人實觶賓之席前北面賓西階上拜主人坐奠觶于薦西賓辭坐取觶以興反位主人阼階上拜送賓北面坐奠觶于薦東反位主人揖降賓降東面立于西階西當西序主人西南面三拜衆賓衆賓皆答一拜主人揖升坐取爵于序端降洗升實爵西階上獻衆賓衆賓之長升拜受者三人主人拜送坐祭立飲不拜既爵授主人爵降復位衆賓皆不拜受爵坐祭立飲每一人獻則薦諸其席衆賓辨有脯醢主人以虛爵降奠于篚揖讓升賓厭衆賓升衆賓皆升就席一人洗舉觶於賓升實觶西階上坐奠觶拜執觶興賓席末答拜舉觶者坐祭遂飲卒觶興坐奠觶拜執觶興賓答拜降洗升實之西階上北面賓拜舉觶者進坐奠觶于薦西賓辭坐取以興舉觶者西階上拜送賓反奠于其所舉觶者降大夫若有遵者則入門左主人降賓及衆賓皆降復初位主人揖讓以大夫升拜至大夫答拜主人以爵降大夫降主人辭降大夫辭洗如賓禮席于尊東升不拜洗主人實爵席前獻于大夫大夫西階上拜進受爵反位主人大夫之右拜送大夫辭加席主人對不去加席乃薦脯醢大夫升席設折俎祭如賓禮不嚌肺不啐酒不告旨西階上卒爵拜主人答拜大夫降洗主人復阼階降辭如初卒洗主人盥揖讓升大夫授主人爵于兩楹間復位主人實爵以酢于西階上坐奠爵拜大夫答拜坐祭卒爵拜大夫答拜主人坐奠爵于西楹南再拜崇酒大夫答拜主人復阼階揖降大夫降立于賓南主人揖讓以賓升大夫及衆賓皆升就席席工于西階上少東樂正先升北面立于其西工四人二瑟瑟先相者皆左何瑟面鼓執越內弦右手相入升自西階北面東上工坐相者坐授瑟乃降笙入立于縣中西面乃合樂周南關雎葛覃卷耳召南鵲巢采蘩采蘋工不興告于樂正曰正歌備樂正告于賓乃降主人取爵于上篚獻工大師則為之洗賓降主人辭降工不辭洗卒洗升實爵工不興左瑟一人拜受爵主人阼階上拜送爵薦脯醢使人相祭工飲不拜既爵授主人爵衆工不拜受爵祭飲辨有脯醢不祭不洗遂獻笙于西階上笙一人拜于下盡階不升堂受爵主人拜送爵階前坐祭立飲不拜既爵升授主人爵衆笙不拜受爵坐祭立飲辨有脯醢不祭主人以爵降奠于篚反升就席主人降席自南方側降作相為司正司正禮辭許諾主人再拜司正答拜主人升就席司正洗觶升自西階由楹內適阼階上北面受命于主人西階上北面請安于賓賓禮辭許司正告于主人遂立于楹間以相拜主人阼階上再拜賓西階上答再拜皆揖就席司正實觶降自西階中庭北面坐奠觶興退少立進坐取觶興反坐不祭遂卒觶興坐奠觶拜執觶興洗北面坐奠于其所興少退北面立于觶南未旅三耦俟于堂西南面東上司射適堂西袒決遂取弓于階西兼挾乘矢升自西階階上北面告于賓曰弓矢既具有司請射賓對曰某不能為二三子許諾司射適阼階上東北面告于主人曰請射于賓賓許司射降自西階階前西面命弟子納射器乃納射器皆在堂西賓與大夫之弓倚于西序矢在弓下北括衆弓倚于堂西矢在其上主人之弓矢在東序東司射不釋弓矢遂以比三耦於堂西三耦之南北面命上射曰某御於子命下射曰子與某子射司正為司馬司馬命張侯弟子説束遂繫左下綱司馬又命獲者倚旌于侯中獲者由西方坐取旌倚于侯中乃退樂正適西方命弟子贊工遷樂于下弟子相工如初入降自西階阼階下之東南堂前三笴西面北上坐樂正北面立于其南司射猶挾乘矢以命三耦各與其耦讓取弓矢拾三耦皆袒決遂有司左執弣右執弦而授弓遂授矢三耦皆執弓搢三而挾一個司射先立于所設中之西南東面三耦皆進由司射之西立于其西南東面北上而俟司射東面立于三耦之北搢三而挾一個揖進當階北面揖及階揖升堂揖豫則鉤楹內堂則由楹外當左物北面揖及物揖左足履物不方足還視侯中俯正足不去旌誘射將乘矢執弓不挾右執弦南面揖揖如升射降出于其位南適堂西改取一個挾之遂適階西取撲搢之以反位司馬命獲者執旌以負侯獲者適侯執旌負侯而俟司射還當上耦西面作上耦射司射反位上耦揖進上射在左並行當階北面揖及階揖上射先升三等下射從之中等上射升堂少左下射升上射揖並行皆當其物北面揖及物揖皆左足履物還視侯中合足而俟司馬適堂西不決遂袒執弓出于司射之南升自西階鉤楹由上射之後西南面立于物間右執簫南揚弓命去侯獲者執旌許諾聲不絶以至于乏坐東面偃旌興而俟司馬出于下射之南還其後降自西階反由司射之南適堂西釋弓襲反位立于司射之南司射進與司馬交于階前相左由堂下西階之東北面視上射命曰無射獲無獵獲上射揖司射退反位乃射上射既發挾弓矢而后下射射拾發以將乘矢獲者坐而獲舉旌以宮偃旌以商獲而未釋獲卒射皆執弓不挾南面揖揖如升射上射降三等下射少右從之中等並行上射於左與升射者相左交于階前相揖由司馬之南適堂西釋弓説決拾襲而俟于堂西南面東上三耦卒射亦如之司射去撲倚于西階之西升堂北面告于賓曰三耦卒射賓揖司射降搢撲反位司馬適堂西袒執弓由其位南進與司射交于階前相左升自西階鉤楹自右物之後立于物間西南面揖弓命取矢獲者執旌許諾聲不絶以旌負侯而俟司馬出于左物之南還其後降自西階遂適堂前北面立于所設楅之南命弟子設楅乃設楅于中庭南當洗東肆司馬由司射之南退釋弓于堂西襲反位弟子取矢北面坐委于楅北括乃退司馬襲進當楅南北面坐左右撫矢而乘之若矢不備則司馬又袒執弓如初升命曰取矢不索弟子自西方應曰諾乃復求矢加于楅司射倚撲于階西升請射于賓如初賓許諾賓主人大夫若皆與射則遂告于賓適阼階上告于主人主人與賓為耦遂告于大夫大夫雖衆皆與士為耦以耦告于大夫曰某御於子西階上北面作衆賓射司射降搢撲由司馬之南適堂西立比衆耦衆賓將與射者皆降由司馬之南適堂西繼三耦而立東上大夫之耦為上若有東面者則北上賓主人與大夫皆未降司射乃比衆耦辨遂命三耦拾取矢司射反位三耦拾取矢皆袒決遂執弓進立于司馬之西南司射作上耦取矢司射反位上耦揖進當楅北面揖及楅揖上射東面下射西面上射揖進坐橫弓卻手自弓下取一個兼諸弣順羽且興執弦而左還退反位東面揖下射進坐橫弓覆手自弓上取一個興其他如上射既拾取乘矢揖皆左還南面揖皆少進當楅南皆左還北面搢三挾一個揖皆左還上射於右與進者相左相揖退反位三耦拾取矢亦如之後者遂取誘射之矢兼乘矢而取之以授有司于西方而后反位衆賓未拾取矢皆袒決遂執弓搢三挾一個由堂西進繼三耦之南而立東面北上大夫之耦為上司射作射如初一耦揖升如初司馬命去侯獲者許諾司馬降釋弓反位司射猶挾一個去撲與司馬交于階前升請釋獲于賓賓許降搢撲西面立于所設中之東北面命釋獲者設中遂視之釋獲者執鹿中一人執算以從之釋獲者坐設中南當楅西當西序東面興受算坐實八算于中橫委其餘于中西南末興共而俟司射遂進由堂下北面命曰不貫不釋上射揖司射退反位釋獲者坐取中之八算改實八算于中興執而俟乃射若中則釋獲者坐而釋獲每一個釋一算上射於右下射於左若有餘算則反委之又取中之八算改實八算于中興執而俟三耦卒射賓主人大夫揖皆由其階降揖主人堂東袒決遂執弓搢三挾一個賓於堂西亦如之皆由其階階下揖升堂揖主人為下射皆當其物北面揖及物揖乃射卒南面揖皆由其階階上揖降階揖賓序西主人序東皆釋弓説決拾襲反位升及階揖升堂揖皆就席大夫袒決遂執弓搢三挾一個由堂西出于司射之西就其耦大夫為下射揖進耦少退揖如三耦及階耦先升卒射揖如升射耦先降降階耦少退皆釋弓于堂西襲耦遂止于堂西大夫升就席衆賓繼射釋獲皆如初司射所作唯上耦卒射釋獲者遂以所執餘獲升自西階盡階不升堂告于賓曰左右卒射降反位坐委餘獲于中西興共而俟司馬袒決執弓升命取矢如初獲者許諾以旌負侯如初司馬降釋弓反位弟子委矢如初大夫之矢則兼束之以茅上握焉司馬乘矢如初司射遂適西階西釋弓去撲襲進由中東立于中南北面視算釋獲者東面于中西坐先數右獲二算為純一純以取實于左手十純則縮而委之每委異之有餘純則橫於下一算為奇奇則又縮諸純下興自前適左東面坐兼斂算實于左手一純以委十則異之其餘如右獲司射復位釋獲者遂進取賢獲執以升自西階盡階不升堂告于賓若右勝則曰右賢於左若左勝則曰左賢於右以純數告若有奇者亦曰奇若左右鈞則左右皆執一算以告曰左右鈞降復位坐兼斂算實八算于中委其餘于中西興共而俟司射適堂西命弟子設豐弟子奉豐升設于西楹之西乃降勝者之弟子洗觶升酌南面坐奠于豐上降袒執弓反位司射遂袒執弓挾一個搢撲北面于三耦之南命三耦及衆賓勝者皆袒決遂執張弓不勝者皆襲説決拾卻左手右加弛弓于其上遂以執弣司射先反位三耦及衆射者皆與其耦進立于射位北上司射作升飲者如作射一耦進揖如升射及階勝者先升升堂少右不勝者進北面坐取豐上之觶興少退立卒觶進坐奠于豐下興揖不勝者先降與升飲者相左交于階前相揖出于司馬之南遂適堂西釋弓襲而俟有執爵者執爵者坐取觶實之反奠于豐上升飲者如初三耦卒飲賓主人大夫不勝則不執弓執爵者取觶降洗升實之以授于席前受觶以適西階上北面立飲卒觶授執爵者反就席大夫飲則耦不升若大夫之耦不勝則亦執弛弓特升飲衆賓繼飲射爵者辨乃徹豐與觶司馬洗爵升實之以降獻獲者于侯薦脯醢設折俎俎與薦皆三祭獲者負侯北面拜受爵司馬西面拜送爵獲者執爵使人執其薦與俎從之適右個設薦俎獲者南面坐左執爵祭脯醢執爵興取肺坐祭遂祭酒興適左個中皆如之左個之西北三步東面設薦俎獲者薦右東面立飲不拜既爵司馬受爵奠于篚復位獲者執其薦使人執俎從之辟設于乏南獲者負侯而俟司射適階西釋弓矢去撲説決拾襲適洗洗爵升實之以降獻釋獲者于其位少南薦脯醢折俎有祭釋獲者薦右東面拜受爵司射北面拜送爵釋獲者就其薦坐左執爵祭脯醢興取肺坐祭遂祭酒興司射之西北面立飲不拜既爵司射受爵奠于篚釋獲者少西辟薦反位司射適堂西袒決遂取弓于階西挾一個搢撲以反位司射去撲倚于階西升請射于賓如初賓許司射降搢撲由司馬之南適堂西命三耦及衆賓皆袒決遂執弓就位司射先反位三耦及衆賓皆袒決遂執弓各以其耦進反于射位司射作拾取矢三耦拾取矢如初反位賓主人大夫降揖如初主人堂東賓堂西皆袒決遂執弓皆進階前揖及楅揖拾取矢如三耦卒北面搢三挾一個揖退賓堂西主人堂東皆釋弓矢襲及階揖升堂揖就席大夫袒決遂執弓就其耦揖皆進如三耦耦東面大夫西面大夫進坐説矢束興反位而后耦揖進坐兼取乘矢順羽而興反位揖大夫進坐亦兼取乘矢如其耦北面搢三挾一個揖退耦反位大夫遂適序西釋弓矢襲升即席衆賓繼拾取矢皆如三耦以反位司射猶挾一個以進作上射如初一耦揖升如初司馬升命去侯獲者許諾司馬降釋弓反位司射與司馬交于階前去撲襲升請以樂樂于賓賓許諾司射降搢撲東面命樂正曰請以樂樂于賓賓許司射遂適階間堂下北面命曰不鼓不釋上射揖司射退反位樂正東面命大師曰奏騶虞間若一大師不興許諾樂正退反位乃奏騶虞以射三耦卒射賓主人大夫衆賓繼射釋獲如初卒射降釋獲者執餘獲升告左右卒射如初司馬升命取矢獲者許諾司馬降釋弓反位弟子委矢司馬乘之皆如初司射釋弓視算如初釋獲者以賢獲與鈞告如初降復位司射命設豐設豐實觶如初遂命勝者執張弓不勝者執弛弓升飲如初司射遂袒決遂左執弓右執一個兼諸弦面鏃適堂西以命拾取矢如初司射反位三耦及賓主人大夫衆賓皆袒決遂拾取矢如初矢不挾兼諸弦弣以退不反位遂授有司于堂西辨拾取矢揖皆升就席司射乃適堂西釋弓去撲説決拾襲反位司馬命弟子説侯之左下綱而釋之命獲者以旌退命弟子退楅司射命釋獲者退中與算而俟司馬反為司正退復觶南而立樂正命弟子贊工即位弟子相工如其降也升自西階反坐賓北面坐取俎西之觶興阼階上北面酬主人主人降席立于賓東賓坐奠觶拜執觶興主人答拜賓不祭卒觶不拜不洗實之進東南面主人阼階上北面拜賓少退主人進受觶賓主人之西北面拜送賓揖就席主人以觶適西階上酬大夫大夫降席立于主人之西如賓酬主人之禮主人揖就席若無大夫則長受酬亦如之司正升自西階相旅作受酬者曰某酬某子受酬者降席司正退立于西序端東面衆受酬者拜興飲皆如賓酬主人之禮辨遂酬在下者皆升受酬于西階上卒受者以觶降奠于篚司正降復位使二人舉觶于賓與大夫舉觶者皆洗觶升實之西階上北面皆坐奠觶拜執觶興賓與大夫皆席末答拜舉觶者皆坐祭遂飲卒觶興坐奠觶拜執觶興賓與大夫皆答拜舉觶者逆降洗升實觶皆立于西階上北面東上賓與大夫拜舉觶者皆進坐奠于薦右賓與大夫辭坐受觶以興舉觶者退反位皆拜送乃降賓與大夫坐反奠于其所興若無大夫則唯賓司正升自西階阼階上受命于主人適西階上北面請坐于賓賓辭以俎反命于主人主人曰請徹俎賓許司正降自西階階前命弟子俟徹俎司正升立于序端賓降席北面主人降席自南方阼階上北面大夫降席席東南面賓取俎還授司正司正以降自西階賓從之降遂立于階西東面司正以俎出授從者主人取俎還授弟子弟子受俎降自西階以東主人降自阼階西面立大夫取俎還授弟子弟子以降自西階遂出授從者大夫從之降立于賓南衆賓皆降立于大夫之南少退北上主人以賓揖讓説屨乃升大夫及衆賓皆説屨升坐乃羞無算爵使二人舉觶賓與大夫不興取奠觶飲卒觶不拜執觶者受觶遂實之賓觶以之主人大夫之觶長受而錯皆不拜辨卒受者興以旅在下者于西階上長受酬酬者不拜乃飲卒觶以實之受酬者不拜受辨旅皆不拜執觶者皆與旅卒受者以虛觶降奠于篚執觶者洗升實觶反奠于賓與大夫無算樂賓興樂正命奏陔賓降及階陔作賓出衆賓皆出主人送于門外再拜明日賓朝服以拜賜于門外主人不見如賓服遂從之拜辱于門外乃退主人釋服乃息司正無介不殺使人速迎于門外不拜入升不拜至不拜洗薦脯醢無俎賓酢主人主人不崇酒不拜衆賓既獻衆賓一人舉觶遂無算爵無司正賓不與徵唯所欲以告於鄉先生君子可也羞唯所有鄉樂唯欲記大夫與則公士為賓使能不宿戒其牲狗也亨于堂東北尊綌幂賓至徹之蒲筵緇布純西序之席北上獻用爵其他用觶以爵拜者不徒作薦脯用籩五膱祭半膱橫于上醢以豆出自東房膱長尺二寸俎由東壁自西階升賓俎脊脅肩肺主人俎脊脅臂肺肺皆離皆右體也進腠凡舉爵三作而不徒爵凡奠者於左將舉者於右衆賓之長一人辭洗如賓禮若有諸公則如賓禮大夫如介禮無諸公則大夫如賓禮樂作大夫不入樂正與立者齒三笙一和而成聲獻工與笙取爵于上篚既獻奠于下篚其笙則獻諸西階上立者東面北上司正既舉觶而薦諸其位三耦者使弟子司射前戒之司射之弓矢與撲倚于西階之西司射既袒決遂而升司馬階前命張侯遂命倚旌凡侯天子熊侯白質諸侯麋侯赤質大夫布侯畫以虎豹士布侯畫以鹿豕凡畫者丹質射自楹間物長如笴其間容弓距隨長武序則物當棟堂則物當楣命負侯者由其位凡適堂西皆出入于司馬之南唯賓與大夫降階遂西取弓矢旌各以其物無物則以白羽與朱羽糅杠長三仞以鴻脰韜上二尋凡挾矢於二指之間橫之司射在司馬之北司馬無事不執弓始射獲而未釋獲復釋獲復用樂行之上射於右楅長如笴博三寸厚寸有半龍首其中蛇交韋當楅髤橫而拳之南面坐而奠之南北當洗射者有過則撻之衆賓不與射者不降取誘射之矢者既拾取矢而后兼誘射之乘矢而取之賓主人射則司射擯升降卒射即席而反位卒事鹿中髤前足跪鑿背容八算釋獲者奉之先首大夫降立于堂西以俟射大夫與士射袒薰襦耦少退于物司射釋弓矢視算與獻釋獲者釋弓矢禮射不主皮主皮之射者勝者又射不勝者降主人亦飲于西階上獲者之俎折脊脅肺臑東方謂之右個釋獲者之俎折脊脅肺皆有祭大夫説矢束坐説之歌騶虞若采蘋皆五終射無算古者於旅也語凡旅不洗不洗者不祭既旅士不入大夫後出主人送于門外再拜鄉侯上個五尋中十尺侯道五十弓弓二寸以為侯中倍中以為躬倍躬以為左右舌下舌半上舌箭籌八十長尺有握握素楚撲長如笴刊本尺君射則為下射上射退于物一笴既發則答君而俟君樂作而后就物君袒朱襦以射小臣以巾執矢以授若飲君如燕則夾爵君國中射則皮樹中以翿旌獲白羽與朱羽糅於郊則閭中以旌獲於竟則虎中龍旜大夫兕中各以其物獲士鹿中翿旌以獲唯君有射于國中其餘否君在大夫射則肉袒
