body:
  text: 士冠禮第一士冠禮第一士冠禮筮于廟門主人玄冠朝服緇帶素韠即位于門東西面有司如主人服即位于西方東面北上筮與席所卦者具饌于西塾布席于門中闑西閾外西面筮人執筴抽上韇兼執之進受命於主人宰自右少退贊命筮人許諾右還即席坐西面卦者在左卒筮書卦執以示主人主人受眡反之筮人還東面旅占卒進告吉若不吉則筮遠日如初儀徹筮席宗人告事畢主人戒賓賓禮辭許主人再拜賓荅拜主人退賓拜送前期三日筮賓如求日之儀乃宿賓賓如主人服出門左西面再拜主人東面荅拜乃宿賓賓許主人再拜賓荅拜主人退賓拜送宿贊冠者一人亦如之厥明夕為期于廟門之外主人立于門東兄弟在其南少退西面北上有司皆如宿服立于西方東面北上擯者請期宰告曰質明行事告兄弟及有司告事畢擯者告期于賓之家夙興設洗直于東榮南北以堂深水在洗東陳服于房中西墉下東領北上爵弁服纁裳純衣緇帶韎韐皮弁服素積緇帶素韠玄端玄裳黃裳雜裳可也緇帶爵韠緇布冠缺項青組纓屬于缺緇纚廣終幅長六尺皮弁笄爵弁笄緇組紘纁邊同篋櫛實于簞蒲筵二在南側尊一甒醴在服北有篚實勺觶角柶脯醢南上爵弁皮弁緇布冠各一匴執以待于西坫南南面東上賓升則東面主人玄端爵韠立于阼階下直東序西面兄弟畢袗玄立于洗東西面北上擯者玄端負東塾將冠者采衣紒在房中南面賓如主人服贊者玄端從之立于外門之外擯者告主人迎出門左西面再拜賓荅拜主人揖贊者與賓揖先入每曲揖至于廟門揖入三揖至于階三讓主人升立于序端西面賓西序東面贊者盥于洗西升立于房中西面南上主人之贊者筵于東序少北西面將冠者出房南面贊者奠纚笄櫛于筵南端賓揖將冠者將冠者即筵坐贊者坐櫛設纚賓降主人降賓辭主人對賓盥卒壹揖壹讓升主人升復初位賓筵前坐正纚興降西階一等執冠者升一等東面授賓賓右手執項左手執前進容乃祝坐如初乃冠興復位贊者卒冠者興賓揖之適房服玄端爵韠出房南面賓揖之即筵坐櫛設笄賓盥正纚如初降二等受皮弁右執項左執前進祝加之如初復位贊者卒紘興賓揖之適房服素積素韠容出房南面賓降三等受爵弁加之服纁裳韎韐其他如加皮弁之儀徹皮弁冠櫛筵入于房筵于戶西南面贊者洗于房中側酌醴加柶覆之面葉賓揖冠者就筵筵西南面賓受醴于戶東加柶面枋筵前北面冠者筵西拜受觶賓東面荅拜薦脯醢冠者即筵坐左執觶右祭脯醢以柶祭醴三興筵末坐啐醴建柶興降筵坐奠觶拜執觶興賓荅拜冠者奠觶于薦東降筵北面坐取脯降自西階適東壁北面見于母母拜受子拜送母又拜賓降直西序東面主人降復初位冠者立于西階東南面賓字之冠者對賓出主人送于廟門外請醴賓賓禮辭許賓就次冠者見於兄弟兄弟再拜冠者荅拜見贊者西面拜亦如之入見姑姊如見母乃易服服玄冠玄端爵韠奠摯見于君遂以摯見於鄉大夫鄉先生乃醴賓以壹獻之禮主人酬賓束帛儷皮贊者皆與贊冠者為介賓出主人送于外門外再拜歸賓俎若不醴則醮用酒尊于房戶之閒兩甒有禁玄酒在西加勺南枋洗有篚在西南順始加醮用脯醢賓降取爵于篚辭降如初卒洗升酌冠者拜受賓荅拜如初冠者升筵坐左執爵右祭脯醢祭酒興筵末坐啐酒降筵拜賓荅拜冠者奠爵于薦東立于筵西徹薦爵筵尊不徹加皮弁如初儀再醮攝酒其他皆如初加爵弁如初儀三醮有乾肉折俎嚌之其他如初北面取脯見于母若殺則特豚載合升離肺實于鼎設扃鼏始醮如初再醮兩豆葵菹蠃醢兩籩栗脯三醮攝酒如再醮加俎嚌之皆如初嚌肺卒醮取籩脯以降如初若孤子則父兄戒宿冠之日主人紒而迎賓拜揖讓立于序端皆如冠主禮於阼凡拜北面于阼階上賓亦北面于西階上荅拜若殺則舉鼎陳于門外直東塾北面若庶子則冠于房外南面遂醮焉冠者母不在則使人受脯于西階下戒賓曰某有子某將加布於其首願吾子之教之也賓對曰某不敏恐不能共事以病吾子敢辭主人曰某猶願吾子之終教之也賓對曰吾子重有命某敢不從宿曰某將加布於某之首吾子將莅之敢宿賓對曰某敢不夙興始加祝曰令月吉日始加元服棄爾幼志順爾成德壽考惟祺介爾景福再加曰吉月令辰乃申爾服敬爾威儀淑慎爾德眉壽萬年永受胡福三加曰以歲之正以月之令咸加爾服兄弟具在以成厥德黃耇無疆受天之慶醴辭曰甘醴惟厚嘉薦令芳拜受祭之以定爾祥承天之休壽考不忘醮辭曰旨酒既清嘉薦亶時始加元服兄弟具來孝友時格永乃保之再醮曰旨酒既湑嘉薦伊脯乃申爾服禮儀有序祭此嘉爵承天之祜三醮曰旨酒令芳籩豆有楚咸加爾服肴升折俎承天之慶受福無疆字辭曰禮儀既備令月吉日昭告爾字爰字孔嘉髦士攸宜宜之于假永受保之曰伯某甫仲叔季唯其所當屨夏用葛玄端黑屨青絇繶純純博寸素積白屨以魁柎之緇絇繶純純博寸爵弁纁屨黑絇繶純純博寸冬皮屨可也不屨繐履記冠義始冠緇布之冠也大古冠布齊則緇之其緌也孔子曰吾未之聞也冠而敝之可也適子冠於阼以著代也醮於客位加有成也三加彌尊諭其志也冠而字之敬其名也委貌周道也章甫殷道也毋追夏后氏之道也周弁殷冔夏收三王共皮弁素積無大夫冠禮而有其昏禮古者五十而后爵何大夫冠禮之有公侯之有冠禮也夏之末造也天子之元子猶士也天下無生而貴者也繼世以立諸侯象賢也以官爵人德之殺也死而謚今也古者生無爵死無謚
