body:
  text: 儀禮卷第十五特牲饋食禮第十五鄭氏注特牲饋食之禮不諏日祭祀自孰始曰饋食饋食者食道也諏謀也士賤職褻時至事暇可以祭則筮其日矣不如少牢大夫先與有司於庿門諏丁巳之日今文諏皆爲詛及筮日主人冠端玄卽位于門外西面冠端玄玄冠玄端下言玄者玄冠有不玄端者門謂庿門子姓兄弟如主人之服立于主人之南西面北上所祭者之子孫言子姓者子之所生小宗祭而兄弟皆來與焉宗子祭則族人皆侍有司羣執事如兄弟服東面北上士之屬吏也席于門中闑西閾外爲筮人設之也古文闑作槷閾作蹙筮人取筮于西塾執之東面受命于主人筮人官名也筮問也取其所用問神明者謂著也宰自主人之左賛命命曰孝孫某筮來日某諏此某事適其皇祖某子尚饗宰羣吏之長自由也賛佐也逹也賛命由左者爲神求變也士祭曰歲事此言某事又不言妃者容大祥之後禫月之吉祭皇君也言君祖者尊之也某子者祖字也伯子仲子也尚庶幾也筮者許諾還卽席西面坐卦者在左卒筮寫卦筮者執以示主人士之筮者坐蓍短由便卦者主畫地識爻爻備以方寫之主人受視反之反還筮者還東面長占卒告于主人占曰吉長占以其屬之長㓜旅占之􅀂不吉則筮逺日如初儀逺日旬之外日宗人吿事畢前期三日之朝筮尸如求日之儀命筮曰孝孫某諏此某事適其皇祖某子筮某之某爲尸尚饗三日者容宿賔視濯也某之某者字尸父而名尸連言其親庶幾其馮依之也大夫士以孫之倫爲尸乃宿尸宿讀爲肅肅進也進之者使知祭日當來古文宿皆作羞凡宿或作速記作肅周禮亦作宿主人立于尸外門外子姓兄弟立于主人之後北面東上不東面者來不爲賔客子姓立于主人之後上當其後尸如主人服出門左西面不敢南面當尊主人辟皆東面北上順尸主人再拜尸荅拜主人先拜尊尸宗人擯辭如初卒曰筮子爲某尸占曰吉敢宿宗人擯者釋主人之辭如初者如宰賛命筮尸之辭卒曰者著其辭所易也今文無敢祝許諾致命受宗人辭許之傳命於尸始宗人祝北面至於傳命皆西面受命東面釋之尸許諾主人再拜稽首其許亦宗人受於祝而告主人尸入主人退相揖而去尸不拜送尸尊宿賔賔如主人服出門左西面再拜主人東面荅再拜宗人擯曰某薦歲事吾子將涖之敢宿薦進也涖臨也言吾子將臨之知賔在有司中今特肅之尊賔耳賔曰某敢不敬從主人再拜賔荅拜主人退賔拜送厥明夕陳鼎于門外北面北上有鼏厥其也宿賔之明日夕門外北而當門也古文鼏爲密棜在其南南順實獸于其上東首順猶從也棜之制如今大木轝矣上有四周下無足獸腊也牲在其西北首東足其西棜西也東足者尚右也牲不用棜以其生設洗于阼階東南壷禁在東序豆籩鉶在東房南上凡席兩敦在西堂東房房中之東當夾北西堂西夾室之前近南耳主人及子姓兄弟即位于門東如初初筮位也賔及衆賔即位于門西東面北上不象如初者以宰在而宗人祝不在宗人祝立于賔西北東面南上事彌至位彌異宗人祝於祭宜近庿主人再拜賔荅再拜三拜衆賔衆賔荅再拜衆賔再拜者士賤旅之得備禮也主人揖入兄弟從賔及衆賔從即位于堂下如外位爲視濯也宗人升自西階視壺濯及豆籩反降東北面吿濯具濯漑也不言敦鉶者省文也東北面告縁賔意欲聞也言濯具不言絜以有几席賔出主人出皆復外位爲視牲也今文復爲反宗人視牲吿充雍正作豕充猶肥也雍正官名也北面以䇿動作豕視聲氣宗人舉獸尾告備舉鼎鼏告潔備其請期曰羮飪肉謂之羮飪孰也謂明日質明時而曰肉孰重豫勞賔宗人旣得期西北面告賔有司吿事畢賔出主人拜送夙興主人服如初立于門外東方南面視側殺夙早也興起也主人服如初則其餘有不玄端者側殺殺一牲也主婦視饎爨于西堂下炊黍稷曰饎宗婦爲之爨竈也西堂下者堂之西下也近西壁南齊于坫古文饎作糦周禮作􅐪亨于門外東方西面北上亨煑也煑豕魚腊以鑊各一爨詩云誰能亨魚漑之釡鬵羮飪實鼎陳于門外如初初視濯也尊于戸東玄酒在西戸東室戸東玄酒在西尚之凡尊酌者在左實豆籩鉶陳于房中如初如初者取而實之旣而反之執事之爼陳于階間二列北上執事謂有司及兄弟二列者因其位在東西祝主人主婦之爼亦存焉不升鼎者異於神盛兩敦陳于西堂藉用萑几席陳于西堂如􅀄盛黍稷者宗婦也萑細葦古文用爲于尸盥匜水實于槃中簞巾在門内之右設盥水及巾尸尊不就洗又不揮門内之右象洗在東統于門東西上凡郷内以入爲左右郷外以出爲左右祝筵几于室中東面爲神敷席也至此使祝接神主婦纚笄宵衣立于房中南面主婦主人之妻雖姑存猶使之主祭祀纚笄首服宵綺屬也此衣染之以黒其繒本名曰宵詩有素衣朱宵記有玄宵衣凡婦人助祭者同服也内則曰舅没則姑老􅃁婦所祭祀賔客每事必請於姑主人及賔兄弟羣執事卽位于門外如􅀄宗人吿有司具具猶辦也主人拜賔如􅀄揖入即位如􅀄􅀄視濯也佐食北面立于中庭佐食賔佐尸食者立于宗人之西主人及祝升祝先入主人從西面于戸内祝先入接神冝在前也少牢饋食禮曰祝盥于洗升自西階主人盥升自阼階祝先入南面主婦盥于房中薦兩豆葵菹蝸醢醢在北主婦盥盥於内洗昬禮婦洗在北堂直室東隅宗人遣佐食及執事盥出命之盥出當助主人及賔舉鼎主人降及賔盥出主人在右及佐食舉牲鼎賔長在右及執事舉魚腊鼎除鼏及與也主人在右綂於東主人與佐食者賔尊不載少牢饋食禮魚用鮒腊用麋士腊用兎宗人執畢先入當阼階南面畢狀如义蓋爲其似畢星取名焉主人親舉宗人則執畢導之旣錯又以畢臨七載備失脫也雜記曰朼用桑長三尺畢用桑三尺刋其本與末朼畢同材明矣今此朼用􅁄心則畢亦用􅁄心舊說云畢以御他神物神物惡桑义則少牢饋食及虞無义何哉此無义者乃主人不親舉耳少牢大夫祭不親舉虞䘮祭祭也主人未執事祔練祥執事用桑义自此純吉用􅁄必义鼎西面錯右人抽扃委于鼎北右人謂主人及二賔旣錯皆西面俟也賛者錯爼加七賛者執爼及七從鼎入者其錯爼東縮加七東柄旣則退而左人北面也乃朼右人也尊者於事指使可也左人載之佐食升肵爼鼏之設于阼階西肵謂心舌之爼也郊特牲曰肵之爲言敬也言主人之所以敬尸之爼古文鼏皆作密卒載加七于鼎卒巳也巳載畢亦加焉主人升入復位爼入設于豆東魚次腊特于爼北入設爼載者腊特饌要方也凡饌必方者明食味人之性所以正主婦設兩敦黍稷于爼南西上及兩鉶芼設于豆南南陳宗婦不賛敦鉶者以其少可親之芼菜也祝洗酌奠奠于鉶南遂命佐食啓㑹佐食啓㑹郤于敦南出立于戸西南面酌奠奠其爵觶也少牢饋食禮啓㑹乃奠之主人再拜稽首祝在左稽首服之甚者祝在左當爲主人釋辭於神也祝祝曰孝孫某敢用剛鬛嘉薦普淖用薦某事於皇祖某子尚饗卒祝主人再拜稽首祝迎尸于門外尸自外來代主人接之就其次而請不拜不敢與尊者爲禮周禮掌次凡祭祀張尸次主人降立于阼階東主人不迎尸成尸尊尸所祭者之孫也祖之尸則主人乃宗子禰之尸則主人乃父道事神之禮庿中而巳出迎則爲厭尸入門左北面盥宗人授巾侍盥者執其􅄊就之執簞者不授巾賤也宗人授巾庭長尊少牢饋食禮曰祝先入門右尸入門左尸至于階祝延尸尸升入祝先主人從延進在後詔侑曰延禮􅄊所謂詔侑武方者也少牢饋食禮曰尸升自西階入祝從主人升自阼階祝先入主人從尸即席坐主人拜妥尸妥安坐也尸荅拜執奠祝饗主人拜如初饗勸強之也其辭取于士虞記則冝云孝孫某圭爲孝薦之饗舊說云明薦之祝命挼祭尸左執觶右取菹㨎于醢祭于豆間命詔尸也挼祭祭神食也士虞禮古文曰祝命佐食堕祭周禮曰旣祭則藏其堕堕與挼讀同耳今文改挼皆爲綏古文此皆爲挼祭也㨎醢者染於醢佐食取黍稷肺祭授尸尸祭之祭酒啐酒吿旨主人拜尸奠觶荅拜肺祭刌肺也旨美也祭酒榖味之芬芬者齊敬共之唯恐不美告之美逹其心明神享之祭鉶甞之吿旨主人拜尸荅拜鉶􅁏味之有菜和者曲禮曰客絮􅅅主人辭不能享祝命爾敦佐食爾黍稷于席上爾近也近之便尸之食也設大羮湆于醢北大羮湆煑肉汁也不和貴其質設之所以敬尸也不祭不嚌大羮不爲神非盛者也士虞禮曰大羮湆自門入今文湆皆爲汁舉肺脊以授尸尸受振祭嚌之左執之肺氣之主也脊正體之貴者先食啗之所以導食通氣乃食食舉舉言食者明凡解體皆連肉主人羞肵爼于腊北肵爼主於尸主人親羞敬也神俎不親設者貴得賔客以神事其先尸三飯告飽祝侑主人拜三飯告飽禮一成也侑勸也或曰又勸之使又食少牢饋食禮侑辭曰皇尸未實侑也佐食舉幹尸受振祭嚌之佐食受加于肵爼舉獸幹魚一亦如之幹長脅也獸腊其體數與牲同尸實舉于菹豆爲將食庻羞舉謂肺脊佐食羞庶羞四豆設于左南上有醢庶衆也衆羞以豕􅁏所以爲異味四豆者膮炙胾醢南上者以膮炙爲上以有醢不得䋫也尸又三飯吿飽祝侑之如初禮再成也舉骼及獸魚如初尸又三飯吿飽祝侑之如初禮三成獸魚如初者獸骼魚一也舉肩及獸魚如初不復飯者三三者士之禮大成也舉先正脊後肩自上而郤下䋫而前終始之次也佐食盛肵爼爼釋三个佐食取牲魚腊之餘盛於肵爼將以歸尸爼釋三个爲改饌於西北隅遺之所釋者牲腊則正脊一骨長脅一骨及臑也魚則三頭而巳个猶枚也今俗言物數有云若干個者此讀然舉肺脊加于肵爼反黍稷于其所尸授佐食佐食受而加之反之也肺脊􅀄在菹豆主人洗角升酌酳尸酳猶􅄛也是獻尸也謂之酳者尸旣卒食又欲頥􅄛養樂之不用爵者下大夫也因父子之道質而用角角加人事畧者今文酳皆爲酌尸拜受主人拜送尸祭酒啐酒賔長以肝從肝肝炙也今文曰啐之古文無長尸左執角右取肝㨎于鹽振祭嚌之加于菹豆卒角祝受尸角曰送爵皇尸卒爵主人拜尸荅拜曰送爵者節主人拜祝酌授尸尸以醋主人醋報也祝酌不洗尸不親酌尊尸也尸親醋相報之義古文醋作酢主人拜受角尸拜送主人退佐食授挼祭退者進受爵反位妥亦當爲挼尸將嘏主人佐食受之挼祭亦使祭尸食也其授祭亦取黍稷肺祭今文或皆改妥作挼主人坐左執角受祭祭之祭酒啐酒進聽嘏聽猶待也受福曰嘏嘏長也大也待尸授之以長大之福佐食摶黍授祝祝授尸尸受以菹豆執以親嘏主人獨用黍者食之主其辭則少牢饋食禮有焉主人左執角再拜稽首受復位詩懷之實于左􅃑挂于季指卒角拜尸荅拜詩猶承也謂奉納之懷中季小也實于左􅃑挂祛以小指者便卒角也少牢饋食禮曰興受黍坐振祭嚌之古文挂作卦主人出寫嗇于房祝以籩受變黍言嗇因事託戒欲其重稼嗇嗇者農力之成功筵祝南面主人自房還時主人酌獻祝祝拜受角主人拜送設菹醢爼行神惠也先獻祝以接神尊之菹醢皆主婦設之佐食設俎祝左執角祭豆興取肺坐祭嚌之興加于俎坐祭酒啐酒以肝從祝左執角右取肝㨎于鹽振祭嚌之加于俎卒角拜主人荅拜受角酌獻佐食佐食北面拜受角主人拜送佐食坐祭卒角拜主人荅拜受角降反于篚升入復位主婦洗爵于房酌亞獻尸亞次也次猶貳主婦貳獻不夾拜者士妻儀簡耳尸拜受主婦北面拜送北面拜者辟内子也大夫之妻拜於主人北西面宗婦執兩籩戸外坐主婦受設于敦南兩籩􅀥栗􅀥在西祝賛籩祭尸受祭之祭酒啐酒籩祭􅀥栗之祭也其祭之亦於豆祭兄弟長以燔從尸受振祭嚌之反之燔炙􅁏也羞燔者受加于肵出出者俟後事也尸卒爵祝受爵命送如初送者送卒爵酢如主人儀尸酢主婦如主人儀者自祝酌至尸拜送如酢主人也不易爵辟内子主婦適房南面佐食挼祭主婦左執爵右撫祭祭酒啐酒入卒爵如主人儀撫挼祭示親祭佐食不授而祭於地亦儀簡也入室卒爵於尊者前成禮明受惠也獻祝籩燔從如初儀及佐食如初卒以爵入于房及佐食如初如其獻佐食則拜主人之北西面也賔三獻如初燔從如初爵止初亞獻也尸止爵者三獻禮成欲神惠之均於室中是以奠而待之席于戸内爲主人鋪之西面席自房來主婦洗爵酌致爵于主人主人拜受爵主婦拜送爵主婦拜拜於北面也今文曰主婦洗酌爵宗婦賛豆如初主婦受設兩豆兩籩􅀄賛亞獻也主婦薦兩豆籩東面也爼入設佐食設之主人左執爵祭薦宗人賛祭奠爵興取肺坐絶祭嚌之興加于爼坐挩于祭酒啐酒絶肺祭之者以離肺長也少儀曰牛羊之肺離而不提心豕亦然挩拭也挩手者爲絶肺染汙也忖肺不挩手古文挩皆作􅀃肝從左執爵取肝㨎于鹽坐振祭嚌之宗人受加于爼燔亦如之興席末坐卒爵拜於席末坐卒爵敬也一酌而備再從而次之示均主婦荅拜受爵酌醋左執爵拜主人荅拜坐祭立飲卒爵拜主人荅拜主婦出反于房主人降洗酌致爵于主婦席于房中南面主婦拜受爵主人西面荅拜宗婦薦豆俎從獻皆如主人主人更爵酌醋卒爵降實爵于篚入復位主人更爵自酢男子不承婦人爵也祭統曰夫婦相授受不相襲處酢必易爵明夫婦之别古文更爲受三獻作止爵賔也謂三獻者以事命之作起也舊􅀃云賔入戶北面曰皇尸請舉爵尸卒爵酢酌獻洗及佐食洗爵酌致于主人主婦燔從皆如初更爵酢于主人卒復位洗乃致爵爲異事新之燔從皆如初者如亞獻及主人主婦致爵也凡獻佐食皆無從其薦俎獻兄弟以齒設之賔更爵自酢亦不承婦人爵今文曰洗致古文更爲受主人降阼階西面拜賔如初洗拜賔而洗爵爲將獻之如初如視濯時主人再拜賔荅拜三拜衆賔衆賔荅再拜者賔辭洗卒洗揖讓升酌西階上獻賔賔北面拜受爵主人在右荅拜就賔拜者此禮不主於尊也賔卑則不專階主人在右綂於其位今文無洗薦脯醢設折俎凡節解者皆曰折俎不言其體畧云折俎非貴體也上賔骼衆賔儀公有司設之賔左執爵祭豆奠爵興取肺坐絶祭嚌之興加于俎坐挩手祭酒卒爵拜主人荅拜受爵酌酢奠爵拜賔荅拜主人酌自酢者賔不敢敵主人主人逹其意主人坐祭卒爵拜賔荅拜揖執祭以降西面奠于其位位如初薦俎從設位如初復其位東面少牢饋食禮宰夫執薦以從設于祭東司士執俎以從設于薦東是則皆公有司爲之與衆賔升拜受爵坐祭立飲薦俎設于其位辯主人備荅拜焉降實爵于篚衆賔立飲賤不備禮郷飲酒記曰立卒爵者不拜旣爵備盡盡人之荅拜尊兩壷于阼階東加勺南枋西方亦如之爲酬賔及兄弟行神惠不酌上尊卑異之就其位尊之兩壷皆酒優之先尊東方示惠由近禮運曰澄酒在下主人洗觶酌于西方之尊西階前北面酬賔賔在左先酌西方者尊賔之義主人奠觶拜賔荅拜主人坐祭卒觶拜賔荅拜主人洗觶賔辭主人對卒洗酌西面賔北面拜西面者郷賔位立於西階之前賔所荅拜之東北主人奠觶于薦北奠酬於薦左非爲其不舉行神惠不可同於飲酒賔坐取觶還東面拜主人荅拜賔奠觶于薦南揖復位還東面就其位薦西奠觶薦南明將舉主人洗爵獻長兄弟于阼階上如賔儀酬賔乃獻長兄弟者獻之禮成於酬先成賔禮此主人之義亦有薦脀設于位私人爲之與洗獻衆兄弟如衆賔儀獻卑而必爲之洗者顯神惠此言如衆賔儀則如獻衆賔洗明矣洗獻内兄弟于房中如獻衆兄弟之儀内兄弟内賔宗婦也如衆兄弟如其拜受坐祭立飲設薦俎於其位而立内賔其位在房中之尊北不殊其長畧婦人者也有司徹曰主人洗獻内賔於房中南面拜受爵主人西面荅拜更爵酢卒爵降實爵于篚入復位爵辯乃自酢以初不殊其長也内賔之長亦南靣荅拜長兄弟洗觚爲加爵如初儀不及佐食洗致如初無從大夫士三獻而禮成多之爲加也不及佐食無從殺也致致於主人主婦衆賔長爲加爵如􅀄爵止尸爵止者欲神惠之均於在庭嗣舉奠盥入北面再拜稽首嗣主人將爲後者舉猶飲也使嗣子飲奠者將傳重累之者大夫之嗣子不舉奠辟諸侯尸執奠進受復位祭酒啐酒尸舉肝舉奠左執觶再拜稽首進受肝復位坐食肝卒觶拜尸備荅拜焉食肝受尊者賜不敢餘也備猶盡也每拜荅之以尊者與卑者爲禮略其文耳古文備爲復舉奠洗酌入尸拜受舉奠荅拜尸祭酒啐酒奠之舉奠出復位啐之者荅其欲酢巳也奠之者復神之奠觶嗣齒於子姓凡非主人升降自西階兄弟弟子洗酌于東方之尊阼階前北面舉觶于長兄弟如主人酬賔儀弟子後生也宗人吿祭脀脀俎也所告者衆賔衆兄弟内賔也獻時設薦爼于其位至此禮又殺吿之祭使成禮也其祭皆離肺不言祭豆可知乃羞羞庻羞也下尸胾醢豆而已此所羞者自祝主人至於内賔無内羞賔坐取觶阼階前北面酬長兄弟長兄弟在右薦南奠觶賔奠觶拜長兄弟荅拜賔立卒觶酌于其尊東面立長兄弟拜受觶賔北面荅拜揖復位其尊長兄弟尊也此受酬者拜亦北面長兄弟西階前北面衆賔長自左受旅如初旅行也受行酬也􅀄賔酬長兄弟長兄弟卒觶酌于其尊西面立受旅者拜受長兄弟北面荅拜揖復位衆賔及衆兄弟交錯以辯皆如初儀交錯猶言東西爲加爵者作止爵如長兄弟之儀於旅酬之間言作止爵明禮殺並作長兄弟酬賔如賔酬兄弟之儀以辯卒受者實觶于篚長兄弟酬賔亦坐取其奠觶此不言交錯以辯賔之酬不言卒受者實觶于篚明其相報禮終於此其文省賔弟子及兄弟弟子洗各酌于其尊中庭北面西上舉觶於其長奠觶拜長皆荅拜舉觶者祭卒觶拜長皆荅拜舉觶者洗各酌于其尊復􅀄位長皆拜舉觶者皆奠觶于薦右奠觶進奠之于薦右非神惠也今文曰奠于薦右長皆執以興舉觶者皆復位荅拜長皆奠觶于其所皆揖其弟子弟子皆復其位復其位者東西面位弟子舉觶於其長所以序長㓜敎孝弟凡堂下拜亦皆北面爵皆無筭筭數也賔取觶酬兄弟之黨長兄弟取觶酬賔之黨唯巳所欲亦交錯以辯無次弟之數因今接㑹使之交恩定好優勸之利洗散獻于尸酢及祝如􅀄儀降實散于篚利佐食也言利以今進酒也更言獻者以利待尸禮將終宜一進酒嫌於加酒亦當三也不致爵禮又殺也主人出立于戸外西南事尸禮畢祝東面告利成利猶養也供養之禮成不言禮畢於尸問之嫌尸謖祝前主人降謖起也前猶導也少牢饋食禮日祝入尸謖主人降立于阼階東西面祝先尸從遂出于庿門前尸之儀士虞禮備矣祝反及主人入復位命佐食徹尸俎俎出于庿門俎所以載肵爼少牢饋食禮曰有司受歸之徹庶羞設于西序下爲將餕去之庻羞主爲尸非神饌也尚書傳曰宗室有事族人皆侍終日大宗巳侍於賔奠然後燕私燕私者何也巳而與族人飲也此徹庻羞置西序下者爲將以燕飮與然則自尸祝至於兄弟之庻羞宗子以與族人燕飲於堂内賔宗婦之庻羞主婦以燕飮于房筵對席佐食分簋鉶爲將餕分之也分簋者分敦黍於㑹爲有對也敦有虞氏之器也周制士用之變敦言簋容同姓之士得從周制耳祭統曰餕者祭之末也不可不知也是故古之人有言曰善終者如始餕其是巳是故古之君子曰尸亦餕􅀑神之餘惠術也可以觀政矣宗人遣舉奠及長兄弟盥立于西階下東面北上祝命甞食􅅪者舉奠許諾升入東面長兄弟對之皆坐佐食授舉各一膚命告也士使嗣子及兄弟􅅪其惠不過族親也古文􅅪皆作餕主人西面再拜祝曰􅅪有以也兩􅅪奠舉于俎許諾皆荅拜以讀如何其乆也必有以也之以祝曰􅅪釋辭以戒之言女􅅪于此當有所以也以先祖有德而享于此祭其坐􅅪其餘亦當以之也少牢饋食禮不戒者非親眤也舊􅀃曰主人拜下􅅪席南􅀂是者三丁寜戒之皆取舉祭食祭舉乃食祭鉶食舉食乃祭鉶禮殺卒食主人降洗爵宰賛一爵主人升酌酳上􅅪上􅅪拜受爵主人荅拜酳下􅅪亦如之少牢饋食禮曰賛者洗三爵酌主人受于戸内以授次􅅪舊􅀃云主人北面授于􅅪爵主人拜祝曰酳有與也如初儀主人復拜爲戒也與讀如諸侯以禮相與之與言女酳此當有所與也與者與兄弟也旣知似先祖之德亦當與女兄弟謂敎化之兩􅅪執爵拜荅主人也祭酒卒爵拜主人荅拜兩􅅪皆降實爵于篚上􅅪洗爵升酌酢主人主人拜受爵下􅅪復兄弟位不復升也上􅅪即位坐荅拜旣授爵戸内乃就坐主人坐祭卒爵拜上􅅪荅拜受爵降實于篚主人出立于戸外西面事餕者禮畢祝命徹阼俎豆籩設于東序下命命佐食阼俎主人之俎宗婦不徹豆籩徹禮略各有爲而巳設于柬序下亦將燕也祝執其俎以出東面于戸西俟告利成少牢下篇曰祝告利成乃執俎以出宗婦徹祝豆籩入于房徹主婦薦俎宗婦旣並徹徹其卑者士虞禮曰祝薦席徹入于房佐食徹尸薦俎敦設于西北隅几在南厞用筵納一尊佐食闔牖戸降厞隱也不知神之所在或諸逺人乎尸謖而改饌爲幽闇庻其饗之所以爲厭飫少牢饋食禮曰南面而饋之設此所謂當室之白陽厭也則尸未入之前爲隂厭矣曾子問曰殤不備祭何謂隂厭陽厭也祝告利成降出主人降即位宗人告事畢賔出主人送于門外再拜拜送賔也凡去者不荅拜佐食徹阼俎堂下俎畢出記俎出節兄弟及衆賔自徹而出唯實俎有司徹歸之尊賔者記特牲饋食其服皆朝服玄冠緇帶緇韠於祭服北也皆者謂賔及兄弟筮曰筮尸視濯亦玄端至祭而朝服朝服者諸侯之臣與其君日視朝之服大夫以祭今賔兄弟縁孝子欲得嘉賔尊客以事其祖禰故服之緇韠者下大夫之臣夙興主人服如初則固玄端唯尸祝佐食玄端玄裳黃裳雜裳可也皆爵韠與主人同服周禮士之齊服有玄端素端然則玄裳上士也黃裳中士雜裳下士設洗南北以堂深東西當東榮榮屋翼也水在洗東祖天地之左海篚在洗西南順實二爵二觚四觶一角一散順從也言南從統於堂也二爵者爲賔獻爵止主婦當致也二觚長兄弟酬衆賔長爲加爵二人班同冝接並也四觶一酌奠其三長兄弟酬賔卒受者與賔弟子兄弟弟子舉觶於其長禮殺事相接禮器曰貴者獻以爵賤者獻以散尊者舉觶卑者舉角舊􅀃云爵一升觚二升觶三升角四升散五升壷棜禁饌于東序南順覆兩壷焉蓋在南明日卒奠幂用綌即位而徹之加勺覆壷者盝瀝水且爲其不冝塵鼏用綌以其堅絜禁言棜者祭尚厭飫得與大夫同器不爲神戒也籩巾以綌也纁裏􅀥烝栗擇籩有巾者果實之物多皮核優尊者可烝裏之也烝擇互文舊􅀃云纁裏者皆玄被鉶芼用苦若􅅔皆有滑夏葵冬苴苦苦荼也苴堇屬乾之冬滑於葵詩云周原膴膴堇荼如飴今文苦爲芐苄乃地黃非也􅁄心匕刻刻􅀂今龍頭牲爨在庿門外東南魚腊爨在其南皆西面饎爨在西壁饎炊也西壁堂之西牆下舊􅀃云南北直屋梠稷在南肵俎心舌皆去本末午割之實于牲鼎載心立舌縮俎午割從橫割之亦勿没立縮順其牲心舌知食味者欲尸之饗此祭是以進之賔與長兄弟之薦自東房其餘在東堂東堂東夾之前近南沃尸盥者一人奉槃者東面執匜者西面淳沃執巾者在匜北匜北執匜之北亦西面每事各一人淳沃稍注之今文淳作激宗人東面取巾振之三南面授尸卒執巾者受宗人代授巾庭長尊尸入主人及賔皆辟位出亦如之辟位逡遁嗣舉奠佐食設豆鹽肝宜鹽也佐食當事則戸外南面無事則中庭北面當事將有事而未至凡祝呼佐食許諾呼猶命也宗人獻與旅齒於衆賔尊庭長齒從其長㓜之次佐食於旅齒於兄弟尊兩壷于房中西墉下南上爲婦人旅也其尊之節亞西方内賔立于其北東面西上宗婦北堂東面北上二者所謂内兄弟内賔姑姊妹也宗婦族人之婦其夫屬于所祭爲子孫或南上或北上宗婦宜統於主婦主婦南面北堂中房而北主婦及内賔宗婦亦旅西面西面者異於獻也男子獻於堂上旅於堂下婦人獻於南面旅於西面内賔象衆賔宗婦象兄弟其節與其儀依男子也主婦酬内賔之長酌奠于薦左内賔之長坐取奠于右宗婦之娣婦舉觶於其姒婦亦如之内賔之長坐取奠觶酬宗婦之姒交錯以辯宗婦之姒亦取奠觶酬内賔之長交錯以辯内賔之少者宗婦之娣婦各舉奠於其長並行交錯無筭其拜及飲者皆西面主婦之東南宗婦賛薦者執以坐于戶外授主婦尸卒食而祭饎爨雍爨雍孰􅁏以尸享祭竈有功也舊􅀃云宗婦祭饎爨享者祭雍爨用黍􅁏而巳無籩豆俎禮器曰燔燎於爨夫爨者老婦之祭盛於盆尊於瓶賔從尸俎出庿門乃反位賔從尸送尸也士之助祭終其事也俎尸俎也賔旣送尸復入反位者冝與主人爲禮乃去之尸俎右肩臂臑肫胳正脊二骨橫脊長脅二骨短脅尸俎神俎也士之正祭禮九體貶於大夫有併骨二亦得十一之名合少牢之體數此所謂放而不致者凡俎實之數竒脊無中脅無前貶於尊者不貶正脊不奪正也正脊二骨長脅二骨者􅀅舉於尸尸食未飽不欲空神俎膚三爲􅅪用二厭飫一也離肺一離猶㨒也小而長午割之亦不提心謂之舉肺刌肺三爲尸主人主婦祭今文刌爲切魚十有五魚水物以頭枚數隂中之物取數於月十有五日而盈少牢饋食禮亦云十有五而俎尊卑同此所謂經而等也腊如牲骨不但言體以有一骨二骨者祝俎髀脡脊二骨脅二骨凡接於神及尸者俎不過牲三體以特牲約加其可併者二亦得竒名少牢饋食禮羊豕各三體膚一離肺一阼俎臂正脊二骨橫脊長脅二骨短脅主人尊欲其體得祝之加數五體又加其可併者二亦得竒名臂左體臂膚一離肺一主婦俎觳折觳後足折分後右足以爲佐食俎不分左臑折辟大夫妻古文觳皆作榖其餘如阼俎餘謂脊脅膚肺佐食俎觳折脊脅三體卑者從正膚一離肺一賔骼長兄弟及宗人折其餘如佐食俎骼左骼也賔俎全體尊賔不用尊體爲其巳甚卑而全之其冝可也長兄弟及宗人折不言所分略之衆賔及衆兄弟内賔宗婦若有公有司私臣皆殽脀又略此所折骨直破折餘體可殽者升之俎一而巳不備三者賤祭禮接神者貴凡骨有􅁏曰殽祭統曰凡爲俎者以骨爲主貴者取貴骨賤者取賤骨貴者不重賤者不虚示均也俎者所以明惠之必均也善爲政者如此故曰見政事之均焉公有司亦士之屬命於君者也私臣自巳所辟除者膚一離肺一公有司門西北面東上獻次衆賔私臣門東北面西上獻次兄弟升受降飲獻在後者賤也祭祀有上事者貴之亦皆與旅儀禮卷第十五經三千四百五字注五千五百一十七字
