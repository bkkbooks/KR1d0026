body:
  text: 儀禮卷第九公食大夫禮第九鄭氏注公食大夫之禮使大夫戒各以其爵戒猶告也告之必使同班敵者易以相親敬上介出請入告問所以爲來事三辭爲旣先受賜不敢當賓出拜辱拜使者屈辱來迎巳大夫不荅拜將命不荅拜爲人使也將猶致也賓再拜稽首受命大夫還復於君賓不拜送遂從之不拜送者爲從之不終事賓朝服卽位于大門外如聘於是朝服則初時玄端如聘亦入于次俟卽位具主人也擯者俟君於大門外􅀸大夫士序及宰夫具其饌物皆於廟門之外羮定肉謂之羮定猶孰也著之者不以爲節甸人陳鼎七當門南面西上設扄鼏鼏若束若編七鼎一大牢也甸人􅃁宰之屬兼亨人者南面西上以其爲賓統於外也扄鼎扛所以舉之者也凡鼎鼏蓋以茅爲之長則束本短則編其中央今文扄作鉉古文鼏皆作宻設洗如饗必如饗者先饗後食如其近者也饗禮亡燕禮則設洗於阼階東南古文饗或作鄉小臣具盤匜在東堂下爲公盥也公尊不就洗小臣於小賓客饗食掌正君服位宰夫設筵加席几設筵於戸西南面而左几公不賓至授几者親設湆醬可以畧此無尊主於食不獻酬飲酒漿飲俟于東房飲酒清酒也漿飲酨漿也其俟奠於豐上也飲酒先言飲明非獻酬之酒也漿飲先言漿别於六飲也凡宰夫之具饌于東房凡非一也飲食之具宰夫所掌也酒漿不在凡中者雖無尊猶嫌在堂公如賓服迎賓于大門内不出大門降於國君大夫納賓大夫謂上擯也納賓以公命賓入門左公再拜賓辟再拜稽首左西方賓位也辟逡遁不敢當君拜也公揖入賓從揖入道之及廟門公揖入廟禰廟也賓入三揖毎曲揖及當碑揖相人偶至于階三讓讓先升公升二等賓升逺下人君大夫立于東夾南西面北上東夾南東西節也取節於夾明東於堂士立于門東北面西上統於門者非其正位辟賓在此小臣東堂下南面西上宰東夾北西面南上宰宰夫之屬也古文無南上内官之士在宰東北西面南上夫人之官内宰之屬也自􅀸大夫至此不先卽位從君而入者明助君饗食賓自無事介門西北面西上西上自統於賓也然則承擯以下立於士西少進東上公當楣北鄉至再拜賓降也公再拜楣謂之梁至再拜者興禮俟賓嘉其來也公再拜賓降矣賓西階東北面荅拜西階東少就主君敬也擯者辭辭拜於下拜也公降一等辭曰寡君從子雖將拜興也賔降再拜公降擯者釋辭矣賔猶降終其再拜稽首興起也賓栗階升不拜自以已拜也栗實栗也不拾級連歩趨主國君之命不拾級而下曰辵命之成拜階上北面再拜稽首賓降拜主君辭之賓雖終拜於主君之意猶爲不成士舉鼎去鼏於外次入陳鼎于碑南南面西上右人抽扄坐奠于鼎西南順出自鼎西左人待載入由東出由西明爲賔也今文奠爲委古文待爲持雍人以爼入陳于鼎南旅人南面加匕于鼎退旅人雍人之屬旅食者也雍人言入旅人言退文互相備也出入之由亦如舉鼎者匕爼毎噐一人諸侯官多也大夫長盥洗東南西面北上序進盥退者與進者交于前卒盥序進南面七長以長㓜也序猶更也前洗南載者西面載者左人也亦序自鼎東西面於其前大夫七則載之魚腊飪飪孰也食禮宜孰饗有腥者載體進奏體謂牲與腊也奏謂皮膚之理也進其理本在前下大夫體七个魚七縮爼􅃦右右首也􅃦右進鬐也乾魚近膄多骨鯁膓胃七同爼以其不立階上以主君離阼也疑正立也自定之貌今文曰西階宰夫自東房薦豆六設于醬東西上韭菹以東醓醢昌本昌本南麋臡以西菁菹鹿臡醓醢醢有醓昌本昌蒲本菹也醢有骨謂之臡菁􅕴菁菹也今文臡皆作麋士設爼于豆南西上牛羊豕魚在牛南腊膓胃亞之亞次也不言䋫錯爼尊也膚以爲特直豕與膓胃東也特膚者出下牲賤旅人取匕甸人舉鼎順出奠于其所以其空也其所謂當門宰夫設黍稷六簋于爼西二以並東北上黍當牛爼其西稷錯以終南陳並併也今文曰併古文簋皆作􅁤大羮湆不和實于鐙宰右執鐙左執蓋由門入升自阼階盡階不升堂授公以蓋降岀入反位大羮湆煑肉汁也大古之羮不和無鹽菜瓦豆謂之鐙宰謂大宰宰夫之長也有蓋者饌自外入爲風塵今文湆爲汁又曰入門自阼階無升公設之于醬西賓辭坐遷之亦東遷所宰夫設鉶四于豆西東上牛以西羊羊南豕豕以東牛鉶菜和羮之噐飮酒實于觶加于豐豐所以承觶者也如豆而卑宰夫右執觶左執豐進設于豆東食有酒者優賓也設于豆東不舉也燕禮記曰凡奠者於左宰夫東面坐啓簋㑹各郤于其西㑹簋蓋也亦一一合郤之各當其簋之西贊者􅀒東房南面告具于公􅀒東房􅀒房戸而立也南面者欲得鄉公與賓也公再拜揖食再拜拜賓饌具賓降拜荅公拜公辭賓升再拜稽首不言成拜降未拜賓升席坐取韭菹以辯擩于醢上豆之間祭擩猶染也今文無于贊者東面坐取黍實于左手辯又取稷辯反于右手興以授賓賓祭之取授以右手便也賓亦興受坐祭之於豆祭也獨云贊興優賔也少儀曰受立授立不坐三牲之肺不離贊者辯取之壹以授賓肺不離者刌之也不言刌刌則祭肺也此舉肺不離而刌之便賓祭也祭離肺者絶肺祭也壹猶稍也古文壹作一賓興受坐祭於是云賓興受坐祭重牲也賓亦每肺興受祭於豆祭挩手扱上鉶以柶辯擩之上鉶之間祭扱以柶扱其鉶菜也挩拭也拭以巾祭飮酒於上豆之間魚腊醬湆不祭不祭者非食物之盛者宰夫授公飯粱公設之于湆西賓北面辭坐遷之旣告具矣而又設此殷勤之加也遷之遷而西之以其東上也公與賓皆復初位位序内階西宰夫膳稻于粱西膳猶進也進稻粱者以簠士羞庶羞皆有大蓋執豆如宰羞進也庶衆也進衆珍味可進者也大以肥美者特爲臠所以祭也魚或謂之膴膴大也唯醢醬無大如宰如其進大羮湆右執豆左執蓋先者反之由門入升自西階庶羞多羞人不足則相授於階上復出取也先者一人升設于稻南簋西間容人簋西黍稷西也必言稻南者明庶羞加不與正豆併也間容人者賓當從間徃來也旁四列西北上不統於正饌者雖加自是一禮是所謂羮胾中别膷以東臐膮牛炙膷臐膮今時臛也牛曰膷羊曰臐豕曰膮皆香美之名也古文膷作香臐作薰炙南醢以西牛胾醢牛鮨先設醢䋫之以次也内則謂鮨爲鱠然則鱠用鮨今文鮨作鰭鮨南羊炙以東羊胾醢豕炙炙南醢以西豕胾芥醬魚膾芥醬芥實醬也内則曰膾春用葱秋用芥衆人騰羞者盡階不升堂授以蓋降岀騰當作媵媵送也授授先者一人贊者􅀒東房告僃于公隨告庶羞具者以其異饌贊升賓以公命命賓升席賓坐席末取粱卽稻祭于醬湆間卽就也祭稻粱不以豆祭祭宜加於加贊者北面坐辯取庶羞之大興一以授賓賓受兼壹祭之壹壹受之而兼一祭之庶羞輕也自祭之於膷臐之間以異饌也賓降拜拜庶羞公辭賓升再拜稽首公荅再拜賓北面自間坐左擁簋粱右執湆以降自間坐由兩饌之間也擁抱也必取粱者公所設也以之降者堂尊處欲食於階下然也公辭賓西面坐奠于階西東面對西面坐取之栗階升北面反奠于其所降辭公奠而後對成其意也降辭公敬也必辭公者爲其尊而親臨巳食侍食贊者之事公許賓升公揖退于箱箱東夾之前俟事之處擯者退􅀒東塾而立無事賓坐遂卷加席公不辭贊者以告公公聽之重來優賓賓三飯以湆醬毎飯歠湆以肴擩醬食正饌也三飯而止君子食不求飽不言其肴優賓宰夫執觶漿飮與其豐以進此進漱也非爲卒食爲將有事縁賓意欲自潔清賓挩手興受受觶宰夫設其豐于稻西酒在東漿在西是所謂左酒右漿庭實設乗皮實坐祭遂飮奠于豐上飲漱公受宰夫束帛以侑西鄉立束帛十端帛也侑猶勸也主國君以爲食賓殷勤之意未至復發幣以勸之欲用深安賓也西鄉立序内位也受束帛于序端賓降筵北面以君將有命也北面於西階上擯者進相幣爲君釋幣辭於賓賓降辭幣升聽命降辭幣主國君又命之升聽命釋許辭降拜當拜受幣公辭賓升再拜稽首受幣當東楹北面主國君南面授之當東楹者欲得君行一臣行二也退西楹西東面立俟主國君送幣也退不􅀒序以將降公壹拜賓降也公再拜賓不敢俟成拜介逆出以賓事畢賓北面揖執庭實以岀揖執者示親受公降立俟賓反上介受賓幣從者訝受皮從者府史之屬訝迎也今文曰梧受賓入門左没霤北面再拜稽首便退則食禮未卒不退則嫌更入行拜若欲從此退公辭止其拜使之卒食揖讓如初如初入也升賓再拜稽首公荅再拜賓拜拜主國君之厚意賓揖介入復位賓降辭公如初將復食賓升公揖退于箱賓卒食㑹飯三飮卒巳也巳食㑹飯三潄漿也㑹飯謂黍稷也此食黍稷則初時食稻粱不以醬湆不復用正饌也初時食加飯用正饌此食正飯用庶羞互相後也後言湆或時後用挩手興北面坐取粱與醬以降西面坐奠于階西示親徹也不以出者非所當得又以巳得侑幣東面再拜稽首卒食拜也不北面者異於辭公降再拜荅之也不辭之使升堂明禮有終介迎出賓出公送于大門内再拜賓不顧初來揖讓而退不顧退禮畧也示難進易退之義擯者以賓不顧告公公乃還也有司卷三牲之爼歸于賓舘卷猶收也無遺之辭也三牲之爼正饌尤尊盡以歸賓尊之至也歸爼者實于篚他時有所釋故魚腊不與以三牲之爼無所釋故也禮之有餘爲施惠不言膓胃膚者在魚腊下不與可知也古文與作豫明日賓朝服拜賜于朝拜食與侑幣皆再拜稽首朝謂大門外訝聽之受其言入告出報也此下大夫有士訝上大夫八豆八簋六鉶九爼魚腊皆二爼記公食上大夫異於下大夫之數豆加葵菹蝸醢四四爲列爼加鮮魚鮮腊三三爲列無特魚膓胃倫膚若九若十有一下大夫則若七若九此以命數爲差也九謂再命者也十一謂三命者也七謂一命者也九或上或下者再命謂小國之􅀸次國之大夫也􅀸則曰上大夫則曰下大國之􅀌視子男庶羞西東毋過四列謂上下大夫也古文毋爲無上大夫庶羞二十加於下大夫以雉兎鶉鴽鴽無毋若不親食謂主國君有疾病若他故使大夫各以其爵朝服以侑幣致之執幣以將命豆實實于罋陳于楹外二以並北陳簋實實于篚陳于楹内兩楹間二以並南陳陳罋筐於㨕間者象授受於堂中也南北相當以食饌同列耳罋北陳者變於食罋數如豆醢芥醬從焉筐米四今文並作併庶羞陳于碑内生魚也魚腊從焉上大夫加鮮魚鮮腊雉兎鶉鴽不陳於堂辟正饌庭實陳于碑外執乗皮者也不參分庭一在南者以言歸且近内牛羊豕陳于門内西方東上爲其踐汙舘庭使近外賓朝服以受如受饔禮朝服食禮輕也無擯以巳本宜徃明日賓朝服以拜賜于朝訝聽命賜亦謂食侑幣大夫相食親戒速記異於君者也速召也先就告之歸具旣具復自召之迎賓于門外拜至皆如饗拜饗大夫相饗之禮也今亡古文饗或作鄉降盥受醬湆侑幣束錦也皆自阼階降堂受授者升一等皆者謂受醬受湆受幣也侑用束錦大夫文也降堂謂止階上今文無束賓止也主人三降賓不從賓執粱與湆之西序端不敢食於尊處主人辭賓反之卷加席主人辭賓反之辭幣降一等主人從從辭賓降受侑幣再拜稽首主人送幣亦然敵也辭於主人降一等主人從辭謂辭其臨巳食卒食徹于西序端亦親徹東面再拜降出拜亦拜卒食其他皆如公食大夫之禮若不親食則公作大夫朝服以侑幣致之作使也大夫有故君必使其同爵者爲之致禮列國之賓來榮辱之事君臣同賓受于堂無儐與受君禮同記不宿戒食禮輕也此所以不宿戒者謂前期三日之戒申戒爲宿謂前期一日戒不速食賓之朝夙興戒之賓則從戒者而來不復召不授几異於醴也無阼席公不坐亨于門外東方必於門外者大夫之事也東方者主陽司宫具几與蒲筵常緇布純加􅍉席尋玄帛純皆卷自末司宫大宰之屬掌宫廟者也丈六尺曰常半常曰尋純縁也􅍉細葦也末經所終有以識之必長筵者以有左右饌也今文􅍉皆爲莞宰夫筵出自東房筵本在房宰夫敷之也天子諸侯左右房賓之乗車在大門外西方北面立賓車不入門廣敬也凡賓卽朝中道而徃將至下行而後車還立于西方賓及位而止北面􅀸大夫之位當車前凡朝位賓主之間各以命數爲逺近之節也鉶芼牛霍羊苦豕薇皆有滑藿豆葉也苦苦荼也滑堇荁之屬今文苦爲苄贊者盥從爼升爼其所有事簠有蓋幂稻粱將食乃設去㑹於房蓋以幂幂巾也今文或作鼏凡炙無醬巳有鹹和上大夫蒲筵加􅍉席其純皆如下大夫純謂三命大夫也􅀌爲賓則莞筵紛純加繅席畫純也􅀸擯由下不升堂也上贊下大夫也上謂堂上擯贊者事相近以佐上下爲名上大夫庶羞酒飮漿飮庶羞可也於食庶羞宰夫又設酒漿以之食庶羞可也以優賓拜食與侑幣皆再拜稽首嫌上大夫不稽首儀禮卷第九經一千七百五十三字注二千八百七字
