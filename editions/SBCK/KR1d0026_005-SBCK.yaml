body:
  text: 儀禮卷第五鄕射禮第五儀禮鄭氏注鄕射之禮主人戒賔賔出迎再拜主人荅再拜乃請主人州長也鄕大夫若在焉則稱郷大夫也戒猶警也語也出迎出門也請告也告賔以射事不言拜辱此爲習民以禮樂不主爲賔巳也不謀賔者時不獻賢能事輕也今郡國行此禮以季春周禮郷老及郷大夫三年正月獻賢能之書於王退而以郷射之禮五物詢衆庶諸侯之郷大夫旣貢士於其君亦用此禮射而詢衆庻乎賔禮辭許主人再拜賔荅再拜主人退賔送再拜退還射宫省録射事無介雖先飮酒主於射也其序賔之禮畧乃席賔南面東上不言於戸牖之間者此射於序衆賔之席繼而西言繼者甫欲習衆庻未有所殊别席主人於阼階上西面阼階東階尊於賔席之東兩壷斯禁左玄酒皆加勺篚在其南東肆斯禁禁切地無足者也設尊者北面西曰左尚之也肆陳也設洗于阼階東南南北以堂深東西當東榮水在洗東篚在洗西南肆榮屋翼也縣于洗東北西面此縣謂磬也縣於東方辟射位也伹縣磬者半天子之士無鍾乃張侯下綱不及地武侯謂所射布也綱持舌繩也武迹也中人之迹尺二寸侯象人綱即其足也是以取數焉不繫左下綱中掩束之事未至也乏參侯道居侯黨之一西五歩容謂之乏所以爲獲者御矢也侯道五十歩此乏去侯北十丈西三丈羮定肉謂之羮定猶孰也謂狗孰可食主人朝服乃速賔賔朝服出迎再拜主人荅再拜退賔送再拜速召也射賔輕也戒時􅀇端今郡國行此鄉射禮皮弁服與禮爲異賔及衆賔遂從之及門主人一相出迎于門外再拜賔荅再拜相主人家臣擯賛傳命者揖衆賔差卑禮宜異主人以賔揖先入以猶與也先入入門右西面賔厭衆賔衆賔皆入門左東面北上賔少進引手曰厭少進差在前也今文皆曰揖衆賔主人以賔三揖皆行及階三讓主人升一等賔升三讓而主人先升者是主人先讓於賔不俱升者賔客之道進冝難也主人阼階上當楣北面再拜賔西階上當楣北面荅再拜主人拜賔至此堂主人坐取爵于上篚以降將獻賔也賔降從主人也主人阼階前西面坐奠爵興辭降重以主人事煩賔也今文無阼階賔對對荅主人坐取爵興適洗南面坐奠爵于篚下盥洗盥手又洗爵致絜敬也古文盥皆作浣賔進東北靣辭洗必進者方辭洗冝違位也言東北面則位南於洗矣主人坐奠爵于篚興對賔反位反從降之位也郷飮酒曰當西序東靣主人卒洗壹揖壹讓以賔升賔西階上北面拜洗主人阼階上北面奠爵遂荅拜乃降乃降將更盥也古文壹皆作一賔降主人辭降賔對主人卒盥壹揖壹讓升賔升西階上疑立疑止也有矜莊之色主人坐取爵實之賔席之前西北面獻賔進酒於賔也凡進物曰獻賔西階上北面拜主人少退少退猶少辟也賔進受爵于席前復位復位西階上位主人阼階上拜送爵賔少退薦脯醢薦進賔升席自西方賔升降由下也乃設折俎牲體枝解節折以實爼也主人阼階東疑立賔坐左執爵右祭脯醢奠爵于薦西興取肺坐絶祭郤左手執夲右手絶末以祭也肺離上爲本下爲末尚左手嚌之嚌嘗也右手在下絶以授口甞之興加于俎坐挩手執爵遂祭酒興席末坐啐酒挩拭也啐甞也古文挩作􅀃降席坐奠爵拜告旨降席席西也旨美也執爵興主人阼階上荅拜賔西階上北面坐卒爵興坐奠爵遂拜執爵興卒盡主人阼階上荅拜賔以虚爵降將洗以酢主人主人降從賔也降立阼階東西面當東序賔西階前東靣坐奠爵興辭降主人對賔坐取爵適洗北面坐奠爵于篚下興盥洗賔北面盥洗自外來主人阼階之東南面辭洗賔坐奠爵于篚興對主人反位反位從降之位也主人辭洗進賔卒洗揖讓如初升主人拜洗賔荅拜興降盥如主人之禮賔升實爵主人之席前東南面酢主人酢報主人阼階上拜賔少退主人進受爵復位賔西階上拜送爵薦脯醢主人升席自北方乃設折俎祭如賔禮祭薦爼及酒亦嚌啐不告旨酒巳物自席前適阼階上北面坐卒爵興坐奠爵遂拜執爵興賔西階上北靣荅拜自由也啐酒於席未由前降便也主人坐奠爵于序端阼階上再拜崇酒賔西階上荅再拜序端東序頭也崇充也謝酒惡相充滿也主人坐取觶于篚以降將酬賔賔降主人奠觶辭降賔對東靣立主人坐取觶洗賔不辭洗不辭洗以其將自飮卒洗揖讓升賔西階上疑立主人實觶酬之阼階上北靣坐奠觶遂拜執觶興酬勸酒賔西階上北靣荅拜主人坐祭遂飮卒觶興坐奠觶遂拜執觶興賔西階上北靣荅拜主人降洗賔降辭如獻禮以將酌巳升不拜洗酬禮殺也賔西階上立主人實觶賔之席前北面酬賔賔西階上拜主人坐奠觶于薦西賔辭坐取觶以興反位賔辭辭主人復親酌巳主人阼階上拜送賔北面坐奠觶于薦東反位酬酒不舉主人揖降賔降東面立于西階西當西序主人將與衆賔爲禮賔謙不敢獨居堂主人西南靣三拜衆賔衆賔皆荅壹拜三拜示徧也壹拜不備禮也獻賔畢乃與衆賔拜敬不能並主人揖升坐取爵于序端降洗升實爵西階上獻衆賔衆賔之長升拜受者三人長其老者言三人則衆賔多矣國以多德行道藝爲榮何常數之有乎主人拜送拜送爵於衆賔右坐祭立飮不拜旣爵授主人爵降復位旣盡衆賔皆不拜受爵坐祭立飮自第四巳下又不拜受爵禮彌略毎一人獻則薦諸其席諸於衆賔辯有脯醢薦於其位主人以虚爵降奠于篚不復用揖讓升賔厭衆賔升衆賔皆升就席一人洗舉觶於賔一人主人之吏升實觶西階上坐奠觶拜執觶興賔席末荅拜舉觶者坐祭遂飮卒觶興坐奠觶拜執觶興賔荅拜降洗升實之西階上北面將進奠觶賔拜拜受觶舉觶者進坐奠觶于薦西不授賤不敢也賔辭坐取以興若親受然舉觶者西階上拜送賔反奠于其所舉觶者降大夫若有遵者則入門左謂此郷之人爲大夫者也謂之遵者方以禮樂化民欲其遵法之也其士也於旅乃入郷大夫士非郷人禮亦然主於郷人耳今文遵爲僎主人降迎大夫於門内也不出門禮不嚌肺不啐酒不吿旨西階上卒爵拜主人荅拜凡所不者殺於賔也大夫升席由東方大夫降洗將酢主人也大夫若衆則辯獻長乃酢主人復阼階降辭如初卒洗主人盥盥者雖將酌自飲尊大夫不敢褻揖讓升大夫授主人爵于兩楹間復位主人實爵以酢于西階上坐奠爵拜大夫荅拜坐祭卒爵拜大夫荅拜主人坐奠爵于西楹南再拜崇酒大夫荅拜主人復阼階揖降將升賔大夫降立于賔南雖尊不奪人之正禮主人揖讓以賔升大夫及衆賔皆升就席席工于西階上少東樂正先升北面立于其西言少東者明樂正西側階不欲大東辟射位工四人二瑟瑟先相者皆左何瑟面鼔執越内弦右手相入升自西階北面東上工坐相者坐授瑟乃降瑟先賤者先就事也相扶工也靣前也鼓在前變於君也執越内弦右手相由便也越瑟下孔所以發越其聲也前越言執者内有弦結手入之淺也相者降立西方笙入立于縣中西面堂下樂相從也縣中磬東立西靣乃合樂周南關雎葛覃卷耳召南鵲巢采蘩采蘋不歌不笙不間志在射略於樂也不略合樂者周南召南之風郷樂也不可略其正也昔大王王季文王始居􅄮山之陽躬行召南之教以成王業至三分天下乃宣周南召南之化本其德之􅀄刑于寡妻至于兄弟以御于家􅀖故謂之郷樂用之房中以及朝庭饗燕郷射飲酒此六篇其風化之原也是以合金石絲竹而歌之工不興吿于樂正曰正歌備不興者瞽矇禮略也樂正吿于賔乃降樂正降者堂上正樂畢也降立西階東北靣主人取爵于上篚獻工大師則爲之洗尊之也君賜大夫樂又從之以其人謂之大師賔降主人辭降大夫不降尊也工不辭洗卒洗升實爵工不興左瑟一人拜受爵左瑟辟主人授爵也一人無大師則工之長者主人阼階上拜送爵薦脯醢使人相祭人相者工飮不拜旣爵授主人爵衆工不拜受爵祭飮辯有脯醢不祭祭飲不興受爵坐祭坐飲不洗遂獻笙于西階上不洗者賤也衆工而不洗矣而著笙不洗者笙賤於衆工正君賜之猶不洗也笙一人拜于下盡階不升堂受爵主人拜送爵階前坐祭立飮不拜旣爵升授主人爵衆笙不拜受爵坐祭立飮辯有脯醢不祭主人以爵降奠于篚反升就席亦揖讓以賔升衆賔皆升主人降席自南方禮殺由便側降賔不從降作相爲司正司正禮辭許諾主人再拜司正荅拜爵備樂畢將留賔以事爲有解倦失禮立司正以監之察儀法也詩云旣立之監或佐之史主人升就席司正洗觶升自西階由楹内適阼階上北面受命于主人洗觶者當酌以表其位顯其事也楹内楹北西階上北面請安于賔傳主人之命賔禮辭許司正告于主人遂立于楹間以相拜相謂賛主人及賔相拜之辭主人阼階上再拜賔西階上荅再拜皆揖就席爲巳安也今文揖爲升司正實觶降自西階中庭北面坐奠觶興退少立奠觶表其位也少立自修正慎其位也古文曰少退立進坐取觶興反坐不祭遂卒觶興坐奠觶拜執觶興洗北面坐奠于其所今文坐取觶無進又曰坐奠之拜興少退北面立于觶南立觶南亦其故擯位末旅旅序也末以次序相酬以將射也旅則禮終也三耦俟于堂西南面東上司正旣立司射選弟子之中德行道藝之高者以爲三耦使俟事於此司射適堂西袒決遂取弓于階西兼挾乗矢升自西階階上北面告于賔曰􅃓矢旣具有司請射司射主人之吏也於堂西袒決遂者主人無次隱蔽而巳袒左免衣也決猶闓也以象骨爲之著右大擘指以鈎弦闓體也遂射韝也以韋爲之所以遂弦者也其非射時則謂之拾袷歛也所以蔽膚斂衣也方持弦矢曰挾乗矢四矢也大射曰挾乗矢於弓外見鏃於弣右巨指鉤􅁌古文挾皆作接賔對曰某不能爲二三子許諾言某不能謙也二三子謂衆賔巳下司射適阼階上東北靣告于主人曰請射于賔賔許司射降自西階階前西面命弟子納射器弟子賔黨之年少者也納内也射噐弓矢決拾旌中籌楅豐也賔黨東面主人之吏西靣乃納射器皆在堂西賔與大夫之弓􅀝于西序矢在弓下北括衆弓􅀝于堂西矢在其上上堂西廉矢亦北括主人之弓矢在東序東亦􅀝于東序也矢在其下北括司射不釋弓矢遂以比三耦於堂西三耦之南北面命上射曰某御於子命下射曰子與某子射北選次其才相近者也古文曰某從於子司正爲司馬兼官由便也立司正爲涖酒爾今射司正無事司馬命張侯弟子說束遂繫左下綱事至也今文􅀃皆作稅司馬又命􅀗者􅀝旌于侯中爲當􅀒侯也獲者亦弟子也謂之獲者以事名之􅀗者由西方坐取旌􅀝于侯中乃退樂正適西方命弟子賛工遷樂于下當辟射也贊佐也遷徙也弟子相工如初入降自西階阼階下之東南堂前三笴西面北上坐笴矢幹也今文無南樂正北面立于其南北面郷堂不與工序也司射猶挾乗矢以命三耦各與其耦讓取弓矢拾猶有故之辭拾更也三耦皆袓決遂有司左執弣右執弦而授弓有司弟子納射噐者也凡納射噐者皆執以俟事遂授矢受於納矢而授之三耦皆執弓搢三而挾一个未違俟處也搢挿也挿於帶右司射先立于所設中之西南東面三耦皆進由司射之西立于其西南東面北上而俟司射東面立于三耦之北搢三而挾一个爲當誘射也固東面矣復言之者明郤時還揖進當階北靣揖及階揖升堂揖豫則鉤楹内堂則由楹外當左物北靣揖鉤楹繞楹而東也序無室可以深也周立四代之學於國而又以有虞氏之庠爲郷學郷飲酒義曰主人迎賔于庠門外是也庠之制有堂有室也今言豫者謂州學也讀如成周宣謝災之謝周禮作序凡屋無室曰謝冝從謝州立謝者下郷也左物下物也今文豫爲序序乃夏后氏之學亦非也及物揖左足履物不方足還視侯中俯正足方猶併也志在於射左足至右足還併足則是立也南靣視侯之中乃俯視併正其足不去旌以其不獲誘射誘猶教也將乘矢將行也行四矢象有事於四方執弓不挾右執弦不挾矢盡南靣揖揖如升射降出于其位南適堂西改取一个挾之改更也不射而挾之示有事也今文曰適序西遂適階西取扑搢之以反位扑所以橽犯教者書云扑作教刑司馬命獲者執旌以􅀒侯欲令射者見侯與旌深有志於中獲者適侯執旌􅀒侯而俟俟待也今文俟爲立司射還當上耦西靣作上耦射還左還也作使也司射反位上耦揖進上射在左並行當階北靣揖及階揖上射先升三等下射從之中等中猶間也上射升堂少左下射升上射揖並行並併也併東行皆當其物北面揖及物揖皆左足履物還視侯中合足而俟司馬適堂西不決遂袒執弓不決遂因不射不備出于司射之南升自西階鉤楹由上射之後西南面立于物間右執簫南揚弓命去侯鉤楹以當由上射者之後也簫􅃓末也大射曰左執弣揚猶舉也獲者執旌許諾聲不絶以至于乏坐東靣偃旌興而俟聲不絶不以宫商不絶而巳郷射威儀省偃猶仆也司馬出于下射之南還其後降自西階反由司射之南適堂西釋弓襲反位立于司射之南圍下射者明爲二人命去侯司射進與司馬交于階前相左由堂下西階之東北靣視上射命曰無射獲無獵獲上射揖司射退反位射獲謂矢中人也獵矢從傍乃射上射旣發挾弓矢而后下射射拾發以將乗矢古文而后作後非也孝經說然后曰后者後也當從后獲者坐而獲射者中則大言獲獲得也射講武田之􅀋是以中爲獲也舉旌以宫偃旌以商宫爲君商爲臣聲和律吕相生獲而未釋獲但大言獲未釋其筭卒射皆執弓不挾南面揖揖如升射不挾亦右執弦如司射上射降三等下射少右從之中等並行上射於左降下與升射者相左交于階前相揖由司馬之南適堂西釋弓􅀃決拾襲而俟于堂西南面東上三耦卒射亦如之司射去扑􅀝于西階之西升堂北面告于賔曰三耦卒射去扑乃升不敢佩刑噐即尊者之側賔揖以揖然之司射降搢扑反位司馬適堂西袒執弓由其位南進與司射交于階前相左升自西階鉤楹自右物之後立于物間西南面揖弓命取矢揖推之也獲者執旌許諾聲不絶以旌􅀒侯而俟俟弟子取矢以旌指教之司馬出于左物之南還其後降自西階遂適堂前北面立于所設楅之南命弟子設楅楅猶幅也所以承笴矢者乃設楅于中庭南當洗東肆東肆統於賔司馬由司射之南退釋弓于堂西襲反位弟子取矢北面坐委于楅北括乃退司馬襲進當楅南北面坐左右撫矢而乗之撫拊之也就委矢左右手撫而四四數分之也上旣言襲矣復言之者嫌有事即􅃝也凡事升堂乃􅃝􅀂矢不備則司馬又袒執弓如初升命曰取矢不索索猶盡也弟子自西方應曰諾乃復求矢加于楅増故曰加曏獲者許諾至此弟子曰諾事同互相明司射􅀝扑于階西升請射于賔如初賔許諾賔主人大夫􅀂皆與射則遂吿于賔適阼階上告于主人主人與賔爲耦言若者或射或否在時欲耳射者繹巳之志君子務焉大夫遵者也吿賔曰主人御于子告主人曰子與賔射遂吿于大夫大夫雖衆皆與士爲耦以耦吿于大夫曰某御於子大夫皆與士爲耦謙也來觀禮同爵自相與耦則嫌自尊别也大夫爲下射而云御於子尊大夫也士謂衆賔之在下者及群士未觀禮者也禮一命巳下齒于郷里西階上北面作衆賔射作使司射降搢扑由司馬之南適堂西立比衆耦衆耦大夫耦及衆賔也命大夫之耦曰子與某子射其命衆耦如三耦衆賔將與射者皆降由司馬之南適堂西繼三耦而立東上大夫之耦爲上􅀂有東面者則北上言􅀂有者大夫士來觀禮及衆賔多無數也賔主人與大夫皆未降言未降者見其志在射司射乃比衆耦辯衆賔射者降比之耦乃徧遂命三耦拾取矢司射反位反位者俟其袒決遂來三耦拾取矢皆袒決遂執弓進立于司馬之西南必􅃝決遂者明將有射事司射作上耦取矢作之者還當上耦如作射司射反位上耦揖進當楅北面揖及楅揖當楅楅正南之東西上射東面下射西面上射揖進坐橫弓郤手自弓下取一个兼諸弣順羽且興執弦而左還退反位東面揖橫􅃓者南踣􅃓也郤手由弓下取矢者以左手在􅃓表右手從裏取之便也兼并矢於弣當順羽旣又當執弦也順羽者手放而下備不整理也不言母周在阼非君周可也下射進坐橫弓覆手自弓上取一个興其他如上射覆手由弓上取矢者以左手在弓裏右手從表取之亦便旣拾取乗矢揖皆左還南面揖皆少進當楅南皆左還北面搢三挾一个楅南郷當楅之位揖皆左還上射於右上射轉居右便其反位也下射左還少南行乃西靣與進者相左相揖反位相左皆由進者之北三耦拾取矢亦如之後者遂取誘射之矢兼乗矢而取之以授有司于西方而后反位取誘射之矢挾五个弟子逆受於東靣位之後衆賔未拾取矢皆袒決遂執弓搢三挾一个由堂西進繼三耦之南而立東靣北上大夫之耦爲上未猶不也衆賔不拾者未射無福上矢也言此者嫌衆賔三耦同倫􅀄時有射者後乃射有拾取矢禮也司射作射如初一耦揖升如初司馬命去侯獲者許諾司馬降釋弓反位司射猶挾一个去扑與司馬交于階前升請釋獲于賔猶有故之辭司射旣誘射恒執弓挾矢以掌射事備尚未知當教之也今三耦卒射衆足以知之矣猶挾之者君子不必也賔許降搢扑西面立于所設中之東北面命釋獲者設中遂視之視之當教之釋獲者執鹿中一人執筭以從之鹿中謂射於謝也於庠當兕中釋獲者坐設中南當楅西當西序東面興受筭坐實八筭于中橫委其餘于中西南末興共而俟興還北靣受筭反東靣實之司射遂進由堂下北面命曰不貫不釋貫猶中也不中正不釋筭也古文貫作關上射揖司射退反位釋獲者坐取中之八筭改實八筭于中興執而俟執所取筭乃射若中則釋獲者坐而釋獲毎一个釋一筭上射於右下射於左若有餘筭則反委之委餘筭禮尚異也委之合於中西又取中之八筭改實八筭于中興執而俟三耦卒射賔主人大夫揖皆由其階降揖主人堂東袒決遂執弓搢三挾一个賔於堂西亦如之皆由其階階下揖升堂揖主人爲下射皆當其物北面揖及物揖乃射卒南面揖皆由其階階上揖降階揖賔序西主人序東皆釋弓說決拾襲反位升及階揖升堂揖皆就席或言堂或言序亦爲庠謝互言也賔主人射大夫止於堂西大夫袒決遂執弓搢三挾一个由堂西出于司射之西就其耦大夫爲下射揖進耦少退揖如三耦及階耦先升卒射揖如升射耦先降降階耦少退皆釋弓于堂西襲耦遂止于堂西大夫升就席耦於庭不並行尊大夫也在堂如上射之儀近其事得申衆賔繼射釋獲皆如初司射所作唯上耦於是言唯上耦者嫌賔主人射亦作之大射三耦卒射司射請于公及賔卒射釋獲者遂以所執餘獲升自西階盡階不升堂告于賔曰左右卒射降反位坐委餘獲于中西興共而俟司射不告卒射者釋獲者於是有事宜終之也餘獲餘筭也無餘筭則空手耳俟俟數也司馬袒決執弓升命取矢如初獲者許諾以旌􅀒侯如初司馬降釋弓反位弟子委矢如初大夫之矢則兼束之以茅上握焉兼束大夫矢優之是以不拾也束于握上則兼取之順羽便也握謂中央也不束主人矢不可以殊於賔也言大夫之矢則矢有題識也肅愼氏貢楛矢銘其括今文上作尚司馬乗矢如初司射遂適西階西釋弓去扑襲進由中東立于中南北靣視筭釋弓去扑射事已釋獲者東面于中西坐先數右獲固東靣矣復言之者爲其少南就右獲二筭爲純純猶全也耦隂陽一純以取實于左手十純則縮而委之縮從也於數者東西爲從古文縮皆爲蹙毎委異之易校數有餘純則橫於下又異之也自近爲下一筭爲竒竒則又縮諸純下竒猶虧也又從之興自前適左東面起由中東就左獲少北於故東靣郷之坐兼斂筭實于左手一純以委十則異之變於右其餘如右獲謂所縮所橫司射復位釋獲者遂進取賢獲執以升自西階盡階不升堂告于賔賢獲勝黨之筭也齊之而取其餘若右勝則曰右賢於左若左勝則曰左賢於右以純數告若有竒者亦曰竒賢猶勝也言賢者射之以中爲雋也假如右勝告曰右賢於左􅀂干純􅀂干竒􅀂左右鈞則左右皆執一筭以吿曰左右鈞降復位坐兼斂筭實八筭于中委其餘于中西興共而俟司射適堂西命弟子設豐將飲不勝者設豐所以承其爵也豐形蓋似豆而卑弟子奉豐升設于西楹之西乃降勝者之弟子洗觶升酌南靣坐奠于豐上降袒執弓反位勝者之弟子其少者也耦不酌下無能也酌者不授爵略之也執弓反射位不俟其黨已酌有事司射遂袒執弓挾一个搢扑北靣于三耦之南命三耦及衆賔勝者皆袒決遂執張弓執張弓言能用之也右手執弦如卒射不勝者皆襲􅀃決拾卻左手右加弛弓于其上遂以執弣固襲􅀃決拾矣復言之者起勝者也執弛弓言不能用之也兩手執弣又不得執弦司射先反位居前俟所命來三耦及衆射者皆與其耦進立于射位北上司射作升飮者如作射一耦進揖如升射及階勝者先升升堂少右先升尊賢也少右辟飲者也亦相飲之位不勝者進北面坐取豐上之觶興少退立卒觶進坐奠于豐下興揖立卒觶不祭不拜受罰爵不備禮也右手執觶左手執􅃓不勝者先降後升先降略之不由次與升飮者相左交于階前相揖出于司馬之南遂適堂西釋弓襲而俟俟復射有執爵者主人使賛者代弟子酌也於旣升飲而升自西階立于序端執爵者坐取觶實之反奠于豐上升飮者如初毎者輒酌以至於徧三耦卒飮賔主人大夫不勝則不執弓執爵者取觶降洗升實之以授于席前優尊也受觶以適西階上北靣立飮受罰爵者不宜自尊别卒觶授執爵者反就席大夫飮則耦不升以賔主人飲耦在上嫌其升􅀂大夫之耦不勝則亦執弛弓特升飲尊者可以􅀌無能對衆賔繼飮射爵者辯乃徹豐與觶徹猶除也設豐者反豐於堂西執爵肺坐祭遂祭酒爲侯祭也亦二手祭酒及注如大射興適左个中皆如之先祭左个後中者以外即之至中若神在中也左个之西北三歩東靣設薦俎獲者薦右東靣立飮不拜旣爵不就乏者明其享侯之餘也立飲薦右近司馬於是司馬北靣司馬受爵奠于篚復位獲者執其薦使人執俎從之辟設于乏南遷設薦俎就乏明巳所得禮也言辟之者不使當位辟舉旌偃旌也設于南右之也凡他薦俎皆當其位之前獲者􅀒侯而俟司射適階西釋弓矢去扑說決拾襲適洗洗爵升實之以降獻釋獲者于其位少南薦脯醢折俎有祭不當其位辟中釋獲者薦右東靣拜受爵司射北靣拜送爵釋獲者就其薦坐左執爵祭脯醢興取肺坐祭遂祭酒興司射之西北靣立飮不拜旣爵司射受爵奠于篚釋獲者少西辟薦反位辟薦少西之者爲復射妨司射視筭也亦辟俎司射適堂西袒決遂取弓于階西挾一个搢扑以反位爲將復射司射去扑􅀝于階西升請射于賔如初賔許司射降搢扑由司馬之南適堂西命三耦及衆賔皆􅃝決遂執弓就位位射位也不言射者以當序取矢司射先反位言先三耦及衆賔也旣命之即反位不俟之也曏不言先三耦未有拾取矢位無所先三耦及衆賔皆袒決遂執弓各以其耦進反于射位以猶與也今文以爲與司射作拾取矢三耦拾取矢如初反位賔主人大夫降揖如初主人堂東賔堂西皆􅃝決遂執弓皆進階前揖南靣相俟而揖行也及楅揖拾取矢如三耦及楅當楅東西也主人西靣賔東靣相揖拾取矢不北靣揖由便也卒北靣搢三挾一个亦於三耦爲之位揖退皆巳揖左還各由其塗反位賔堂西主人堂東皆釋弓矢襲及階揖升堂揖就席將袒先言主人將襲先言賔尊賔也大夫袒決遂執弓就其耦降袒決遂於堂西就其耦於射位與之拾取矢揖皆進如三耦耦東靣大夫西靣大夫進坐說矢束􅀃矢束者下耦以將拾取興反位而后耦揖進坐兼取乗矢順羽而興反位揖兼取乗矢者尊大夫不敢與之拾也相下相尊君子之所以相接也大夫進坐亦兼取乗矢如其耦北靣搢三挾一个亦於三耦爲之位揖退耦反位大夫遂適序西釋弓矢襲升即席大夫不序於下尊也衆賔繼拾取矢皆如三耦以反位司射猶挾一个以進作上射如初一耦揖升如初進前也曏言還當上耦西靣是言進終始互相明也今文或言作升射司馬升命去侯獲者許諾司馬降釋弓反位司射與司馬交于階前去扑襲升請以樂樂于賔賔許諾司射降搢扑東靣命樂正曰請以樂樂于賔賔許東面於西階之前也不就樂正命之者傳尊者之命於賤者遥號令之可也樂正亦許諾猶北面不還以賔在堂司射遂適階間堂下北面命曰不鼓不釋不與鼓節相應不釋筭也郷射之鼔五節歌五終所以將八矢一節之間當拾發四節四拾其一節先以聽也上射揖司射退反位樂正東面命大師曰奏騶虞間􅀂一東面者進還郷大師也騶虞國風召南之詩篇也射義曰騶虞者樂官備也其詩有一發五豝五豵于嗟騶虞之言樂得賢者衆多嘆思至仁之人以充其官此天子之射節也而用之者方有樂賢之志取其冝也其他賔客郷大夫則歌采蘋間􅀂一者重節大師不興許諾樂正退反位乃奏騶虞以射三耦卒射賔主人大夫衆賔繼射釋獲如初卒射降皆應鼓與歌之節乃釋筭降者衆賔釋獲者執餘獲升告左右卒射如初卒巳也今文曰告于賔司馬升命取矢獲者許諾司馬降釋弓反位弟子委矢司馬乗之皆如初司射釋弓視筭如初筭獲筭也今文曰視數也釋獲者以賢獲與鈞告如初降復位司射命設豐設豐實觶如初遂命勝者執張弓不勝者執弛弓升飮如初司射猶袒決遂左執弓右執一个兼諸弦面鏃適堂西以命拾取矢如初側持弦矢曰執面猶尚也并矢於弦尚其鏃將止變於射也司射反位三耦及賔主人大夫衆賔皆袒決遂拾取矢如初矢不挾兼諸弦弣以退不反位遂授有司于堂西不挾亦謂執之如司射也不以反射位授有司者射禮畢辯拾取矢揖皆升就席謂賔大夫反衆賔也相俟堂西進立于西階之前主人以賔揖升大夫及衆賔從升立時少退于大夫二耦及弟子自􅀂留下司射乃適堂西釋弓去扑說決拾襲反位司馬命弟子說侯之左下綱而釋之􅀃解也釋之不復射奄束之命獲者以旌退命弟子退楅司射命釋獲者退中與筭而俟諸所退皆俟堂西備復射也旌言以者旌恒執也獲者釋獲者亦退其薦俎司馬反爲司正退復觶南而立當監旅酬樂正命弟子賛工即位弟子相工如其降也升自西階反坐賛工遷樂也降時如初入樂正反自西階東北面賔北面坐取俎西之觶興阼階上北面酬主人主人降席立于賔東賔坐奠觶拜執觶興主人荅拜賔不祭卒觶不拜不洗實之進東南面所不者酬而禮殺也賔立飲主人阼階上北面拜賔少退少退少逡遁也主人進受觶賔主人之西北面拜送旅酬而同階禮殺也賔揖就席主人以觶適西階上酬大夫大夫降席立于主人之西如賔酬主人之禮其旣實觶進西南面立郷所酬主人揖就席若無大夫則長受酬亦如之長謂以長幼之次酬衆賔司正升自西階相旅作受酬者曰某酬某子某者字也某子者氏也稱酬者之字受酬者曰某子旅酬下爲上尊之也春秋傳曰字不若子此言某酬某子者射禮略於飲酒飲酒言某子受酬以飲酒爲主受酬者降席司正退立于西序端東面退立俟後酬者也始升相立階西北面衆受酬者拜興飮皆如賔酬主人之禮辯遂酬在下者皆升受酬于西階上在下謂賔黨也鄕飲酒記曰主人之賛者西面北上不與無筭爵然後與此異於賔卒受者以觶降奠于篚司正降復位使二人舉觶于賔與大夫二人主人之賛者舉觶者皆洗觶升實之西階上北面皆坐奠觶拜執觶興賔與大夫皆席末荅拜舉觶者皆坐祭遂飮卒觶興坐奠觶拜執觶興賔與大夫皆荅拜舉觶者逆降洗升實觶皆立于西階上北面東上賔與大夫拜舉觶者皆進坐奠于薦右坐奠之不敢授賔與大夫辭坐受觶以興辭辭其坐奠觶舉觶者退反位皆拜送乃降賔與大夫坐反奠于其所興不舉者盛禮巳崇古文曰反坐若無大夫則唯賔長一人舉觶如燕禮媵爵之爲司正升自西階阼階上受命于主人適西階上北面請坐于賔請坐欲與賔燕盡殷勤也至此盛禮以成酒清肴乾強有力者猶倦焉賔辭以俎俎者肴之貴者也辭之者不敢以燕坐䙝貴肴反命于主人主人曰請徹俎賔許司正降自西階階前命弟子俟徹俎弟子賔黨也俎者主人賛者設之今賔辭之使其黨俟徹順賔意也上言請坐于賔此言主人曰互相備耳司正升立于序端賔降席北面主人降席自南方阼階上北面大夫降席席東南面俟弟子升受俎賔取俎還授司正司正以降自西階賔從之降遂立于階西東面司正以俎出授從者授賔家從來者也古者與人飲食必歸其盛者所以厚禮之主人取俎還授弟子弟子受俎降自西階以東主人降自阼階西面立以東授主人侍者大夫取俎還授弟子弟子以降自西階遂出授從者大夫從之降立于賔南凡言還者明取俎各自郷其席衆賔皆降立于大夫之南少退北上從降亦爲將燕主人以賔揖讓說屨乃升大夫及衆賔皆說屨升坐􅀃屨者將坐空屨䙝賤不冝在堂也􅀃屨則摳衣爲其被地乃羞羞進也所進者狗胾􅊽也燕設㗖具所以案酒無筭爵使二人舉觶賔與大夫不興取奠觶飮卒觶不拜二人謂曏者二人也使之升立于西階上賔與大夫將旅當執觶也卒觶者固不拜矣著之者嫌坐卒爵者拜旣爵此坐于席禮旣殺不復崇執觶者受觶遂實之賔觶以之主人大夫之觶長受長衆賔長而錯皆不拜錯者實主人之觶以之次賔也實賔長之觶以之次大夫其或多者迭飮於坐而巳皆不拜受禮又殺也辯卒受者興以旅在下者于西階上衆賔之未飲而酬主人之賛者大夫之未飲而酬賔黨亦錯焉不使執觶者酌以其將旅酬不以巳尊􅀌人也其未􅀂皆衆賔則先酬主人之賛者若皆大夫則先酬賔黨而已執觶者酌在上辯降復位長受酬酬者不拜乃飮卒觶以實之言酬者不拜者嫌酬堂下異位當拜也古文曰受酬者不拜受酬者不拜受禮殺進受尊者之酬猶不拜辯旅皆不拜主人之賛者於此始旅嫌有拜執觶者皆與旅嫌巳飲不復飲也上使之勸人耳非逮下之惠也亦自以齒與於旅也卒受者以虚觶降奠于篚執觶者洗升實觶反奠于賔與大夫復奠之者燕以飲酒爲歡醉乃止主人之意也今文無執觶及賔觶大夫之觶皆爲爵實觶觶爲之無筭樂合郷樂無次數賔興樂正命奏陔陔陔夏其詩亡周禮賔醉而出奏陔夏陔夏者天子諸侯以鍾鼓大夫士鼓而巳賔降及階陔作賔出衆賔皆出主人送于門外再拜拜送賔于門東西靣賔不荅拜禮有終明日賔朝服以拜賜于門外拜賜謝恩惠也主人不見如賔服遂從之拜辱于門外乃退不見不䙝禮也拜辱謝其自屈辱主人釋服乃息司正釋服􅀃朝服服玄端也息猶勞也勞司正謂賔之與之飲酒以其昨日尤勞倦也月令曰勞農以休息之無介勞禮略貶於飲酒也此巳下皆記禮之異者不殺無俎故也使人速速召賔迎于門外不拜入升不拜至不拜洗薦脯醢無俎賔酢主人主人不崇酒不拜衆賔旣獻衆賔一人舉觶遂無筭爵言遂者明其間闕也賔俎奠觶于其所擯者遂受命于主人請坐于賔賔降說屨升坐矣不言遂請坐者請坐主於無筭爵無司正使擯者而巳不立之賔不與昨日至尊不可䙝也古文與作豫徴唯所欲徴召也謂所欲請呼以告於鄕先生君子可也告請也郷先生郷大夫致仕者也君子有大德行不仕者羞唯所有用時見物鄕樂唯欲不歌雅頌取周召之詩在所好記大夫與則公士爲賔不敢使郷人加尊於大夫也公士在官之士郷賔主用處士使能不宿戒能者敏於事不待宿戒而習之其牲狗也狗取擇人亨于堂東北郷飲酒義曰俎陽氣之所發也尊綌幂賔至徹之以綌爲幂取其堅絜蒲筵緇布純筵席也純縁西序之席北上衆賔統於賔獻用爵其他用觶爵尊不可䙝也以爵拜者不徒作以爵拜謂拜旣爵徒猶空也作起也不空起言起必酢主人薦脯用􅇼五膱祭半膱橫于上醢以豆出自東房膱長尺二寸脯用􅇼􅇼冝乾物也醢以豆豆冝濡物也膱猶脡也爲記者異耳祭橫于上殊之也於人爲縮膱廣狹未聞也古文膱爲胾今文或作植俎由東壁自西階升狗旣亨載于東方賔俎脊脅肩肺主人俎脊脅臂肺肺皆離皆右體也進腠以骨名􅁏貴骨也賔俎用肩主人用臂尊賔也離猶㨒也腠膚理也進理謂前其夲右體周所貴也若有尊者則俎其餘體也凡舉爵三作而不徒爵謂獻賔獻大夫獻工皆有薦凡奠者於左不飲不欲其妨將舉者於右便其舉也衆賔之長一人辭洗如賔禮尊之於其黨若有諸公則如賔禮大夫如介禮無諸公則大夫如賔禮尊卑之差諸公大國之􅀌也樂作大夫不入後樂賢也樂正與立者齒謂其飲之次也尊樂正同於賔黨郷飲酒記曰與立者皆薦以齒三笙一和而成聲三人吹笙一人吹和凡四人也爾稚曰笙小者謂之和獻工與笙取爵于上篚旣獻奠于下篚其笙則獻諸西階上奠爵于下篚不復用也今文無與笙立者東面北上賔黨司正旣舉觶而薦諸其位薦於觶南三耦者使弟子司射前戒之弟子賔黨之少者也前戒謂先射請戒之司射之弓矢與扑􅀝于西階之西便其事也司射旣袒決遂而升司馬階前命張侯遂命􅀝旌著並行也古文曰遂命獲者􅀝旌凡侯天子熊侯白質諸侯麋侯赤質大夫布侯畫以虎豹士布侯畫以鹿豕此所謂獸侯也燕射則張之郷射及賔射當張采侯二正而記此者天子諸侯之燕射各以其郷射之禮而張此侯由是云焉白質赤質皆謂采其地其地不采者白布也熊麋虎豹鹿豕皆正面畫其頭象於正鵠之處耳君畫一臣畫二陽竒隂偶之數也燕射射熊虎豹不忘上下相犯射麋鹿豕志在君臣相養也其畫之皆毛物之凡畫者丹質賔射之侯燕射之侯皆畫雲氣於側以爲飾必先以丹采其地丹淺於赤射自楹間物長如笴其間容弓距隨長武自楹間者謂射於庠也楹間中央東西之節也物謂射時所立處也謂之物者物猶事也君子所有事也長如笴者謂從畫之長短也笴矢幹也長三尺與跬相應射者進退之節也間容弓者上下射相去六尺也距隨者物橫畫也始前足至東頭爲距後足來合而南靣爲隨武跡也尺二寸序則物當棟堂則物當楣是制五架之屋也正中曰棟次曰楣前曰庪命􅀒侯者由其位於賤者禮略凡適堂西皆出入于司馬之南唯賔與大夫降階遂西取弓矢尊者冝逸由便也旌各以其物旌㹅名也雜帛爲物大夫士之所建也言各者郷射或於庠或於謝無物則以白羽與朱羽糅杠長三仞以鴻脰韜上二㝷無物者謂小國之州長也其郷大夫一命其州長士不命不命者無物此翿旌也翿亦所以進退衆者糅雜也杠橦也七尺曰仞鴻鳥之長脰者也八尺曰尋今文糅爲縮韜爲翿凡挾矢於二指之間橫之二指謂左右手之第二指此以食指將指挾之司射在司馬之北司馬無事不執弓以不主射故也始射獲而未釋獲復釋獲復用樂行之君子取人以漸上射於右於右物射楅長如笴博三寸厚寸有半龍首其中虵交韋當博廣也兩端爲龍首中央爲虵身相交也虵龍君子之􅀋也交者象君子取矢於楅上也直心背之衣曰當以丹韋爲之司馬左右撫矢而乗之分委於當楅髤橫而拳之南面坐而奠之南北當洗髤赤黒􅃮也射者有過則撻之過謂矢揚中人凡射時矢中人當刑之今郷㑹衆賢以禮樂勸民而射者中人本意在侯去傷害之心逺是以輕之以扑撻於中庭而巳書曰扑作教刑衆賔不與射者不降不以無事亂有事古文與爲豫取誘射之矢者旣拾取矢而后兼誘射之乗天而取之謂反位巳禮成乃更進取之不相因也賔主人射則司射擯升降卒射即席而反位卒事擯賔主人升降者皆尊之也不使司馬擯其升降主於射鹿中髤前足跪鑿背容八筭釋獲者奉之先首前足跪者象教擾之獸受􅀒也大夫降立于堂西以俟射尊大夫不使乆列於射位大夫與士射袒薫􅃭不肉袒殊於耦耦少退于物下大夫也旣發則然司射釋弓矢視筭與獻釋獲者釋弓矢唯比二事休武主文釋弓矢耳然則擯升降不釋禮射不主皮主皮之射者勝者又射不勝者降禮射謂以禮樂射也大射賔射燕射是矣不主皮者貴其容體比於禮其節比於樂不待中爲備也言不勝者降則不復升射也主皮者無侯張獸皮而射之主於獲也尚書傳曰戰闘不可不習故於蒐狩以閑之也閑之者貫之也貫之者習之也凡祭取餘獲陳於澤然後卿大夫相與射也中者雖不中也取不中者雖中也不取何以然所以貴揖讓之取也而賤勇力之取嚮之取也於囿中勇力之取也今樂之道也疾今人慢於禮樂之盛言語無節故追道古也凡旅不洗敬殺不洗者不祭不盛旣旅士不入後正禮也旣旅則將燕矣士入齒於郷人大夫後出下郷人不干其賔主之禮主人送于門外再拜拜送大夫尊之也主人送賔還入門揖大夫乃出送拜之鄕侯上个五尋上个謂最上幅也八尺曰尋上幅用布四丈中十尺方者也用布五丈今官布幅廣二尺二寸旁削一寸考工記曰梓人爲侯廣與崇方謂中也侯道五十弓弓二寸以爲侯中言侯中所取數也量侯道以貍歩而云弓者侯之所取數冝於躬噐也正二寸骹中之博也今文改弓爲肱也倍中以爲躬躬身也謂中之上下幅也用布各二丈倍躬以爲左右舌謂上个也居兩旁謂之个左右出謂之舌下舌半上舌半者半其出於射者也用布三丈所以半上舌者侯人之形􅀋也上个象臂下个象足中人張臂八尺張足六尺五八四十五六三十以此爲衰也凡郷侯用布十六丈數起侯道五十弓以計道七十弓之侯用布二十五丈二尺道九十弓之侯用布三十六丈箭籌八十箭篠也籌筭也筭八十者略以十耦爲正貴全數其時衆寡從賔長尺有握握素握本所持處也素謂刋之也刋本一作膚楚扑長如笴刋夲尺刋其可持處君射則爲下射上射退于物一笴旣發則荅君而俟荅對也此以下雜記也今文君射則爲下君樂作而后就物君袒朱􅃭以射君尊小臣以巾執矢以授君尊不搢矢不挾矢授之稍屬若飮君如燕則夾爵謂君在不勝之黨也賔飮君如燕賔媵觚于公之禮則夾爵夾爵者君旣卒爵復自酌君國中射則皮樹中以翿旌獲白羽與朱羽糅國中城中也謂燕射也皮􅀣獸名以翿旌獲尚文德也今文皮􅀣繁豎糅爲縚古文無以於郊則閭中以旌獲於郊謂大射也大射於大學王制曰小學在公宫之左大學在郊閭獸名如驢一角或曰如驢岐蹄周書曰北唐以閭折羽爲旌於竟則虎中龍旜於竟謂與鄰國君射也畫龍於旜尚文章也通帛爲旜大夫兕中各以其物獲兕獸名似牛一角士鹿中翿旌以獲謂小國之州長也用翿爲旌以獲無物也古文無以獲唯君有射于國中其餘否臣不習武事於君側也古文有作又今文無其餘否君在大夫射則肉袒不袒纁襦厭於君也今文無射儀禮卷第五經三千六百四十五字注六千九百一十五字
