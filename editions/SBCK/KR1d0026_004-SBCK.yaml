body:
  text: 儀禮卷第四鄕飮酒禮第四儀禮鄭氏注鄕飮酒之禮主人就先生而謀賔介主人謂諸侯之鄕大夫也先生鄕中致仕者賔介處士賢者周禮大司徒之職以鄕三物教萬民而賔興之一曰六德知仁聖義忠和二曰六行孝友睦姻任恤三曰六藝禮樂射御書數鄕大夫以正月之吉受法于司徒退而頒之于其鄕吏使各以教其所治以考其德行察其道藝及三年大比而興賢者能者鄕老及鄕大夫帥其吏與其衆寡以禮禮賔之厥明獻賢能之書於王是禮乃三年正月而一行也諸侯之鄕大夫貢士於其君蓋如此云古者年七十而致仕老於鄕里大夫名曰父師士名曰少師而敎學焉恒知鄕人之賢者是以大夫就而謀之賢者爲賔其次爲介又其次爲衆賔而與之飮酒是亦將獻之以禮禮賔之也今郡國十月行此飮酒禮以黨正毎歲􅀖索􅀑神而祭祀則以禮屬民而飮酒于序以正齒位之􅀃然此篇無正齒位之事焉凡鄉黨飮酒必於民聚之時欲其見化知尚賢尊長也孟子曰天下有逹尊三爵也德也齒也主人戒賔賔拜辱主人荅拜乃請賔賔禮辭許主人再拜賔荅拜戒警也告也拜辱出拜其自屈辱至巳門也請告以其所爲來之事不固辭者素所有志主人退賔拜辱退猶去也去又拜辱者以送謝之介亦如之如戒賔也乃席賔主人介席敷席也夙興往戒歸而敷席賔席牖前南靣主人席阼階上西靣介席西階上東靣衆賔之席皆不屬焉席衆賔於賔席之西不屬者不相續也皆獨坐明其德各特尊兩壺于房戸間斯禁有玄酒在西設篚于禁南東肆加二勺于兩壺斯禁禁切地無足者玄酒在西上也肆陳也設洗于阼階東南南北以堂深東西當東榮水在洗東篚在洗西南肆榮屋翼羮定肉謂之羮定猶孰也主人速賔賔拜辱主人荅拜還賔拜辱速召也還猶退介亦如之如賔速也賔及衆賔皆從之從猶隨也言及衆賔介亦在其中矣主人一相迎于門外再拜賔賔荅拜拜介介荅拜相主人之吏擯賛傳命者揖衆賔差益卑也拜介揖衆賔皆西南靣主人揖先入揖揖賔也先入門而西面賔厭介入門左介厭衆賔入衆賔皆入門左北上皆入門西東靣賔之屬相厭變於主人也推手曰揖引手曰厭今文皆作揖又曰衆賔皆入左無門主人與賔三揖至于階三讓主人升賔升主人阼階上當楣北靣再拜賔西階上當楣北靣荅拜三揖者將進揖當陳揖當碑揖楣前梁也復拜拜賔至此堂尊之主人坐取爵于篚降洗將獻賔也賔降從主人也主人坐奠爵于階前辭重以巳事煩賔也事同曰讓事異曰辭賔對對荅也賔主之辭未聞主人坐取爵興適洗南靣坐奠爵于篚下盥洗巳盥乃洗爵致絜敬也今文無奠賔進東北靣辭洗必進東行示情主人坐奠爵于篚興對賔復位當西序東靣言復位者明始降時位在此主人坐取爵沃洗者西北靣沃洗者主人之羣吏卒洗主人壹揖壹讓升俱升古文一作壹賔拜洗主人坐奠爵遂拜降盥復盥爲手坋汙賔降主人辭賔對復位當西序卒盥揖讓升賔西階上疑立疑讀爲疑然從於趙盾之疑疑正立自定之皃主人坐取爵實之賔之席前西北靣獻賔獻進也進酒於賔賔西階上拜主人少退少退少辟賔進受爵以復位主人阼階上拜送爵賔少退復位復西階上位薦脯醢薦進也進之者主人有司賔升席自西方升由下也升必中席乃設折俎牲體枝解節折在俎主人阼階東疑立賔坐左執爵祭脯醢坐坐於席祭脯醢者以右手奠爵于薦西興右手取肺卻左手執本坐弗繚右絶末以祭尚左手嚌之興加于俎興起也肺離之本端厚大者繚猶紾也大夫以上威儀多紾絶之尚左手者明垂紾之乃絶其末嚌甞也坐挩手遂祭酒挩拭也古文挩作􅀃興席末坐啐酒啐亦甞也降席坐奠爵拜吿㫖執爵興主人阼階上荅拜降席席西也旨美也賔西階上北靣坐卒爵興坐奠爵遂拜執爵興主人阼階上荅拜卒盡也於此盡酒者明此席非專爲飮食起賔降洗將酢主人主人降亦從賔也降降立阼階東西靣賔坐奠爵興辭西階前也主人對賔坐取爵適洗南北靣主人阼階東南靣辭洗賔坐奠爵于篚興對主人復阼階東西靣賔東北靣盥坐取爵卒洗揖讓如初升主人拜洗賔荅拜興降盥如主人禮賔實爵主人之席前東南靣酢主人主人阼階上拜賔少退主人進受爵復位賔西階上拜送爵薦脯醢主人升席自北方設折俎祭如賔禮祭者祭薦俎及酒亦嚌啐不告旨酒巳物也自席前􅃴阼階上北靣坐卒爵興坐奠爵遂拜執爵興賔西階上荅拜自席前者啐酒席末因從北方降由便也主人坐奠爵于序端阼階上北靣再拜崇酒賔西階上荅拜東西牆爲之序崇充也言酒惡相充實主人坐取觶于篚降洗賔降主人辭降賔不辭洗立當西序東靣不辭洗者以其將自飮卒洗楫讓升賔西階上疑立主人實觶酬賔阼階上北靣坐奠觶遂拜執觶興賔西階上荅拜酬勸酒也酬之言周忠信爲周坐祭遂飮卒觶興坐奠觶遂拜執觶興賔西階上荅拜主人降洗賔降辭如獻禮升不拜洗不拜洗殺於獻賔西階上立主人實觶賔之席前北靣賔西階上拜主人少退卒拜進坐奠觶于薦西賔巳拜主人奠其觶賔辭坐取觶復位主人阼階上拜送賔北靣坐奠觶于薦東復位酬酒不舉君子不盡人之歡不竭人之忠以全交也主人揖降賔降立于階西當序東靣主人將與介爲禮賔謙不敢居堂上主人以介揖讓升拜如賔禮主人坐取爵于東序端降洗介降主人辭降介辭洗如賔禮升不拜洗介禮殺也介西階上立不言疑者省文主人實爵介之席前西南靣獻介介西階上北靣拜主人少退介進北靣受爵復位主人介右北靣拜送爵介少退主人拜于介右降尊以就卑也今文無比靣主人立于西階東薦脯醢介升席自北方設折俎祭如賔禮不嚌肺不啐酒不告旨自南方降席北靣坐卒爵興坐奠爵遂拜執爵興主人介右荅拜不嚌啐下賔介降洗主人復阼階降辭如初如賔酢之時卒洗主人盥盥者當爲介酌介揖讓升授主人爵于兩楹之間就尊南授之介不自酌下賔酒者賔主共之介西階上立主人實爵酢于西階上介右坐奠爵遂拜執爵興介荅拜主人坐祭遂飮卒爵興坐奠爵遂拜執爵興介荅拜主人坐奠爵于西楹南介右再拜崇酒介荅拜奠爵西楹南以當獻衆賔主人復阼階揖降介降立于賔南主人西南靣三拜衆賔衆賔皆荅壹拜三拜壹拜示徧不備禮也不升拜賤也主人揖升坐取爵于西楹下降洗升實爵于西階上獻衆賔衆賔之長升拜受者三人長其老者言三人則衆賔多矣主人拜送於衆賔右坐祭立飲不拜旣爵授主人爵降復位旣卒也卒爵不拜立飮立授賤者禮簡衆賔獻則不拜受爵坐祭立飮次三人以下也不拜禮彌簡每一人獻則薦諸其席謂三人也衆賔辯有脯醢亦每獻薦於其位位在下今文辯皆作徧主人以爵降奠于篚不復用也揖讓升賔厭介升介厭衆賔升衆賔序升即席序次也即就也今文厭皆爲揖一人洗升舉觶于賔一人主人之吏發酒端曰舉實觶西階上坐奠觶遂拜執觶興賔席末荅拜坐祭遂飮卒觶興坐奠觶遂拜執觶興賔荅拜降洗升實觶立于西階上賔拜賔拜拜將受觶進坐奠觶于薦西賔辭坐受以興舉觶不授下主人也言坐受者明行事相接􅀂親受謙也舉觶者西階上拜送賔坐奠觶于其所所薦西也舉觶者降事巳設席于堂廉東上爲工布席也側邊曰廉燕禮曰席工於西階上少東樂正先升北靣此言樂正先升立于西階東則工席在階東工四人二瑟瑟先相者二人皆左何瑟後首挎越内弦右手相四人大夫制也二瑟二人鼔瑟則二人歌也瑟先者將入序在前也相扶工也衆賔之少者爲之毎工一人鄕射禮曰弟子相工如􅀄入天子相工使視瞭者凡工瞽矇也故有扶之者師冕見及階子曰階也及席子曰席也固相師之道後首者變于君也挎持也相瑟者則爲之持瑟其相歌者徒相也越瑟下孔也内弦側擔之者樂正先升立于西階東正長也工入升自西階北靣坐相者東靣坐遂授瑟乃降降立于西方近其事工歌鹿鳴四牡皇皇者華三者皆小雅篇也鹿鳴君與臣下及四方之賔燕講道修政之樂歌也此采其巳有旨酒以召嘉賔嘉賔旣來示我以善道又樂嘉賔有孔昭之明德可則傚也四牡君勞使臣之來樂歌也此采其勤苦王事念將父母懷歸傷悲忠孝之至以勞賔也皇皇者華君遣使臣之樂歌也此采其更是勞苦自以爲不及欲諮謀于賢知而以自光明也卒歌主人獻工工左瑟一人拜不興受爵主人阼階上拜送爵一人工之長也凢工賤不爲之洗薦脯醢使人相祭使人相者相其祭酒祭薦工飮不拜旣爵授主人爵坐授之衆工則不拜受爵祭飮辯有脯醢不祭祭飮獻酒重無不祭也今文辯爲徧大師則爲之洗賔介降主人辭降工不辭洗大夫􅀂君賜之樂謂之大師則爲之洗尊之也賔介降從主人也工大師也上旣言獻工矣乃言太師者大師或瑟或歌也其獻之瑟則先歌則後笙入堂下磬南北靣立樂南陔白華華黍笙吹笙者也以笙吹此詩以爲樂也南陔白華華黍小雅篇也今亡其義未聞昔周之興也周公制禮作樂采時世之詩以爲樂歌所以通情相風切也其有此篇明矣後世衰微幽厲尤甚禮樂之書稍稍廢棄孔子曰吾自衛反魯然後樂正唯頌各得其所謂當時在者而復重雜亂者也惡能存其亡者乎且正考父校商之名頌十二篇于周大師歸以祀其先王至孔子二百年之間五篇而巳此其信也主人獻之于西階上一人拜盡階不升堂受爵主人拜送爵階前坐祭立飮不拜旣爵升授主人爵一人笙之長者也笙三人和一人凢四人鄕射禮曰笙一人拜于下衆笙則不拜受爵坐祭立飮辯有脯醢不祭亦受爵于西階上薦之皆於其位磬南今文辯爲徧乃閒歌魚麗笙由庚歌南有嘉魚笙崇丘歌南山有臺笙由儀閒代也謂一歌則一吹六者皆小雅篇也魚麗言太平年豐物多也此采其物多酒旨所以優賔也南有嘉魚言太平君子有酒樂與賢者共之也此采其能以禮下賢者賢者纍蔓而歸之與之燕樂也南山有臺言太平之治以賢者爲本此采其愛友賢者爲􅀖家之基民之父母旣欲其身之壽考又欲其名德之長也由庚崇丘由儀今亡其義未聞乃合樂周南􅀜雎葛覃卷耳召南鵲巢采蘩采蘋合樂謂歌樂與衆聲俱作周南召南國風篇也王后國君夫人房中之樂歌也關雎言后妃之德葛覃言后妃之職卷耳言后妃之志鵲巢言國君夫人之德采蘩言國君夫人不失職采蘋言卿大夫之妻能脩其法度昔大王王季居于岐山之陽躬行召南之教以興王業及文王而行周南之教以受命大雅云刑于寡妻至于兄弟以御于家􅀖謂此也其始一國耳文王作邑于豐以故地爲卿士之采地乃分爲二國周周公罰所食召召公所食於時文王三分天下有其巳一德化被于南土是以其詩有仁賢之風者屬之召南焉有聖人之風者屬之周南焉夫婦之道生民之本王政之端此六篇者其教之原也故國君與其臣下及四方之賔燕用之合樂也鄕樂者風也小雅爲諸侯之樂大雅頌爲天子之樂鄕飮酒升歌小雅禮盛者可以進取也燕合鄕樂禮輕者可以逮下也春秋傳曰肆夏繫遏渠天子所以享元侯也文王大明緜兩君相見之樂也然則諸侯相與燕升歌大雅合小雅天子與次國小國之君燕亦如之與大國之君燕升歌頌合大雅其笙間之篇未聞工告于樂正曰正歌備樂正告于賔乃降樂正降者以正歌備無事也降立西階東北靣主人降席自南方不由北方由便側降賔介不從作相爲司正司正禮辭許諾主人拜司正荅拜作使也禮樂之正旣成將留賔爲有解惰立司正以監之拜拜其許主人升復席司正洗觶升自西階阼階上北靣受命于主人主人曰請安于賔司正告于賔賔禮辭許爲賔欲去留之告賔於西階司正告于主人主人阼階上再拜賔西階上荅拜司正立于楹間以相拜皆揖復席再拜拜賔許也司正旣以賔許告主人遂立楹間以相拜賔王人旣拜揖就席司正實觶降自西階階間北靣坐奠觶退共少立階間北靣東西節也其南北當中庭共拱手也少立自正愼其位也巳帥而正孰敢不正燕禮曰右還北靣坐取觶不祭遂飲卒觶興坐奠觶遂拜執觶興盥洗北靣坐奠觶于其所退立于觶南洗觶奠之示潔敬立於其南以察衆賔北面坐取俎西之觶阼階上北面酬主人主人降席立于賔東初起旅酬也凡旅酬者少長以齒終於沃盥者皆弟長而無遺矣賔坐奠觶遂拜執觶興主人荅拜不祭立飮不拜卒觶不洗實觶東南面授主人賔立飮卒觶因更酌以鄕主人將授主人阼階上拜賔少退主人受觶賔拜送于主人之西旅酬同階禮殺賔揖復席酬主人訖主人西階上酬介介降席自南方立于主人之西如賔酬主人之禮主人揖復席其酌實觶西南面授介自此以下旅酬酌者亦如之司正升相旅曰某子受酬一酬者降席旅序也於是介酬衆賔衆賔又以次序相酬某者衆賔姓也同姓則以伯仲别之又同則以且字别之司正退立于序端東面辟受酬者又便其賛上賛下也始升相西階西北面受酬者自介右由介東也尊介使不失故位衆受酬者受自左後將受酬者皆由西變於介也今文無衆酬者拜興飮皆如賔酬主人之禮嫌賔以下異也辯卒受者以觶降坐奠于篚辯辯衆賔之在下者鄕射禮曰辯遂酬在下者皆升受酬于西階上司正降復位觶南之位使二人舉觶于賔介洗升實觶于西階上皆坐奠觶遂拜執觶興賔介席末荅拜皆坐祭遂飮卒觶興坐奠觶遂拜執觶興賔介席末荅拜二人亦主人之吏􅀂有大夫則舉觶于賔與大夫燕禮曰媵爵者立于洗南西靣北上序進盥洗逆降洗升實觶皆立于西階上賔介皆拜於席末拜皆進薦西奠之賔辭坐取觶以興介則薦南奠之介坐受以興退皆拜送降賔介奠于其所賔言取介言受尊卑異文今文曰賔受司正升自西階受命于主人主人曰請坐于賔賔辭以俎至此盛禮俱成酒清肴乾賔主百拜強有力者猶倦焉張而不弛弛而不張非文武之道請坐者將以賔燕也俎者肴之貴者辭之者不敢以禮殺當貴者主人請徹俎賔許亦司正傳請告之司正降階前命弟子俟徹俎西階前也弟子賔之少者俎者主人之吏設之使弟子俟徹者明徹俎賔之義司正升立于席端待事賔降席北面主人降席阼階上北面介降席西階上北面遵者降席席東南靣皆立相須徹俎也遵者謂此鄕之人仕至大夫者也今來助主人樂賔主人所榮而遵法者也因以爲名或有無來不來用時事耳今文遵爲僎或爲全賔取俎還授司正司正以降賔從之主人取俎還授弟子弟子以降自西階主人降自阼階介取俎還授弟子弟子以降介從之􅀂有諸公大夫則使人受俎如賔禮衆賔皆降取俎者皆鄕其席旣授弟子皆降復􅀄入之位􅀃屨揖讓如初升坐􅀃屨者爲安燕當坐也必􅀃於下者屨賤不空居堂􅀃屨主人先左賔先右今文說爲稅乃羞羞進也所進者狗胾醢也鄕設骨體所以致敬也今進羞所以盡愛也敬之愛之所以厚賢也無筭爵筭數也賔主燕飮爵行無數醉而止也鄕射禮曰使二人舉觶于賔與大夫又曰執觶者洗升實觶反奠於賔與大夫皆是無筭樂燕樂亦無數或間或合盡歡而止也春秋襄二十九年吳公子札來聘請觀于周樂此國君之無筭賔出奏陔陔陔夏也陔之言戒也終日燕飮酒罷以陔爲節明無失禮也周禮鍾師以鍾鼓奏九夏是奏陔夏則有鍾鼓矣鍾鼔者天子諸侯備用之大夫士鼔而巳蓋建於阼階之西南鼔鄕射禮曰賔興樂正命奏陔賔降及階陔作賔出衆賔皆出主人送于門外再拜門東西靣拜也賔介不荅拜禮有終也賔􅀂有遵者諸公大夫則旣一人舉觶乃入不于主人正禮也遵者諸公大夫也謂之賔者同從外來耳大國有􅀌四命謂之公席于賔東公三重大夫再重席此二者於賔東尊之不與鄕人齒也天子之國三命者不齒於諸侯之國爵爲大夫則不齒矣不言遵者遵者亦卿大夫公如大夫入主人降賔介降衆賔皆降復初位主人迎揖讓升公升如賔禮辭一席使一人去之如讀若今之若主人迎之於門内也辭一席謙自同於大夫大夫則如介禮有諸公則辭加席委于席端主人不徹無諸公則大夫辭加席主人對不去加席加席上席也大夫席再重明日賔服鄕服以拜賜拜賜謝恩惠鄕服昨日與鄉大夫飮酒之朝服也不言朝服未服以朝也今文曰賔服鄕服主人如賔服以拜辱拜賔復自屈辱也鄕射禮曰賔朝服以拜賜于門外主人不見如賔服遂從之拜辱于門外乃退主人釋服釋朝服更服玄端也古文釋作舍乃息司正息勞也勞賜昨日賛執事者獨云司正司正庭長也無介勞禮略也司正爲賔不殺市買若因所有可也不殺則無俎薦脯醢羞同也羞唯所有在有何物徴唯所欲徴召也以吿于先生君子可也告請也先生不以筋力爲禮於是可以來君子國中有盛德者可者召不召唯所欲賔介不與禮瀆則䙝古文與爲豫鄕樂唯欲鄕樂周南召南六篇之中唯所欲作不從次也不歌鹿鳴魚麗者辟國君也記鄕朝服而謀賔介皆使能不宿戒鄕鄕人謂鄕大夫也朝服冠玄端緇帶素韠白屨今郡國行鄕飮酒之禮玄冠而衣皮弁服與禮異再戒爲宿戒禮將有事先戒而又宿戒蒲筵緇布純筵席也純縁也尊綌幂賔至徹之綌􅁑也幂覆尊巾其牲狗也狗取擇人亨于堂東北祖陽氣之所始也陽氣主養易曰天地養萬物聖人養賢以及萬民獻用爵其他用觶爵尊不䙝用之薦脯五挺橫祭于其上出自左房挺猶膱也鄕射禮曰祭半膱膱長尺有二寸左在東陽也陽主養房饌陳處也冠禮之饌脯􅊽南上曲禮曰以脯修置者左朐右末俎由東壁自西階升亨狗旣孰載之俎饌於東方賔俎脊脅肩肺主人俎脊脅臂肺介俎脊脅肫胳肺肺皆離皆右體進腠凡牲前脛骨三肩臂臑也後脛骨二膊胳也尊者俎尊骨卑者俎卑骨祭統曰凡爲俎者以骨爲主骨有貴賤凡前貴後賤離猶㨒也􅴪理也進理謂前其本也今文胳作骼以爵拜者不徒作作起也言拜旣爵者不徒起起必酢主人坐卒爵者拜旣爵立卒爵者不拜旣爵降殺各從其宜不使相錯唯工不從此禮凡奠者於左不飲者不欲其妨將舉於右便也衆賔之長一人辭洗如賔禮於三人之中復差有尊者餘二人雖爲之洗不敢辭其下不洗立者東靣北上􅀂有北靣者則東上賢者衆寡無常也或統於堂或統於門樂正與立者皆薦以齒謂其飮之次也尊樂正同於賔黨不言飮而言薦以明飮也旣飮皆薦於其位樂正位西階東北靣凡舉爵三作而不徒爵謂獻賔獻大夫獻工皆有薦樂作大夫不入後樂賢者獻工與笙取爵于上篚旣獻奠于下篚明其異器敬也如是則獻大夫亦然上篚三爵其笙則獻諸西階上謂主人拜送爵也於工拜于阼階上者以其坐于西階東也古文無上磬階間縮􅋼北靣鼔之縮從也霫以東西爲從鼔猶擊也大夫而特縣方賔鄕人之賢者從士禮也射則磬在東古文縮爲蹙主人介凡升席自北方降自南方席南上升由下降由上由便司正旣舉觶而薦諸其位司正主人之屬也無獻因其舉觶而薦之凡旅不洗敬禮殺也不洗者不祭不甚絜也旣旅士不入後正禮也旣旅則將燕矣徹俎賔介遵者之俎受者以降遂出授從者以送之主人之俎以東藏於東方樂正命奏陔賔出至于階陔作􅀂有諸公則大夫於主人之北西靣其西靣者北上統於公主人之賛者西靣北上不與賛佐也謂主人之屬佐助主人禮事微鼏沃盥設薦俎者西靣北上統於堂也與及也不及謂不獻酒無筭爵然後與燕乃及之儀禮卷第四
