body:
  text: 儀禮卷第六燕禮第六儀禮鄭氏注燕禮小臣戒與者小臣相君燕飲之法與者謂留羣臣也君以燕禮勞使臣若臣有功故與羣臣樂之小臣則警戒告語焉飮酒以合㑹爲歡也膳宰具官饌于寢東膳宰天子曰膳夫掌君飮食膳羞者也具官饌具其官之所饌謂酒也牲也脯􅊽也寢露寢樂人縣縣鍾磬也國君無故不徹縣言縣者爲燕新之設洗篚于阼階東南當東􅋼罍水在東篚在洗西南肆設膳篚在其北西面設此不言其官賤也當東􅋼者人君爲殿屋也亦南北以堂深肆陳也膳篚者君象􅒀所饌也亦南陳言西面尊之異其文司宫尊于東楹之西兩方壺左玄酒南上公尊瓦大兩有豐幂用綌若錫在尊南南上尊士旅食于門西兩圜壺司宫天子曰小宰聽酒人之成要者也尊方壺爲􅀸大夫士也臣道􅀡方於東楹之西予君專此酒也玉藻曰唯君面尊玄酒在南順君之面也瓦大有虞氏之尊也禮噐曰君尊瓦甒豐形似豆卑而大鼏用綌􅀂錫冬夏異也在尊南在方壺之南也尊士旅食者用圜壺變於卿大夫也旅衆也士衆食謂未得正禄所謂庶人在官者也今文錫爲緆司宫筵賔于戸西東上無加席也筵席也席用蒲筵緇布純無加席燕私禮臣屈也諸侯之官無司几筵也射人吿具吿事具于君射人主此禮以其或射也小臣設公席于阼階上西鄕設加席公升即位于席西鄕周禮諸侯胙席莞筵紛純加繅席畫純後設公席者凡禮卑者先卽事尊者後也小臣納卿大夫卿大夫皆入門右北面東上士立于西方東面北上祝史立于門東北面東上小臣師一人在東堂下南面士旅食者立于門西東上納者以公命引而入也自士以下從而入卽位耳師長也小臣之長一人猶天子大僕正君之服位者也凢入門而右由闑東左則由闑西公降立于阼階之東南南鄕爾卿卿西面北上爾大夫大夫皆少進爾近也移也揖而移之近之也大夫猶北面少前射人請賔命當由君出也公曰命某爲賔某大夫也射人命賔賔少進禮辭命賔者東面南顧禮辭辭不敏也反命射人以賔之辭告於君又命之賔再拜稽首許諾又復射人反命告賔許賔出立于門外東面當更以賔禮入公揖卿大夫乃升就席揖之人之也小臣自阼階下北面請執幂者與羞膳者執幂者執瓦大之幂也方圜壺無幂羞膳羞於公謂庶羞乃命執幂者執幂者升自西階立於尊南北面東上以公命於西階前命之也東上玄酒之幂爲上也羞膳者從而東由堂車升自北階房中西靣南上不言之者不升堂略之也膳宰請羞于諸公卿者小臣不請而使膳宰於卑者彌略也禮以異爲敬射人納賔射人爲擯者也今文曰擯者賔入及庭公降一等揖之及至也至庭謂旣入而左北面時公升就席以其將與主人爲禮不參之也賔升自西階主人亦升自西階賔右北面至再拜賔荅再拜主人宰夫也宰夫大宰之屬掌賔客之獻飮食者也其位在洗北西面君於其臣雖爲賔不親獻以其尊莫敢伉禮也至再拜者拜賔來至也天子膳夫爲獻主主人降洗洗南西北面賔將從降鄕之賔降階西東面主人辭降賔對對荅主人北面盥坐取􅒀洗賔少進辭洗主人坐奠􅒀于篚興對賔反位賔少進者又辭宜違其位也獻不以爵辟正主也古文􅒀皆爲觶主人卒洗賔揖乃升賔毎先升尊也主人升賔拜洗主人賔右奠􅒀荅拜降盥主人復盥爲拜手坋塵也賔降主人辭賔對卒盥賔揖升主人升坐取􅒀取􅒀將就瓦大酌膳執幂者舉幂主人酌膳執幂者反幂君物曰膳膳之言善也酌君尊者尊賔也主人筵前獻賔賔西階上拜筵前受爵反位主人賔右拜送爵賔旣拜前受􅒀退復位膳宰薦脯醢賔升筵膳宰設折俎折俎牲體骨也鄕飲酒記曰賔俎脊脅肩肺賔坐左執爵右祭脯醢奠爵于薦右興取肺坐絕祭嚌之興加于俎坐挩手執爵遂祭酒興席末坐啐酒降席坐奠爵拜告旨執爵興主人荅拜降席席西也旨美也賔西階上北面坐卒爵興坐奠爵遂拜主人荅拜遂拜拜旣爵也賔以虚爵降將酢主人主人降賔洗南坐奠􅒀少進辭降主人東面對上旣言爵矣復言觚者嫌易之也大射禮曰主人西階西東面少進對今文從北以下觚皆爲爵賔坐取􅒀奠于篚下盥洗篚下篚南主人辭洗謙也今文無洗賔坐奠􅒀于篚興對卒洗及階揖升主人升拜洗如賔禮賔降盥主人降賔辭降卒盥揖升酌膳執幂如初以酢主人于西階上主人北面拜受爵賔主人之左拜送爵賔旣南面授爵乃之左主人坐祭不啐酒辟正主也未薦者臣也不拜酒不告㫖主人之義遂卒爵興坐奠爵拜執爵興賔荅拜主人不崇酒以虚爵降奠于篚崇充也不以酒謝賔甘美君物也賔降立于西階西旣受獻矣不敢安盛射人升賔賔升立于序内東面東西牆謂之序大射禮曰擯者以命升賔主人盥洗象觚升實之東北面獻于公象觚觚有象骨飾也取象觚者東面公拜受爵主人降自西階阼階下北面拜送爵士薦脯醢膳宰設折俎升自西階薦進也大射禮曰宰胥薦脯醢由左房公祭如賔禮膳宰賛授肺不拜酒立卒爵坐奠爵拜執爵興凡異者君尊變於賔也主人荅拜升受爵以降奠干膳篚更爵洗升酌膳酒以降酢于阼階下北面坐奠爵再拜稽首公荅再拜更爵者不敢襲至尊也古文更爲受主人坐祭遂卒爵再拜稽首公荅再拜主人奠爵于篚主人盥洗升媵觚于賔酌散西階上坐奠爵拜賔賔降筵北面荅拜媵送也讀或爲揚揚舉也酌散者酌方壺酒也於膳爲散今文媵皆作騰主人坐祭遂飮賔辭卒爵拜賔荅拜辭者辭其代君行酒不立飮也此降於正主酬也主人降洗賔降主人辭降賔辭洗卒洗揖升不拜洗不拜洗酬而禮殺主人酌膳賔西階上拜拜者拜其酌巳受爵于筵前反位主人拜送爵賔升席坐祭酒遂奠于薦東遂者因坐而奠不北面也奠之者酬不舉也主人降復位賔降筵西東南面立賔不立干序内位彌尊也位彌尊者其禮彌卑記所謂一張一弛者是之􅀋與小臣自阼階下請媵爵者公命長命長使選卿大夫之中長幼可使者小臣作下大夫二人媵爵作使也卿爲上大夫不使之者爲其尊媵爵者阼階下皆北面再拜稽首公荅再拜再拜稽首拜君命也媵爵者立于洗南西面北上序進盥洗角觶升自西階序進酌散交于楹北降阼階下皆奠觶再拜稽首執觶興公荅再拜序次第也猶代也楹北西楹之北也交而相待於西階上旣酌右還而反往來以右爲上媵爵者皆坐祭遂卒觶興坐奠觶再拜稽首執觶興公荅再拜媵爵者執觶待于洗南待君命也小臣請致者請使一人與二人與優君也若君命皆致則序進奠觶于篚阼階下皆再拜稽首公荅再拜媵爵者洗象觶升實之序進坐奠于薦南北上降阼階下皆再拜稽首送觶公荅再拜序進往來由尊北交于東楹之北奠于薦南不敢必君舉也大射禮曰媵爵者皆退反位公坐取大夫所媵觶興以酬賔賔降西階下再拜稽首公命小臣辭賔升成拜興以酬賔就其階而酬之也升成拜復再拜稽首也先時君辭之於禮􅀂未成然公坐奠觶荅再拜執觶興立卒觶賔下拜小臣辭賔升再拜稽首不言成拜者爲拜故下實未拜也下不輒拜禮殺也此賔拜于君之左不言之者不敢敵偶於君公坐奠觶荅再拜執觶興賔進受虚爵降奠于篚易觶洗君尊不酌故也凡爵不相襲者也於尊者言更自敵以下言易更作新易有故之辭進受虚爵尊君也不言公酬賔於西階上及公反位者亦尊君空其文也公有命則不易不洗反升酌膳觶下拜小臣辭賔升再拜稽首下拜下亦未拜凡下未拜有二或禮殺或君親辭君親辭則聞命卽升升乃拜是亦不言成拜公荅再拜拜於阼階上也於是賔請旅侍臣賔以旅酬於西階上旅序也以次序勸􅀸大夫飮酒射人作大夫長升受旅言作大夫則卿存矣長者尊先而卑後賔大夫之右坐奠觶拜執觶興大夫荅拜賔在右者相飮之位賔坐祭立飮卒觶不拜酬而禮殺若膳觶也則降更觶洗升實散大夫拜受賔拜送言更觶􅀸尊也大夫辯受酬如受賔酬之禮不祭卒受者以虚觶降奠于篚卒猶後也大射禮曰奠于篚復位今文辯皆作徧主人洗升實散獻卿于西階上酬而後獻卿别尊卑也飮酒成於酬也司宫兼卷重席設于賔左東上言兼卷則毎卿異席也重席重蒲筵緇布純也卿坐東上統於君也席自房來卿升拜受觚主人拜送觚卿辭重席司宫徹之徹猶去也重席雖非加猶爲其重累去之辟君也乃薦脯醢卿升席坐左執爵右祭脯醢遂祭酒不啐酒降席西階上北面坐卒爵興坐奠爵拜執爵興主人荅拜受爵卿降復位不酢辟君也卿無俎者燕主於羞辯獻卿主人以虚爵降奠于篚今文無奠于篚射人乃升卿卿皆升就席若有諸公則先卿獻之如獻卿之禮諸公者謂大國之􅀌也􅀌一人言諸者容牧有三監席于阼階西北面東上無加席席􅀌北面爲其大尊屈之也亦因阼階西位近君近君則屈親寵苟敬私昵之坐小臣又請媵爵者二大夫媵爵如初又復請致者􅀂命長致則媵爵者奠觶于篚一人待于洗南長致致者阼階下再拜稽首公荅再拜命長致者公或時未能舉自􅄖暇也古文云阼階下北面再拜洗象觶升實之坐奠于薦南降與立于洗南者二人皆再拜稽首送觶公荅再拜奠于薦南者於公所用酬賔觶之處二人俱拜以其共勸君公又行一爵􅀂賔􅀂長唯公所酬一爵先媵者之下觶也若賔􅀂長則賔禮殺矣長公卿之尊者也賔則以酬長長則以酬賔以旅于西階上如初大夫卒受者以虚觶降奠于篚主人洗升獻大夫于西階上大夫升拜受觚主人拜送􅒀大夫坐祭立卒爵不拜旣爵主人受爵大夫降復位旣盡也不拜之者禮又殺胥薦主人于洗北西面脯醢無脀胥膳宰之吏也主人大夫之下先大夫薦之尊之也不於上者上無其位也脀俎實辯獻大夫遂薦之繼賔以西東上徧獻之乃薦略賤也亦獻而后布席也卒射人乃升大夫大夫皆升就席席工于西階上少東樂正先升北面立于其西工瞽朦歌諷誦詩者也凢執技藝者稱工少牢饋食禮曰皇尸命工祝樂記師乙曰乙賤工也樂正于天子樂師也凢樂掌其序事樂成則告備小臣納工工四人二瑟小臣左何瑟面鼔執越内弦右手相入升自西階北面東上坐小臣坐授瑟乃降工四人者燕禮輕從大夫制也面鼔者燕尚樂可鼔者在前也越瑟下孔也内弦弦爲主也相扶工也後二人徒相天子大僕二人也小臣四人祭僕六人御僕十二人皆同官工歌鹿鳴四牡皇皇者華三者皆小雅篇也鹿鳴君與臣下及四方之賔宴講道修政之樂歌也此采其巳有旨酒以召嘉賔嘉賔旣來示我以善道又樂嘉賔有孔昭之明德可則傚也四牡君勞使臣之來樂歌也此采其勤苦王事念將父母懷歸傷悲忠孝之至以勞賔也皇皇者華君遣使臣之樂歌也此采其更自勞苦自以爲不及欲諮謀於賢知而以自光明也卒歌主人洗升獻工工不興左瑟一人拜受爵主人西階上拜送爵工歌乃獻之賤者先就事也左瑟便其右一人工之長者也工拜於席薦脯醢輒薦之變於大夫也使人相祭使扶工者相其祭薦祭酒卒爵不拜賤不備禮主人受爵將復獻衆工也衆工不拜受爵坐祭遂卒爵辯有脯醢不祭主人受爵降奠于篚遂猶因也古文曰卒爵不拜公又舉奠觶唯公所賜以旅于西階上如初言賜者君又彌尊賔長彌卑卒旅畢也笙入立于縣中奏南陔白華華黍以笙播此三篇之詩縣中縣中央也鄕飮酒禮曰磬南北面奏南陔白華華􅁰皆小雅篇也今亡其義未聞昔周之興也周公制禮作樂采時世之詩以爲樂歌所以通情相風切也其有此篇明矣後世衰微幽厲尤甚禮樂之書稍稍廢棄孔子曰吾自衛反魯然後樂正雅頌各得其所謂當時在者而復重雜亂者也惡能存其亡者乎且正考父校商之名頌十二篇于周大師歸以祀其先王至孔子二百年之間五篇而巳此其信也主人洗升獻笙于西階上一人拜盡階不升堂受爵降主人拜送爵階前坐祭立卒爵不拜旣爵升授主人一人笙之長者也鄕射禮曰笙一人拜于下衆笙不拜受爵降坐祭立卒爵辯有脯醢不祭乃間歌魚麗笙由庚歌南有嘉魚笙崇丘歌南山有臺笙由儀間代也謂一歌則一吹也六者皆小雅篇也魚麗言大平年豐物多也此采其物多酒旨所以優賔也南有嘉魚言大平君子有酒樂與賢者共之也此采其能以禮下賢者賢者纍蔓而歸之與之宴樂也南山有臺言大平之治以賢者爲本也此采其愛友賢者爲􅀖家之基民之父母旣欲其身之壽考又欲其名德之長也由庚崇丘由儀今亡其義未聞遂歌鄕樂周南􅀜雎葛覃卷耳召南鵲巢采蘩采蘋周南召南國風篇也王后國君夫人房中之樂歌也􅀜雎言后妃之德􅁑覃言后妃之職卷耳言后妃之志鵲巢言國君夫人之德采蘩言國君夫人不失職也采蘋言卿大夫之妻能修其法度也昔大王王季居于岐山之陽躬行召南之敎以興王業及文王而行周南之敎以受命大雅云刑于寡妻至于兄弟以御于家􅀖謂此也其始一國爾文王作邑于豐以故地爲􅀸士之采地乃分爲二國周周公所食也召召公所食也於時文王三分天下有其二德化􅀍于南土是以其詩有仁賢之風者屬之召南焉有聖人之風者屬之周南焉夫婦之道者生民之本王政之端此六篇者其敎之原也故國君與其臣下及四方之賔燕用之合樂也鄕樂者風也小雅爲諸侯之樂大雅頌爲天子之樂鄕飮酒升歌小雅禮盛者可以進取燕合鄕樂者禮輕者可以逮下也春秋傳曰肆夏䌓遏渠天子所以享元侯也文王大明緜兩君相見之樂也然則諸侯相與燕升歌大雅合小稚也天子與次國小國之君燕亦如之與大國之君燕升歌頌合大雅其笙間之篇未聞大師告于樂正曰正歌備大師上工也掌合隂陽之聲教六詩以六律爲之音者也子貢問師乙曰吾聞聲歌各有宜也如賜者宜何歌也是明其掌而知之也正歌者升歌及笙各三終間歌三終合樂三終爲一備備亦成也樂正由楹内東楹之東告于公乃降復位言由楹内者以其立於堂廉也復位位在東縣之北射人自阼階下請立司正公許射人遂爲司正君許其請因命用爲司正君三舉爵樂備作矣將留賔飮酒更立司正以監之察儀法也射人俱相禮其事同司正洗角觶南面坐奠于中庭升東楹之東受命西階上北面命卿大夫君曰以我安卿大夫皆對曰諾敢不安洗奠角觶于中庭明其事以自表威儀多也君意殷勤欲留賔飮酒命卿大夫以我故安或亦其實不主意於賔司正降自西階南面坐取觶升酌散降南面坐乃安凡燕坐必􅀃屨屨賤不在堂也禮者尚敬敬多則不親燕安坐相親之心羞庶羞謂􅍧肝膋狗胾醢也骨體所以致敬也庶羞所以盡愛也敬之愛之厚賢之道大夫祭薦夔乃祭薦不敢於盛成禮也司正升受命皆命君曰無不醉賔及卿大夫皆興對曰諾敢不醉皆反坐皆命者命賔命卿大夫也起對必降席司正退立西序端主人洗升獻士于西階上士長升拜受觶主人拜送觶獻士用觶士賤也今文觶作觚士坐祭立飲不拜旣爵其他不拜坐祭立飮他謂衆士也亦升受爵不拜乃薦司正與射人一人司士一人執幂二人立于觶南東上天子射人司士皆下大夫二人諸侯則上士其人數亦如之司正爲上辯獻士士旣獻者立于東方西面北上乃薦士毎巳獻而卽位于東方蓋尊之畢獻薦于其位祝史小臣師亦就其位而薦之次士獻之巳不變位位自在東方主人就旅食之尊而獻之旅食不拜受爵坐祭立飲北面酌南鄕獻之於尊南不洗者以其賤略之也亦畢獻乃薦之主人執虚爵奠于篚復位􅀂射則大射正爲司射如鄕射之禮大射正射人之長者也如鄕射之禮者燕爲樂卿大夫宜從其禮也如者如其告􅃓矢旣具至退巾與筭也納射噐而張侯其告請先于君乃以命賔及卿大夫其爲司正者亦爲司馬君與賔爲耦鄕射記曰自君射至龍旜亦其異者也薦旅食乃射者是燕射主於飮酒賔降洗升媵觚于公酌散下拜公降一等小臣辭賔升再拜稽首公荅再拜此當言媵觶酬之禮皆用觶言觚者字之誤也古者觶字或作角旁氏由此誤爾賔坐祭卒爵再拜稽首公荅再拜賔降洗象觶升酌膳坐奠于薦南降拜小臣辭賔升成拜公荅再拜賔反位反位反席也今文曰洗象觚公坐取賔所媵觶興唯公所賜至此又言興者明公崇禮不倦也今文觶又爲觚受者如初受酬之禮降更爵洗升酌膳下拜小臣辭升成拜公荅拜乃就席坐行之坐行之若今坐相勸酉有執爵者士有盥升主酌授之者唯受于公者拜公所賜者也其餘則否司正命執爵者爵辯卒受者興以酬士欲令惠均大夫卒受者以爵興西階上酬士士升大夫奠爵拜士荅拜興酬士者士立堂下無坐位大夫立卒爵不拜實之士拜受大夫拜送士旅于西階上辯祝史小臣旅食皆及焉士旅酌旅序也士以次序自酌相酬無執爵者卒主人洗升自西階獻庶子于阼階上如獻士之禮辯降洗遂獻左右正與内小臣皆於阼階上如獻庶子之禮庶子掌正六牲之體及舞位使國子修德學道世子之官也而與膳宰樂正聮事樂正亦學國子以舞左右正謂樂正僕人正也小樂正立于西縣之北僕人正僕人師僕人士立于其北北上大樂正立于東縣之北􅀂射則僕人正僕人士陪于工後内小臣奄人掌君隂事隂令后夫人之官也皆獻于阼階上别於外内臣也獻正下及内小臣則磬人鐘人鏄人鼔人僕人之屬盡獻可知也凢獻皆薦也無筭爵筭數也爵行無次無數唯意所勸醉而止士也有執膳爵者有執散爵者執膳爵者酌以進公公不拜受執散爵者酌以之公命所賜所賜者興受爵降席下奠爵再拜稽首公荅拜席下席西也古文曰公荅再拜受賜爵者以爵就席坐公卒爵然後飲不敢先虚爵明此勸惠從尊者來也執膳爵者受公爵酌反奠之宴歡在於飮酒成其意受賜爵者興授執散爵執散爵者乃酌行之予其所勸者唯受爵於公者拜卒受爵者興以酬士于西階上士升大夫不拜乃飲實爵乃猶而也士不拜受爵大夫就席士旅酌亦如之公有命徹幂則卿大夫皆降西階下北面東上再拜稽首公命小臣辭公荅再拜大夫皆辟命微幂者公意殷勤必盡酒也小臣辭不升成拜明雖醉正臣禮也不言賔賔彌臣也君荅拜於上示不虚受也遂升反坐士終旅於上如初卿大夫降而爵止於其反席卒之無筭樂升歌間合無數也取歡而巳其樂章亦然宵則庶子執燭於阼階上司宫執燭於西階上甸人執大燭於庭􅕡人爲大燭於門外宵夜也燭燋也甸人掌共薪蒸者庭大燭爲位廣也􅕡人門人也爲作也作大燭以俟賔客出賔醉北面坐取其薦脯以降取脯重得君賜奏陔陔陔夏樂章也賔出奏陔夏以爲行節也凢夏以鐘鼓奏之賔所執脯以賜鍾人於門内􅋼遂出必賜鍾人鍾人掌以鍾鼔奏九夏今奏陔以節巳用賜脯以報之明雖醉不忘禮古文賜作錫卿大夫皆出隨賔出也公不送賔禮訖是臣也公與客燕謂四方之使者敢不從許之也於是出見主國使者辭以見許爲得命今文無使某致命曰寡君使某有不腆之酒以請吾子之與寡君須􅁷焉親相見致君命辭也君貺寡君多矣又辱賜于使臣臣敢拜賜命貺賜也猶愛也敢拜賜命從使者拜君之賜命猶謙不必辭也記燕朝服於寢朝服者諸侯與其羣臣日視朝之服也謂冠玄端緇帶素韠白屨也燕於路寢相親昵也今辟雍十月行此燕禮玄冠而衣皮弁服與禮異也其牲狗也狗取擇人也明非其人不與爲禮也亨于門外東方亨于門外臣所掌也􅀂與四方之賔燕則公迎之于大門内揖讓升四方之賔謂來聘者也自戒至於拜至皆如公食亦告饌具而後公卽席小臣請執幂請羞者乃迎賔也賔爲茍敬席于阼階之西北面有脀不嚌肺不啐酒其介爲賔茍且也假也主國君鄕時親進醴于賔今燕又宜獻焉人臣不敢褻煩尊者至此升堂而辭讓欲以臣禮燕爲恭敬也於是席之如獻諸公之位言茍敬者賔實主國所宜敬也脀折俎也不嚌啐似􅀂尊者然也介門西北面西上公降迎上介以爲賔揖讓升如􅀄禮主人獻賔獻公旣獻茍敬乃媵觚羣臣卽位如燕也無膳尊無膳爵降尊以就卑也與卿燕則大夫爲賔與大夫燕亦大夫爲賔不以所與燕者爲賔者燕爲序歡心賔主敬也公父文伯飲南宫敬叔酒以路堵父爲客此之謂也君􅁪以大夫爲賔者大夫卑雖尊之猶逺于君令文無則下無燕羞膳者與執幂者皆士也尊君也膳宰卑於士羞卿者小膳宰也膳宰之佐也若以樂納賔則賔及庭奏肆夏賔拜酒主人荅拜而樂闋公拜受爵而奏肆夏公卒爵主人升受爵以下而樂闋肆夏樂章也今亡以鐘鏄播之鼔磬應之所謂金奏也記曰入門而縣興示易以敬也卿大夫有王事之勞則奏此樂焉升歌鹿鳴下管新宮笙入三成新宫小雅逸篇也管之入三成謂三終也遂合鄕樂郷樂周南召南六篇言遂者不間也􅀂舞則勺勺頌篇告成大武之樂歌也其詩曰於鑠王師遵養時晦又曰實維爾公允師旣合鄕樂萬舞而奏之所以美王侯勸有功也唯公與賔有俎主於燕其餘可以無俎獻公曰臣敢奏爵以聽命授公釋此辭不敢必受之凡公所辭皆栗階栗蹙也謂越等急趨君命也凡栗階不過二等其始升猶聚足連歩越二等左右足各一發而升堂凡公所酬旣拜請旅侍臣旣拜謂自酌升拜時也擯者阼階下告于公還西階下告公許旅行也請行酒于羣臣必請者不專惠也凡薦與羞者小膳宰也謂於卿大夫以下也上特言羞卿者小膳宰者欲絶於賔羞賔者亦士有内羞謂羞豆之實酏食糝食羞籩之實糗餌粉餈君與射則爲下射􅃝朱􅃭樂作而后就物君尊小臣以巾授矢稍屬君尊不搢矢不以樂志辟不敏也旣發則小臣受弓以授弓人侯復發也不使大射正燕射輕上射退于物一笴旣發則荅君而俟荅對􅀂飮君燕則夾爵謂君在不勝之黨賔飮之如燕媵觚則又夾爵君在大夫射則肉袒不纁􅃭厭於君􅀂與四方之賔燕媵爵曰臣受賜矣臣請賛執爵者受賜謂公鄕者酬之至燕主人事賔之禮殺賔降洗升媵觶于公荅恩惠也相者對曰吾子無自辱焉辭之也對荅也亦告公以公命荅之也有房中之樂弦歌周南召南之詩而不用鍾磬之節也謂之房中者后夫人之所諷誦以事其君子儀禮卷第六經三千二百二十三字注四千六百二十字
