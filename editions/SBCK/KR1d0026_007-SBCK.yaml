body:
  text: 儀禮卷第七大射儀第七儀禮鄭氏注大射之儀君有命戒射將有祭祀之事當射宰告於君君乃命之言君有命政教冝由尊者宰戒百官有事於射者宰於天子冢宰治官卿也作大事則掌以君命戒於百官射人戒諸公卿大夫射司士戒士射與賛者射人掌以射法治射儀司士掌國中之士治凡其戒命皆司馬之屬也殊戒公卿大夫與士辨貴賤也賛佐也謂士佐執事不射者前射三日宰夫戒宰及司馬射人宿視滌宰夫􅃁宰之屬掌百官之徴令者司馬於天子政官之卿凡大射則合其六耦滌謂漑噐埽除射宫司馬命量人量侯道與所設乏以貍歩大侯九十參七十干五十設乏各去其侯西十北十量人司馬之屬掌量道巷塗數者侯謂所射布也尊者射之以威不寧侯卑者射之以求爲侯量侯道謂去堂逺近也容謂之乏所以爲獲者之禦矢貍之伺物每舉足者正視逺近爲發必中也是以量侯道取象焉郷射記曰侯道五十弓考工記曰弓之下制六尺則此貍歩六尺明矣大侯熊侯謂之大者與天子熊侯同參讀爲糝糝雜也雜侯者豹鵠而麋飾下天子大夫也干讀爲豻豻侯者豻鵠豻飾也大夫將祭於巳射麋侯士無臣祭不射遂命量人巾車張三侯大侯之崇見鵠於參參見鵠於干千不及地武不繫左下綱設乏西十北十凡乏用革巾車於天子宗伯之屬掌裝衣車者亦使張侯侯巾􅀋崇高也高必見鵠鵠所射之主射義曰爲人君者以爲君鵠爲人臣者以爲臣鵠爲人父者以爲父鵠爲人子者以爲子鵠言射中此乃能任巳位也鵠之言較較直也射者所以直巳志或曰鵠鳥名射之難中中之爲俊是以所射於侯取名也淮南子曰鳱鵠知來然則所云正者正也亦鳥名齊魯之間名題肩爲正正鵠皆鳥之捷􅃛者考工記曰梓人爲侯廣與崇方參分其廣而鵠居一焉則大侯之鵠方六尺糝侯之鵠方四尺六寸大半寸豻侯之鵠方三尺三寸少半寸及至也武迹也中人之足長尺二寸以豻侯計之糝侯去地一丈五寸少半寸也大侯去地二丈二尺五寸少半寸凡侯北靣西方謂之左前射三日張侯設乏欲使有事者豫志焉樂人宿縣于阼階東笙磬西面其南笙鍾其南鑮皆南陳笙猶生也東爲陽中萬物以生春秋傳曰大蔟所以金奏賛陽出滯沽洗所以脩絜百物考神納賔是以東方鍾磬謂之笙皆編而縣之周禮曰凡縣鍾磬半爲堵全爲肆有鍾有磬爲全鑮如鍾而大奏樂以鼓鑮爲節建鼔在阼階西南鼓應鼙在其東南鼓建猶樹也以木貫而載之樹之跗也南鼓謂所伐靣也應􅎏應朔鼙也先擊朔鼙應之鼙小鼓也在東便其先擊小後擊大也鼔不在東縣南爲君也西階之西頌磬東面其南鍾其南鑮皆南陳一建鼓在其南東鼓朔鼙在其北言成功日頌西爲隂中萬物之所成春秋傳曰夷則所以詠歌九則平民無忒無射所以宣布哲人之令德示民􅁤義是以西方鍾磬謂之頌朔始也奏樂先擊西鼙樂爲賔所由來也鍾不言頌鼙不言東鼓義同省文也古文頌爲庸一建鼓在西階之東南面言面者國君於其群臣備三面爾無鍾磬有鼔而巳其爲諸侯則軒縣簜在建鼓之閒簜竹也謂笙簫之屬􅀝於堂鼗􅀝于頌磬西紘鼗如鼓而小有柄賔至摇之以奏樂也紘編磬繩也設鼗於磬西􅀝于紘也王制曰天子賜諸侯樂則以柷將之賜伯子男樂則以鼗將之厥明司宫尊于東楹之西兩方壷膳尊兩甒在南有豐幂用錫若絺綴諸箭蓋幂加勺又反之皆玄尊酒在北膳尊君尊也後陳之尊之也豐以承尊也􅀃者以爲若井鹿盧其爲字從豆􅞱聲近似豆大而卑矣幂覆尊巾也錫細布也絺細葛也箭篠也爲幂蓋卷辟綴於篠橫之也又反之爲覆勺也皆玄尊二者皆有玄酒之尊重夲也酒在北尊綂於君南爲上也唯君面尊言專惠也今文錫或作緆絺或作綌古文箭作晉尊士旅食于西鑮之南北面兩圜壷旅衆也士衆食未得正禄謂庻人在官者圜壷變於方也賤無玄酒又尊于大侯之乏東北兩壷獻酒爲􅀠僕人巾車糝侯豻侯之獲者獻讀爲沙沙酒濁特泲之必摩沙者也兩壷皆沙酒郊特牲曰汁獻涗于醆酒服不之尊俟時而陳於南統於侯皆東靣設洗于阼階東南罍水在東篚在洗西南陳設膳篚在其北西面或言南陳或言西面異其文也又設洗于獲者之尊西北水在洗北篚在南東陳亦統於侯也無爵因服不也有篚爲奠虚爵也服不之洗亦俟時而陳於其南小臣設公席于阼階上西郷司宫設賔席于戶西南面有加席卿席賔東東上小卿賔西東上大夫繼而東上􅀂有東面者則北上席工于西階之東東上諸公阼階西北面東上唯賔及公席布之也其餘樹之於位後耳小卿命於其君者也席於賔西射禮辨貴賤也諸公大國有􅀌卿一人與君論道亦不典職如公矣官饌百官各饌其所當共之物羮定亨肉孰也射義曰諸侯之射也必先行燕禮燕禮牲用狗射人告具于公公升即位于席西郷小臣師納諸公卿大夫諸公卿大夫皆入門右北面東上士西方東面北上大史在干侯之東北北面東上士旅食者在士南北面東上小臣師從者在東堂下南面西上大史在于侯東北士旅食者在士南爲有侯入庭深也小臣師正之佐也正相君出入君之大命公降立于阼階之東南南鄕小臣師詔揖諸公卿大夫諸公卿大夫西面北上揖大夫大夫皆少進詔告也變爾言揖亦以其入庭深也上言大夫誤􅄛耳大射正擯大射正射人之長擯者請賔公曰命某爲賔某大夫名擯者命賔賔少進禮辭命賔者東面南顧辭辭以不敏反命以賔之辭告於君又命之賔再拜稽首受命又復擯者反命賔出立于門外北面公揖卿大夫升就席小臣自阼階下北面請執幂者與羞膳者請士可使執君兩甒之幂及羞脯醢庻羞於君者方圜壷獻無幂乃命執幂者執幂者升自西階立于尊南北面東上命者於西階前以公命命之東上執玄尊之幂爲上羞膳者從而東由堂東升自北階立于房中西面南上不言命者不升堂略之膳宰請羞于諸公卿者膳宰請者異於君也擯者納賔賔及庭公降一等揖賔賔辟及至也辟逡遁不敢當盛公升即席以賔將與主人爲禮不參之奏肆夏肆夏樂章名今亡吕叔玉云肆夏時邁也時邁者大平廵守祭山川之樂歌其詩曰明昭有周式序在位又曰我求懿德肆于時夏奏此以延賔其著宣王德勸賢與周禮曰賔出入奏肆夏賔升自西階主人從之賔右北面至再拜賔荅再拜主人宰夫也又掌賔客之獻飲食君於臣雖爲賔不親獻以其莫敢亢禮主人降洗洗南西北面賔將從降郷之不於洗北辟正主賔降階西東面主人辭降賔對對荅主人北面盥坐取觚洗賔少進辭洗主人坐奠觚于篚興對賔反位賔少進者所辭異宜違其位也獻不用爵辟正主主人卒洗賔揖升賔毎先升尊也主人升賔拜洗主人賔右奠觚荅拜降盥賔降主人辭降賔對卒盥賔揖升主人升坐取觚取觚將就瓦甒酌膳執幂者舉幂主人酌膳執幂者蓋幂酌者加勺又反之反之覆勺筵前獻賔賔西階上拜受爵于筵前反位主人賔右拜送爵賔旣拜於筵前受爵退復位宰胥薦脯􅊽宰胥宰官之吏也不使膳宰薦不主於飲酒變於燕賔升筵庶子設折俎庻子司馬之屬掌正六牲之體者也鄕射記曰賔俎脊脅肩肺不使膳宰設俎爲射變於燕賔坐左執觚右祭脯醢奠爵于薦右興取肺坐絶祭嚌之興加于俎坐挩手執爵遂祭酒興席末坐啐酒降席坐奠爵拜告旨執爵興主人荅拜降席席西也旨美也樂闋闋止也樂止者尊賔之禮盛於上也賔西階上北面坐卒爵興坐奠爵拜執爵興主人荅拜賔以虚爵降旣卒爵將酢也主人降賔洗南西北面坐奠觚少進辭降主人西階西東面少進對賔坐取觚奠于篚下盥洗篚下篚南主人辭洗賔坐奠觚于篚興對卒洗及階揖升主人升拜洗如賔禮賔降盥主人降賔辭降卒盥揖升酌膳執幂如初以酢主人于西階上主人北面拜受爵賔主人之左拜送爵賔南面授爵乃於左拜凡授爵郷所受者主人坐祭不啐酒辟正主也未薦者臣也不拜酒主人之義燕禮曰不拜酒不告旨遂卒爵興坐奠爵拜執爵興賔荅拜主人不崇酒以虚爵降奠于篚不崇酒辟正主也崇充也謂謝酒惡相充實賔降立于西階西東面旣受獻矣不敢安盛擯者以命升賔賔升立于西序東面命公命也東西牆謂之序主人盥洗象觚升酌膳東北面獻于公象觚觚有象骨飾者也取象觚東面不言實之變於燕公拜受爵乃奏肆夏言乃者其飾異於賔主人降自西階阼階下北面拜送爵宰胥薦脯醢由左房庶子設折俎升自西階自由也左房東房也人君左右房郷射記曰主人俎脊脅臂肺也公祭如賔禮庶子賛授肺不拜酒立卒爵坐奠爵拜執爵興凡異者君尊變於賔主人荅拜樂闋升受爵降奠于篚更爵洗升酌散以降酢于阼階下北面坐奠爵再拜稽首公荅拜更易也易爵不敢襲至尊古文更爲受主人坐祭遂卒爵興坐奠爵再拜稽首公荅拜主人奠爵于篚主人盥洗升媵觚于賔酌散西階上坐奠爵拜賔西階上北面荅拜媵送也散方壷之酒也古文媵皆作騰主人坐祭遂飮賔辭卒爵興坐奠爵拜執爵興賔荅拜辭者辭其代君行酒不立飲也比於正主酬也主人降洗賔降主人辭降賔辭洗卒洗賔揖升不拜洗不拜洗酬而禮殺也主人酌膳賔西階上拜受爵于筵前反位主人拜送爵賔升席坐祭酒遂奠于薦東遂者因坐而奠之不北面也奠之者酬不舉也主人降復位賔降筵西東南面立賔不立於序内位彌尊小臣自阼階下請媵爵者公命長命之使選於長幼之中也卿則尊士則卑小臣作下大夫二人媵爵作使媵爵者阼階下皆北面再拜稽首公荅拜再拜稽首拜君命媵爵者立于洗南西面北上序進盥洗角觶升自西階序進酌散交于楹北降適阼階下皆奠觶再拜稽首執觶興公荅拜序次第也猶代也先者旣酌右還而反與後酌者交於西楹北相左俟於西階上乃降徃來以右爲上古文曰降造阼階下媵爵者皆坐祭遂卒觶興坐奠觶再拜稽首執觶興公荅再拜媵爵者執觶待于洗南待待君命小臣請致者請君使一人與二人與不必君命若命皆致則序進奠觶于篚阼階下皆北面再拜稽首公荅拜媵爵者洗象觶升實之序進坐奠于薦南北上降適阼階下皆再拜稽首送觶公荅拜旣酌而代進徃來由尊北交於東楹北亦相左奠於薦南不敢必君舉媵爵者皆退反位反門右北面位公坐取大夫所媵觶興以酬賔賔降西階下再拜稽首小臣正辭賔升成拜公起酬賔於西階降尊以就卑也正長也小臣長辭變於燕升成拜復再拜稽首先時君辭之於禮􅀂未成然公坐奠觶荅拜執觶興公卒觶賔下拜小臣正辭賔升再拜稽首不言成拜者爲拜故下實未拜也下不輒拜禮殺也下亦降也發端言降拜因上事言下拜公坐奠觶荅拜執觶興賔進受虚觶降奠于篚易觶興洗賔進以臣道就君受虚爵君不親酌凡爵不相襲者於尊者言更自敵以下言易更作新易有故之辭也不言公酬賔於西階上及公反位者尊君空其文也公有命則不易不洗反升酌膳下拜小臣正辭賔升再拜稽首公荅拜不易君義也不洗臣禮也賔告于擯者請旅諸臣擯者告于公公許旅序也賔欲以次序勸諸臣酒賔以旅大夫于西階上擯者作大夫長升受旅作使也使之以長幼之次先孤卿後大夫賔大夫之右坐奠觶拜執觶興大夫荅拜賔在右相飲之位賔坐祭立卒觶不拜酬而禮殺􅀂膳觶也則降更觶洗升實散大夫拜受賔拜送遂就席言更觶尊卿尊卿則賔禮殺大夫辯受酬如受賔酬之禮不祭酒卒受者以虚觶降奠于篚復位卒猶巳也今文辯作徧主人洗觚升實散獻卿于西階上酬賔而後獻卿飲酒禮成於酬司宮兼卷重席設于賔左東上言兼卷則毎卿異席重席蒲筵緇布純席卿言東上統於君席自房來卿升拜受觚主人拜送觚卿辭重席司宮徹之徹猶去也重席雖非加猶爲其重累辭之辟君乃薦脯醢卿升席庶子設折俎卿折俎未聞蓋用脊脅臑折肺卿有俎者射禮尊卿坐左執爵右祭脯醢奠爵于薦右興取肺坐絶祭不嚌肺興加于俎坐挩手取爵遂祭酒執爵興降席西階上北面坐卒爵興坐奠爵拜執爵興陳酒肴君之惠也不嚌肺亦自貶於君也主人荅拜受爵卿降復位復西面位不酢辟君辯獻卿主人以虚爵降奠于篚擯者升卿卿皆升就席􅀂有諸公則先卿獻之如獻卿之禮席于阼階西北面東上無加席公􅀌也席之北面爲大尊屈之也亦因阼階上近君近君則親寵茍敬私昵之坐小臣又請媵爵者二大夫媵爵如初請致者􅀂命長致則媵爵者奠觶于篚主人洗觚升獻大夫于西階上大夫升拜受觚主人拜送觚大夫坐祭立卒爵不拜旣爵主人受爵大夫降復位旣盡也大夫卒爵不拜賤不備禮胥薦主人于洗北西面脯醢無脀胥宰官之吏主人下大夫也先大夫薦之尊之也不薦于上辟正主脀俎實辯獻大夫遂薦之繼賔以西東上􅀂有東面者則北上卒擯者升大夫大夫皆升就席辯獻乃薦略賤也亦獻後布席也乃席工于西階上少東小臣納工工六人四瑟工謂瞽矇善歌諷誦詩者也六人大師少師各一人上工四人四瑟者禮大樂衆也僕人正徒相大師僕人師相少師僕人士相上工徒空手也僕人正僕人之長師其佐也士其吏也天子視瞭相工諸侯兼官是以僕人掌之大師少師工之長也凡國之瞽矇正焉杜蒯曰曠也大師也於是分别工及相者射禮明貴賤相者皆左何瑟後首内弦挎越右手相謂相上工者後首主於射略於此樂内弦挎越以右手相工由便也越瑟下孔所以發越其聲者也古文後首爲後手後者徒相入謂相大師少師者也上列官之尊卑此言先後之位亦所以明貴賤凡相者以工出入小樂正從之從大師也後升者變於燕也小樂正於天子樂師也升自西階北面東上工六人坐授瑟乃降相者也降立于西縣之北小樂正立于西階東不統於工明工雖衆位猶在此乃歌鹿鳴三終鹿鳴小雅篇也人君與臣下及四方之賔燕講道脩政之樂歌也言巳有旨酒以召嘉賔與之飲者樂嘉賔之來示我以善道又樂嘉賔有孔昭之明德可則傚也歌鹿鳴三終而不歌四牡皇皇者華主於講道略於勞苦與諮事主人洗升實爵獻工工不興左瑟工歌而獻之以事報之也洗爵獻工辟正主也獻不用觚工賤異之也工不興不能備禮左瑟便其右大師無瑟於是言左瑟者節也一人管謂吹簜以播新宫之樂其篇亡其義未聞笙從工而入旣管不獻略下樂也立于東縣之中卒管大師及少師上工皆東坫之東南西面北上坐不言縣北統於堂也於是時大樂正還北面立于其南擯者自阼階下請立司正三爵旣備上下樂作君將留群臣而射宜更立司正以監之察儀法也公許擯者遂爲司正君許其請因命用之不易之者俱相禮其事同也司正適洗洗角觶南面坐奠于中庭奠觶者著其位以顯其事威儀多也升東楹之東受命于公西階上北面命賔諸公卿大夫公曰以我安賔諸公卿大夫皆對曰諾敢不安以我安者君意殷勤欲留之以我故安也司正降自西階南面坐取觶升酌散降南面坐奠觶奠於中庭故處興右還北面少立坐取觶興坐不祭卒觶奠之興再拜稽首左還南面坐取觶洗南面反奠于其所北面立皆所以自昭明於衆也將於觶南北面則右還於觶北南面則左還如是得從觶西徃來也必從觶西徃來者爲君在阼不背之也司射適次􅃝決遂執弓挾乗矢於弓外見鏃於弣右巨指鉤弦司射射人也次若今時更衣處張幃席爲之耦次在洗東南袒左免衣也决猶闓也以象骨爲之著右巨指所以鈎弦而闓之遂射韝也以朱韋爲之著左臂所以遂弦也方持弦矢曰挾乗矢四矢弣弓杷也見鏃焉順其射也右巨指右手大擘以鉤弦弦在旁挾由便也古文挾皆作接自阼階前曰爲政請射爲政謂司馬也司馬政官主射禮遂告曰大夫與大夫士御於大夫因告選三耦於君御猶侍也大夫與大夫爲耦不足則士侍於大夫與爲耦也今文於爲于遂適西階前東面右顧命有司納射器納内也射器皆入君之弓矢適東堂賔之弓矢與中籌豐皆止于西堂下衆弓矢不挾緫衆弓矢楅皆適次而俟中閭中筭噐也籌筭也豐可奠射爵者衆弓矢三耦及卿大夫以下弓矢也司射矢亦止西堂下衆弓矢不挾則納公與賔弓矢者挾之楅承矢噐今文俟作待工人士與梓人升自北階兩楹之間䟽數容弓􅀂丹􅀂墨度尺而午射正莅之工人士梓人皆司空之屬能正方圜者一從一横曰午謂畫物也射正司射之長卒畫自北階下司宫埽所畫物自北階下埽物重射事也工人士梓人司宫位在北堂下大史俟于所設中之西東面以聽政中未設也大史俟焉將有事也郷射禮曰設中南當楅西當西序東面司射西面誓之曰公射大侯大夫射參士射干射者非其侯中之不獲卑者與尊者爲耦不異侯大史許諾誓猶告也古文異作辭遂比三耦比選次之也不言面者大夫在門右北靣士西方東面三耦俟于次北西面北上未知其耦今文俟爲立司射命上射曰某御於子命下射曰子與某子射卒遂命三耦取弓矢于次取弓矢不拾者次中隱蔽處司射入于次搢三挾一个出于次西面揖當階北面揖及階揖升堂揖當物北面揖及物揖由下物少退誘射搢扱也挾一个挾於弦也个猶枚也由下物而少退謙也誘猶教也夫子循循然善誘人射三侯將乗矢始射干又射參大侯再發將行也行四矢象有事於四方詩云四矢反􅀆以御亂􅀆卒射北面揖揖於當物之處不南面者爲不背卿及階揖降如升射之儀遂適堂西改取一个挾之改更也不射而挾矢示有事也遂取扑搢之以立于所設中之西南東面扑所以撻犯教者也於是言立著其位也郷射記曰司射之弓矢與扑􅀝于西階之西司馬師命負侯者執旌以負侯司馬師正之佐也欲令射者見侯與旌深志於侯中也􅀒侯獲者也天子服不氏下士一人徒四人掌以旌居乏待獲析羽爲旌􅀒侯者皆適侯執旌􅀒侯而俟司射適次作上耦射作使也司射反位上耦出次西面揖進上射在左並行當階北面揖及階揖上射先升三等下射從之中等上射在左便射位也中猶間也上射升堂少左下射升上射揖並行並併也併東行皆當其物北面揖及物揖皆左足履物還視侯中合足而俟視侯中各視其侯之中大夫耦則視參中參中十四尺土耦則視干中干中十尺司馬正適次袒決遂執弓右挾之出升自西階適下物立于物間左執弣右執簫南揚弓命去侯司馬正政官之屬簫弓末揚弓者執下末揚猶舉也適下物由上射後東過也命去侯者將射當獲也郷射禮曰西南面立于物間􅀒侯皆許諾以宫趨直西及乏南又諾以商至乏聲止宫爲君商爲臣其聲和相生也郷射禮曰獲者執旌許諾古文聲爲磬授獲者退立于西方獲者興共而俟大侯服不氏􅀒侯徒一人居乏相代而獲參侯于侯徒􅀒侯居乏不相代郷射禮曰獲者執旌許諾聲不絶以至于乏坐東面偃旌興而俟古文獲皆作護非也司馬正出于下射之南還其後降自西階遂適次釋弓說決拾襲反位拾遂也郷射禮曰司馬反位立于司射之南司射進與司馬正交于階前相左由堂下西階之東北面視上射命曰毋射獲母獵獲上射揖司射退反位射獲矢中乏也從旁爲獵乃射上射旣發挾矢而后下射射拾發以將乗矢拾更也將行也獲者坐而獲坐言獲也舉旌以宫偃旌以商再言獲也獲而未釋獲但言獲未釋筭古文釋爲舎卒射右挾之北面揖揖如升射右挾之右手挾弦上射降三等下射少右從之中等並行上射於左與升射者相左交于階前相揖適次釋弓􅀃決拾襲反位上射於左由下射階上少右乃降待之言襲者凡射皆袒三耦卒射亦如之司射去扑􅀝于階西適阼階下北面吿于公曰三耦卒射反搢扑反位司馬正袒決遂執弓右挾之出與司射交于階前相左出出於次也􅃝時亦適次升自西階自右物之後立于物間西南面揖弓命取矢揖推之􅀒侯許諾如初去侯皆執旌以􅀒其侯而俟俟小臣取矢以旌指教之司馬正降自西階北面命設楅此出于下射之南還其後而降之小臣師設楅司馬正東面以弓爲畢畢所以教助執事者郷射記曰乃設楅于中庭南當洗東肆旣設楅司馬正適次釋弓􅀃決拾襲反位小臣坐委矢于楅北括司馬師坐乗之乗四四數之卒􅀂矢不備則司馬正又􅃝執弓升命取矢如初曰取矢不索乃復求矢加于楅卒司馬正進坐左右撫之興反位左右撫分上下射此坐皆北面司射適西階西􅀝扑升自西階東面請射于公􅀝扑者將即君前不敢佩刑噐也升堂者欲諸公卿大夫辯聞也公許遂適西階上命賔御于公諸公卿則以耦告于上大夫則降即位而后告告諸公卿於堂上尊之也司射自西階上北面告于大夫曰請降司射先降搢扑反位大夫從之降適次立于三耦之南西面北上適次由次前而北西面立司射東面于大夫之西比耦大夫與大夫命上射曰某御於子命下射曰子與某子射卒遂比衆耦衆耦士也衆耦立于大夫之南西面北上􅀂有士與大夫爲耦則以大夫之耦爲上爲上居群士之上命大夫之耦曰子與某子射吿於大夫曰某御於子士雖爲上射其辭猶尊大夫命衆耦如命三耦之辭諸公卿皆未降言未降者見其志在射遂命三耦各與其耦拾取矢皆袒決遂執弓右挾之此命入次之事也司射旣命而反位不言之者上射出當作取矢事未訖一耦出西面揖當楅北面揖及楅揖三耦同入次其出也一一上射出西面立司射作之乃揖行也當楅楅正南之東西上射東面下射西面上射揖進坐橫弓卻手自弓下取一个兼諸弣興順羽且左還毋周反面揖橫弓者南踣弓也郤手自弓下取矢者以左手在弓表右手從裏取之便也兼并也并矢於弣當順羽旣又當執弦順羽者手放而下備不整理也左還反其位毋周右還而反東面也君在阼還周則下射將背之古文且爲阻下射進坐橫弓覆手自弓上取一个兼諸弣興順羽且左還毋周反面揖橫弓亦南踣弓也人東西郷以南北爲橫覆手自弓上取矢以左手在弓裏右手從表取之便也旣拾取矢梱之梱齊等之也古文梱作魁兼挾乗矢皆内還南面揖内還者上射左下射右不皆右還亦以君在阼嫌下射故左還而背之也上以陽爲内下以隂爲内因其冝可也適楅南皆左還北面揖搢三挾一个楅南郷當楅之位也揖以耦左還上射於左以猶與也言以者耦之事成於此意相人耦也上射轉居左便其反位也上射少北乃東面退者與進者相左相揖退釋弓矢于次說決拾襲反位二耦拾取矢亦如之後者遂取誘射之矢兼乗矢而取之以授有司于次中皆襲反位有司納射噐因留主授受之司射作射如初一耦揖升如初司馬命去侯負侯許諾如初司馬降釋弓反位司射猶挾一个去扑與司馬交于階前適阼階下北面請釋獲于公猶守故之辭於此言之者司射旣誘射恒執弓挾矢以掌射事備尚未知當教之也今三耦卒射衆足以知之矣猶挾之者君子不必也公許反搢扑遂命釋獲者設中以弓爲畢北面北面立于所設中之南當視之也郷射禮曰設中南當楅西當西序大史釋獲小臣師執中先首坐設之東面退大史實八筭于中橫委其餘于中西興共而俟先猶前也命大史而小臣師設之國君官多也小臣師退反東堂下位郷射禮曰橫委其餘于中西南末司射西面命曰中離維綱揚觸梱復公則釋獲衆則不與離猶過也獵也侯有上下綱其邪制躬舌之角者爲維或曰維當爲絹絹網耳揚觸者謂矢中他物揚而觸侯也梱復謂矢至侯不著而還復復反也公則釋獲優君也衆當中鵠而著古文梱作魁唯公所中中三侯皆獲值中一侯則釋獲釋獲者命小史小史命獲者傳告服不使知此司射所命司射遂進由堂下北面視上射命曰不貫不釋上射揖司射退反位貫猶中也射不中鵠不釋筭古文貫作􅀜釋獲者坐取中之八筭改實八筭興執而俟執所取筭乃射若中則釋獲者每一个釋一筭上射於右下射於左􅀂有餘筭則反委之委餘筭禮貴異又取中之八筭改實八筭于中興執而俟三耦卒射賔降取弓矢于堂西不敢與君並俟告取之以升俟君事畢諸公卿則適次繼三耦以南言繼三耦明在大夫北公將射則司馬師命􅀒侯皆執其旌以􅀒其侯而俟君尊若始焉司馬師反位􅀠僕人埽侯道新之司射去扑適阼階下吿射于公公許適西階東告于賔告當射也今文曰阼階下無適遂搢扑反位小射正一人取公之決拾于東坫上一小射正授弓拂弓皆以俟于東堂授弓當授大射正拂弓去塵公將射則賔降適堂西袒決遂執弓搢三挾一个升自西階先待于物北北一笴東面立不敢與君併笴矢幹東面立郷君也司馬升命去侯如初還右乃降釋弓反位還右還君之右也猶出下射之南還其後也今文曰右還公就物小射正奉決拾以笥大射正執弓皆以從於物笥萑葦噐大射正舎司正親其職小射正坐奠笥于物南遂拂以巾取決興賛設決朱極三極猶放也所以韜指利放弦也以朱韋爲之三者食指將指無名指無極放弦契於此指多則痛小指短不用小臣正賛袒公袒朱􅃭卒袒小臣正退俟于東堂小射正又坐取拾興賛設拾以笥退奠于坫上復位旣袒乃設拾拾當以韝􅃭上大射正執弓以袂順左右隈上再下壹左執弣右執簫以授公公親揉之順放之也隈弓淵也揉宛之觀其安危也今文順爲循古文揉爲紐小臣師以巾内拂矢而授矢于公稍屬内拂恐塵及君也稍屬不搢矢大射正立于公後以矢行吿于公􅀂不中使君當知而改其度下曰留上曰揚左右曰方留不至也揚過去也方出旁也公旣發大射正受弓而俟拾發以將乗矢公下射也而先發不留尊也公卒射小臣師以巾退反位大射正受弓受弓以授有司於東堂小射正以笥受決拾退奠于坫上復位大射正退反司正之位小臣正賛襲公還而后賔降釋弓于堂西反位于階西東面階西東面賔降位公卽席司正以命升賔賔升復筵而后卿大夫繼射諸公卿取􅃓矢于次中袒決遂執弓搢三挾一个出西面揖揖如三耦升射卒射降如三耦適次釋弓說決拾襲反位衆皆繼射釋獲皆如初諸公卿言取弓矢衆言釋獲互言也卒射釋獲者遂以所執餘獲適阼階下北面吿于公曰左右卒射司射不告者釋獲者於是有事冝終之也餘獲餘筭也無餘筭則無所執古文曰餘筭反位坐委餘獲于中西興共而俟司馬袒執弓升命取矢如初􅀒侯許諾以旌􅀒侯如初司馬降釋弓如初小臣委矢于楅如初司馬司馬正於是司馬師亦坐乗矢賔諸公卿大夫之矢皆異束之以茅卒正坐左右撫之進束反位異束大夫矢尊殊之也正司馬正也進前也又言束整結之示親也賔之矢則以授矢人于西堂下是言矢人則納射器之有司各以其器名官職不言君矢小臣以授矢人于東堂下可知司馬釋弓反位而后卿大夫升就席此言其升前小臣委矢於楅司射適階西釋弓去扑襲進由中東立于中南北面視筭釋弓去扑射事巳也釋獲者東面于中西坐先數右獲固東面矣復言之者少南就石獲二筭爲純純猶全也耦隂陽也一純以取實于左手十純則縮而委之縮從也於數者東西爲從古文縮皆作蹙每委異之易校數有餘純則橫諸下又異之也自近爲下一筭爲竒竒則又縮諸純下又從之興自前適左從中前北也更端故起東面坐少北於故坐兼斂筭實于左手一純以委十則異之變於右也其餘如右獲謂所縮所橫者司射復位釋獲者遂進取賢獲執之由阼階下北面告于公賢獲勝黨之筭也執之者齊而取其餘􅀂右勝則曰右賢於左若左勝則曰左賢於右以純數告若有竒者亦曰竒告曰某賢於某􅀂干純若干竒若左右鈞則左右各執一筭以告曰左右鈞還復位坐兼斂筭實八筭于中委其餘于中西興共而俟司射命設豐當飮不勝者射爵司宫士奉豐由西階升北面坐設于西楹西降復位勝者之弟子洗觶升酌散南面坐奠于豐上降反位弟子其少者也不授者射爵猶罰爵略之司射遂􅃝執弓挾一个搢扑東面于三耦之西命三耦及衆射者勝者皆袒決遂執張弓執張弓言能用之也右手挾弦不勝者皆襲說決拾卻左手右加弛弓于其上遂以執弣固襲說決拾矣復言之者起勝者也不勝者執弛弓言不能用之也兩手執弣無所挾也司射先反位居前俟所命入次而來飲三耦及衆射者皆升飮射爵于西階上不勝之黨無不飲小射正作升飮射爵者如作射一耦出揖如升射及階勝者先升升堂少右先升尊賢也少右辟飲者亦因相飲之禮然不勝者進北面坐取豐上之觶興少退立卒觶進坐奠于豐下興揖立卒觶不祭不拜受罰不備禮也右手執觶左手執弓不勝者先降後升先降略之不由次也降而少右復並行與升飮者相左交于階前相揖適次釋弓襲反位僕人師繼酌射爵取觶實之反奠于豐上退俟于序端僕人師酌者君使之代弟子也自此以下辯爲之酌升飮者如初三耦卒飮􅀂賔諸公卿大夫不勝則不降不執弓耦不升此耦謂士也諸公卿或闕士爲之耦者不升其諸公卿大夫相爲耦者不降席重耻尊也僕人師洗升實觶以授賔諸公卿大夫受觶于席以降適西階上北面立飮卒觶授執爵者反就席雖尊亦西階上立飲不可以已尊枉正罰也授爵而不奠豐尊大夫也若飮公則侍射者降洗角觶升酌散降拜侍射賔也飲君則不敢以爲罰從致爵之禮也公降一等小臣正辭賔升再拜稽首公荅再拜賔坐祭卒爵再拜稽首公荅再拜賔降洗象觶升酌膳以致下拜小臣正辭升再拜稽首公荅再拜公卒觶賔進受觶降洗散觶升實散下拜小臣正辭升再拜稽首公荅再拜賔復酌自飲者夾爵也但如致爵則無以異於燕也夾爵亦所以耻公也所謂若飲君燕則夾爵賔坐不祭卒觶降奠于篚階西東面立不祭象射爵擯者以命升賔賔升就席擯者司正也今文席爲筵若諸公卿大夫之耦不勝則亦執弛弓特升飮此耦亦謂士也特猶獨也以尊與卑爲耦而又不勝使之獨飲􅀂無倫匹􅀌賤也衆皆繼飮射爵如三耦射爵辯乃徹豐與觶徹除也司宫尊侯于服不之東北兩獻酒東面南上皆加勺設洗于尊西北篚在南東肆實一散于篚爲大侯獲者設尊也言尊侯者􅀗者之功由侯也不於初設之者不敢必君射也君不射則不獻大侯之獲者散爵名容五升司馬正洗散遂實爵獻服不言服不者著其官尊大侯也服不司馬之屬掌養猛獸而教擾之者洗酌皆西面服不侯西北三歩北面拜受爵近其所爲獻司馬正西面拜送爵反位不俟卒爵略賤也此終言之獻服不之徒乃反位宰夫有司薦庶子設折俎宰夫有司宰夫之吏也郷射記曰獲者之俎折脊脅肺卒錯獲者適右个薦俎從之不言服不言獲者國君大侯服不􅀒侯其徒居之待獲變其文容二人也司馬正皆獻之薦俎巳錯乃適右个明此獻已已歸功於侯也適右个由侯内鄕射記曰東方謂之右个獲者左執爵右祭薦俎二手祭酒祭俎不奠爵不備禮也二手祭酒者獲者南面於俎北當爲侯祭於不也隷僕人巾車於服不之位受之功成於大侯也不言量人者此自後以及先可知卒司馬師受虚爵奠于篚獲者之篚獲者皆執其薦庶子執俎從之設于乏少南少南爲復射妨旌也隷僕人巾車量人自服不而南服不復負侯而俟司射適階西去扑適堂西釋弓說決拾襲適洗洗觚升實之降獻釋獲者于其位少南獻釋獲者與獲者異文武不同也去扑者扑不升堂也少南辟中薦脯醢折俎皆有祭俎與服不同唯祭一爲異釋獲者薦右東面拜受爵司射北面拜送爵釋獲者就其薦坐左執爵右祭脯醢興取肺坐祭遂祭酒祭俎不奠爵亦賤不備禮興司射之西北面立卒爵不拜旣爵司射受虚爵奠于篚釋獲者少西辟薦反位辟薦少西之者爲復射妨司射視筭亦辟俎也司射適堂西袒決遂取弓挾一个適階西搢扑以反位爲將復射司射􅀝扑于階西適阼階下北面請射于公如初不升堂賔諸公卿大夫旣射矣聞之可知反搢扑適次命三耦皆袒決遂執弓序出取矢曏言拾是言序互言耳司射先反位言先先三耦也司射旣命三耦以入次之事即反位三耦入次袒決遂執弓挾矢乃出反次外西面位曏不言司射先反位三耦未有次位無所先也三耦拾取矢如初小射正作取矢如初小射正司射之佐作取矢禮殺代之三耦旣拾取矢諸公卿大夫皆降如初位與耦入於次皆袒決遂執弓皆進當楅進坐說矢束上射東面下射西面拾取矢如三耦皆進當楅進三耦揖之位也凡継射命耦而巳不作射不作取矢從􅀄若士與大夫爲耦士東面大夫西面大夫進坐說矢束退反位說矢束自同於三耦謙也耦揖進坐兼取乗矢興順羽且左還毋周反面揖兼取乗矢不敢與大夫拾大夫進坐亦兼取乗矢如其耦北面搢三挾一个揖進大夫與其耦皆適次釋弓說決拾襲反位諸公卿升就席大夫反位諸公卿乃升就席大夫與已上下位衆射者繼拾取矢皆如三耦遂入于次釋弓矢􅀃決拾襲反位司射猶挾一个以作射如初一耦揖升如初司馬升命去侯􅀒侯許諾司馬降釋弓反位司射與司馬交于階前􅀝扑于階西適阼階下北面請以樂于公公許請奏樂以爲節也始射獲而未釋獲復釋獲復用樂行之君子之於事也始取苟能中課有功終用成法教化之漸也射用應樂爲難孔子曰射者何以聽循聲而發發而不失正鵠者其唯賢者乎司射反搢扑東面命樂正曰命用樂言君有命用樂射也樂正在工南北面樂正曰諾司射遂適堂下北面視上射命曰不鼓不釋不與鼓節相應不釋筭也鼓亦樂之節學記曰鼓無當於五聲五聲不得不和凡射之鼓節投壷其存者也周禮射節天子九諸侯七卿大夫以下五上射揖司射退反位樂正命大師曰奏貍首間􅀂一樂正西面受命左還東面命大師以大射之樂章使奏之也貍首逸詩曾孫也貍之言不來也其詩有射詩侯首不朝者之言因以名篇後世失之謂之曾孫曽孫者其章頭也射義所載詩曰曾孫侯氏是也以爲諸侯射節者采其旣有弧矢之威又言小大莫處御於君所以燕以射則燕則譽有樂以時㑹君事之志也間若一者調其聲之䟽數重節大師不興許諾樂正反位奏貍首以射三耦卒射賔待于物如初公樂作而后就物稍屬不以樂志其他如初儀不以樂志君之射儀遲速從心其發不必應樂辟不敏也志意所儗度也春秋傳曰吾志其目卒射如初賔就席諸公卿大夫衆射者皆繼射釋獲如初卒射降反位釋獲者執餘獲進告左右卒射如初司馬升命取矢􅀒侯許諾司馬降釋弓反位小臣委矢司馬師乗之皆如初司射釋弓視筭如初釋獲者以賢獲與鈞告如初復位司射命設豐實觶如初遂命勝者執張􅃓不勝者執弛􅃓升飮如初卒退豐與觶如初司射猶袒決遂左執弓右執一个兼諸弦面鏃適次命拾取矢如初側持弦矢曰執面猶尚也兼矢於弦尚鏃將止變於射也司射反位三耦及諸公卿大夫衆射者皆袒決遂以拾取矢如初矢不挾兼諸弦面鏃退適次皆授有司弓矢襲反位不挾亦謂執之如司射卿大夫升就席司射適次釋弓說決拾去扑襲反位司馬正命退楅解綱小臣師退楅巾車量人解左下綱司馬師命獲者以旌與薦俎退解猶釋也今文司馬師無司馬司射命釋獲者退中與筭而俟諸所退射器皆俟備君復射釋獲者亦退其薦俎公又舉奠觶唯公所賜􅀂賔􅀂長以旅于西階上如初大夫卒受者以虚觶降奠于篚反位司馬正升自西階東楹之東北面告于公請徹俎公許射事旣畢禮殺人倦冝徹俎燕坐遂適西階上北面告于賔賔北面取俎以出諸公卿取俎如賔禮遂出授從者于門外自其從者大夫降復位門東北面位庻子正徹公俎降自阼階以東降自阼階􅀂親徹也以東去藏賔諸公卿皆人門東面北上諸公卿不入門而右以將燕亦因從賔司正升賔賔諸公卿大夫皆􅀃屨升就席公以賔及卿大夫皆坐乃安曏命以我安臣於君尚猶踧踖至此乃敢安羞庻羞羞進也庻衆也所進衆羞謂􅍧肝膋狗胾醢也或有炮鼈膾鯉雉兎鶉鴽大夫祭薦燕乃祭薦不敢於盛成禮司正升受命皆命公曰衆無不醉賔及諸公卿大夫皆興對曰諾敢不醉皆反位坐皆命者命賔命諸公命卿大夫皆郷其位也興對必降席敬也司正退立西序端主人洗酌獻士于西階上士長升拜受觶主人拜送獻士用觶士賤也今文觶作觚士坐祭立飮不拜旣爵其他不拜坐祭立飮其他謂衆士也升不拜受爵乃薦司正與射人于觶南北面東上司正爲上司正射人士也以齒受獻旣乃薦之也司正大射正也射人小射正略其佐辯獻士士旣獻者立于東方西面北上乃薦士士旣獻易位者以卿大夫在堂臣位尊東也畢獻薦之略賤祝史小臣師亦就其位而薦之亦者亦士也辯獻乃薦也祝史門東北面東上主人就士旅食之尊而獻之旅食不拜受爵坐祭立飮主人旣酌西面士旅食北面受之不洗者於賤略之主人執虚爵奠于篚復位賔降洗升媵觶于公酌散下拜公降一等小臣正辭賔升再拜稽首公荅再拜賔受公賜多矣禮將終冝勸公序厚意也今文觶爲觚公荅拜無再拜賔坐祭卒爵再拜稽首公荅再拜賔降洗象觚升酌膳坐奠于薦南降拜小臣正辭賔升成拜公荅拜賔反位反位反席也此觚當爲觶公坐取賔所媵觚興唯公所賜受者如初受酬之禮降更爵洗升酌膳下再拜稽首小臣正辭升成拜公荅拜乃就席坐行之坐行之􅀂今坐相勸酒有執爵者士有盥升主酌授之唯受于公者拜公所賜者拜其餘則否司正命執爵者爵辯卒受者興以酬士欲令惠均大夫卒受者以爵興西階上酬士士升大夫奠爵拜士荅拜興酬士者立堂下與上坐者異也大夫立卒爵不拜實之士拜受大夫拜送士旅于西階上辯祝史小臣師旅食皆及焉士旅酌旅序也士以次自酌相酬無執爵者􅀂命曰復射則不獻庶子獻庻子則正禮畢後無事司射命射唯欲司射命賔及諸公卿大夫射欲者則射不欲者則止可否之事從人心也卿大夫皆降再拜稽首公荅拜拜君樂與臣下執事無巳不言賔賔從羣臣禮在上壹發中三侯皆獲其功一也而和者益多尚歡樂也矢揚觸或有參中者主人洗升自西階獻庶子于阼階上如獻士之禮辯獻降洗遂獻左右正與内小臣皆於阼階上如獻庶子之禮庶子旣掌正六牲之體又正舞位授舞器與膳宰樂正聯事又掌國子戒令敎治世子之官也左右正謂樂正僕人正也位在中庭之左右小樂正在頌磬之北右也工在西即北面工遷於東則東面大樂正在笙磬之北左也工在西則西面工遷於東則北面僕人正相大師工升堂與其師士降立於小樂正之北北上工遷於東則陪其工後國君無故不釋縣二正君之近官也内小臣奄人掌君隂事隂令后夫人之官也獻三官於阼階别内外臣也同獻更洗以時事不聮也獻正下及内小臣則磬人鍾人鑮人鼓人僕人師僕人士盡獻可知也庶子内小臣位在小臣師之東少退西上無筭爵筭數也爵行無次數唯意所勸醉而止士也有執膳爵者有執散爵者執膳爵者酌以進公公不拜受執散爵者酌以之公命所賜所賜者興受爵降席下奠爵再拜稽首公荅再拜席下席西受賜爵者以爵就席坐公卒爵然後飮酬之禮爵代舉今爵並行嫌不代也並行猶代者明勸惠從尊者來執膳爵者受公爵酌反奠之燕之歡在飲酒成其意也受賜者興授執散爵者執散爵者乃酌行之與其所勸者唯受于公者拜卒爵者興以酬士于西階上士升大夫不拜乃飮實爵乃猶而也士不拜受爵大夫就席士旅酌亦如之公有命徹幂則賔及諸公卿大夫皆降西階下北面東上再拜稽首命徹幂者公意殷勤欲盡酒公命小臣正辭公荅拜大夫皆辟升反位升不成拜於將醉正臣禮士終旅於上如初卿大夫降而爵止於其反席卒之無筭樂升歌間合無次數唯意所樂宵則庶子執燭於阼階上司宫執獨於西階上甸人執大燭於庭閽人爲獨於門外宵夜也燭燋也甸人掌共薪蒸者庭大燭爲其位廣也爲作也作燭俟賔出賔醉北面坐取其薦脯以降取脯重得君之賜奏陔陔夏樂章也其歌頌􅀋也以鍾鼓奏之其篇今亡賔所執脯以賜鍾人于門内􅋼遂出必賜鍾人鍾人以鍾鼔奏陔夏賜之脯明雖醉志禮不忘樂卿大夫皆出從賔出公不送臣也與之安燕交歡嫌元禮也公入驁驁夏亦樂章也以鍾鼓奏之其詩今亡此公出而言入者射宫在郊以將還爲入燕不驁者於路寢無出入也儀禮卷第七經六千八百九十字注一千三百八字
