body:
  text: 儀禮卷第八聘禮第八儀禮鄭氏注聘禮君與卿圖事圖謀也謀聘故及可使者謀事者必因朝其位君南面卿西面大夫北面士東面遂命使者遂猶因也旣謀其人因命之也聘使卿使者再拜稽首辭辭以不敏君不許乃退退反位也受命者必進旣圖事戒上介亦如之旣巳也戒猶命也巳謀事乃命上介難於使者易於介宰命司馬戒衆介衆介皆逆命不辭宰上卿貳君事者也諸侯謂司徒爲宰衆介者士也士屬司馬周禮司馬之屬司士堂作士適四方使爲介逆猶受也宰書幣書聘所用幣多少也宰又掌制國之用命宰夫官具宰夫宰之屬也命之使衆官具幣及所宜齎及期夕幣及猶至也夕幣先行之日夕陳幣而視之重聘也使者朝服帥衆介夕視其事也古文帥皆作率管人布幕于寢門外管猶館也舘人謂掌次舎帷幕者也布幕以承幣寢門外朝也古文管作官今文布作敷官陳幣皮北首西上加其奉於左皮上馬則北面奠幣于其前奉所奉以致命謂束帛及玄纁也馬言則者此享主用皮或時用馬馬入則在幕南皮馬皆乗古文奉爲卷今文無則使者北面衆介立于其左東上旣受行同位也位在幕南卿大夫在幕東西面北上大夫西面辟使者宰入告具于君君朝服出門左南郷入告入路門而告史讀書展幣展猶校録也史幕東西面讀書賈人坐撫其幣毎者曰在必西面者欲君與使者俱見之也宰執書告備具于君授使者使者受書授上介史展幣畢以書還授宰宰旣告備以授使者其受授皆北面公揖入揖禮羣臣官載其幣舎于朝待旦行也上介視載者監其安處之畢乃出所受書以行爲當復展厥明賔朝服釋幣于禰告爲君使也賔使者謂之賔尊之也天子諸侯將出告羣廟大夫告禰而已凡釋幣設洗盥如祭有司筵几于室中祝先入主人從入主人在右再拜祝告又再拜更云主人者廟中之稱也祝告告以主人將行也釋幣制玄纁束奠于几下出祝釋之也凡物十曰束玄纁之率玄居三纁居二朝貢禮云純四只制丈八尺主人立于戶東祝立于牖西少頃之間示有俟於神又入取幣降卷幣實于笲埋于西階東又入者祝也埋幣必盛以器若藏之然又釋幣于行告將行也行者之先其古人之名未聞天子諸侯有常祀在冬大夫三祀曰門曰行曰厲喪禮有毀宗躐行出于大門則行神之位在廟門外西方不言埋幣可知也今時民春秋祭祀有行神古之遺禮乎遂受命賔須介來乃受命也言遂者明自是出不復入上介釋幣亦如之如其於禰與行上介及衆介俟于使者之門外俟待也待於門外東面北上使者載旜帥以受命于朝旜旌旗屬也載之者所以表識其事也周禮曰通帛爲旜又曰孤卿建旜至於朝門使者北面東上古文旜皆爲膳君朝服南郷卿大夫西面北上君使卿進使者進之者使者謙不敢必君之終使巳使者入及衆介隨入北面東上君揖使者進之上介立于其左接聞命進之者有命宜相近也接猶續也賈人西面坐啓櫝取圭垂繅不起而授宰賈人在官知物賈者繅所以藉圭也其或拜則奠于其上今文繅作璪宰執圭屈繅自公左授使者屈繅者斂之禮以相變爲敬也自公左賛幣之義使者受圭同面垂繅以受命同面者宰就使者北面並授之旣授之而君出命矣凡授受者授由其右受由其左旣𫐠命同面授上介述命者循君之言重失誤上介受圭屈繅出授賈人衆介不從賈人將行者在門外北面受享束帛加璧受夫人之聘璋享玄纁束帛加琮皆如初享獻也旣聘又獻所以厚恩惠也帛今之璧色繒也夫人亦有聘享者以其與巳同體爲國小君也其聘用璋取其半圭也君享用璧夫人用琮天地配合之象也圭璋特逹瑞也璧琮有加徃德也周禮曰瑑圭璋璧琮以覜聘遂行舎於郊於此脫舎衣服乃即道也曲禮曰凡爲君使已受命君言不宿於家歛旜此行道耳未有事也歛藏也若過邦至于竟使次介假道束帛將命于朝曰請帥奠幣至竟而假道諸侯以國爲家不敢直徑也將猶奉也帥猶道也請道巳道路所當由下大夫取以入告岀許遂受幣言遂者明受其幣非爲許故也容其辭讓不得命也餼之以其禮上賔大牢積唯芻禾介皆有餼凡賜人以牲生曰餼餼猶稟也給也以其禮者尊卑有常差也常差者上賔上介牲用大牢羣介用少牢米皆百筥牲陳于門内之西北靣米設于中庭上賔上介致之以束帛羣介則牽羊焉上賔有禾十車芻二十車禾以抺馬士帥没其竟没盡誓于其竟賔南面上介西面衆介北面東上史讀書司馬執䇿立于其後此使次介假道止而誓也賔南面專威信也史於衆介之前北面讀書以勑告士衆爲其犯禮暴掠也禮君行師從卿行旅從司馬主軍法者執䇿示罰未入竟壹肄謂於所聘之國竟也肄習也習聘之威儀重失誤爲壝壇畫階帷其北無宫壝土象壇也帷其北宜有所郷依也無宫不壝土畫外垣也朝服無主無執也不立主人主人尊也不執玉不敢䙝也徒習其威儀而已介皆與北面西上入門左之位也古文與作豫習享士執庭實士士介也庭實必執之者皮則有攝張之節習夫人之聘享亦如之習公事不習私事公事致命者也及竟張旜誓及至也張旜明事在此國也張旜謂使人維之乃謁關人謁告也古者竟上爲關以譏異服識異言關人問從者幾人欲知聘問且爲有司當共委積之具以介對以所與受命者對謙也聘禮上公之使者七介侯伯之使者五介子男之使者三介以其代君交於列國是以貴之周禮曰凡諸侯之卿其禮各下其君二等君使士請事遂以入竟請猶問也問所爲來之故也遂以入因道之入竟斂旜乃展復校録幣重其事歛旜變於始入布幕賔朝服立于幕東西面介皆北面東上賈人北面坐拭圭拭清也側幕而坐乃開櫝遂執展之持之而立告在上介北面視之退復位言退復位則視圭進違位退圭圭璋尊不陳之陳皮北首西上又拭璧展之㑹諸其幣加于左皮上上介視之退㑹合也諸於也古文曰陳幣北首馬則幕南北面奠幣于其前前當前幕上展夫人之聘享亦如之賈人告于上介上介告于賔展夫人聘享上介不視貶於君也賈人旣拭璋琮南面告於上介上介於是乃東面以告賔亦所謂放而文之類有司展羣幣以告羣幣私覿及大夫者有司載幣者自展自告及郊又展如初郊逺郊也周制天子畿内千里逺郊百里以此差之逺郊上公五十里侯伯三十里子男十里也近郊各半之及館展幣於賈人之館如初館舎也逺郊之内有候館可以小休止沐浴展幣不于賔館者爲主國之人有勞問巳者就焉便疾也賔至于近郊張旜君使下大夫請行反君使卿朝服用束帛勞請行問所之也雖知之謙不必也士請事大夫請行卿勞彌尊賔也其服皆朝服上介出請入告賔禮辭迎于舎門之外再拜出請出門西面請所以來事也入告入北面告賔也毎所及至皆有舎其有來者皆出請入告于此言之者賔彌尊事彌録勞者不荅拜凡爲人使不當其禮賔揖先入受于舎門内不受于堂此主於侯伯之臣也公之臣受勞於堂勞者奉幣入東面致命東面郷賔賔北面聽命還少退再拜稽首受幣勞者岀北面聽命若君南面然少退象降拜授老幣老賔之臣出迎勞者欲儐之勞者禮辭賔揖先入勞者從之乗皮設設於門内也物四曰乗皮麋鹿皮也賔用束錦儐勞者言儐者賔在公館如家之義亦以來者爲賔勞者再拜稽首受稽首尊國賔也賔再拜稽首送幣受送拜皆北面象階上勞者揖皮出乃退賔送再拜揖皮出東面揖執皮者而出夫人使下大夫勞以二竹簋方玄𬒳纁裏有蓋竹簋方者器名也以竹爲之狀如簋而方如今寒具筥筥者圜此方耳其實棗蒸栗擇兼執之以進兼猶兩也右手執棗左手執栗賔受棗大夫二手授栗受授不游手慎之也賔之受如初禮如卿勞之儀儐之如初下大夫勞者遂以賔入出以束錦授從者因東面釋辭請道之以入然則賔送不拜至于朝主人曰不腆先君之祧旣拚以俟矣賔至外門下大夫入告出釋此辭主人者公也不言公而言主人主人接賔之辭明至欲受之不敢稽賔也腆猶善也遷主所在曰祧周禮天子七廟文武焉祧諸侯五廟則祧始祖也是亦廟也言祧者祧尊而廟親待賔客者上尊者賔曰俟間賔之意不欲奄卒主人也且以道路悠逺欲沐浴齊戒俟間未敢聞命大夫帥至于館卿致館致至也賔至此館主人以上卿禮致之所以安之也賔迎再拜卿致命賔再拜稽首卿退賔送再拜卿不俟設飱之畢以不用束帛致故也不用束帛致之者明爲新至非大禮也宰夫朝服設飱食不備禮曰飱詩云不素飱兮春秋傳曰方食魚飱皆謂是飪一牢在西鼎九羞鼎三腥一牢在東鼎七中庭之饌也飪孰也孰在西腥在東象春秋也鼎西九東七凡其鼎實與其陳如陳饔餼羞鼎則陪鼎也以其實言之則曰羞以其陳言之則曰陪堂上之饌八西夾六八六者豆數也凡饌以豆爲本堂上八豆八簋六鈃兩簠八壺西夾六豆六簋四鉶兩簠六壷其實與其陳亦如饔餼門外米禾皆二十車禾槀實并刈者也諸侯之禮車米視生牢禾視死牢十車大夫之禮皆視死牢而已雖有生牢不取數焉米陳門東禾陳門西薪芻倍禾各四十車凡此之陳亦如饔餼上介飪一牢在西鼎七羞鼎三堂上之饌六門外米禾皆十車薪芻倍禾西鼎七無鮮魚鮮腊衆介皆少牢亦飪在西鼎五羊豕腸胃魚腊新至尚孰堂上之饌四豆四簋兩鈃四壷無簠厥明訝賔于館此訝下大夫也以君命迎賔謂之訝訝迎也亦皮弁賔皮弁聘至于朝賔入于次服皮弁者朝聘主相尊敬也諸侯視朔皮弁服入于次者俟辦也次在大門外之西以帷爲之乃陳幣有司入于主國廟門外以布幕陳幣如展幣焉圭璋賈人執櫝而俟卿爲上擯大夫爲承擯士爲紹擯擯者出請事擯謂主國之君所使出接賔者也紹繼也其位相承繼而出也主君公也則擯者五人侯伯也則擯者四人子男也則擯者三人聘義曰介紹而傳命君子於其所尊不敢質敬之至也旣知其所爲來之事復請之者賔來當與主君爲禮爲其謙不敢厈尊者啓發以進之於是時賔出次直闑西北面上擯在闑東閾外西面其相去也公之使者七十歩侯伯之使者五十歩子男之使者三十歩此旅擯耳不傳命上介在賔西北東面承擯在上擯東南西面各自次序而下末介末擯旁相去三丈六尺上擯之請事進南面揖賔俱前賔至末介上擯至末擯亦相去三丈六尺止揖而請事還入告于公天子諸侯朝覲乃命介紹傳命耳其儀各鄉本受命反面傳而下及末則鄉受之反面傳而上又受命傳而下亦如之此三丈六尺者門容二徹參个旁加各一歩也今文無擯公皮弁迎賔于大門内大夫納賔公不出大門降于待其君也大夫上擯也謂之大夫者上序可知從大夫揔無所别也於是賔主人皆裼賔入門左内賔位也衆介隨入北面西上少退擯者亦入門而右北面東上上擯進相君公再拜南面拜迎賔辟不荅拜辟位逡遁不敢當其禮公揖入毎門毎曲揖毎門輙揖者以相人偶爲敬也凡君與賔入門賔必後君介及擯者隨之並而鴈行旣入則或左或右相去如初玉藻曰君入門介拂闑大夫中棖與闑之間士介拂棖賔入不中門不履閾此賔謂聘卿大夫也門中門之正也不敢與君並由之敬也介與擯者鴈行卑不踰尊者之迹亦敬也賔之介猶主人之擯及廟門公揖入立于中庭公揖先入省内事也旣則立於中庭以俟賔不復出如此得君行一臣行二於禮可矣公迎賔于大門内卿大夫以下入廟門即位而俟之賔立接西塾接猶近也門側之堂謂之塾立近塾者巳與主君交禮將有出命俟之於此介在幣南北面西上上擯亦隨公入門東東上少進於士几筵旣設擯者出請命有几筵者以其廟受冝依神也賔至廟門司宫乃于依前設之神尊不豫事也席西上上擯待而出請受賔所以來之命重停賔也至此言命事彌至言彌信也周禮諸侯祭祀席蒲筵繢純右彫几賈人東面坐啓櫝取圭垂繅不起而授上介賈人郷入陳幣東面俟於此言之就有事也授圭不起賤不與爲禮也不言裼襲者賤不裼也繅有組繫也上介不襲執圭屈繅授賔上介北靣受圭進西靣授賔不襲者以盛禮不在於巳也屈繅并持之也曲禮曰執玉其有藉者則裼無藉者則襲賔襲執圭執圭盛禮而又盡飾爲其相蔽敬也玉藻曰服之襲也充美也是故尸襲執玉龜襲也擯者入告出辭玉擯者上擯也入告公以賔執圭將致其聘命圭贄之重者辭之亦所以致尊讓也納賔賔入門左公事自闑西介皆入門左北面西上隨賔入也介無事止於此今文無門三揖君與賔也入門將曲揖旣曲北面又揖當碑揖至于階三讓讓升公升二等先賔升二等亦欲君行一臣行二賔升西楹西東面與主君相郷擯者退中庭郷公所立處退者以公冝親受賔命不用擯相也賔致命致其君之命也公左還北郷當拜擯者進進阼階西釋辭於賔相公拜也公當楣再拜拜貺也貺惠賜也楣謂之梁賔三退負序三退三逡遁也不言辟者以執圭將進授之公側襲受玉于中堂與東楹之間側猶獨也言獨見其尊賔也佗日公有事必有賛爲之者凡襲于隱者公序玷之間可知也中堂南北之中也入堂深尊賔事也東楹之間亦以君行一臣行二擯者退負東塾而立反其等位無事賔降介逆出逆出由便賔出聘事畢公側授宰玉使藏之授於序端裼降立裼者免上衣見裼衣凡當盛禮者以充美爲敬非盛禮者以見美爲敬禮尚相變也玉藻曰裘之裼也見美也又曰麛裘青豻褎絞衣以裼之論語曰素衣麛裘皮弁時或素衣其裘同可知也裘者爲温表之爲其褻也寒暑之服冬則裘夏則葛凡䄠裼者左降立俟享也亦於中庭古文裼皆作賜擯者出請不必賔事之有無賔裼奉束帛加璧享擯者入告出許許受之庭實皮則攝之毛在内内攝之入設也皮虎豹之皮攝之者右手并執前足左手并執後足毛在内不欲文之豫見也内攝之者兩手相郷也入設亦參分庭一在南言則者或以馬也凡君於臣臣於君麋鹿皮可也賔入門左揖讓如初升致命張皮張者釋外足見文也公再拜受幣士受皮者自後右客自由也從東方來由客後西居其左受皮也執皮者旣授亦自前西而出賔出當之坐攝之象受于賔公側授宰幣皮如入右首而東如入左在前皮右首者變于生也聘于夫人用璋享用琮如初禮如公立于中庭以下若有言則以束帛如享禮有言有所告請若有所問也記曰有故則束帛加書以將命春秋臧孫辰告糴于齊公子遂如楚乞師晉侯使韓穿來言汶陽之田皆是也無庭實也擯者出請事賔告事畢公事畢賔奉束錦以請覿覿見也郷將公事是欲交其歡敬也不用羔因使而見非特來擯者入告出辭客有大禮未有以待之請禮賔賔禮辭聽命擯者入告告賔許也宰夫徹几改筵宰夫又主酒食者也將禮賔徹神几改神席更布也賔席東上公食大夫禮曰蒲筵常緇布純加􅍉席㝷玄帛純此筵上下大夫也周禮曰筵國賔于牖前莞筵紛純加繅席畫純左彤几者則是筵孤也孤彤几卿大夫其漆几與公出迎賔以入揖讓如初公出近者已之禮更端也公升側受几于序端漆几也今文無升宰夫内拂几三奉兩端以進内拂几不欲塵坋尊者以進自東箱來授君公東南郷外拂几三卒振𬒮中攝之進西鄕進就賔也擯者告告賔以公授几賔進訝受几于筵前東面俟未設也今文訝爲梧公壹拜送公尊也古文壹作一賔以几辟辟位逡遁北面設几不降階上荅再拜稽首不降以主人禮未成也几賔左几宰夫實觶以醴加柶于觶面枋酌以授君也君不自酌尊也宰夫亦洗升實觶以醴自東箱來不面擸不訝授也公側受醴將以飲賔賔不降壹拜進筵前受醴復位公拜送醴賔壹拜者醴質以少爲貴宰夫薦籩豆脯醢賔升筵擯者退負東塾事未畢擯者不退中庭以有宰夫也賔祭脯醢以柶祭醴三庭實設庭實乗馬降筵北面以柶兼諸觶尚擸坐啐醴降筵就階上公用束帛致幣也言用尊于下也亦受之于序端建柶北面奠于薦東糟醴不啐擯者進相幣進以辭賔降辭幣不敢當公禮也公降一等辭辭賔降也栗階升聽命栗階趨君命尚疾不連歩降拜拜受公辭不降一等殺也升再拜稽首受幣當東楹北面亦訝受而北面者禮主於巳巳臣也退東面俟俟君拜也不北面者謙若不敢當階然公壹拜賔降也公再拜不俟公再拜者不敢當公之盛也公再拜者事畢成禮也賔執左馬以出受尊者禮冝親之也效馬者并左右靮授之餘三馬主人牽者從出也上介受賔幣從者訝受馬從者士介賔覿奉束錦緫乗馬二人賛入門右北面奠幣再拜稽首不請不辭郷時已請也覿用束錦辟享幣也緫者緫八轡牽之賛者居馬間扣馬也入門而右私事自闑右奠幣再拜以臣禮見也賛者賈人之屬介特覿也擯者辭辭其臣賔出事畢擯者坐取幣出有司二人牽馬以從出門西面于東塾南將還之也賛者有司受馬乃出几取幣于庭北面擯者請受請以客禮受之賔禮辭聽命賔受其幣賛者受馬牽馬右之入設庭實先設客禮也右當公之盛也公再拜之欲人居馬左任右手便也於是牽馬者四人事得申也曲禮曰效馬效羊者右牽之賔奉幣入門左介皆入門左西上以客禮入可從介公揖讓如初升公北面再拜公再拜者以其𥘉以臣禮見新之也賔三退反還負序反還者不敢與授圭同振幣進授當東楹北面不言君受略之也士受馬者自前還牽者後適其右受自由也適牽者之右而受之也此亦並授者不自前左由便也便其巳授而去也受馬自前變於受皮牽馬者自前西乃出自由也賔降階東拜送君辭拜送幣于階東以君在堂郷之拜也君降一等辭君乃辭之而賔由拜敬也擯者曰寡君從子雖將拜起也此禮固多有辭矣未有著之者是其志而煥乎未敢明說栗階升公西郷賔階上再拜稽首成拜公少退爲敬賔降出公側授宰幣馬出廟中宜清公降立擯者出請上介奉束錦士介四人皆奉玉錦束請覿玉錦錦之文纎縟者也禮有以少文爲貴者後言束辭之便也擯者入告出許上介奉幣儷皮二人賛儷猶兩也上介用皮變於賔也皮麋鹿皮皆入門右東上奠幣皆再拜稽首皆者皆衆介也賛者奠皮出擯者辭亦辭其臣介逆出亦事畢也擯者執上幣士執衆幣有司二人舉皮從其幣出請受此請受請于上介也擯者先即西面位請之釋辭之時衆執幣者隨立門中而俟委皮南面擯者旣釋辭執衆幣者進即位有司乃得委之南面便其復入也委皮當門執幣者西面北上擯者請受請于上介也上言其次此言其位互約文也介禮辭聽命皆進訝受其幣此言皆訝受者嫌擯者二授之上介奉幣皮先入門左奠皮皮先者介隨執皮者而入也入門左介至揖位而立執皮者奠皮以有不敢授之義古文重入公再拜拜中庭也不受于堂介賤也介振幣自皮西進北面授幣退復位再拜稽首送幣進者北行參分庭一而東行當君乃復北行也介出宰自公左受幣不側授介禮輕有司二人坐舉皮以東擯者又納士介納者出道入也士介入門右奠幣再拜稽首終不敢以客禮見擯者辭介逆出擯者執上幣以出禮請受賔固辭禮請受者一請受而聽之也賔爲之辭士介賤不敢以言通於主君也固衍字當如面大夫也公荅再拜擯者出立于門中以相拜擯者以賔辭入告還立門中閾外西面公乃遥荅拜也相者賛告之士介皆辟辟於其東面位逡遁也士三人東上坐取幣立俟儐者執上幣來也擯者進就公所也宰夫受幣于中庭以東使宰夫受于士士介幣輕也受之于公左賔幣公側授宰上介幣宰受于公左士介幣宰夫受于士敬之差執幣者序從之序從者以宰夫當一一受之擯者出請賔告事畢賔旣告事畢衆介逆道賔而出也擯者入告公出送賔公出衆擯亦逆道紹擯及賔並行間亦六歩及大門内公問君郷以公禮將事無由問也賔至始入門之位北面將揖而出衆介亦在其右少退西上於此可以問君居處何如序殷勤也時承擯紹擯亦於門東北靣東上上擯徃來傳君命南面蘧伯玉使人於孔子孔子問曰夫子何爲此公問君之類也賔對公再拜拜其無恙公拜賔亦辟公問大夫賔對公勞賔賔再拜稽首公荅拜勞以道路之勤公勞介介皆再拜稽首公荅拜賔出公再拜送賔不顧公旣拜客趨辟君命上擯送賔出反告賔不顧於此君可以反路寢矣論語記孔子之行曰君召使擯色勃如也足躩如也賔退必復命曰賔不顧矣賔請有事於大夫請問問卿也不言問聘聘亦問也嫌近君也上擯送賔出賔東面而請之擯者反命因告之公禮辭許禮辭一辭賔即館小休息也即就也卿大夫勞賔賔不見以巳公事未行上介以賔辭辭之大夫奠鴈再拜上介受不言卿卿與大夫同執鴈下見于國君周禮凡諸侯之卿見朝君皆執羔勞上介亦如之君使卿韋弁歸饔餼五牢變皮弁服韋弁敬也韋弁韎韋之弁兵服也而服之者皮韋同類取相近耳其服蓋韎布以爲衣而素裳牲殺曰饔生曰餼今文歸或爲饋上介請事賔朝服禮辭朝服示不受也受之當以尊服有司入陳入賔所館之庿陳其積饔謂飪與腥飪一牢鼎九設于西階前陪鼎當内廉東面北上上當碑南陳牛羊豕魚腊腸胃同鼎膚鮮魚鮮腊設扄鼏膷臐膮蓋陪牛羊豕陪鼎三牲臛膷臐膮陪之庶羞加也當内廉辟堂塗也腸胃次腊以其出牛羊也膚豕肉也唯燖者有膚此饌先陳其位後言其次重大禮詳其事也宫必有碑所以識日景引隂陽也凡碑引物者宗廟則麗牲焉以取毛血其材宫廟以石窆用木腥二牢鼎二七無鮮魚鮮腊設于阼階前西面南陳如飪鼎二列有腊者所以優賔也堂上八豆設于戶西西陳皆二以並東上韭菹其南醓醢屈戸室戶也東上變于親食賔也醓醢汁也屈猶錯也今文並皆爲併八簋繼之黍其南稷錯黍在北六鉶繼之牛以西羊豕豕南牛以東羊豕鉶羹器也兩簠繼之粱在北簠不次簋者粱稻加也凡饌屈錯要相變八壷設于西序北上二以並南陳壷酒尊也酒蓋稻酒粱酒不錯者酒不以雜錯爲味西夾六豆設于西墉下北上韭菹其東醓醢屈六簋繼之黍其東稷錯四鉶繼之牛以南羊羊東豕豕以北牛兩簠繼之粱在西皆二以並南陳六壷西上二以並東陳東陳在北墉下綂於豆饌于東方亦如之東方東夾室西北上亦韭菹其東醯醢也壷東上西陳亦在北墉下綂於豆醯醢百罋夾碑十以爲列醯在東夾碑在鼎之中央也醯在東醯榖陽也醢肉隂也餼二牢陳于門西北面東上牛以西羊豕豕西牛羊豕餼生也牛羊右手牽之豕束之寢右亦居其左米百筥筥半斛設于中庭十以爲列北上黍粱稻皆二行稷四行庭實固當庭中言當中庭者南北之中也東西爲列列當醯醢南亦相變也此言中庭則設碑近如堂深也門外米三十車車秉有五籔設于門東爲三列東陳大夫之禮米禾皆視死牢秉籔數名也秉有伍籔二十四斛也籔讀若不數之數今文籔或爲逾禾三十車車三秅設于門西西陳秅數名也三秅千二百秉薪芻倍禾倍禾者以其用多也薪從米芻從禾四者之車皆陳北輈凡此所以厚重禮也聘義曰古之用財不能均如此然而用財如此其厚者言盡之於禮也盡之於禮則内君臣不相陵而外不相侵故天子制之而諸侯務焉爾賔皮弁迎大夫于外門外再拜大夫不荅拜大夫使者卿也揖入及廟門賔揖入賔與使者揖而入使者止執幣賔俟之于門内謙也古者天子適諸侯必舎於大祖廟諸侯行舎于諸公廟大夫行舎于大夫廟大夫奉束帛執其所以將命入三揖皆行皆猶並也使者尊不後主人至于階讓大夫先升一等讓不言三不成三也凡升者主人讓于客三敵者則客三辭主人乃許升亦道賔之義也使者尊主人三讓則許升矣今使者三讓則是主人四讓也公雖尊亦三讓乃許升不可以不下主人也古文曰三讓賔從升堂北面聽命北面于階上也大夫東面致命賔降階西再拜稽首拜餼亦如之大夫以束帛同致饔餼也賔殊拜之敬也重君之禮也大夫辭升成拜尊賔受幣堂中西北面趨主君命也堂中西中央之西大夫降出賔降授老幣出迎大夫老家臣也賔出迎欲擯之大夫禮辭許入揖讓如初賔升一等大夫從升堂賔先升敵也皆北面庭實設馬乗乗四馬也賔降堂受老束錦大夫止止不降使之餘尊賔奉幣西面大夫東面賔致幣不言致命非君命也大夫對北面當楣再拜稽首稽首尊君客也致對有辭也受幣于楹間南面退東面俟賔北面授尊君之使賔再拜稽首送幣大夫降執左馬以出出廟門從者亦訝受之賔送于外門外再拜明日賔拜于朝拜饔與餼皆再拜稽首拜謝主君之恩惠於大門外周禮曰凡賔客之治令訝聽之此拜亦皮弁服上介饔餼三牢飪一牢在西鼎七羞鼎三飪鼎七無鮮魚鮮腊也賔介皆異館腥一牢在東鼎七堂上之饌六六者賔西夾之數西夾亦如之筥及罋如上賔凡所不貶者尊介也言如上賔者明此賔客介也餼一牢門外米禾視死牢牢十車薪芻倍禾凡其實與陳如上賔凡凡飪以下下大夫韋弁用束帛致之上介韋弁以受如賔禮介不皮弁者以其受大禮似賔不敢純如賔也儐之兩馬束錦士介四人皆餼大牢米百筥設于門外牢米不入門略之也米設當門亦十爲列北上牢在其南西上宰夫朝服牽牛以致之執紖牽之東面致命朝服無束帛亦略之上介西面拜迎士介朝服北面再拜稽首受受於牢東拜自牢後適宰夫右受由前東面授從者無擯旣受拜送之矣明日衆介亦各如其受之服從賔拜於朝賔朝服問卿不皮弁别於主君卿毎國三人卿受于祖廟重賔禮也祖王父也下大夫擯無士擯者旣接於君所急見之擯者出請事大夫朝服迎于外門外再拜賔不荅拜揖大夫先入毎門毎曲揖及廟門大夫揖入入者省内事也旣而俟于宁也擯者請命亦從入而出請不几筵辟君也庭實設四皮麋鹿皮也賔奉束帛入三揖皆行至于階讓皆猶並也古文曰三讓賔升一等大夫從升堂北面聽命賔先升使者尊賔東面致命致其君命大夫降階西再拜稽首賔辭升成拜受幣堂中西北面於堂中央之西受幣趨聘君之命賔降出大夫降授老幣無擯不擯賔辟君也擯者出請事賔面如覿幣面亦見也其謂之面威儀質也賔奉幣庭實從庭實四馬入門右大夫辭大夫於賔入自階下辭迎之賔遂左見私事也雖敵賔猶謙入門右爲若降等然曲禮曰客若降等則就主人之階主人興辭於客然後客復就西階庭實設揖讓如初大夫至庭中旋並行大夫升一等賔從之大夫先升道賔大夫西面賔稱面稱舉也舉相見之辭以相接大夫對北面當楣再拜受幣于楹間南面退西面立受幣楹間敵也賔亦振幣進北面授賔當楣皆再拜大夫辭介逆出擯者執上幣出禮請受賔辭賔亦爲士介辭大夫荅再拜擯者執上幣立于門中以相拜士介皆辟老受擯者幣于中庭士三人坐取羣幣以從之擯者出請事賔出大夫送于外門外再拜賔不顧不顧言去擯者退大夫拜辱拜送也下大夫甞使至者幣及之甞使至巳國則以幣問之也君子不忘舊上介朝服三介問下大夫下大夫如卿受幣之禮上介三介下大夫使之禮也其面如賔面于卿之禮大夫若不見有故也君使大夫各以其爵爲之受如主人受幣禮不拜各以其爵主人卿也則使卿大夫也則使大夫不拜代受之耳不當主人禮也夕夫人使下大夫韋弁歸禮夕問卿之夕也使下大夫下君也君使之云夫人者以致辭當稱寡小君堂上籩豆六設于戶東西上二以並東陳籩豆六者下君禮也臣設于戶東又辟饌位也其設脯其南醢屈六籩六豆壷設于東序北上二以並南陳醙黍淸皆兩壷醙白酒也凡酒稻爲上黍次之粱次之皆有清白以黍間清白者互相備明三酒六壷也先言醙白酒尊先設之大夫以束帛致之致夫人命也此禮無牢下朝君也賔如受饔之禮儐之乗馬束錦上介四豆四籩四壷受之如賔禮四壺無稻酒也不致牢下於君也儐之兩馬束錦明日賔拜禮於朝於是乃言賔拜明介從拜也今文禮爲醴大夫餼賔大牢米八筐其陳於門外黍粱各二筐稷四筐二以並南陳無稻牲陳於後東上不饌於堂庭辟君也賔迎再拜老牽牛以致之賔再拜稽首受老退賔再拜送老室老大夫之貴臣上介亦如之衆介皆少牢米六筐皆士牽羊以致之米六筐者又無粱也士亦大夫之貴臣公於賔壹食再饗饗謂亨大牢以飲賔也公食大夫禮日設洗如饗則饗與食互相先後也古文壹皆爲一今文饗皆爲郷燕與羞俶獻無常數羞謂禽羞鴈鶩之屬成孰煎和也俶始也始獻四時新物聘義所謂時賜無常數由恩意也古文俶作淑賔介皆明日拜于朝上介壹食壹饗饗食賔介爲介從饗獻矣復特饗之客之也若不親食使大夫各以其爵朝服致之以侑幣如致饔無儐君不親食謂有疾及他故也必致之不廢其禮也致之必使同班敵者易以相親敬也致禮於卿使卿致禮於大夫使大夫非必命數也無儐以巳夲冝徃古文侑皆作宥致饗以酬幣亦如之酬幣饗禮酬賔勸酒之幣也所用未聞也禮幣束帛乗馬亦不是過也禮器曰琥璜爵蓋天子酬諸侯大夫於賔壹饗壹食上介若食若饗若不親饗則公作大夫致之以酬幣致食以侑幣作使也大夫有故君必使其同爵者爲之致之列國之賔來榮辱之事君臣同之君使卿皮弁還玉于館玉圭也君子於玉比德焉以之聘重禮也還之者德不可取於人相切厲之義也皮弁者始以此服受之不敢不終也賔皮弁襲迎于外門外不拜帥大夫以入迎之不拜示將去不純爲主也帥道也今文曰迎于門外古文帥爲率大夫升自西階鉤楹鉤楹由楹内將南面致命致命不東面以賔在下也必言鉤楹者賔在下嫌楹外也賔自碑内聽命升自西階自左南面受圭退負右房而立聽命於下敬也自左南面右大夫且並受也必並受者若郷君前耳退爲大夫降逡遁今文或曰由自西階無南面大夫降中庭賔降自碑内東面授上介于阼階東大夫降出言中庭者爲賔降節也授於阼階東者欲親見賈人藏之也賔還阼階下西靣立上介出請賔迎大夫還璋如初入岀請請事於外以入告也賔雖將去出入猶東唯升堂由西階凡介之位未有改也賔裼迎大夫賄用束紡賄予人財之言也紡紡絲爲之今之縳也所以遺聘君可以爲衣服相厚之至禮玉束帛乗皮禮禮聘君也所以報享也亦言玉璧可知也今文禮皆作醴皆如還玉禮大夫出賔送不拜公館賔爲賔將去親存送之厚殷勤且謝聘君之意也公朝服賔辟不敢受主國君見巳於此館也此亦不見言辟者君在廟門敬也凡君有事於諸侯臣之家車造廟門乃下上介聽命聽命於廟門中西面如相拜然也擯者毎賛君辭則曰敢不承命告于寡君之老聘享夫人之聘享問大夫送賔公皆再拜拜此四事公東面拜擯者北面公退賔從請命于朝賔從者實爲拜主君之館巳也言請命者以已不見不敢厈尊者之意公辭賔退辭其拜也退還館裝駕爲旦將發也周禮曰賔從拜辱于朝明日客拜禮賜遂行之賔三拜乗禽於朝訝聽之發去乃拜乗禽明已受賜大小無不識遂行舎于郊始發且宿近郊自展軨公使卿贈如覿幣贈送也所以好送之也言如覿幣見爲反報也今文公爲君受于舎門外如受勞禮無儐不入無儐明去而冝有巳也如受勞禮以贈勞同節使下大夫贈上介亦如之使士贈衆介如其覿幣大夫親贈如其面幣無儐贈上介亦如之使人贈衆介如其面幣士送至于竟使者歸及郊請反命郊近郊也告郊人使請反命於君也必請之者以巳乆在外言有罪惡不可以入春秋時鄭伯惡其大夫高克使之將兵逐而不納此蓋請而不得入朝服載旜行時稅舎于此郊今還至此正其故行服以俟君命敬也古文旜作膳禳乃入禳祭名也爲行道累歷不祥禳之以除灾凶乃入陳幣于朝西上上賔之公幣私幣皆陳上介公幣陳他介皆否皆否者公幣私幣皆不陳此幣使者及介所得於彼國君卿大夫之贈賜也其或陳或不陳詳尊而略卑也其陳之及卿大夫處者待之如夕幣其禮於君者不陳上賔使者公幣君之賜也私幣卿大夫之幣也他介士介也言他容衆從者束帛各加其庭實皮左不加於其皮上榮其多也公南鄕亦宰告于君君乃朝服出門左南郷卿進使者使者執圭垂繅北面上介執璋屈繅立于其左此主於反命士介亦隨入並立東上反命曰以君命聘于某君某君受幣于某宫某君再拜以享某君某君再拜君亦揖使者進之乃進反命也某君某國名也某宫若言桓宮僖宮也某君再拜謂再拜受也必言此者明彼君敬君巳不辱命宰自公左受玉亦於使者之東同面並受也不右使者由便也受上介璋致命亦如之變反言致者若云非君命也致命曰以君命聘於某君夫人某君再拜以享于某君夫人某君再拜不言受幣于某宮可知略之執賄幣以告曰某君使某子賄授宰某子若言髙子國子凡使者所當以告君者上介取以授之賄幣在外也禮玉亦如之亦執束帛加璧也告曰某君使某子禮宰受之士隨自後左士介受乗皮如初上介岀取玉束帛士介從取皮也執禮幣以盡言賜禮禮幣主國君𥘉禮賔之幣也以盡言賜禮謂自此至於贈公曰然而不善乎善其能使於四方而猶女也授上介幣再拜稽首公荅再拜授上介幣當拜公言也不授宰者當復陳之私幣不告亦略卑也君勞之再拜稽首君荅再拜勞之以道路勤苦若有獻則曰某君之賜也言此物某君之所賜予爲惠者也其所獻雖珍異不言某爲彼君服御物謙也其大夫出反必獻忠孝也君其以賜乎不必其當君也獻不拜者爲君之荅巳也上介徒以公賜告如上賔之禮徒謂空手不執其幣君勞之再拜稽首君荅拜勞士介亦如之士介四人旅荅壹拜又賤也君使宰賜使者幣使者再拜稽首以所陳幣賜之也禮臣子人賜之而必獻之君父不敢自私服也君父因以予之則拜受之如更受賜也旣拜宰以上幣授之賜介介皆再拜稽首士介之幣皆載以造朝不陳之耳與上介同受賜命俱拜旣拜宰亦以上幣授上介乃退君揖入皆出去介皆送至於使者之門將行俟于門反又送于門與尊長出入之禮也乃退揖揖别也使者拜其辱隨謝之也再拜上介三拜士介釋幣于門門大門也主于闑布席于闑西閾外東靣設洗于門外東方其餘如初于禰時出于行入于門不兩告告所先見也乃至于禰筵几于室薦脯醢告反也薦進也觴酒陳主人酌進奠一獻也言陳者將復有次也先薦後酌祭禮也行釋幣反釋奠略出謹入也席于阼爲酢主人也酢主人者祝取爵酌不酢於室異於祭薦脯醢成酢禮也三獻室老亞獻士三獻也毎獻奠輒取爵酌主人自酢也一人舉爵三獻禮成更起酒也主人奠之未舉也獻從者從者家臣從行者也主人獻之勞之也皆升飲酒於西階上不使人獻之辟國君也行酬乃出主人舉奠酬從者下辯室老亦與焉也上介至亦如之聘遭喪入竟則遂也遭喪主國君薨也入竟則遂國君以國爲體士旣請事巳入竟矣關人未告則反不郊勞子未君也不筵几致命不於廟就尸柩於殯宮又不神之不禮賔喪降事也主人畢歸禮賔所飲食不可廢也禮謂饔餼饗食賔唯饔餼之受受正不受加也不賄不禮玉不贈喪殺禮爲之不備遭夫人世子之喪君不受使大夫受于廟其他如遭君喪夫人世子死君爲喪主使大夫受聘禮不以凶接吉也其他謂禮所降遭喪將命于大夫主人長衣練冠以受遭喪謂主國君薨夫人世子死也此三者皆大夫攝主人長衣素純布衣也去衰易冠不以純凶接純吉也吉時在裏爲中衣中衣長衣繼皆掩尺表之曰深衣純𬒮寸半耳君喪不言使大夫受子未君無使臣義也聘君若薨于後入竟則遂旣接於主國君也赴者未至則哭于巷衰于館未至謂赴告主國君者也哭于巷者哭于巷門未可爲位也衰于館未可以凶服出見人其聘享之事自若吉也今文赴作訃受禮受饔餼也不受饗食亦不受加赴者至則衰而出禮爲隣國闕於是可以凶服將事也唯稍受之稍禀食也歸執圭復命于殯升自西階不升堂復命于殯者臣子之於君父存亡同子即位不哭將有告請之事冝清净也不言世子者君薨也諸臣待之亦皆如朝夕哭位辯復命如聘自陳幣至于上介以公賜告無勞子臣皆哭使者旣復命子與羣臣皆哭與介入北郷哭北郷哭新至别於朝夕出袒括髪悲哀變於外臣也入門右即位踊從臣位自哭至踊如奔喪禮若有私喪則哭于館衰而居不饗食私喪謂其父母哭于館衰而居不敢以私喪自聞于主國凶服于君之吉使春秋傳曰大夫以君命出聞喪徐行而不反歸使衆介先衰而從之巳有齊斬之服不忍顯然趨於徃來其在道路使介居前歸又請反命巳猶徐行隨之君納之乃朝服旣反命出公門釋服哭而歸其佗如奔喪之禮吉時道路深衣賔入竟而死遂也主人爲之具而殯具謂始死至殯所當用介攝其命爲致聘享之禮也初時上介接聞命君弔介爲主人雖有臣子親姻猶不爲主人以介與賔並命於君尊也主人歸禮幣必以用當中奠贈諸喪具之用不必如賔禮介受賔禮無辭也介受主國賔巳之禮無所辭也以其當陳之以反命也有賔喪嫌其辭之不饗食歸介復命柩止于門外門外大門外也必以柩造朝逹其忠心介卒復命出奉柩送之君弔卒殯卒殯成節乃去若大夫介卒亦如之不言上介者小聘上介士也士介死爲之棺斂之不具佗衣物也自以時服也君不弔焉主國君使人弔不親徃若賔死未將命則旣斂于棺造于朝介將命未將命謂俟間之後也以柩造朝以巳至朝志在逹君命若介死歸復命唯上介造于朝若介死雖士介賔旣復命徃卒殯乃歸徃謂送柩小聘曰問不享有獻不及夫人主人不筵几不禮面不升不郊勞記貶於聘所以爲小也獻私獻也面猶覿也其禮如爲介三介如爲介如爲大聘上介記乆無事則聘焉事謂盟㑹之屬若有故則卒聘束帛加書將命百名以上書於䇿不及百名書於方故謂灾患及時事相告請也將猶致也名書文也今謂之字䇿簡也方板也主人使人與客讀諸門外受其意旣聘享賔出而讀之讀之不於内者人稠處嚴不得審悉主人國君也人内史也書必璽之客將歸使大夫以其束帛反命于館爲書報也明日君館之旣報館之書問尚疾也旣受行出遂見宰問幾月之資資行用也古者君臣謀密草創未知所之逺近問行用當知多少而已古文資作齎使者旣受行日朝同位謂前夕幣之間同位者使者北面介立于左少退别其處臣也出祖釋軷祭酒脯乃飲酒于其側祖始也旣受聘享之禮行出國門止陳車騎釋酒脯之奠於軷爲行始也詩傳曰軷道祭也謂祭道路之神春秋傳曰軷渉山川然則軷山行之名也道路以險阻爲難是以委土爲山或伏牲其上使者爲軷祭酒脯祈告也卿大夫處者於是餞之飲酒於其側禮畢乗車轢之而遂行舎於近郊矣其牲犬羊可也古文軷作祓所以朝天子圭與繅皆九寸剡上寸半厚半寸博三寸繅三采六等朱白蒼圭所執以爲瑞節也剡上象天圜地方也雜采曰繅以韋衣木板飾以三色再就所以薦玉重愼也九寸三公之圭也古文繅或作藻今文作璪問諸侯朱緑繅八寸二采再就降於天子也於天子曰朝於諸侯曰問記之於聘文互相備皆玄纁繫長尺絢組采成文曰絢繫無事則以繫玉因以爲飾皆用五采組上以玄下以絳爲地今文絢作約問大夫之幣俟于郊爲肆又齎皮馬肆猶陳列也齎猶付也使者旣受命宰夫載問大夫之禮待於郊陳之爲行列至則以付之也使者初行舎于近郊幣云肆馬云齎因其冝亦互文也不於朝付之者辟君禮也必陳列之者不夕也古文肆爲肄辭無常孫而說孫順也大夫使受命不受辭辭必順且說辭多則史少則不逹史謂䇿祝辭苟足以逹義之至也至極也今文至爲砥辭曰非禮也敢對曰非禮也敢辭辭不受也對荅問也二者皆卒曰敢言不敢卿館於大夫大夫館於士士館於工商館者必於廟不館於敵者之廟爲大尊也自官師以上有廟有寢工商則寢而巳管人爲客三日具沐五日具浴管人掌客館者也客謂使者下及士介也飱不致不以束帛致命草次饌飱具輕賔不拜以不致命沐浴而食之自㓗清尊主國君賜也記此重者沐浴可知卿大夫訝大夫士訝士皆有訝卿使者大夫上介也士衆介也訝主國君所使迎待賔者如今使者護客賔即館訝將公命使巳迎待之命又見之以其摯又復也復以私禮見者訝將舎於賔館之外冝相親也大夫訝者執鴈士訝者執雉賔旣將公事復見之以其摯旣巳也公事聘享問大夫復報也使者及上介執鴈羣介執雉各以見其訝凡四器者唯其所寳以聘可也言國獨以此爲寳也四器謂圭璋璧琮宗人授次次以帷少退于君之次主國之門外諸侯及卿大夫之所使者次位皆有常處上介執圭如重授賔愼之也曲禮曰凡執主器執輕如不克賔入門皇升堂讓將授志趨皇自莊盛也讓謂舉手平衡也志猶念也念趨謂審行歩也孔子之執圭鞠躬如也如不勝上如揖下如授勃如戰色足蹜蹜如有循古文皇皆作王授如爭承下如送君還而后退重失隊也而后猶然後也下階發氣怡焉再三舉足又趨發氣舎息也再三舉足自安定乃復趨也此云舉足則志趨卷遯而行也孔子之升堂鞠躬如也屏氣似不息者出降一等逞顔色怡怡如也没階趨進翼如也及門正焉容色復故此皆心變見於威儀執圭入門鞠躬焉如恐失之記異說也及享發氣焉盈容發舎氣也孔子之於享禮有容色衆介北面蹌焉容貌舒揚私覿愉愉焉容貌和敬出如舒鴈威儀自然而有行列舒鴈鵞也皇且行入門主敬升堂主愼復記執玉異說凡庭實隨入左先皮馬相間可也隨入不並行也間猶代也上物有冝君子不以所無爲禮畜獸同類可以相代古文間作干賔之幣唯馬出其餘皆東馬出當從廐也餘物皆東藏之内府多貨則傷于德貨天地所化生謂玉也君子於玉比德焉朝聘之禮以爲瑞節重禮也多之則是主於貨傷其爲德幣美則没禮幣人所造成以自覆幣謂束帛也愛之斯欲衣食之君子之情也是以享用幣所以副忠信美之則是主於幣而禮之本意不見也賄在聘于賄賄財也于讀曰爲言主國禮賔當視賔之聘禮而爲之財也賔客者主人所欲豐也若苟豐之是又傷財也周禮曰凡諸侯之交各稱其邦而爲之幣以其幣爲之禮古文賄皆作悔凡執玉無藉者襲藉謂繅也繅所以緼藉玉禮不拜至以賔不於是始至今文禮爲醴醴尊于東箱瓦大一有豐瓦大瓦尊豐承尊器如豆而卑薦脯五膱祭半膱橫之膱脯如版然者或謂之脡皆取直貌焉祭醴再扱始扱一祭卒再祭卒謂後扱主人之庭實則主人遂以出賔之士訝受之此謂餘三馬也左馬賔執以出矣士士介從者旣覿賔若私獻奉獻將命時有珍異之物或賔奉之所以自序尊敬也猶以君命致之擯者入告出禮辭辭其獻也賔東面坐奠獻再拜稽首送獻不入者奉物禮輕擯者東面坐取獻舉以入告出禮請受東靣坐取獻者以冝並受也其取之由賔南而自後右客也賔固辭公荅再拜拜受於賔也固亦衍字擯者立于閾外以相拜賔辟相賛也古文閾爲蹙擯者授宰夫于中庭東藏之旣乃介覿若兄弟之國則問夫人兄弟謂同姓若昬姻甥舅有親者問猶遺也謂獻也不言獻者變於君也非兄弟獻不及夫人若君不見君有疾若他故不見使者使大夫受受聘享也大夫上卿也自下聽命自西階升受負右房而立賔降亦降此儀如還圭然而賔大夫易處耳今文無而不禮辟正主也幣之所及皆勞不釋服以與賔接於君所賔又請有事于已不可以不速也所不及者下大夫未甞使者也不勞者以先是賔請有事於巳同類旣聞彼爲禮所及則巳徃有嫌也所以知及不及者賔請有事固曰某子某子賜饔唯羹飪筮一尸若昭若穆羹飪謂飪一牢也肉謂之羹唯是祭其先大禮之盛者也筮尸若昭若穆容父在父在則祭祖父卒則祭禰腥餼不祭則士介不祭也士之初行不釋幣于禰不祭可也古文羹爲羔飪作腍僕爲祝祝曰孝孫某孝子某薦嘉禮于皇祖某甫皇考某子僕爲祝者大夫之臣攝官也如饋食之禮如少牢饋食之禮不言少牢今以大牢也今文無之假噐於大夫不敢以君之器爲祭器朌肉及廋車朌猶賦也廋廋人也車巾車也二人掌視車馬之官也賦及之明辯也古文朌作紛聘日致饔急歸大禮明日問大夫不以残日問人崇敬也古文曰問夫人也夕夫人歸禮與君異日下之也今文歸作饋旣致饔旬而稍宰夫始歸乗禽日如其饔餼之數稍稟食也乗謂乗行之禽也謂鴈鶩之屬其歸之以雙爲數其賔與上介也古文旣爲餼士中日則二雙中猶間也不一日一雙大寡不敬也凡獻執一雙委其餘於面執一雙以將命也面前也其受之也上介受以入告之士舉其餘從之賔不辭拜受于庭上介執之以相拜于門中乃入授人上介受亦如之士介拜受于門外禽羞俶獻比比放也其致之禮如乗禽也禽羞謂成孰有齊和者俶獻四時珍美新物也俶始也言其始可獻也聘義謂之時賜歸大禮之日旣受饔餼請觀聘於是國欲見其宗廟之好百官之冨若尤尊大之焉訝帥之自下門入帥猶道也從下門外入游觀非正也各以其爵朝服此句似非其次冝在凡致禮下絶爛在此士無饔無饔者無擯謂歸餼也大夫不敢辭君初爲之辭矣此句亦非其次冝在明日問大夫之下凡致禮皆用其饗之加籩豆凡致禮謂君不親饗賔及上介以酧幣致其禮也其其賔與上介也加籩豆謂其實也亦實于罋筐饗禮今亡無饔者無饗禮士介無饗禮凡餼大夫黍粱稷筐五斛謂大夫餼賔上介也器寡而大略旣將公事賔請歸謂巳問大夫事畢請歸不敢自專謙也主國留之饗食燕獻無日數盡殷勤也凡賔拜于朝訝聽之拜拜賜也唯稍不拜燕則上介爲賔賔爲苟敬饗食君親爲主尊賔也燕私樂之禮崇恩殺敬也賔不欲主君復舉禮事禮已于是辭爲賔君聽之從諸公之席命爲苟敬苟敬者主人所以小敬也更降迎其介以爲賔介大夫也雖爲賔猶卑於君君則不與亢禮也主人所以致敬者自敵以上宰夫獻爲主人代公獻無行則重賄反幣無行謂獨來復無所之也必重其賄與反幣者使者歸以得禮多爲榮所以盈聘君之意也反幣謂禮玉束帛乗皮所以報聘君之享禮也昔秦康公使西乞術聘于魯辭孫而說襄仲曰不有君子其能國乎厚賄之此謂重賄反幣者也今文曰賄反幣曰子以君命在寡君寡君拜君命之辱此賛君拜聘享辭也在存也君以社稷故在寡小君拜此賛拜夫人聘享辭也言君以社稷故者夫人與君體敵不敢當其惠也其卒亦曰寡君拜命之辱君貺寡君延及二三老拜此賛拜問大夫之辭貺賜也大夫曰老又拜送拜送賔也其辭蓋云子將有行寡君敢拜送百拜聘享至此亦非其次冝承上君館之下賔於館堂楹閒釋四皮束帛賔不致主人不拜賔將遂去是館留禮以禮主人所以謝之也不致不拜不以將别崇新敬也大夫來使無罪饗之樂與嘉賔為禮過則餼之餼之腥致其牢禮也其致之辭不云君之有故耳聘義曰使者聘而誤主君不親饗食所以愧厲之也不言罪者罪將執之其介爲介饗賔有介者賔尊行敵禮也有大客後至則先客不饗食致之卑不與尊者齊禮唯大聘有几筵謂受聘享時也小聘輕雖受于庿不爲神位十斗曰斛十六斗曰籔十籔曰秉秉十六斛今江淮之間量名有爲籔者今文籔爲逾二百四十斗謂一車之米秉有五籔四秉曰筥此秉謂刈禾盈手之秉也筥穧名也若今萊易之閒刈稻聚把有名爲筥者詩云彼有遺秉又云此有不歛穧十筥曰稯十稯曰秅四百秉爲一秅一車之禾三秅爲千二百秉三百筥三十稯也古文稯作緵儀禮卷第八經五千三百四注一万九百六十一
