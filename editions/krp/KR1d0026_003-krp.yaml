body:
  text: 儀禮卷第三士相見禮第三儀禮鄭氏注士相見之禮摯冬用雉夏用腒左頭奉之曰某也願見無由逹某子以命命某見摯所執以至者君子見於所尊敬必執摯以將其厚意也士摯用雉者取其耿介交有時别有倫也雉必用死者爲其不可生服也夏用腒備腐臭也左頭頭陽也無由逹言乆無因縁以自逹也某子今所因縁之姓名也以命者稱述主人之意今文頭爲脰主人對曰某子命某見吾子有辱請吾子之就家也某將走見有又也某子命某徃見今吾子又自辱來序其意也走猶徃也今文無走賔對曰某不足以辱命請終賜見命謂請吾子之就家主人對曰某不敢爲儀固請吾子之就家也某將走見不敢爲儀言不敢外貌爲威儀忠誠欲徃也固如故也今文不爲非古文云固以請也賔對曰某不敢爲儀固以請言如固請終賜見也今文不爲非主人對曰某也固辭不得命將走見聞吾子稱摯敢辭摯不得命者不得見許之命也走猶出也稱舉也辭其摯爲其大崇也古文曰某將走見賔對曰某不以摯不敢見見於所尊敬而無摯嫌大簡主人對曰某不足以習禮敢固辭言不足習禮者不敢當其崇禮來見巳賔對曰某也不依於摯不敢見固以請言依於摯謙自卑也今文無也主人對曰某也固辭不得命敢不敬從出迎于門外再拜賔荅再拜主人揖入門右賔奉摯入門左主人再拜受賔再拜送摯出右就右也左就左也受摯於庭旣拜受送則出矣不受摯於堂下人君也今文無主人請見賔反見退主人送于門外再拜請見者爲賔崇禮來相接以矜莊歡心未交也賔反見則燕矣下云凡燕見於君至凡侍坐於君子博記反見之燕義臣初見於君再拜奠摯而出主人復見之以其摯曰曏者吾子辱使某見請還摯於將命者復見之者禮尚徃來也以其摯謂曏時所執來者也曏曩也將猶傳也傳命者謂擯相者主人對曰某也旣得見矣敢辭讓其來荅巳也賔對曰某也非敢求見請還摯于將命者言不敢求見嫌褻主人不敢當也今文無也主人對曰某也旣得見矣敢固辭固如故也賔對曰某不敢以聞固以請於將命者言不敢以聞又益不敢當主人對曰某也固辭不得命敢不從許受之也異日則當退同日則否賔奉摯入主人再拜受賔再拜送摰出主人送于門外再拜士見於大夫終辭其摯於其入也一拜其辱也賔退送再拜終辭其摯以將不親荅也凡不荅而受其摯唯君於臣耳大夫於士不出迎入一拜正禮也送再拜尊賔若甞爲臣者則禮辭其摯曰某也辭不得命不敢固辭禮辭一辭其摯而許也將不荅而聽其以摯入有臣道也賔入奠摯再拜主人荅壹拜奠摯尊卑異不親授也古文壹爲一賔出使擯者還其摯于門外曰某也使某還摯還其摯者辟正君也賔對曰某也旣得見矣敢辭辭君還其摯也今文無擯者對曰某也命某某非敢爲儀也敢以請還摯者請使受之賔對曰某也夫子之賤私不足以踐禮敢固辭家臣稱私踐行也言某臣也不足以行賔客禮賔客所不荅者不受摯擯者對曰某也使某不敢爲儀也固以請言使某尊君也或言命某傳言耳賔對曰某固辭不得命敢不從再拜受受其摯而去之下大夫相見以鴈飾之以布維之以索如執雉鴈取知時飛翔有行列也飾之以布謂裁縫衣其身也維謂繫聮其足上大夫相見以羔飾之以布四維之結于面左頭如麛執之上大夫卿也羔取其後帥羣而不黨也面前也繫聯四足交出背上於胷前結之也如麛執之者秋獻麛有成禮如之或曰麛孤之摯也其禮蓋謂左執前足右執後足今文頭爲脰如士相見之禮大夫雖摯異其儀猶如士始見于君執摯至下容彌蹙下謂君所也蹙猶促也促恭慤貌也其爲㳟士大夫一也庻人見於君不爲容進退走容謂趨翔士大夫則奠摯再拜稽首君荅壹拜言君荅士大夫一拜則於庻人不荅之庻人之摯鶩古文壹作一若他邦之人則使擯者還其摯曰寡君使某還摯賔對曰君不有其外臣臣不敢辭再拜稽首受凡燕見于君必辯君之南面若不得則正方不疑君辯猶正也君南面則臣見正北面君或時不然當正東面若正西面不得疑君所處邪鄕之此謂特見圖事非立賔主之燕也疑度之君在堂升見無方階辯君所在升見升堂見於君也君近東則升東階君近西則升西階凡言非當正容體以待之毋自變動爲嫌解惰不虚心也衆謂諸卿大夫同在此者皆若是其視之儀無異也古文毋作無今文衆爲終若父則遊目母上於面母下於帶子於父主孝不主敬所視廣也因觀安否何如也今文父爲甫古文毋作無若不言立則視足坐則視膝不言則伺其行起而巳凡侍坐於君子君子欠伸問日之早晏以食具告改居則請退可也君子謂卿大夫及國中賢者也志倦則欠體倦則伸問日晏近於乆也具猶辯也改居謂自變動也古文伸作信早作蚤夜侍坐問夜膳葷請退可也問夜問其時數也膳葷謂食之葷辛物葱薤之屬食之以止卧古文葷作薫若君賜之食則君祭先飯徧甞膳飮而俟君命之食然後食若祭先飯食其祭食臣先飯示爲君甞食也此謂君與之禮食膳謂進庶羞旣甞庻羞則飮俟君之徧甞也今云呫甞膳若有將食者則俟君之食然後食將食猶進食謂膳宰也膳宰進食則臣不甞食周禮膳夫品甞食王乃食若君賜之爵則下席再拜稽首受爵升席祭卒爵而俟君卒爵然後授虚爵受爵者於尊所至於授爵坐授人耳必俟君卒爵者若欲其釂然也今文曰若賜之爵無君也退坐取屨隱辟而后屨君爲之興則曰君無爲興臣不敢辭君若降送之則不敢顧辭遂岀謂君若食之飮之而退也隱辟俛而逡廵興起也辭君興而不敢辭其降於巳大崇不敢當也大夫則辭退下比及門三辭下亦降也若先生異爵者請見之則辭辭不得命則曰某無以見辭不得命將走見先見之先生致仕者也異爵謂卿大夫也辭辭其自降而來走猶出也先見之者出先拜也曲禮曰主人敬賔則先拜賔非以君命使則不稱寡大夫士則曰寡君之老謂擯賛者辭也不稱寡者不言寡君之某言姓名而巳大夫卿士其使則皆曰寡君之某檀弓曰往而未有禄者君有饋焉曰獻使焉曰寡君之老凡執幣者不趨容彌蹙以爲儀不趨主愼也以進而益恭爲威儀耳今文無容執玉者則唯舒武舉前曵踵唯舒者重玉器尤愼也武迹也舉前曵踵備􅠶跲也今文無者古文曵作抴凡自稱於君士大夫則曰下臣宅者在邦則曰市井之臣在野則曰草茅之臣庻人則曰刺草之臣他國之人則曰外臣宅者謂致仕者也致仕者去官而居宅或在國中或在野周禮載師之職以宅田任近郊之地刺猶剗除也今宅爲託古文茅作苗儀禮卷第三經七百五十三字注一千六百八十九字
