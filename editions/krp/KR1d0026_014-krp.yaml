body:
  text: 儀禮卷第十四士虞禮第十四鄭氏注士虞禮特豕饋食饋猶歸也側亨于廟門外之右東面側亨亨一胖也亨於爨用鑊不於門東未可以吉也是日也以虞易奠祔而以吉祭易喪祭鬼神所在則曰廟尊言之魚腊爨亞之北上爨竈饎爨在東壁西面炊黍稷曰饎饎北上上齊於屋宇於虞有亨饎之爨彌吉設洗于西階西南水在洗西篚在東反吉也亦當西榮南北以堂深尊于室中北墉下當戶兩甒醴酒酒在東無禁幂用絺布加勺南枋酒在東上醴也絺布葛屬素几葦席在西序下有几始鬼神也苴刌茅長五寸束之實于篚饌于西坫上苴猶藉也饌兩豆菹醢于西楹之東醢在西一鉶亞之醢在西南面取之得左取菹右取醢便其設之從獻豆兩亞之四籩亞之北上豆從主人獻祝籩從主婦獻尸祝北上菹與棗不東陳别於正饌黍稷二敦于階間西上藉用葦席藉猶薦也古文藉爲席匜水錯于槃中南流在西階之南簞巾在其東流匜吐水口也陳三鼎于門外之右北面北上設扄鼏門外之右門西也今文扄爲鉉匕爼在西塾之西不饌於塾上統於鼎也塾有西者是室南鄕羞燔爼在内西塾上南順南順於南面取縮執之便也肝俎在燔東主人及兄弟如葬服賓執事者如弔服皆卽位于門外如朝夕臨位婦人及内兄弟服卽位于堂亦如之葬服者旣夕曰丈夫髽散帶垂也賓執事者賓客來執事也祝免澡葛絰帶布席于室中東面右几降出及宗人卽位于門西東面南上祝亦執事免者祭祀之禮祝所親也澡治也治葛以爲首絰及帶接神宜變也然則士之屬官爲其長弔服加麻矣至於旣卒哭主人變服則除右几於席近南也宗人告有司具遂請拜賓如臨入門哭婦人哭臨朝夕哭主人卽位于堂衆主人及兄弟賓卽位于西方如反哭位旣夕曰乃反哭入門升自西階東面衆主人堂下東面北上此則異於朝夕祝入門左北面不與執事同位接神尊也宗人西階前北面當詔主人及賓之事祝盥升取苴降洗之升入設于几東席上東縮降洗觶升止哭縮從也古文縮爲蹙主人倚杖入祝從在左西面主人北旋倚杖西序乃入喪服小記曰虞杖不入於室祔杖不升於堂然則練杖不入於門明矣贊薦菹醢醢在北主婦不薦衰斬之服不執事也曾子問曰士祭不足則取於兄弟大功以下者佐食及執事盥出舉長在左舉舉鼎也長在左西方位也凡事宗人詔之鼎入設于西階前東面北上匕俎從設左人抽扄鼏匕佐食及右人載載載於俎佐食載則亦在右矣今文扄爲鉉古文鼏爲密卒朼者逆退復位復賓位也俎入設于豆東魚亞之腊特亞次也今文無之贊設二敦于俎南黍其東稷簋實尊黍也設一鉶于豆南鉶菜羮也佐食出立于戸西饌巳也今文無于戸西贊者徹鼎反于門外祝酌醴命佐食啓㑹佐食許諾啓㑹郤于敦南復位㑹合也謂敦蓋也復位出立于戸西今文啓爲開祝奠觶于鉶南復位主人再拜稽首復位復主人之左祝饗命佐食祭饗告神饗此祭祭于苴也饗神辭記所謂哀子某哀顯相夙興夜處不寧下至適爾皇祖某甫尚饗是也佐食許諾鉤袒取黍稷祭于苴三取膚祭祭如初祝取奠觶祭亦如之不盡益反奠之主人再拜稽首鉤袒如今擐衣也苴所以藉祭也孝子始將納尸以事其親爲神疑於其位設苴以定之耳或日苴主道也則特牲少牢當有主象而無何乎祝祝卒主人拜如初哭出復位祝祝者釋孝子祭辭祝迎尸一人衰絰奉篚哭從尸尸主也孝子之祭不見親之形象心無所繫立尸而主意焉一人主人兄弟檀弓曰旣封主人贈而祝宿虞尸尸入門丈夫踊婦人踊踊不同文者有先後也尸入主人不降者喪事主哀不主敬淳尸盥宗人授巾淳沃也沃尸盥者賔執事者也尸及階祝延尸延進也告之以升尸升宗人詔踊如初言詔踊如初則凡踊宗人詔之尸入户踊如初哭止哭止尊尸婦人入于房辟執事者主人及祝拜妥尸尸拜遂坐妥安坐也從者錯篚于尸左席上立于其北北席北也尸取奠左執之取菹擩于醢祭于豆間祝命佐食墮祭下祭曰墮墮之猶言墮下也周禮曰旣祭則藏其墮謂此也今文墮爲綏特牲少牢或爲羞失古正矣齊魯之間謂祭爲墮佐食取黍稷肺祭授尸尸祭之祭奠祝祝主人拜如初尸嘗醴奠之如初亦祝祝卒乃再拜稽首佐食舉肺脊授尸尸受振祭嚌之左手執之右手將有事也尸食之時亦奠肺脊于豆祝命佐食邇敦佐食舉黍錯于席上邇近也尸祭鉶嘗鉶右手也少牢曰以柶祭羊鉶遂以祭豕鉶嘗羊鉶泰羮湆自門入設于鉶南胾四豆設于左博異味也湆肉汁也胾切肉也尸飯播餘于篚不反餘也古者飯用手吉時播餘于㑹古文播爲半三飯佐食舉幹尸受振祭嚌之實于篚飯間㗖肉安食氣又三飯舉胳祭如初佐食舉魚腊實于篚尸不受魚腊以喪不備味又三飯舉肩祭如初後舉肩者貴要成也舉魚腊俎俎釋三个釋猶遺也遺之者君子不盡人之歡不竭人之忠个猶枚也今俗或名枚曰個音相近此腊亦七體如其牲也尸卒食佐食受肺脊實于篚反黍如初設九飯而巳士禮也篚猶吉祭之有所俎主人洗廢爵酌酒酳尸尸拜受爵主人北面荅拜尸祭酒嘗之爵無足曰廢爵酳安食也主人北面以酳酢變吉也凡異者皆變吉古文酳作酌賔長以肝從實于俎縮右鹽縮從也從實肝炙於俎也喪祭進柢右鹽於俎近北便尸取之也縮執俎言右鹽則肝鹽併也尸左執爵右取肝擩鹽振祭嚌之加于俎賔降反俎于西塾復位取肝右手也加于俎從其牲體也以喪不志于味尸卒爵祝受不相爵主人拜尸荅拜不相爵喪祭於禮略相爵者特牲曰送爵皇尸卒爵祝酌授尸尸以醋主人主人拜受爵尸荅拜醋報主人坐祭卒爵拜尸荅拜筵祝南面祝接神尊也筵用萑席主人獻祝祝拜坐受爵主人荅拜獻祝因反西面位薦菹醢設俎祝左執爵祭薦奠爵興取肺坐祭嚌之興加于俎祭酒嘗之肝從祝取肝擩鹽振祭嚌之加于俎卒爵拜主人荅拜今文無擩鹽祝坐授主人主人酌獻佐食佐食北面拜坐受爵主人荅拜佐食祭酒卒爵拜主人荅拜受爵出實于篚升堂復位篚在庭不復入事巳也亦因取杖乃東面立主婦洗足爵于房中酌亞獻尸如主人儀爵有足輕者飾也昬禮曰内洗在北堂直室東隅自反兩籩棗栗設于㑹南棗在西尚棗棗美尸祭籩祭酒如初賔以燔從如初尸祭燔卒爵如初酌獻祝籩燔從獻佐食皆如初以虚爵入于房𥘉主人儀賔長洗繶爵三獻燔從如初儀繶爵口足之間有篆又彌飾婦人復位復堂上西面位事巳尸將出當哭踊祝出戸西面告利成主人哭西面告告主人也利猶養也成畢也言養禮畢也不言養禮畢於尸間嫌皆哭丈夫婦人於主人哭斯哭矣祝入尸謖謖起也祝入而無事尸則知起矣不告尸者無遣尊者之道也古文謖或爲休從者奉篚哭如初初哭從尸祝前尸出戸踊如初降堂踊如初出門亦如之前道也如初者出如入降如升三者之節悲哀同祝反入徹設于西北隅如其設也几在南厞用席改設饌者不知鬼神之節改設之庶幾歆饗所以爲厭飫也几在南變古文明東面不南面漸也厞隱也干厞隱之處從其幽闇祝薦席徹入于房祝自執其俎出徹薦席者執事者祝薦席則初自房來贊闔牖戸鬼神尚居幽闇或者逺人乎贊佐食者主人降賔出宗人詔主人降賔則出廟門主人出門哭止皆復位門外未入位宗人告事畢賔出主人送拜稽顙送拜者明于大門外也賔執事者皆去卽徹室中之饌者兄弟也記虞沐浴不櫛沐浴者將祭自絜清不櫛未在於飾也唯三年之喪不櫛期以下櫛可也今文曰沐浴陳牲于廟門外北首西上寢右言牲腊在其中西上變吉寢右者當升左胖也腊用棜檀弓曰旣反哭主人與有司視虞牲日中而行事朝葬日中而虞君子舉事必用辰正也再虞三虞皆質明殺于廟門西主人不視豚解主人視牲不視殺凡爲喪事略也豚解解前後脛脊脅而巳孰乃體解升於鼎也今文無庿羮飪升左肩臂臑肫骼脊脅離肺膚祭三取諸左膉上肺祭一實于上鼎肉謂之羮飪孰也脊脅正脊正脅也喪祭略七體耳離肺舉肺也少牢饋食禮曰舉肺一長終肺祭肺三皆刌膉脰肉也古文曰左股上此字從肉殳殳矛之殳聲升魚鱄鮒九實于中鼎差減之升腊左胖髀不升實于下鼎腊亦七體牲之類皆設扄鼏陳之嫌旣陳乃設扄鼏也今文扄作鉉古文鼏作密載猶進柢魚進鬐猶猶士喪旣夕言未可以吉也柢本也鬐脊也今文柢爲胝古文鬐爲耆祝俎髀脰脊脅離肺陳于階間敦東不升於鼎賤也統於敦明神惠也祭以離肺下尸淳尸盥執槃西面執匜東面執巾在其北東面宗人授巾南面槃以盛棄水爲淺汚人也執巾不授巾卑也主人在室則宗人升戸外北面當詔主人室事佐食無事則出戸負依南面室中尊不空立戸牖之間謂之依鉶芼用苦若薇有滑夏用葵冬用苴有柶苦苦荼也苴堇類也乾則滑夏秋用生葵冬春用乾苴古文苦爲枯今文或作芐豆實葵菹菹以西蠃醢籩棗烝栗擇棗烝栗擇則菹刌也棗烝栗擇則豆不揭籩有籐也尸入祝從尸祝在主人前也嫌如初時主人倚杖入祝從之初時主人之心尚若親存宜自親之今旣接神祝當詔侑尸也尸坐不說屨侍神不敢燕惰也今文說爲稅尸謖祝前鄕尸前道也祝道尸必先鄕之爲之節還出戸又鄕尸還過主人又鄕尸還降階又鄕尸過主人則西階上不言及階明主人見尸有踧踖之敬降階還及門如出戸及至也言還至門明其間無節也降階如升時將出門如出戸時皆還鄉尸也每將還必有辟退之容凡前尸之禮儀在此尸出祝反入門左北面復位然後宗人詔降尸服卒者之上服上服者如特牲士玄端也不以爵弁服爲上者祭於君之服非所以自配鬼神士之妻則宵衣耳男男尸女女尸必使異姓不使賤者異姓婦也賤者謂庶孫之妾也尸配尊者必使適也無尸則禮及薦饌皆如初無尸謂無孫列可使者也殤亦是也禮謂衣服即位升降旣饗祭于苴祝祝卒記異者之節不綏祭無泰羮湆胾從獻不綏言獻記終始也事尸之禮始於綏祭終於從獻綏當爲墮主人哭出復位於祝祝卒祝闔牖戸降復位于門西門西北面位也男女拾踊三拾更也三更踊如食間隱之如尸一食九飯之頃也祝升止哭聲三啓戸聲者噫歆也將啓戸警覺神也今文啓爲開主人入親之祝從啓牖鄕如初牖先闔後啓扇在内也鄕牖名也如初者主人入祝從在左主人哭出復位堂上位也卒徹祝佐食降復位祝復門西北面位佐食復西方位不復設西北隅者重閉牖户䙝也宗人詔降如初初贊闔牖戸宗人詔主人降之始虞用柔日葬之日日中虞欲安之柔日隂隂取其靜曰哀子某哀顯相夙興夜處不寧曰辭也祝祝之辭也喪祭稱哀顯相助祭者也顯明也相助也詩云於穆清廟肅雍顯相不寧悲思不安敢用潔牲剛鬣敢昧冒之辭豕曰剛鬣香合黍也大夫士於黍稷之號合言普淖而巳此言香合蓋記者誤耳辭次黍又不得在薦上嘉薦普淖嘉薦菹醢也普淖黍稷也普大也淖和也德能大和乃有黍稷故以爲號云明齊溲酒明齊新水也言以新水溲釀此酒也郊特牲曰明水涗齊貴新也或曰當爲明視謂兔腊也今文曰明粢粢稷也皆非其次今文溲爲醙哀薦祫事始虞謂之祫事者主欲其祫先祖也以與先祖合爲安今文曰吉事適爾皇祖某甫爾女也女死者告之以適皇祖所以安之也皇君也某甫皇祖字也若言尼甫饗勸強之也再虞皆如初曰哀薦虞事丁日葬則巳日再虞其祝辭異者一言耳三虞卒哭他用剛日亦如初曰哀薦成事當祔於祖廟爲神安於此後虞改用剛日剛日陽也陽取其動也士則庚日三虞壬日卒哭其祝辭異者亦一言耳他謂不及時而葬者喪服小記曰報葬者報虞者三月而後卒哭然則虞卒哭之間有祭脡爲挺有乾肉折俎二尹縮祭半尹在西塾乾肉牲體之脯也如今涼州烏翅矣折以爲俎實優尸也尹正也雖其折之必使正縮從也古文縮爲蹙尸出執几從席從祝入亦告利成入前尸尸乃出几席素几葦席也以几席從執事也尸出門右南面俟設席也席設于尊西北東面几在南賔出復位將入臨之位士喪禮賔繼兄弟北上門東北面西上門西北面東上西方東面北上主人出即位于門東少南婦人出即位于主人之北皆西面哭不止婦人出者重餞尸尸即席坐唯主人不哭洗廢爵酌獻尸尸拜受主人拜送哭復位薦脯醢設俎于薦東朐在南朐脯及乾肉之屈也屈者在南變於吉尸左執爵取脯擩醢祭之佐食授嚌授乾肉之祭尸受振祭嚌反之祭酒卒爵奠于南方反之反於佐食佐食反之於俎尸奠爵禮有終主人及兄弟踊婦人亦如之主婦洗足爵亞獻如主人儀無從踊如初賔長洗繶爵三獻如亞獻踊如初佐食取俎實于篚尸謖從者奉篚哭從之祝前哭者皆從及大門内踊如初男女從尸男由左女由右及至也從尸不出大門者由廟門外無事尸之禮也古文謖作沐尸出門哭者止以餞於外大門猶廟門賔出主人送拜稽顙送賔拜於大門外主婦亦拜賔女賔也不言出不言送拜之於闈門之内闈門如今東西掖門丈夫說絰帶于廟門外旣卒哭當變麻受之以葛也夕日則服葛者爲祔期今文說爲稅入徹主人不與入徹者兄弟大功以下言主人不與則知丈夫婦人在其中古文與爲豫婦人說首絰不說帶不脫帶齊斬婦人帶不變也婦人少變而重帶帶下體之上也大功小功者葛帶時亦不說者未可以輕文變於主婦之質至祔葛帶以即位檀弓曰婦人不葛帶無尸則不餞猶出几席設如初拾踊三以餞尸者本爲送神也丈夫婦人亦從几席而出古文席爲筵哭止吿事畢賔出死三日而殯三月而葬遂卒哭謂士也雜記曰大夫三月而葬五月而卒哭諸侯五月而葬七月而卒哭此記更從死起異人之間其義或殊將旦而祔則薦薦謂卒哭之祭卒辭曰哀子某來日某隮祔爾于爾皇祖某甫尚饗卒辭卒哭之祝辭隮升也尚庶幾也不稱饌明主爲告祔也今文隮爲齊女子曰皇祖妣某氏女孫祔於祖母婦曰孫婦于皇祖姑某氏不言爾曰孫婦婦差䟽也今文無某氏其他辭一也來日某隮祔尚饗饗辭曰哀子某圭爲而哀薦之饗饗辭勸強尸之辭也圭絜也詩曰吉圭爲饎凡吉祭饗尸曰孝子明日以其班祔卒哭之明日也班次也喪服小記曰祔必以其昭穆亡則中一以上凡祔巳復于寢如旣祫主反其廟練而後遷廟古文班或爲辨辨氏姓或然今文爲胖沐浴櫛搔翦彌自飾也搔當爲爪今文曰沐浴搔翦或爲蚤揃揃或爲鬋用專膚爲折俎取諸脰膉專猶厚也折俎謂主婦以下俎也體盡人多折骨以爲之今以脰膉貶於純吉今文字爲折俎而說以爲肵俎亦甚誣矣古文脰膉爲頭嗌也其他如饋食如特牲饋食之事或云以左胖虞右胖祔今此如饋食則尸俎肵俎皆有肩臂豈復用虞臂乎其不然明矣用嗣尸虞祔尚質未暇筮尸曰孝子某孝顯相夙興夜處小心畏忌不惰其身不寧稱孝者吉祭用尹祭尹祭脯也大夫士祭無云脯者今不言牲號而云尹祭亦記者誤矣嘉薦普淖普薦溲酒普薦鉶羮不稱牲記其異者今文溲爲醙適爾皇祖某甫以隮祔爾孫某甫尚饗欲其祔合兩告之曾子問曰天子崩國君薨則祝取羣廟之主而藏諸祖廟禮也卒哭成事而後主各反其廟然則士之皇祖於卒哭亦反其廟無主則反廟之禮未聞以具幣告之乎朞而小祥小祥祭名祥吉也擅弓曰歸祥肉古文朞皆作基曰薦此常事祝辭之異者言常者朞而祭禮也古文常爲祥又朞而大祥曰薦此祥事又復也中月而禫中猶間也禫祭名也言大祥間一月自喪至此凡二十七月禪之言澹澹然平安意也古文禫或爲導是月也吉祭猶未配是月是􅎭月也當四時之祭月則祭猶未以某妃配某氏哀未忘也少牢饋食禮祝祝曰孝孫某敢用柔毛剛鬣嘉薦普淖用薦歲事于皇祖伯某以某妃配某氏尚饗儀禮卷第十四經二千七十九字注三千四百四十三字
