body:
  text: 儀禮卷第二士昬禮第二儀禮鄭氏注昬禮下達納采用鴈逹通也將欲與彼合昬姻必先使媒氏下通其言女氏許之乃後使人納其采擇之禮用鴈爲摯者取其順隂陽往來詩云取妻如之何匪媒不得昬必由媒交接設紹介皆所以養廉恥主人筵于戶西西上右几主人女父也筵爲神布席也戶西者尊處將以先祖之遺體許人故受其禮於禰廟也席西上右設几神不統於人席有首尾使者玄端至使者夫家之屬若羣吏使往來者玄端士莫夕之服又服以事其廟有司緇裳擯者出請事入吿擯者有司佐禮者請猶問也禮不必事雖知猶問之重愼也主人如賔服迎于門外再拜賔不荅拜揖入門外大門外不荅拜者奉使不敢當其盛禮至于廟門揖入三揖至于階三讓入三揖者至內􅋼將曲揖旣曲北靣揖當碑揖主人以賔升西靣賔升西階當阿東靣致命主人阼階上北靣再拜阿棟也入堂深示親親今文阿爲􅔑授于楹間南靣授於楹間明爲合好其節同也南靣並授也賔降出主人降授老鴈老羣吏之尊者擯者出請不必賔之事有無賔執鴈請問名主人許賔入授如初禮問名者将歸卜其吉凶古文禮爲醴擯者出請賔吿事畢入吿出請醴賔此醴亦當爲禮禮賔者欲厚之賔禮辭許禮辭一辭主人徹几改筵東上側尊甒醴于房中徹几改筵者鄕爲神今爲人側尊亦言無玄酒側尊於房中亦有篚有籩豆如冠禮之設主人迎賔于廟門外揖讓如初升主人北靣再拜賔西階上北靣荅拜主人拂几授校拜送賔以几辟北靣設于坐左之西階上荅拜拂拭也拭几者尊賔新之也校几足辟逡遁古文校爲枝賛者酌醴加角柶靣葉出于房賛佐也佐主人酌事也賛者亦洗酌加角柶覆之如冠禮矣出房南靣待主人迎受古文作擖主人受醴靣枋筵前西北靣賔拜受醴復位主人阼階上拜送主人西北靣疑立待賔卽筵也賔復位於西階上北靣明相尊敬此筵不主爲飮食起賛者薦脯醢薦進賔卽筵坐左執觶祭脯醢以柶祭醴三西階上北靣坐啐醴建柶興坐奠觶遂拜主人荅拜卽就也左執觶則祭以右手也凡祭於脯醢之豆間必所爲祭者謙敬示有所先也啐嘗也嘗之者成主人意建猶扱也興起也奠停也賔即筵奠于薦左降筵北靣坐取脯主人辭薦左籩豆之東降下也自取脯者尊主人之賜將歸執以反命辭者辭其親徹賔降授人脯出主人送于門外再拜人謂使者從者授於階下西靣然後出去納吉用鴈如納采禮歸卜於廟得吉兆復使使者往告昬姻之事於是定納徴玄纁束帛儷皮如納吉禮徴成也使使者納幣以成昬禮用玄纁者象隂陽備也束帛十端也周禮曰凡嫁子取妻入幣純帛無過五兩儷兩也執束帛以致命兩皮爲庭實皮鹿皮今文纁皆作熏請期用鴈主人辭賔許告期如納徴禮主人辭者陽倡隂和期日宜由夫家來也夫家必先卜之得吉日乃使使者往辭卽告之期初昬陳三鼎于寢門外東方北靣北上其實特豚合升去蹄舉肺脊二祭肺二魚十有四腊一肫髀不升皆飪設扃鼏期取妻之日鼎三者升豚魚腊也寢壻之室也北靣鄕內也特猶一也合升合左右胖升於鼎也去蹄蹄甲不用也舉肺脊者食時所先舉也肺者氣之主也周人尚焉脊者體之正也食時則祭之飯必舉之貴之也每皆二者夫婦各一耳凢魚之正十五而鼎減一爲十四者欲其敵偶也腊免腊也肫或作純純全也凡腊用全髀不升者近竅賤也飪熟也扃所以杠鼎鼏覆之古文純爲鈞髀爲脾今文扃作鉉鼏皆作密設洗于阼階東南洗所以承盥洗之噐棄水者饌于房中醯醬二豆菹醢四豆兼巾之黍稷四敦皆蓋醯醬者以醯和醬生人尚褻味兼巾之者六豆共巾也巾爲禦塵蓋爲尚温周禮曰食齊視春時大羹湆在爨大羮湆煑肉汁也大古之羮無鹽菜爨火上周禮曰羮齊視夏時今文湆皆作汁尊于室中北墉下有禁玄酒在西綌幂加勺皆南枋墉牆也禁所以􅔑甒者玄酒不忘古也綌麤葛今文枋作柄尊于房戸之東無玄酒篚在南實四爵合卺無玄酒者略之也夫婦酌於內尊其餘酌於外尊合卺破匏也四爵兩卺凡六爲夫婦各三酳一升曰爵主人爵弁纁裳緇袘從者畢玄端乗墨車從車二乗執燭前馬主人壻也壻爲婦主爵弁而纁裳玄冕之次大夫以上親迎冕服冕服迎者鬼神之鬼神之者所以重之親之纁裳者衣緇衣不言衣與帶而言袘者空其文明其與袘俱用緇袘謂縁袘之言施以緇緣裳象陽氣下施從者有司也乗二車從行者也畢猶皆也墨車􅃮車士而乗墨車攝盛也執燭前馬使徒役持炬火居前炤道婦車亦如之有裧亦如之者車同等士妻之車夫家共之大夫以上嫁女則自以車送之裧車裳幃周禮謂之容車有容則固有蓋至于門外婦家大門之外主人筵于戸西西上右几主人女父也筵爲神布席女次純衣纁袡立于房中南靣次首飾也今時髲也周禮追師掌爲副編次純衣絲衣女從者畢袗玄則此亦玄矣袡亦縁也袡之言任也以纁緣其衣象隂氣上任也凡婦人不常施袡之衣盛昬禮爲此服䘮大記曰復衣不以袡明非常姆纚笄宵衣在其右姆婦人年五十無子出而不復嫁能以婦道敎人者若今時乳母矣纚縚髪笄今時簮也纚亦廣充幅長六尺宵讀爲詩素衣未綃之綃魯詩以綃爲綺屬也姆亦玄衣以綃爲領因以爲名且相别耳姆在女右當詔以婦禮女從者畢袗玄纚笄𬒳顈黼在其後女從者謂姪娣也詩云諸娣從之祁祁如雲袗同也同玄者上下皆玄顈禪也詩云素衣朱襮爾雅云黼領謂之襮周禮曰白與黒謂之黼天子諸侯后夫人狄衣卿大夫之妻刺黼以爲領如今偃領矣士妻始嫁施禪黼於領上假盛飾耳言𬒳明非常服主人玄端迎于門外西靣再拜賔東靣荅拜賔壻主人揖入賔執鴈從至于廟門揖入三揖至于階三讓主人升西靣賔升北靣奠鴈再拜稽首降出婦從降自西階主人不降送賔升奠鴈拜主人不荅明主爲授女耳主人不降送禮不參壻御婦車授綏姆辭不受壻御者親而下之綏所以引升車者僕人之禮必授人綏婦乗以几姆加景乃驅御者代乗以几者尚安舒也景之制蓋如明衣加之以爲行道禦塵令衣鮮明也景亦明也驅行也行車輪三周御者乃代壻今文景作憬壻乗其車先俟于門外壻車在大門外乗之先者道之也男率女女從男夫婦剛柔之義自此始也俟待也門外壻家大門外婦至主人揖婦以入及寢門揖入升自西階媵布席于奥夫入于室即席婦尊西南靣媵御沃盥交升自西階道婦入也媵送也謂女從者也御當爲訝訝迎也謂壻從者也媵沃壻盥於南洗御沃婦盥於北洗夫婦始接情有廉恥媵御交道其志贊者徹尊幂舉者盥出除鼏舉鼎入陳于阼階南西靣北上匕俎從設執匕者執俎者從鼎而入設之匕所以別出牲體也俎所以載也北靣載執而俟執俎而立俟豆先設匙者逆退復位于門東北靣西上執匕者事畢逆退由便至此乃著其位略賤也贊者設醬于席前菹醢在其北俎入設于豆東魚次腊特于俎北豆東菹醢之東贊設黍于醬東稷在其東設湆于醬南饌要方也設對醬于東對醬婦醬也設之當特俎菹醢在其南北上設黍于腊北其西稷設湆于醬北御布對席贊啓會卻于敦南對敦于北啓發也今文啓作開古文卻爲綌贊吿具揖婦即對筵皆坐皆祭祭薦黍稷肺贊者西靣告饌具也壻揖婦使即席薦菹醢贊爾黍授肺脊皆食以湆醬皆祭舉食舉也爾移也移置席上便其食也皆食食黍也以用也用者謂啜湆𠯗醬古文黍作稷三飯卒食卒巳也同牢示親不主爲食起三飯而成禮也贊洗爵酌酳主人主人拜受贊戶內北靣荅拜酳婦亦如之皆祭酳漱也酳之言演也安也漱所以絜口且演安其所食酳酌內尊贊以肝從皆振祭嚌肝皆實于菹豆肝肝炙也飮酒宜有肴以安之卒爵皆拜贊荅拜受爵再酳如初無從三酳用卺亦如之亦無從也贊洗爵酌于戶外尊入戶西北靣奠爵拜皆荅拜坐祭卒爵拜皆荅拜興贊酌者自酢也主人出婦復位復尊西南靣之位乃徹于房中如設于室尊否徹室中之饌設于房中爲媵御餕之徹尊不設有外尊也主人說服于房媵受婦說服于室御受姆授巾巾所以自絜清今文說皆作稅御衽于奥媵祍良席在東皆有枕北止祍卧席也婦人稱夫曰良孟子曰將見良人之所之止足也古文止作趾主人入親說婦之纓入者從房還入室也婦人十五許嫁笄而禮之因著纓明有繫也蓋以五采爲之其制未聞燭出昬禮畢將卧息媵餕主人之餘御餕婦餘賛酌外尊酳之外尊房戶外之東尊媵侍于戸外呼則聞爲尊者有所徴求今文侍作待夙興婦沭浴纚笄宵衣以俟見夙早也昏明日之晨興起也俟待也待見於舅姑寢門之外古者命士以上年十五父子異宫質明賛見婦于舅姑席于阼舅即席席于房外南靣姑即席質平也房外房戶外之西古文舅皆作咎婦執笲棗栗自門入升自西階進拜奠于席笲竹噐而衣者其形蓋如今之筥􅠚蘆矣進拜者進東靣乃拜奠之者舅尊不敢授也舅坐撫之興荅拜婦還又拜還又拜者還於先拜處拜婦人與丈夫爲禮則俠拜降階受笲腵脩升進北靣拜奠于席姑坐舉以興拜授人人有司姑執笲以起荅婦拜授有司徹之舅則宰徹之賛醴婦醴當爲禮賛禮婦者以其婦道新成親厚之席于戶牖間室戶西牖東南靣位側尊甒醴于房中婦疑立于席西疑正立自定之貌賛者酌醴加柶靣枋出房席前北靣婦東靣拜受賛西階上北靣拜送婦又拜薦脯醢婦東靣拜賛北靣荅之變于丈夫始冠成人之禮婦升席左執觶右祭脯醢以柶祭醴三降席東靣坐啐醴建柶興拜賛荅拜婦又拜奠于薦東北靣坐取脯降出授人于門外奠于薦東升席奠之取脯降出授人親徹且榮得禮人謂婦氏人舅姑入于室婦盥饋饋者婦道旣成成以孝養特豚合升側載無魚腊無稷並南上其他如取女禮側載者右胖載之舅爼左胖載之姑爼異尊卑並南上者舅姑共席于奥其饌各以南爲上其他謂醬湆菹醢女謂婦也如取婦禮同牢時今文並當作併婦賛成祭卒食一酳無從賛成祭者授處之今文無成也席于北墉下墉牆也室中北牆下婦徹設席前如初西上婦餕舅辭易醬婦餕者卽席將餕也辭易醬者嫌淬汙婦餕姑之饌御賛祭豆黍肺舉肺脊乃食卒姑酳之婦拜受姑拜送坐祭卒爵姑受奠之奠之奠于篚婦徹于房中媵御餕姑酳之雖無娣媵先於是與始飯之錯古者嫁女必姪娣從謂之媵姪兄之子娣女弟也娣尊姪卑若或無娣猶先媵客之也始飯謂舅姑錯者媵餕舅餘御餕姑餘也古文始爲姑舅姑共饗婦以一獻之禮舅洗于南洗姑洗于北洗奠酬以酒食勞人曰饗南洗在庭北洗在北堂設兩洗者獻酬酢以絜清爲敬奠酬者明正禮成不復舉凡酬酒皆奠於薦左不舉其燕則更使人舉爵舅姑先降自西階婦降自阼階授之室使爲主明代已歸婦俎于婦氏人言俎則饗禮有牲矣婦氏人丈夫送婦者使有司歸以婦俎當以反命於女之父母明其得禮舅饗送者以一獻之禮酬以束錦送者女家有司也爵至酬賔又從之以束錦所以相厚古文錦皆爲帛姑饗婦人送者酬以束錦婦人送者隷子弟之妻妾凡饗速之若異邦則贈丈夫送者以束錦贈送也就賔館若舅姑旣没則婦入三月乃奠菜没終也奠菜者以篚祭菜也蓋用堇席于廟奥東靣右几席于北方南靣庿考妣之廟北方墉下祝盥婦盥于門外婦執笲菜祝帥婦以入祝告稱婦之姓曰某氏來婦敢奠嘉菜于皇舅某子帥道也入入室也某氏者齊女則曰姜氏魯女則曰姬氏來婦言來爲婦嘉美也皇君也婦拜扱地坐奠菜於几東席上還又拜如初扱地手至地也婦人扱地猶男子稽首婦降堂取笲菜入祝曰某氏來婦敢告于皇姑某氏奠菜于席如初禮降堂階上也室事交乎戶今降堂者敬也於姑言敢告舅尊於姑婦出祝闔牖戸凡廟無事則閉之老醴婦于房中南靣如舅姑醴婦之禮因於廟見禮之壻饗婦送者丈夫婦人如舅姑饗禮記士昬禮凡行事必用昬昕受諸禰廟辭無不腆無辱用昕使者用昬壻也腆善也賔不稱幣不善主人不謝來辱摰不用死皮帛必可制摯鴈也皮帛儷皮束帛也腊必用鮮魚用鮒必殽全殽全者不餧敗不剥傷女子許嫁笄而醴之稱字許嫁已受納徴禮也笄女之禮猶冠男也使主婦女賔執其禮祖廟未毀教于公宫三月若祖廟巳毀則教于宗室祖廟女高祖爲君者之廟也以有緦麻之親就尊者之官敎以婦德婦言婦容婦功宗室大宗之家問名主人受鴈還西靣對賔受命乃降受鴈于兩楹間南靣還于阼階上對賔以女名祭醴始扱壹祭又扱再祭賔右取脯左奉之乃歸執以反命反命謂使者問名納吉納徴請期還報於壻父納徴執皮攝之內文兼執足左首隨入西上參分庭一在南攝猶辟也兼執足者左手執前兩足右手執後兩足左首象生曲禮曰執禽者左手隨入爲門中阨狹西上中庭位併賔致命釋外足見文主人受幣士受皮者自東出于後自左受遂坐攝皮逆退適東璧賔致命主人受幣庭實所用爲節士謂若中士下士不命者以主人爲官長自由也父醴女而俟迎者母南靣于房外女旣次純衣父醴之于房中南靣蓋母薦焉重昬禮也女奠爵于薦東立于位而侯壻壻至父出使擯者請事母出南靣房外示親授壻且當戒女也女出于母左父西靣戒之必有正焉若衣若笄毋戒諸西階上不降必有正焉者以託戒使不忘婦乗以几從者二人坐持几相對持几者重愼之婦入寢門賛者徹尊幂酌玄酒三屬于尊棄餘水于堂下階間加勺屬注也玄酒涗水貴新昬禮又貴新故事至乃取之三注于尊中笲緇被纁裏加于橋舅荅拜宰徹笲𬒳表也笲有衣者婦見舅姑以飾爲敬橋所以􅔑笲其制未聞今文橋爲鎬婦席薦饌于房醴婦饗婦之席薦也饗婦姑薦焉舅姑共饗婦舅獻爵姑薦脯醢婦洗在北堂直室東隅篚在東北靣盥洗在北堂所謂北洗北堂房中半以北洗南北直室東隅東西直房戶與隅間婦酢舅更爵自薦更爵男女不相因也不敢辭洗舅降則辟于房不敢拜洗不敢與尊者爲禮凡婦人相饗無降姑饗婦人送者于房無降者以北洗篚在上婦入三月然後祭行入夫之室三月之後於祭乃行謂助祭也庻婦則使人醮之婦不饋庶婦庶子之婦也使人醮之不饗也酒不酬酢曰醮亦有脯醢適婦酌之以醴尊之庶婦酌之以酒卑之其儀則同不饋者共養統於適也昬辭曰吾子有惠貺室某也昬辭擯者請事告之辭吾子謂女父也稱有惠明下逹貺賜也室猶妻也子謂公冶長可妻也某壻名某有先人之禮使某也請納采某壻父名也某也使名也對曰某之子憃愚又弗能敎吾子命之某不敢辭對曰者擯出納賔之辭某女父名也吾子謂使者今文弗爲不無能字致命曰敢納采問名曰某旣受命將加諸卜敢請女爲誰氏某使者名也誰氏者謙也不必其主人之女對曰吾子有命且以備數而擇之某不敢辭卒曰某氏不記之者明爲主人之女醴曰子爲事故至於某之室某有先入之禮請醴從者言從者謙不敢斥也今文於爲于對曰某旣得將事矣敢辭將行先人之禮敢固以請主人辭固如故某辭不得命敢不從也賔辭也不得命者不得許巳之命納吉曰吾子有貺命某加諸卜占曰吉使某也敢告貺賜也賜命謂許以女名也某壻父名對曰某之子不敎唯恐弗堪子有吉我與在某不敢辭與猶兼也古文與爲豫納徴曰吾子有嘉命貺室某也某有先人之禮儷皮束帛使某也請納徴致命曰某敢納徴對曰吾子順先典貺某重禮某不敢辭敢不承命典常也法也請期曰吾子有賜命某旣申受命矣惟是三族之不虞使某也請吉日三族謂父昆弟巳昆弟子昆弟虞度也不億度謂卒有死䘮此三族者巳及子皆爲服期期服則踰年欲及今之吉也雜記曰大功之末可以冠子嫁子對曰某旣前受命矣唯命是聽前受命者申前事也曰某命某聽命于吾子曰某壻父名也對曰某固唯命是聽使者曰某使某受命吾子不許某敢不告期曰某日某吉日之甲乙對曰某敢不敬須須待凡使者歸反命曰某旣得將事矣敢以禮告告禮所執脯主人曰聞命矣父醮子子壻命之曰往迎爾相承我宗事相助也宗事宗庿之事勗帥以敬先妣之嗣若則有常勗勉也若猶女也勉帥婦道以敬其爲先妣之嗣女之行則當有常深戒之詩云大姒嗣徽音子曰諾唯恐弗堪不敢忘命賔至擯者請對曰吾子命某以兹初昬使某將請承命賔壻也命某某壻父名兹此也將行也使某行昬禮來迎對曰某固敬具以須父送女命之曰戒之敬之夙夜毋違命夙早也早起夜卧命舅姑之敎命古文毋爲無毋施衿結帨曰勉之敬之夙夜無違宫事帨佩巾庶母及門內施鞶申之以父母之命命之曰敬恭聽宗爾父母之言夙夜無愆視諸衿鞶庶母父之妾也鞶鞶囊也男鞶革女鞶絲所以盛帨巾之屬爲謹敬申重也宗尊也愆過也諸之也示之以衿鞶者皆託戒使識之也不示之以衣笄者尊者之戒不嫌忘之視乃正宇今文作示俗誤行之壻授綏姆辭曰未敎不足與爲禮也姆敎人者宗子無父母命之親皆没己躬命之宗子者適長子也命之命使者母命之在春秋紀裂繻來逆女是也躬猶親也親命之則宋公使公孫壽來納幣是也言宗子無父是有父者禮七十老而傳八十齊䘮之事不及若是者子代其父爲宗子其取也父命之支子則稱其宗支子庶昆弟也稱其宗子命使者弟稱其兄弟宗子之母弟若不親迎則婦入三月然後壻見曰某以得爲外昬姻請覿女氏稱昬壻氏稱姻覿見也主人對曰某以得爲外昬姻之數某之子未得濯漑於祭祀是以未敢見今吾子辱請吾子之就宫某將走見主人女父也以白造緇日辱對曰某以非他故不足以辱命請終賜見非他故彌親之辭命謂將走見之言今文無終賜對曰某得以爲昬姻之故不敢固辭敢不從不言外亦彌親之辭古文曰外昬姻主人出門左西靣壻入門東靣奠摯再拜出出門出内門入門入大門出内門不出大門者異於賔客也壻見於寢奠摯者壻有子道不敢授也摯雉也擯者以摯出請受欲使以賔客禮相見壻禮辭許受摯入主人再拜受壻再拜送出出巳見女父見主婦主婦闔扉立于其内主婦主人之婦也見主婦者兄弟之道冝相親也闔扉者婦人無外事扉左扉壻立于門外東靣主婦一拜壻荅再拜主婦又拜壻出必先一拜者婦人於丈夫必俠拜主人請醴及揖讓入醴以一獻之禮主婦薦奠酬無幣及與也無幣異於賔客壻出主人送再拜
