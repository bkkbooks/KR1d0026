body:
  text: 儀禮卷第十六少牢饋食禮第十六儀禮鄭氏注少牢饋食之禮禮將祭祀必先擇牲繫于牢而芻之羊豕曰少牢諸侯之卿大夫祭宗庿之牲日用丁巳内事用柔日必丁巳者取其令名自丁寧自變改皆爲謹敬必先諏此日明日乃筮筮旬有一日旬十日也以先月下旬之巳筮來月上旬之巳筮於庿門之外主人朝服西面于門東史朝服左執筮右抽上韇兼與筮執之東面受命于主人史家臣主筮事者主人曰孝孫某來日丁亥用薦歲事于皇祖伯某以某妃配某氏尚饗丁未必亥也直舉一日以言之耳禘于大庿禮曰日用丁亥不得丁亥則己亥辛亥亦用之無則苟有亥焉可也薦進也進歲時之祭事也皇君也伯某且字也大夫或因字爲謚春秋傳曰魯無駭卒請謚與族公命之以字爲展氏是也某仲叔季亦曰仲某叔某季某某妃某妻也合食曰配某氏若言姜氏子氏也尚庶幾饗歆也史曰諾西面于門西抽下韇左執筮右兼執韇以擊筮將問吉凶焉故擊之以動其神易曰蓍之德圜而神遂述命曰假爾大筮有常孝孫某來日丁亥用薦歲事于皇祖伯某以某妃配某氏尚饗𫐠循也重以主人辭告筮也假借也言因蓍之靈以問之常吉凶之占繇乃釋韇立筮卿大夫之著長五尺立筮由便卦者在左坐卦以木卒筮乃書卦于木示主人乃退占卦者史之屬也卦以木者每一爻畫地以識之交爻備書於板史受以示主人退占東面旅占之吉則史韇筮史兼執筮與卦以吿于主人占曰從從者求吉得吉之言乃官戒宗人命滌宰命爲酒乃退官戒戒諸官也當共祭祀事者使之具其物且齊也滌漑濯祭噐埽除宗庿若不吉則及逺日又筮日如初及至也逺日後丁若後巳宿宿讀爲肅肅進也大夫尊儀益多筮日旣戒諸官以齊戒矣至前祭一日又戒以進之使知祭日當來古文宿皆作羞前宿一日宿戒尸皆肅諸官之日又先肅尸者重所用爲尸者又爲將筮明日朝筮尸如筮日之禮命曰孝孫某來日丁亥用薦歲事于皇祖伯某以某妃配某氏以某之某爲尸尚饗筮卦占如初某之某者字尸父而名尸也字尸父尊鬼神也不前期三日筮尸者大夫下人君祭之朝乃視濯與士異吉則乃遂宿尸祝擯筮吉又遂肅尸重尸也旣肅尸乃肅諸官及執事者祝爲擯者尸神象主人再拜稽首祝吿曰孝孫某來日丁亥用薦歲事于皇祖伯某以某妃配某氏敢宿告尸以主人爲此事來肅尸拜許諾主人又再拜稽首主人退尸送揖不拜尸不拜者尸尊若不吉則遂改筮尸卽改筮之不及逺日旣宿尸反爲期于庿門之外爲期肅諸官而皆至定祭早晏之期爲期亦夕時也言旣肅尸反爲期明大夫尊肅尸而巳其爲賔及執事者使人肅之主人門東南面宗人朝服北面曰請祭期主人曰比於子比次早晏在於子也主人不西面者大夫尊於諸官有君道也爲期亦唯尸不來也宗人曰旦明行事主人曰諾乃退旦明旦日質明明日主人朝服即位于庿門之外東方南面宰宗人西面北上牲北首東上司馬刲羊司士擊豕宗人告備乃退刲擊皆謂殺之此實旣省吿備乃殺之文互者省也尚書傳曰羊屬火豕屬水雍人摡鼎匕俎于雍爨雍爨在門東南北上雍人掌割亨之事者爨竈也在門東南統於主人北上羊豕魚腊皆有竈竈西有鑊凡摡者皆陳之而後吿絜廩人摡甑甗匕與敦于廩爨廩爨在雍爨之北廩人掌米入之藏者甗如甑一孔匕所以上黍稷者也古文甑爲烝司宫摡豆籩勺爵􅒀觶凡洗篚于東堂下勺爵觚觶實于篚卒摡饌豆籩與篚于房中放于西方設洗于阼階東南當東榮放猶依也大夫攝官司宫兼掌祭噐也羹定雍人陳鼎五三鼎在羊鑊之西二鼎在豕鑊之西魚腊從羊膚從豕統於牲司馬升羊右胖髀不升肩臂臑膞骼正脊一脡脊一橫脊一短脅一正脅一代脅一皆二骨以並腸三胃三舉肺一祭肺三實于一鼎升猶上也上右胖周所貴也髀不升近竅賤也肩臂臑肱骨也膞骼股骨脊從前爲正脅旁中爲正脊先前脅先後屈而反猶噐之䋫也並併也脊脅骨多六體各取二骨併之以多爲貴舉肺一尸食所弁舉也祭肺三爲尸主人主婦古文胖皆作辯髀皆作脾今文並皆爲併司士升豕右胖髀不升肩臂臑膞骼正脊一脡脊一橫脊一短脅一正脅一代脅一皆二骨以並舉肺一祭肺三實于一鼎豕無腸胃君子不食溷腴雍人倫膚九實于一鼎倫擇也膚脅革肉擇之取美者司士又升魚腊魚十有五而鼎腊一純而鼎腊用麋司士又升副倅者合升左右胖曰純純猶全也卒脀皆設扃鼏乃舉陳鼎于庿門之外東方北面北上北面北上鄉内相隨古文鼏皆爲密司宫尊兩甒于房戸之間同棜皆有幂甒有玄酒房戸之間房西室戸東也棜無足禁者酒戒也大夫去足改名優尊者若不爲之戒然古文甒皆作廡今文鼏作幂司宫設罍水于洗東有枓設篚于洗西南肆枓㪺水噐也凡設水用罍沃盥用枓禮在此也改饌豆籩于房中南面如饋之設實豆籩之實改更也爲實之更之威儀多也如饋之設如其陳之左右也饋設東面小祝設槃匜與簞巾于西階東爲尸將盥主人朝服即位于阼階東西面爲將祭也司宫筵于奥祝設几于筵上右之布陳神坐也室中西南隅謂之奥席東面近南爲右主人出迎鼎除鼏士盥舉鼎主人先入道之也主人不盥不舉司宫取二勺于篚洗之兼執以升乃啓二尊之蓋幂奠于棜上加二勺于尊覆之南柄二尊兩甒也今文啓爲開古文柄皆爲枋鼎序入雍正執一七以從雍府執四七以從司士合執二俎以從司士賛者二人皆合執二俎以相從入相助陳鼎于東方當序南于洗西皆西面北上膚爲下七皆加于鼎東枋膚爲下以其加也南于洗西陳於洗西南俎皆設于鼎西西肆肵俎在羊俎之北亦西肆肵俎在北將先載也異其設文不當鼎宗人遣賔就主人皆盥于洗長朼長朼者長賔先次賔後也主人不朼言就主人者明親臨之古文朼作匕佐食上利升牢心舌載于肵俎心皆安下切上午割勿没其載于肵俎末在上舌皆切本末亦午割勿没其載于肵橫之皆如初爲之于爨也牢羊豕也安平也平割其下於載便也凡割本末食必正也午割使可絶也勿没爲其分散也肵之爲言敬也所以敬尸也周禮祭尚肺事尸尚心舌心舌知滋味今文切皆爲刌佐食遷肵俎于阼階西西縮乃反佐食二人上利升羊載右胖髀不升肩臂臑膞骼正脊一脡脊一橫脊一短脅一正脅一代脅一皆二骨以並腸三胃三長皆及俎拒舉肺一長終肺祭肺三皆切肩臂臑膞骼在兩端脊脅肺肩在上升之以尊卑載之以體次各有宜也拒讀爲介距之距俎距脛中當橫節也凡牲體之數及載備於此下利升豕其載如羊無腸胃體其載于俎皆進下進下變於食生也所以交於神明不敢以食道敬之至也鄕飮酒禮進腠羊次其體豕言進下互相見司士三人升魚腊膚魚用鮒十有五而俎縮載右首進腴右首進腴亦變於食生也有司載魚橫之少儀曰羞濡魚者進尾腊一純而俎亦進下肩在上如羊豕凡腊之體載禮在此膚九而俎亦橫載革順列載於俎令其皮相順亦者亦其骨體卒脀祝盥于洗升自西階主人盥升自阼階祝先入南面主人從戸内西面將納祭也主婦被錫衣侈袂薦自東房韭菹醓醢坐奠于筵前主婦賛者一人亦被錫衣侈袂執葵菹蠃醢以授主婦主婦不興遂受陪設于東韭菹在南葵菹在北主婦興入于房被錫讀爲髲鬄古者或剔賤者刑者之髮以被婦人之紒爲飾因名髲鬄焉此周禮所謂次也不纚笄者大夫妻尊亦衣綃衣而侈其袂耳侈者蓋半士妻之袂以益之衣三尺三寸祛尺入寸韭菹醓醢朝士之豆也而饋食用之豐大夫禮葵菹在䋫今文鬄爲緆蠃爲蝸佐食上利執羊俎下利執豕俎司士三人執魚腊膚俎序升自西階相從入設俎羊在豆東豕亞其北魚在羊東腊在豕東特膚當俎北端相助也主婦自東房執一金敦黍有蓋坐設于羊俎之南婦賛者執敦稷以授主婦主婦興受坐設于魚俎南又興受賛者敦黍坐設于稷南又興受賛者敦稷坐設于黍南敦皆南首主婦興入于房敦有首者尊者噐飾也飾蓋象龜周之禮飾噐各以其類龜有上下甲今文曰主婦入于房祝酌奠遂命佐食啓會佐食啓會蓋二以重設于敦南酌奠酌酒爲神奠之後酌者酒尊要成也特牲饋食禮曰祝洗酌奠奠于鉶南重累之主人西面祝在左主人再拜稽首祝祝曰孝孫某敢用柔毛剛鬛嘉薦普淖用薦歲事于皇祖伯某以某妃配某氏尚饗主人又再拜稽首羊曰柔毛豕曰剛鬛嘉薦菹醢也普淖黍稷也普大也淖和也德能大和乃有黍稷春秋傳曰奉粢以告曰潔粢豐盛謂其三時不害而民和年豐也祝出迎尸于庿門之外主人降立于阼階東西面祝先入門右尸入門左主人不出迎尸伸尊也特牲饋食禮曰尸入主人及賔皆辟位出亦如之祝入門右者辟尸盥也旣則後尸宗人奉槃東面于庭南一宗人奉匜水西面于槃東一宗人奉簞巾南面于槃北乃沃尸盥于槃上卒盥坐奠簞取巾興振之三以授尸坐取簞興以受尸巾庭南没霤祝延尸尸升自西階入祝從由後詔相之曰延延進也周禮曰大祝相尸禮祝從從尸升自西階主人升自阼階祝先入主人從祝接神先入冝也尸升筵祝主人西面立于戸内祝在左主人由祝後而居右尊也祝從尸尸即席乃卻居主人左祝主人皆拜妥尸尸不言尸荅拜遂坐拜妥尸拜之使安坐也尸自此荅拜遂坐而卒食其間有不啐奠不嘗鉶不告㫖大夫之禮尸彌尊也不告㫖者爲𥘉亦不饗所謂曲而殺祝反南面未有事也墮祭爾敦官各肅其職不命尸取韭菹辯㨎于三豆祭于豆間上佐食取黍稷于四敦下佐食取牢一切肺于俎以授上佐食上佐食兼與黍以授尸尸受同祭于豆祭牢羊豕也同合也合祭於俎豆之祭也黍稷之祭爲墮祭將食神餘尊之而祭之今文辯爲徧上佐食舉尸牢肺正脊以授尸上佐食爾上敦黍于筵上右之爾近也或曰移也右之便尸食也重言上佐食明更起不相因主人羞肵俎升自阼階置于膚北羞進也肵敬也親進之主人敬尸之加上佐食羞兩鉶取一羊鉶于房中坐設于韭菹之南下佐食又取一豕鉶于房中以從上佐食受坐設于羊鉶之南皆芼皆有柶尸扱以柶祭羊鉶逐以祭豕鉶嘗羊鉶芼菜也羊用苦豕用薇皆有滑食舉舉牢肺正脊也先飮啗之以爲道也三飯食以黍上佐食舉尸牢幹尸受振祭嚌之佐食受加于肵幹正脅也古文幹爲肝上佐食羞胾兩瓦豆有醢亦用瓦豆設于薦豆之北設於薦豆之北以其加也四豆亦䋫羊胾在南豕胾在北無臐曉者尚牲不尚味尸又食食胾上佐食舉尸一魚尸受振祭嚌之佐食受加于肵横之又復也或言食或言飯食大名小數曰飯魚横之者異於肉又食上佐食舉尸腊肩尸受振祭嚌之上佐食受加于肵腊魚皆一舉者少牢二牲略之腊必舉肩以肩爲終也别舉魚腊崇威儀又食上佐食舉尸牢骼如初如舉幹也又食不舉者卿大夫之禮不過五舉須侑尸尸告飽祝西面於主人之南獨侑不拜侑曰皇尸未實侑侑勸也祝獨勸者更則尸飽實猶飽也祝旣侑復反南面尸又食上佐食舉尸牢肩尸受振祭嚌之佐食受加于肵四舉牢體始於正脊終於肩尊於終始尸不飯告飽祝西面于主人之南祝當賛主人辭主人不言拜侑祝言而不拜主人不言而拜親䟽之宜尸又三飯爲祝一飯爲主人三飯尊卑之差凡十一飯下人君也上佐食受尸牢肺正脊加于肵言受者尸授之也尸授牢幹而實舉于俎豆食畢操以授佐食焉主人降洗爵升北面酌酒乃酳尸尸拜受主人拜送酳猶羡也旣食之而又飮之所以樂之古文酳作酌尸祭酒啐酒賔長羞牢肝用俎縮執俎肝亦縮進末鹽在右羞進也縮從也鹽在肝右便尸㨎之古文縮爲蹙尸左執爵右兼取肝㨎于俎鹽振祭嚌之加于菹豆卒爵主人拜祝受尸爵尸荅拜兼兼羊豕祝酌受尸尸醋主人主人拜受爵尸荅拜主人西面奠爵又拜主人受酢酒俠爵拜彌尊尸上佐食取四敦黍稷下佐食取牢一切肺以授上佐食上佐食以綏祭綏或作挼挼讀爲墮將受嘏亦尊尸餘而祭之古文墮爲肵主人佐執爵右受佐食坐祭之又祭酒不興遂啐酒右受佐食右手受墮於佐食也至此言坐祭之者明尸與主人爲禮也尸恒坐有事則起主人恒立有事則坐祝與二佐食皆出盥于洗入二佐食各取黍于一敦上佐食兼受搏之以授尸尸執以命祝命祝以嘏辭卒命祝祝受以東北面于戸西以嘏于主人曰皇尸命工祝承致多福無疆于女孝孫來女孝孫使女受祿于天冝稼于田眉壽萬年勿替引之嘏大也予主人以大福工官也承猶傳也來讀曰釐釐賜也耕種曰稼勿猶無也替廢也引長也言無廢止時長如是也古文嘏爲格祿爲福眉爲微替爲㭈㭈或爲臷臷替聲相近主人坐奠爵興再拜稽首興受黍坐振祭嚌之詩懷之實于左𬒮挂于季指執爵以興坐卒爵執爵以興坐奠爵拜尸荅拜執爵以興出宰夫以籩受嗇黍主人嘗之納諸内詩猶承也實於左𬒮便右手也季猶小也出出戸也宰夫掌飮食之事者收歛曰嗇明豐年乃有黍稷也復嘗之者重之至也納猶入也古文挂作卦主人獻祝設席南面祝拜于席上坐受室中迫狹主人西面荅拜不言拜送下尸薦兩豆菹醢葵菹蠃醢佐食設俎牢髀橫脊一短脅一腸一胃一膚三魚一橫之腊兩髀屬于尻皆升下體祝賤也魚橫者四物其俎殊之也腊兩髀屬于尻尤賤不殊祝取菹㨎于醢祭于豆間祝祭爼大夫祝俎無肺祭用膚逺下尸不嚌之膚不盛祭酒啐酒肝牢從祝取肝㨎于鹽振祭嚌之不興加于俎卒爵興亦如佐食授爵乃興不拜旣爵大夫祝賤也主人酌獻上佐食上佐食戸内牖東北面拜坐受爵主人西面荅拜佐食祭酒卒爵拜坐授爵興不啐而卒爵者大夫之佐食賤禮略俎設于兩階之間其俎折一膚佐食不得成禮於室中折者擇取牢正體餘骨折分用之有脀而無薦亦逺下尸主人又獻下佐食亦如之其脀亦設于階間西上亦折一膚上佐食旣獻則出就其俎特牲記曰佐食無事則中庭北面謂此時有司賛者取爵于篚以升授主婦賛者于房戶男女不相因特牲饋食禮曰佐食卒角主人受角降反于篚婦賛者受以授主婦主婦洗于房中出酌入戸西面拜獻尸入尸西面拜由便也不北面者辟人君夫人也拜而後獻者當俠拜也昬禮曰婦洗在北堂直室東隅尸拜受主婦主人之北西面拜送爵拜於主人之北西面婦人位在肉此拜於北則上拜於南矣由便也尸祭酒卒爵主婦拜祝受尸爵尸荅拜易爵洗酌授尸祝出易爵男女不同爵主婦拜受爵尸荅拜上佐食綏祭主婦西面于主人之北受祭祭之其綏祭如主人之禮不嘏卒爵拜尸荅拜不嘏夫婦一體綏亦當作挼古文爲肵主婦以爵出賛者受易爵于篚以授主婦于房中賛者有司賛者也易爵亦以授婦賛者婦賛者受房戸外入授主婦主婦洗酌獻祝祝拜坐受爵主婦荅拜于主人之北卒爵不興坐授主婦不俠拜下尸也今文曰祝拜受主婦受酌獻上佐食于戶内佐食北面拜坐受爵主婦西面荅拜祭酒卒爵坐授主婦主婦獻下佐食亦如之主婦受爵以入于房不言拜於主人之北可知也爵奠於内篚賔長洗爵獻于尸尸拜受爵賔戸西北面拜送爵尸祭酒卒爵賔拜祝受尸爵尸荅拜祝酌授尸賔拜受爵尸拜送爵賔坐奠爵遂拜執爵以興坐祭遂飮卒爵執爵以興坐奠爵拜尸荅拜賔酌獻祝祝拜坐受爵賔北面荅拜祝祭酒啐酒奠爵于其筵前啐酒而不啐爵祭事畢示醉也不獻佐食將儐尸禮殺主人出立于阼階上西面祝出立于西階上東面祝告曰利成利猶養也成畢也孝子之養禮畢祝入尸謖主人降立于阼階東西面謖起也謖或作休祝先尸從遂出于庿門事尸之禮訖於庿門祝反復位于室中主人亦入于室復位祝命佐食徹肵俎降設于堂下阼階南徹肵俎不出門將儐尸也肵俎而以儐尸者其本爲不反魚肉耳不云尸俎未歸尸司宫設對席乃四人𧃊大夫禮四人餕明惠大也上佐食盥升下佐食對之賔長二人備備四人餕也三餕亦盥升司士進一敦黍于上佐食又進一敦黍于下佐食皆右之于席上右之者東面在南西面在北資黍于羊俎兩端兩下是餕資猶減也減置於羊俎兩端則一賔長在上佐食之北一賔長在下佐食之南今文資作齎司士乃辯舉𧃊者皆祭黍祭舉舉舉膚今文辯爲徧主人西面三拜𧃊者𧃊者奠舉于俎皆荅拜皆反取舉三拜旅之示徧也言反者拜時或去其席在東面席者東面拜在西面席者皆南面拜司士進一鉶于上𧃊又進一鉶于次𧃊又進二豆湆于兩下乃皆食食舉湆肉汁也卒食主人洗一爵升酌以授上𧃊賛者洗三爵酌主人受于戸内以授次𧃊若是以辯皆不拜受爵主人西面三拜𧃊者𧃊者奠爵皆荅拜皆祭酒卒爵奠爵皆拜主人荅壹拜不拜受爵者大夫餕者賤也荅壹拜略也古文一爲壹也𧃊者三人興出出降實爵于篚反賔位上𧃊止主人受上𧃊爵酌以醋于戸内西面坐奠爵拜上𧃊荅拜坐祭酒啐酒主人自酢者上𧃊獨止當尸位尊不酌也上𧃊親嘏曰主人受祭之福胡壽保建家室親嘏不使祝授之亦以黍主人興坐奠爵拜執爵以興坐卒爵拜上𧃊荅拜上𧃊興出主人送乃退送佐食不拜賤儀禮卷第十六經二千九百七十九字注二千七百八十七字
