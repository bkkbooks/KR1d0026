body:
  text: 儀禮卷第十三旣夕禮第十三儀禮鄭氏注旣夕哭旣巳也謂岀門哭止復外位時請啓期告于賔將葬當遷柩于祖有司於是乃請啓肂之期於主人以告賔賔冝知其時也今文啓爲開夙興設盥于祖廟門外祖王父也下士祖禰共廟陳鼎皆如殯東方之饌亦如之皆皆三鼎也如殯如大歛旣殯之奠夷牀饌于階間夷之言尸也朝正柩用此牀二燭俟于殯門外早關以爲明也燭用烝丈夫髽散帶垂即位如初爲將啓變也此互文以相見耳髽婦人之變䘮服小記曰男子免而婦人髽男子冠而婦人笄如初朝夕哭門外位婦人不哭主人拜賔入即位袒此不象如𥘉者以男子入門不哭也不哭者將有事止讙囂商祝免袒執功布入升自西階盡階不升堂聲三啓三命哭功布灰治之布也執之以接神爲有所拂㧍也聲三三有聲存神也啓三三言啓告神也舊說以爲聲噫興也今文免作絻燭入炤徹與啓肂者祝降與夏祝交于階下取銘置于重祝降者祝徹宿奠降也與夏祝交事相接也夏祝取銘置于重爲啓肂遷之吉事交相左凶事交相右今文銘皆作名踊無筭主人也商祝拂柩用功布幠用夷衾拂去塵也幠覆之爲其形露遷于祖用軸遷徙也徙於祖朝祖庿也檀弓曰殷朝而殯於祖周朝而遂葬蓋象平生將出必辭尊者軸輁軸也軸狀如轉轔刻兩頭爲軹輁狀如長牀穿桯前後著金而關軸焉大夫諸侯以上有四周謂之輴天子畫之以龍重先奠從燭從柩從燭從主人從行之序也主人從者丈夫由右婦人由左以服之親䟽爲先後各從其昭穆男賔在前女賔在後升自西階柩也猶用子道不由阼也奠俟于下東面北上俟正柩也主人從升婦人升東面衆人東即位東方之位正柩于兩楹間用夷牀兩楹間象鄕戶牖也是時柩北首主人柩東西面置重如初如殯宮時也席升設于柩西奠設如初巾之升降自西階席設于柩之西直柩之西當西階也從奠設如𥘉東面也不統於柩神不西面也不設柩東東非神位也巾之者爲禦當風塵主人踊無筭降拜賔即位踊襲主婦及親者由足西面設奠時婦人皆室戶西南面奠畢乃得東面親者西面堂上迫䟽者可以居房中薦車直東榮北輈薦進也進車者象生時將行陳駕也今時謂之魂車輈轅也車當采榮東陳西上於中庭質明滅燭質正也徹者升自阼階降自西階徹者辟新奠不設序西南巳再設爲䙝乃奠如初升降自西階爲遷祖奠也奠升不由阼階柩北首辟其足主人要節而踊節升降薦馬纓三就入門北面交轡圉人夾牽之駕車之馬毎車二疋纓今馬鞅也就成也諸侯之臣飾纓以三色而三成此三色者蓋絛絲也其著之如罽然天子之臣如其命數王之革路絛纓圉人養馬者在左右曰夾旣奠乃薦馬者爲其踐汚庿中也凡入門參分庭一在南御者執策立于馬後哭成踊右還出主人於是乃哭踊者薦車之禮成於薦馬賔岀主人送于門外有司請祖期亦因在外位請之當以告賔每事畢輒出將行而飮酒曰祖祖始也曰日側側昳也謂將過中之時主人入袒乃載踊無筭卒束襲袒爲載變也乃舉柩郤下而載之束束棺於柩車賔出遂匠納車于階間謂此車降奠當前束下遷祖之奠也當前束猶當戶腢也亦在柩車西束有前後也商祝飾柩一池紐前䞓後緇齊三采無貝飾柩爲設牆栁也巾奠乃牆謂此也牆有布帷栁有布荒池者象官室之承霤以竹爲之狀如小車笭衣以青布一池縣於栁前士不揄絞紐所以聮帷荒前赤後黒因以爲飾左右面各有前後齊居栁之中央若今小車蓋上㽔矣以三采繒爲之上朱中白下蒼著以絮元士以上有貝設披披輅栁棺上貫結於戴人居旁牽之以備傾虧䘮大記曰士戴前纁後緇二披用纁今文披皆爲藩屬引屬猶著也引所以引柩車在軸輴曰紼古者人引柩春秋傳曰坐引而哭之三陳明器於乗車之西明器藏器也檀弓曰其曰明器神明之也言神明者異於生器竹不成用瓦不成味木不成斵琴瑟張而不平竽笙備而不和有鍾磬而無筍虡陳器於乗車之西則重北也折橫覆之折猶庪也方鑿連木爲之蓋如牀而縮者三橫者五無簀窆事畢加之壙上以承抗席橫陳之者爲苞筲以下䋫於其北便也覆之見善面也抗木橫三縮二抗禦也所以禦止土者其横與縮各足掩壙加抗席三席所以禦塵加茵用䟽布緇翦有幅亦縮二橫三茵所以藉棺者翦淺也幅縁之亦者亦抗木也及其用之木三在上茵二在下象天三合地二人藏其中焉今文翦作淺器西南上綪器目言之也陳明器以西行南端爲上綪屈也不容則屈而反之茵茵在杭木上陳器次而北也苞二所以裹奠羊豕之肉筲三黍稷麥筲畚種類也其容蓋與簋同一觳也罋三醯醢屑幂用䟽布罋瓦器其容亦蓋一觳屑薑桂之屑也内則曰屑桂與薑幂覆也今文幂皆作密甒二醴酒幂用功布甒亦瓦器也古文甒皆作廡皆木桁久之桁所以庪苞筲罋甒也久當爲炙灸謂以蓋案塞其口毎器異桁用器弓席所以矢耒耜兩敦兩杅槃匜匜實于槃中南流此皆常用之噐也杅盛湯漿槃匜盥噐也流匜口也今文杅爲桙無祭器士禮略也大夫以上兼用鬼器人噐也有燕樂器可也與賔客燕飲用樂之器也役器甲胄干笮此皆師役之器甲鎧胄兠鍪干楯笮矢箙燕器杖笠翣燕居安體之器也笠竹􅡓蓋也翣扇徹奠巾席俟于西方主人要節而踊巾席俟於西方祖奠將用焉要節者來象升丈夫踊去象降婦人踊徹者由明器北西面旣徹由重南東不設於序西南者非宿奠也宿奠必設者爲神馮依之久也袒爲將袒變商祝御柩亦執功布居前爲還柩車爲節也兩馬士制也春秋傳曰宋景曹卒魯季康子使冉求賵之以馬曰其可以稱旌繁乎擯者出請入吿主人釋杖迎于廟門外不哭先入門右北面及衆主人袒尊君命也衆主人自若西面馬入設設于庭在重南賔奉幣由馬西當前輅北面致命賔使者幣玄纁也輅轅縛所以屬引由馬西則亦當前輅之西於是北面致命得郷柩與奠柩車在階間少前參分庭之北輅有前後主人哭拜稽顙成踊賔奠幣于棧左服出棧謂柩車也凡士車制無漆飾左服象授人授其右也服車箱今文棧作輚宰由主人之北舉幣以東柩東主人位以東藏之士受馬以出此士謂胥徒之長也有勇力者受馬聘禮曰皮馬相間可也主人送于外門外拜襲入復位杖賔賵者將命賔卿大夫士也擯者出請入告出告須不迎告曰孤某須馬入設賔奉幣擯者先入賔從致命如初𥘉公使者主人拜于位不踊柩車東位也旣啓之後與在室同賔奠幣如初舉幣受馬如初擯者出請賔出在外請之爲其復有事若奠賔致可以奠也入告出以賔入將命如初士受羊如受馬又請士亦謂胥徒之長又復也若賻賻之言𥙷也助也貨財曰賻入告主人出門左西面賔東面將命主人出者賻主施於主人主人拜賔坐委之宰由主人之北東面舉之反位坐委之明主人哀戚志不在受人物反位反主人之後位若無器則捂受之謂對相授不委地又請賔告事畢拜送入贈者將命贈送擯者出請納賔如初如其入告出告須賔奠幣如初亦於棧左服若就器則坐奠于陳就猶善也贈無常唯玩好所有陳明噐之陳凡將禮必請而後拜送雖知事畢猶請君子不必人意兄弟賵奠可也兄弟有服親者可且賵且奠許其厚也賵奠於死生兩施所知則賵而不奠所知通問相知也降於兄弟奠施於死者爲多故不奠知死者贈知生者賻各主於所知書賵於方若九若七若五方板也書賵奠賻贈之人名與其物於板毎板若九行若七行若五行書遣於策策簡也遣猶送也謂所當藏物茵以下乃代哭如初棺柩有時將去不忍絶聲也𥘉謂旣小斂時宵爲燎于門内之右爲哭者爲明厥明陳鼎五于門外如初鼎五羊豕魚腊鮮獸各一鼎也士禮特牲三鼎盛葬奠加一等用少牢也如𥘉如大歛奠時其實羊左胖反吉祭也言左胖者體不殊骨也髀不升周貴肩賤髀古文髀作脾腸五胃五亦盛之也離肺離豕亦如之豚解無腸胃如之如羊左胖髀不升離肺也豚解解之如解豚亦前肩後肫春脅而巳無腸胄者君子不食溷腴魚腊鮮獸皆如初鮮新殺者士腊用兎加鮮獸而無膚者豕旣豚解略之東方之饌四豆脾析蜱醢葵菹蠃醢脾讀爲雞脾肶之脾脾析百葉也蜱蜯也今文蠃爲蝸四籩棗糗栗脯糗以豆糗粉餌醴酒此東方之饌與祖奠同在主人之南當前輅北上巾之陳器明噐也夜敘藏之滅燎執燭俠輅北靣炤徹與葬奠也賔入者拜之明自啓至此主人無出禮徹者入丈夫踊設于西北婦人踊猶阼階升時也亦旣盥乃入入由重東而主人踊猶其升也自重北西面而徹設於柩車西北亦由序西南徹者東由柩車北東適葬奠之饌鼎入舉入陳之也陳之蓋於重東北西面北上如初乃奠豆南上綪籩蠃醢南北上綪籩蠃醢南辟醴酒也俎二以成南上不綪特鮮獸成猶併也不綪者魚在羊東腊在豕東古文特爲俎醴酒在籩西北上統於豆也奠者出主人要節而踊亦以往來爲節奠由重北西旣奠由重南東甸人抗重出自道道左倚之還重不言甸人抗重言之者重旣虞將埋之言其宫使守視之抗舉也岀自道出從門中央也不由闑東西者重不反變於恒出入道左主人位今時有死者鑿木置食其中樹於道側由此薦馬馬出自道車各從其馬駕於門外西面而俟南上南上便其行也行者乗車在前道槀序從徹者入踊如初徹巾苞牲取下體苞者象旣饗而歸賔俎者也取下體者脛骨象行又俎實之終始也士苞三个前脛折取臂臑後脛折取骼亦得俎釋三个雜記曰父母而賔客之所以爲哀不以魚腊非正牲也行器目葬行明器在道之次茵苞器序從如其陳之先後車從次噐徹者出踊如初於是廟中當行者唯柩車主人之史請讀賵執筭從柩東當前束西面不命母哭哭者相止也唯主人主婦哭燭在石南面史北面請旣而與執筭西面於主人之前讀書釋筭燭在右南面炤書便也古文筭皆爲筴讀書釋筭則坐必釋筭者榮其多卒命哭滅燭書與筭執之以逆出卒巳公史自西方東面命母哭主人主婦皆不哭讀遣卒命哭滅燭出公史君之典禮書者遣者入壙之物君使史來讀之成其得禮之正以終也燭俠路商祝執上統於壙茵先入當藉柩也元士則葬用輁軸加茵焉屬引於是說載除飾更屬引於緘耳古文屬爲燭主人袒衆主人西面北上婦人東面皆不哭俠羡道爲位乃窆主人哭踊無筭窆下棺也今文窆爲封襲贈用制幣玄纁束拜稽顙踊如初丈八尺曰制二制合之束十制五合卒袒拜賔主婦亦拜賔即位拾踊三襲主婦拜賔拜女賔也卽位反位賔出則拜送相問之賔也凡弔賔有五去皆拜之此舉中焉藏器於旁加見噐用器役器也見棺飾也更謂之見者加此則棺柩不復見矣先言藏噐乃云加見者噐在見内也内之者明君子之於事終不自逸也檀弓曰有虞氏之瓦棺夏后氏堲周殷人棺椁周人牆置翣藏苞筲於旁於旁者在見外也不言罋甒饌相次可知四者兩兩而居䘮大託曰棺椁之間君容祝大夫容壺士容甒加折卻之加抗席覆之加抗木冝次也實土三主人拜鄕人謝其勤勞即位踊襲如初哀親之在斯乃反哭入升自西階東面衆主人堂下東面北上西階東面反諸其所作也反哭者於其祖庿不於阼階西面西方神位婦人入大夫踊升自阼階辟主人也主婦入于室踊出即位及丈夫拾踊三入于室反諸其所養也出卽位堂上西面也拾更也賔弔者升自西階曰如之何主人拜稽顙賔弔者衆賔之長也反而亡焉失之矣於是爲甚故弔之弔者北面主人拜於位不北面拜賔東者以其亦主人位也今文無曰賔降出主人送于門外拜稽顙遂適殯宮皆如啓位拾踊三啓位婦人入升堂丈夫即中庭之位兄弟出主人拜送兄弟小功以下也異門大功亦可以歸衆主人出門哭止闔門主人揖衆主人乃就次次倚廬也猶朝夕哭不奠是日也以虞易奠三虞虞䘮祭名虞安也骨肉歸於土精氣無所不之孝子爲其彷徨三祭以安之朝葬日中而虞不忍一日離卒哭卒哭三虞之後祭名始朝夕之間哀至則哭至此祭止也朝夕哭而巳明日以其班祔班次也袝卒哭之明日祭名祔猶屬也祭昭穆之次而屬之今文班爲胖記士處適寢寢東首于北墉下將有疾乃寢於適室今文處爲居于爲於有疾疾者齊正情性也適寢者不齊不居其室養者皆齊憂也徹琴瑟去樂疾病外内皆埽爲有賔客來問也疾甚曰病徹褺衣加新衣故衣垢汗爲來人穢惡之御者四人皆坐持體爲不能自轉側御者今時侍從之人屬纊以俟絶氣爲其氣微難節也纊新絮男子不絶於婦人之手婦人不絶於男子之手備褻乃行禱于五祀盡孝子之情五祀博言之士二祀曰門曰行乃卒卒終也主人啼兄弟哭哀有甚有否於是始去笄纚服深衣檀弓曰始死羔裘玄冠者易之設牀第當牖衽下筦上簟設枕病卒之間廢牀至是設之事相變祍卧席古文第爲茨遷尸徙於牖下也於是幠用歛衾復者朝服左執領右執要招而左衣朝服服未可以變楔貌如軛上兩末事便也今文軛作厄綴足用燕几校在南御者坐持之校脛也尸南首几脛在南以拘足則不得辟戾矣古文校爲枝即牀而奠當腢用吉噐若醴若酒無巾柶腢肩頭也用吉器器未變也或卒無醴用新酒赴曰君之臣某死赴母妻長子則曰君之臣某之某死赴走告也今文赴作訃室中唯主人主婦坐兄弟有命夫命婦在焉亦坐别尊卑也尸在室有君命衆主人不出不二主襚者委衣于牀不坐牀高由便其禭于室戸西北面致命始死時也夏祝淅米差盛之差擇之御者四人抗衾而浴䄠第抗衾爲其倮程蔽之也䄠袒也袒簀去席盝水便其母之䘮則内御者浴鬠無笄内御女御也無笄猶丈夫之不冠也設明衣婦人則設中帶中帶若今之禪襂卒洗貝反于䈂實貝柱右齻左齻象齒堅夏祝徹餘飯徹去鬻瑱塞耳塞充窒掘坎南順廣尺輪二尺深三尺南其壤南順統於堂輪從也今文掘爲坅垼用塊塊堛也古文垼爲役明衣裳用幕布袂屬幅長下膝幕布帷幕之布升數未聞也屬幅不削幅也長下膝又有裳於蔽下體深也有前後裳不辟長及觳不辟質也觳足跗也凡他服短無見膚長無𬒳土縓綼緆一染謂之縓今紅也飾裳在幅曰綼在下曰緆緇純七入爲緇緇黒也飾衣曰純謂領與𬒮衣以緇裳以縓象天地也設握裏親膚繫鉤中指結于掔掔掌後節中也手無決者以握繫一端繞掔還從上自貫反與其一端結之甸人築坅坎築實土其中堅之穿坎之名一曰坅隷人涅廁隷人罪人也今之徒役作者也涅塞也爲人復往褻之又亦鬼神不用旣襲宵爲燎于中庭宵夜厥明滅燎陳衣記節凡絞紟用布倫如朝服凡凡小斂大斂也倫比也今文無紟古文倫爲輪設棜于東堂下南順齊于坫饌于其上兩甒醴酒酒在南篚在東南順實角觶四木柶二素勺二豆在甒北二以並籩亦如之棜今之轝也角觶四木柶二素勺爲少進醴酒兼饌之也勺二醴酒各一也豆籩二以併則是大歛饌也記於此者明其他與小歛同陳古文角觶爲角柶凡籩豆實具設皆巾之籩豆偶而爲具具則於饌巾之巾之加飾也明小斂一豆一籩不巾觶俟時而酌柶覆加之面枋及錯建之時朝夕也檀弓曰朝奠日出夕奠逮日小斂辟奠不出室未忍神逺之也辟襲奠以辟斂旣斂則不出於室設於序西南畢事而去之無踊節其哀未可節也旣馮尸主人袒髺髮絞帶衆主人布帶衆主人齊衰以下大斂于阼未忍便離主人位也主人奉尸斂于棺則西階上賔之大夫升自西階階東北面東上視斂旣馮尸大夫逆降復位中庭西面位巾奠執燭者滅燭出降自阼階由主人之北東巾奠而室事巳旣殯主人說髦旣殯置銘于肂復位時也今文說皆作稅兒生三月鬋髪爲鬌男角女羈否則男左女右長大猶爲飾存之謂之髦所以順父母幼小之心至此尸柩不見䘮無飾可以去之髦之形象未聞三日絞垂成服日絞要絰之散垂者冠六升外縪纓條屬厭縪謂縫著於武也外者外其餘也纓條屬者通屈一條繩爲武垂下爲纓屬之冠厭伏也衰三升衣與裳也屨外納納收餘也杖下本竹桐一也順其性也居倚廬倚木爲廬在中門外東方北戶寢苫枕塊苫編藁塊堛也不說絰帶哀戚不在於安哭晝夜無時哀至則哭非必朝夕非䘮事不言不忘所以爲親歠粥朝一溢米夕一溢米不食菜果不在於飽與滋味粥糜也二十兩曰溢爲米一升二十四分升之一實在木曰果在地曰蓏主人乗惡車拜君命拜衆賔及有故行所乗也雜記曰端衰䘮車皆無等然則此惡車王䘮之木車也古文惡作堊白狗幦未成豪狗幦覆笭也以狗皮爲之取其臑也白於䘮飾宜古文幦爲幂蒲蔽蔽藩御以蒲菆不在於驅馳蒲菆牡蒲莖古文菆作騶犬服笭間兵服以犬皮爲之取堅也亦白今文犬爲大木錧取少聲今文錧爲鎋約綏約轡約繩綏所以引升車木鑣亦取少聲古文鑣爲苞馬不齊髦齊翦也今文髦爲毛主人之惡車如王之木車則齊衰以下其乗素車繅車駹車漆車與主婦之車亦如之䟽布裧裧者車裳幃於蓋弓垂之貳車白狗攝服貳副也攝猶縁也狗皮緣服差飾其他皆如乗車如所乗惡車朔月童子執帚卻之左手奉之童子隷子弟若内竪寺人之屬執用左手卻之示未用從徹者而入童子不專禮事比奠舉席埽室聚諸㝔布席如初卒奠埽者執帚垂末内鬛從執燭者而東比猶先也室東南隅謂之㝔燕養饋羞湯沐之饌如他日燕養平常所用供養也饋朝夕食也羞四時之珍異湯沐所以洗去汙垢内則曰三日具沐五日具浴孝子不忍一日廢其事親之禮於下室日設之如生存也進徹之時如其頃朔月若薦新則不饋于下室以其殷奠有黍稷也下室如今之内堂正寢聽朝事筮宅冡人物土物猶相也相其地可葬者乃營之卜曰吉告從于主婦主婦哭婦人皆哭主婦升堂哭者皆止事畢啓之昕外内不哭將有事爲其讙嚻旣啓命哭古文啓爲開夷牀輁軸饌于西階東明階間者位近西也夷牀饌於祖庿輁軸饌於殯宫其二庿者於禰亦饌輁軸焉古文輁或作拱其二庿則饌于禰庿如小斂奠乃啓祖尊禰卑也士事祖禰上士異庿下士共庿朝于禰庿重止于門外之西東面柩入升自西階正柩于兩楹間奠止于西階之下東面北上主人升柩東西面衆主人東即位婦人從升東面奠升設于柩西升降自西階主人要節而踊重不入者主於朝祖而行若過之矣門西東面待之便也燭先入者升堂東楹之南西面後入者西階東北面在下炤正柩者先先柩者後後柩者適祖時燭亦然互記於此主人降即位徹乃奠升降自西階主人踊如初如其降拜賔至於要節而踊不薦車不從此行祝及執事舉奠巾席從而降柩從序從如初適祖此謂朝禰明日舉奠適祖之序也此祝執醴先酒脯醢俎從之巾席爲後旣正柩席升設設奠如𥘉祝受巾巾之凡䘮自卒至殯自啓至葬主人之禮其變同則此日數亦同矣序從主人以下今文無從薦乗車鹿淺幦干笮革靾載旜載皮弁服纓轡貝勒縣于衡士乗棧車鹿淺鹿夏毛也幦覆笭玉藻曰士齊車鹿幦豹犆干盾也笮矢箙也靾韁也􅎶旌旗之屬通帛爲旜孤卿之所建亦攝焉皮弁服者視朔之服貝勒貝飾勒有于無兵有箙無弓矢明不用古文靾爲殺旜爲膳道車載朝服道車朝夕及燕出入之車朝服日視朝服之也玄衣素裳稾車載蓑笠稾猶散也散車以田以鄙之車蓑笠備雨服今文稾爲潦凡道車稾車之纓轡及勒亦縣于衡也將載祝及執事舉奠戶至道左北面立東上道左墓道東先至者在東柩至于壙斂服載之柩車至壙祝說載除飾乃歛乗車道車槀車之服載之不空之以歸送形而往迎精而反亦禮之冝卒窆而歸不驅孝子往如慕反如疑爲親之在彼君視斂若不待奠加蓋而出不視斂則加蓋而至卒事爲有他故及辟忌也旣正柩賔出遂匠納車于階間遂匠遂人匠人也遂人主引徒役匠人主載柩窆職相左右也車載柩車周禮謂之蜃車雜記謂之團或作輇或作摶聲讀皆相附耳未聞孰正其車之轝狀如牀中央有轅前後出設前後輅轝上有四周下則前後有軸以輇爲輪許叔重說有輻曰輪無輻曰輇祝饌祖奠于主人之南當前輅北上巾之言饌於主人之南當前輅則旣祖祝乃饌弓矢之新沽功設之冝新沽示不用今文沽作古有弭飾焉弓無縁者謂之弭弭以骨角爲飾亦張可也亦使可張有柲柲弓檠弛則縳之於弓裏備損傷以竹爲之詩云竹柲緄縢今文柲作枈設依撻焉依纒絃也撻弣側矢道也皆以韋爲之今文撻爲銛有韣韣弓衣也以緇布爲之翭矢一乗骨鏃短衞翭猶候也候物而射之矢也四矢曰乗骨鏃短衛亦示不用也生時翭矢金鏃凡爲矢五分笴長而羽其一志矢一乗軒輖中亦短衞志猶擬也習射之矢書云若射之有志輖摯也無鏃短衛亦示不用生時志矢骨鏃凡爲矢前重後輕也儀禮卷第十三經二千五百一注五千四十七十六字字
