front:
  text: 儀禮卷第十二士喪禮第十二鄭氏注士喪禮死于適室幠用斂衾適室正寢之室也疾者齊故于正寢焉疾時處北墉下死而遷之當牖下有牀祍幠覆也斂衾大斂所并用之衾衾𬒳也小斂之衾當陳喪大記曰始死遷尸于牀幠用斂衾去死衣復者一人以爵弁服簪裳于衣左何之扱領于帶復者有司招魂復魄也天子則夏采祭僕之屬諸侯則小臣爲之爵弁服純衣纁裳也禮以冠名服簪連也升自前東榮中屋北面招以衣曰皐某復三降衣于前北面招求諸幽之義也皐長聲也某死者之名也復反也降衣下之也喪大記曰凡復男子稱名婦人稱字受用篋升自阼階以衣尸受者受之於庭也復者其一人招則受衣亦一人也人君則司服受之衣尸者覆之若得魂反之復者降自後西榮不由前降不以虚反也降因徹西北匪若云此室凶不可居然也自是行死事楔齒用角柶爲將含恐其口閉急也綴足用燕几綴猶拘也爲將屨恐其辟戾也今文綴爲對奠脯醢醴酒升自阼階奠于尸東鬼神無象設奠以馮依之帷堂事小訖也乃赴于君主人西階東南面命赴者拜送赴告也臣君之股肱耳目死當有恩有賔則拜之賔僚友群士也其位猶朝夕哭矣入坐于牀東衆主人在其後西面婦人俠牀東面衆主人庻昆弟也婦人謂妻妾子姓也亦適妻在前親者在室謂大功以上父兄姑姊妹子姓在此者衆婦人戶外北面衆兄弟堂下北面衆婦人衆兄弟小功以下君使人弔徹帷主人迎于寢門外見賔不哭先入門右北面使人士也禮使人必以其爵使者至使人入將命乃出迎之寢門内門也徹帷㧁之事畢則下之弔者入升自西階東面主人進中庭弔者致命主人不升賤也致命曰君聞子之喪使某如何不淑主人哭拜稽顙成踊稽顙頭觸地成踊三者三賔出主人拜送于外門外君使人禭徹帷主人如初禭者左執領右執要入升致命襚之言遺也衣被曰襚致命曰君使某襚主人拜如初禭者入衣尸出主人拜送如初唯君命出升降自階西階遂拜賔有大夫則特拜之即位于西階下東面不踊大夫雖不辭入也唯君命出以明大夫以下時來弔禭不出也始喪之日哀戚甚在室故不出拜賔也大夫則特拜别于士旅拜也即位西階下未忍在主人位也不踊但哭拜而巳不辭而主人升入明本不爲賔出不成禮也親者禭不將命以即陳大功以上有同財之義也不將命不使人將之致於主人也即陳陳在房中庶兄弟禭使人以將命于室主人拜于位委衣于尸東牀上庶兄弟即衆兄弟也變衆言庶容同姓耳將命曰某使某禭拜于位室中位也朋友禭親以進主人拜委衣如初退哭不踊親以進親之恩也退下堂反賔位也主人徒哭不踊别於君襚也徹衣者執衣如禭以適房凡於禭者出有司徹衣爲銘各以其物亡則以緇長半幅䞓末長終幅廣三寸書銘干未曰某氏某之柩銘明旌也雜帛爲物大夫之所建也以死者爲不可别故以其旗識識之愛之斯録之矣亡無也無旌不命之士也半幅一尺終幅二尺在棺爲柩今文銘皆爲名未爲斾也竹杠長三尺置于宇西階上杠銘橦也宇梠也甸人掘坎于階間少西爲垼于西牆下東郷甸人有司主田野者垼塊竈西牆中庭之西今文郷爲面新盆槃瓶廢敦重鬲皆濯造于西階下新此瓦器五種者重死事盆以盛水槃承渜濯瓶以汲水也廢敦敦無足者所以盛米也重鬲鬲將縣重者也濯滌漑也造至也猶饌也以造言之喪事遽陳襲事于房中西領南上不綪襲事謂衣服也綪讀爲䋫䋫屈也襲事少上陳而下不屈江沔之間謂縈收繩索爲䋫古文綪皆爲精明衣裳用布所以親身爲圭絜也鬠笄用桑長四寸纋中桑之爲言喪也用爲笄取其名也長四寸不冠故也纋笄之中央以安髪布巾環幅不鑿環幅廣袤等也不鑿者士之子親含及其巾而巳大夫以上賔爲之含當口鑿之嫌有惡古文環作還掩練帛廣終幅長五尺析其末掩裏首也析其末爲將結放頣下又還結於項中瑱用白纊瑱充耳纊新緜幎目用緇方尺二寸䞓裏著組繫幎目覆面者也幎讀若詩云葛藟縈之縈䞓赤也著充之以絮也組繫爲可結也古文幎爲涓握手用玄纁裏長尺二寸廣五寸牢中旁寸著組繫牢讀爲樓樓謂削約握之中央以安手也今文樓爲纋旁爲方決用正王棘若檡棘組繫纊極二決猶闓也挾弓以橫執弦詩云決拾旣佽正善也王棘與檡棘善理堅刃者皆可以爲決極猶放弦也以沓指放弦令不挈指也生者以朱韋爲之而三死用纊又二明不用也古文王爲玉今文擇爲澤世俗謂王棘矺䑕冒緇質長與手齊䞓殺掩足冐韜尸者制如直囊上曰質下曰殺質正也其用之先以殺韜足而上後以質韜首而下齊手上玄下纁象天地也喪大記曰君錦冐黼殺綴旁七大夫玄冐黼殺綴旁五士緇冐䞓殺綴旁三凡冐質長與手齊殺三尺爵弁服純衣謂生時爵弁之服也純衣者纁裳古者以冠名服死者不冠皮弁服皮弁所衣之服也其服白布衣素裳也褖衣黒衣裳赤縁謂之褖禒之言縁也所以表袍者也喪大記曰衣必有裳袍必有表不禪謂之一稱古文禒爲縁緇帶黒繒之帶韎韐一命緼韍竹笏笏所以書思對命者玉藻曰笏天子以球玉諸侯以象大夫以魚須文竹士以竹本象可也又曰笏度二尺有六寸其中博三寸其殺六分而去一又曰天子搢珽方正於天下也諸侯荼前詘後直讓於天子也大夫前詘後詘無所不讓今文笏作忽夏葛屨冬白屨皆繶緇絇純組綦繫于踵冬皮屨變言白者明夏時用葛亦白也此皮弁之屨士冠禮曰素積白屨以魁柎之緇絇繶純純博寸綦屨係也所以拘止屨也綦讀如馬絆綦之綦庶禭繼陳不用庶衆也不用不用襲也多陳之爲榮少納之爲貴貝三實于笄貝水物古者以爲貨江水出焉笲竹器名稻米一豆實於筐豆四升沐巾一浴巾二皆用綌於笲巾所以拭汚垢浴巾二者上體下體異也綌麤葛櫛於簞簞葦笥浴衣於篋浴衣巳浴所衣之衣以布爲之其制如今通裁皆饌于西序下南上皆者皆具以下東西牆謂之序中以南謂之堂管人汲不說繘屈之管人有司主館舎者不說繘將以就祝濯米屈縈也祝淅米于堂南面用盆祝夏祝也浙汰也管人盡階不升堂受潘煑于垼用重鬲盡階三等之上喪大記曰管人受沐乃煑之甸人取所徹廟之西北匪薪用爨之祝盛米于敦奠于貝北復於筐處士有冰用夷槃可也謂夏月而君加賜冰也夷槃承尸之槃喪大記曰君設大槃造氷焉大夫設夷槃造冰焉士併瓦槃無冰設牀䄠第有枕外御受沐入外御小臣侍從者沐管人所煑潘也主人皆出戶外北面象平生沐浴倮桯子孫不在旁主人出而襢第乃沐櫛挋用巾挋晞也淸也古文挋皆作振浴用巾挋用浴衣用巾用拭之也喪大記曰御者二人浴浴水用盆沃水用抖渜濯棄于坎沐浴餘潘水巾櫛浴衣亦并棄之古文渜作縁荆沔之間語蚤揃如他日蚤讀爲瓜斷瓜揃鬚也人君則小臣爲之他日平生時鬠用組乃笄設明衣裳用組組束髪也古文鬠皆爲括主人入即位巳設明衣可以入也商祝襲祭服禒衣次商祝祝習商禮者商人教之以敬於接神冝襲布衣牀上祭服爵弁服皮弁服皆從君助祭之服大蜡有皮弁素服而祭送終之禮襲衣於牀牀次含牀之東衽如𥘉也喪大記曰含一牀襲一牀遷尸於堂又一牀主人出南面左袒扱諸面之右盥于盆上洗貝執以入宰洗柶建于米執以從俱入戸西郷也今文宰不言執商祝執巾從入當牖北面徹枕設巾徹楔受貝奠于尸西當牖北面值尸南也設巾覆面爲飯之遺落米也如商祝之事位則尸南首明矣主人由足西牀上坐東面不敢從首前也祝受貝米奠之口實不由足也祝又受米奠于貝北宰從立于牀西在右米在貝北便扱者也宰立牀西在主人之右當佐飯事主人左扱米實于右三實一貝左中亦如之又實米唯盈于右尸口之右唯盈取滿而巳主人襲反位襲復衣也位在尸東商祝掩瑱設幎目乃屨綦結于跗連絇掩者先結頥下旣眞幎目乃還結項也跗足上也絇屨飾如刀衣鼻在屨頭上以餘組連之止足坼也乃襲三稱遷尸於襲上而衣之凡衣死者左衽不紐襲不言設牀又不言遷尸於襲上以其俱當牖無大異明衣不在筭筭數也不在數明衣禪衣不成稱也設韐帶搢笏韐帶韎韐緇帶不言韎緇者省文亦欲見韐自有帶韐帶用革搢挿也挿於帶之右旁古文韐爲合也設決麗于掔自飯持之設握乃連掔麗施也掔手後節中也飯大擘指本也決以韋爲之藉有彄彄内端爲紐外端有横帶設之以紐擐大擘本也因沓其彄以横帶貫紐結於掔之表也設握者以綦繫鉤中指由手表與決帶之餘連結之此謂右手也古文麗亦爲連掔作捥設冒櫜之幠用衾櫜韜盛物者取事名焉衾者始死時斂衾今文櫜爲橐巾柶鬊蚤埋于坎坎至此築之也將襲辟奠旣則反之重木刋鑿之甸人置重于中庭參分庭一在南木也縣物焉曰重刋斵治鑿之爲縣簪孔也士重木長三尺夏祝鬻餘飯用二鬲于西牆下夏祝祝習夏禮者也夏人教以忠其於養冝鬻餘飯以飯尸餘米爲鬻也重主道也士二鬲則大夫四諸侯六天子八與簋同差幂用疏布久之繫用靲縣千重幂用葦席北面左衽帶用靲賀之結于後久讀爲灸謂以蓋塞鬲口也靲竹䈼也以席覆重辟屈而反兩端交於後左衽西端在上賀加也今文幂皆作密祝取銘置于重祝習周禮者也厥明陳衣于房南領西上綪絞橫三縮一廣終幅析其末綪屈也絞所以收束衣服爲堅急者也以布爲之縮從也横者三幅從者一幅析其末者令可結也喪大記曰絞一幅爲三緇衾赬裏無紞紞𬒳也斂衣或倒𬒳無别於前後可也凡衾制同皆五幅也祭服次爵弁服皮弁服散衣次禒衣以下𫀆繭之屬凡十有九稱祭服與散衣陳衣繼之庶禭不必盡用取稱而巳不務多饌于東堂下脯醢醴酒幂奠用功布實于簞在饌東功布鍜濯灰治之布也凡在東西堂下者南齊坫古文奠爲尊設盆盥于饌東有巾爲奠設盥也喪事略故無洗也苴絰大鬲下夲在左要絰小焉散帶垂長三尺牡麻絰右夲在上亦散帶垂皆饌于東方苴絰斬衰之絰也苴麻者其貌苴以爲絰服重者尚麤惡絰之言實也鬲搤也中人之手搤圍九寸絰帶之差自此出焉下本在左重服統於内而本陽也要絰小焉五分去一牡麻絰者齊衰以下之絰也牡麻絰者其貌易服輕者冝差好也右本在上輕服本於隂而統於外散帶之垂者男子之道文多變也饌于東方東坫之南苴絰爲上婦人之帶牡麻結夲在房婦人亦有苴絰但言帶者記其異此齊衰婦人斬衰婦人亦苴絰也牀策夷衾饌于西坫南策簀也夷衾覆尸之衾喪大記曰自小斂以徃用夷衾夷衾質殺之裁猶冐也西方盥如東方爲舉者設盥也如東方者亦用盆布巾饌於西堂下陳一鼎于寢門外當東塾少南西面其實特豚四鬄去蹄兩胉脊肺設扃鼏鼏西末素俎在鼎西西順覆匕東柄鬄解也四解之殊肩髀而巳喪事略去蹄去其甲爲不潔淸也胉脅也素俎喪尚質旣饌將小斂則辟襲奠今文鬄爲剔胉爲迫古文鼏爲密士盥二人以並東面立于西階下立俟舉尸也今文並爲併布席于戶内下莞上簟有司布斂席也商祝布絞衾散衣祭服祭服不倒美者在中斂者趨方或傎倒衣裳祭服尊不倒之也美善也善衣後布於斂則在中也旣後布祭服而又言善者在中明毎服非一稱也士舉遷尸反位遷尸於服上設牀策于兩楹之間衽如初有枕衽寢卧之席也亦下莞上簟卒斂徹帷尸巳飾主人西面馮尸踊無筭主婦東面馮亦如之馮服膺之主人髺髮袒衆主人免于房始死將斬衰者雞斯將齊衰者素冠今至小斂變又將初喪服也髺髪者去笄纚而紒衆主人免者齊衰將袒以免代冠冠服之尤尊不以袒也免之制未聞舊說以爲如冠狀廣一寸喪服小記曰斬衰髺髪以麻免而以布此用麻布爲之狀如今之著幓頭矣自項中而前交於額上郤繞紒也于房于室釋髺髪冝於隱者今文免皆作絻古文髺作括婦人髽于室始死婦人將斬衰者去笄而纚將齊衰者骨笄而纚今言髽者亦去笄纚而紒也齊衰以上至笄猶髽髽之異於髻髪者旣去纚而以髪爲大紒如今婦人露紒其象也檀弓曰南宫縚之妻之姑之喪夫子誨之髽曰爾母縱縱爾爾母扈扈爾其用麻布亦如著幓頭然士舉男女奉尸侇于堂幠用夷衾男女如室位踊無筭侇之言尸也夷衾覆尸柩之衾也堂謂楹間牀第上也今文侇作夷主人出于足降自西階衆主人東即位婦人阼階上西面主人拜賔大夫特拜士旅之即位踊襲絰于序東復位拜賔鄕賔位拜之也即位踊東方位襲絰于序東東夾前乃奠祝與執事爲之舉者盥右執七卻之左執俎橫攝之入阼階前西面錯錯俎北面舉者盥出門舉鼎者右人以右手執七左人以左手執俎因其便也攝持也西面錯錯鼎於此冝西面錯俎北面俎冝西順之右人左執匕抽扄予左手兼執之取鼏委于鼎北加扄不坐抽扄取鼏加扄於鼏上皆右手今文扄爲鉉古文予爲與鼏爲密乃朼載載兩髀于兩端兩肩亞兩胉亞脊肺在於中皆覆進柢執而俟乃朼以朼次出牲體右人也載受而載於俎左人也亞次也凡七體皆覆爲塵柢本也進本者未異於生也骨有本末古文朼爲匕髀爲脾今文胉爲迫柢皆爲􅢂夏祝及執事盥執醴先酒脯醢俎從升自阼階丈夫踊甸人徹鼎巾待于阼階下執事者諸執奠事者巾功布也執者不升巳不設祝旣錯醴將受之奠于尸東執醴酒北面西上執醴酒者先升尊也立而俟後錯要成也豆錯俎錯于豆東立于俎北西上醴酒錯于豆南祝受巾巾之由足降自西階婦人踊奠者由重南東丈夫踊巾之爲塵也東反其位賔出主人拜送于門外廟門外也乃代哭不以官代更也孝子始有親喪悲哀憔悴禮防其以死傷生使之更哭不絶聲而巳人君以官尊卑士賤以親䟽爲之三日之後哭無時周禮挈壺氏凡喪縣壺以代哭有襚者則將命擯者出請入告主人待于位喪禮略於威儀旣小斂擯者乃用辭出請之辭曰孤某使某請事擯者出吿須以賔入須亦待也出告之辭曰孤某須矣賔入中庭北面致命主人拜稽顙賔升自西階出于足西面委衣如於室禮降出主人出拜送朋友親襚如初儀西階東北面哭踊三降主人不踊朋友旣委衣又還哭於西階上不背主人襚者以褶則必有裳執衣如初徹衣者亦如之升降自西階以東帛爲褶無絮雖複與禪同有裳乃成稱不用表也以東藏以待事也古文褶爲襲宵爲燎于中庭宵夜也燎火燋厥明滅燎陳衣于房南領西上綪絞紟衾二君禭祭服散衣庶襚凡三十稱紟不在筭不必盡用紟單被也衾二者始死斂衾今又復制也小斂衣數自天子逹大斂則異矣喪大記曰大斂布絞縮者三橫者三東方之饌兩瓦甒其實醴酒角觶木柶毼豆兩其實葵菹芋蠃醢兩籩無縢布巾其實栗不擇脯四脡此饌但言東方則亦在東堂下也毼白也齊人或名全菹爲芉縢縁也詩云竹柲緄縢布巾籩巾也籩豆具而有巾盛之也特牲饋食禮有籩巾今文蠃爲蝸古文縢爲甸奠席在饌北斂席在其東大斂奠而有席彌神之掘肂見衽肂埋棺之坎者也掘之於西階上祍小要也喪大記曰君殯用輴櫕至于上畢塗屋大夫殯以幬櫕置于西序塗不曁于棺士殯見祍塗上帷之又曰君蓋用漆三祍三束大夫蓋用漆二衽二束士蓋不用漆二祍二束棺入主人不哭升棺用軸蓋在下軸輁軸也輁狀如牀軸其輪輓而行熬黍稷各二筐有魚腊饌于西坫南熬所以惑蚍蜉令不至棺旁也爲舉者設盆盥於西陳三鼎于門外北上豚合升魚鱄鮒九腊左胖髀不升其他皆如初合升合左右體升於鼎其他皆如初謂豚體及匕俎之陳如小斂時合升四鬄亦相互耳燭俟于饌東燭燋也饌東方之饌有燭者堂雖明室猶闇火在地曰燎執之曰燭祝徹盥于門外入升自阼階丈夫踊祝徹祝與有司當徹小斂之奠者小斂設盥于饌東有巾大斂設盥于門外彌有威儀祝徹巾授執事者以待授執巾者於尸東使先待於阼階下爲大斂奠又將巾之祝還徹醴也徹饌先取醴酒北面北面立相待俱降其餘取先設者出于足降自西階婦人踊設于序西南當西榮如設于堂爲求神於庭孝子不忍使其親須臾無所馮依也堂謂尸東也凡奠設于序西南者畢事而去之醴酒位如初執事豆北南面東上如初者如其醴酒北面西上也執醴尊不爲便事變位乃適饌東方之新饌帷堂徹事畢婦人尸西東面主人及親者升自西階出于足西面袒袒大斂變也不言髽免髺髪小斂以來自若矣士盥位如初亦旣盥並立西階下布席如初亦下莞上簟鋪於阼階上於楹間爲少南商祝布絞紟衾衣美者在外君禭不倒至此乃用君禭主人先自盡有大夫則告後來者則告以方斂非斂時則當降拜之士舉遷尸復位主人踊無筭卒斂徹帷主人馮如初主婦亦如之主人奉尸斂于棺踊如初乃蓋棺在肂中斂尸焉所謂殯也檀弓曰殯於客位主人降拜大夫之後至者北面視肂北面於西階東衆主人復位婦人東復位阼階上下之位設熬旁一筐乃塗踊無筭以木覆棺上而塗之爲火備卒塗祝取銘置于肂主人復位踊襲爲銘設柎樹之肂東乃奠燭升自阼階祝執
