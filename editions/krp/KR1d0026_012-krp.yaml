body:
  text: 商祝布絞紟衾衣美者在外君禭不倒巾席從設于奥東面執燭者先升堂照室自是不復奠於尸祝執巾與執席者從入爲安神位室中西南隅謂之奥執燭南面巾委於席右祝反降及執事執饌東方之饌士盥舉鼎入西面北上如初載魚左首進鬐三列腊進柢如初如小斂舉鼎執匙俎扄鼏朼載之儀魚左首設而在南鬐脊也左首進鬐亦未異於生也凡未異於生者不致死也古文首爲手鬐爲耆祝執醴如初酒豆籩俎從升自阼階丈夫踊甸人徹鼎如初祝先升奠由楹内入于室醴酒北面亦如初設豆右菹菹南栗栗東脯豚當豆魚次腊特于俎北醴酒在籩南巾如初右菹菹在醢南也此左右異於魚者載者統於執設者統於席醴當栗南酒當脯南旣錯者出立于戸西西上祝後闔戶先由楹西降自西階婦人踊奠者由重南東丈夫踊爲神馮依之也賔出婦人踊主人拜送于門外入及兄弟北面哭殯兄弟出主人拜送于門外小功以下至此可以歸異門大功亦存焉衆主人出門哭止皆西面于東方闔門主人揖就次次謂斬衰倚廬齊衰堊室也大功有帷帳小功緦麻有牀策可也君若有賜焉則視歛旣布衣君至賜恩惠也斂大斂君視大斂皮弁服襲裘主人成服之後徃則錫衰主人出迎于外門外見馬首不哭還入門右北面及衆主人袒不哭厭於君不敢伸其私恩巫止于廟門外祝代之小臣二人執戈先二人後巫掌招弭以除疾病周禮小臣掌正君之法儀者周禮男巫王弔則與祝前檀弓曰君臨臣喪以巫祝桃茢執戈以惡之所以異於生也皆天子之禮諸侯臨臣之喪則使祝代巫執茢居前下天子也小臣君行則在前後君升則俠阼階北面凡宮有鬼神曰廟君釋采入門主人辟釋采者祝爲君禮門神也必禮門神者明君無故不來也禮運曰諸侯非問疾弔喪而入諸臣之家是謂君臣爲謔君升自阼階西鄕祝負墉南面主人中庭祝南面房中東鄕君牆謂之墉主人中庭進益北君哭主人哭拜稽顙成踊出出不敢必君之卒斂事君命反行事主人復位大斂事君升主人主人西楹東北面命主人使之升升公卿大夫繼主人東上乃斂公大國之孤四命也春秋傳曰鄭伯有耆酒爲窟室而夜飲酒擊鍾焉朝至未巳朝者曰公焉在其人曰吾公在壑谷伯有者公子子良之孫良霄卒公卿大夫逆降復位主人降出逆降者後升者先降位如朝夕哭弔之位君反主人主人中庭君坐撫當心主人拜稽顙成踊出撫手案之凡馮尸興必踊今文無成君反之復初位衆主人辟于東壁南面以君將降也南面則當坫之東君降西鄕命主人馮尸主人升自西階由足西面馮尸不當君所踊主婦東面馮亦如之君必降者欲孝子盡其情奉尸斂于棺乃蓋主人降出君反之入門左視塗肂在西階上入門左由便趨疾不敢乆留君君升卽位衆主人復位卒塗主人出君命之反奠入門右亦復中庭位乃奠升自西階以君在阼君要節而踊主人從踊節謂執奠始升階及旣奠由重南東時也卒奠主人出哭者止以君將出不敢讙囂聒尊者也君出門廟中哭主人不哭辟君式之辟逡遁辟位也古者立乗式謂小俛以禮主人也曲禮曰立視五巂式視馬尾貳車畢乗主人哭拜送貳車副車也其數各視其命之等君出使異姓之士乗之在後君弔蓋乗象路曲禮曰乗君之乗車不敢曠左左必式襲入即位衆主人襲拜大夫之後至者成踊後至布衣而後來者賔出主人拜送自賔出以下如君不在之儀三日成服杖拜君命及衆賔不拜棺中之賜旣殯之明日全三日始歠粥矣禮尊者加惠明日必徃拜謝之棺中之賜不施已也曲禮曰生與來日朝夕哭不辟子卯旣殯之後朝夕及哀至乃哭不代哭也子卯桀紂亡日凶事不辟吉事闕焉婦人即位于堂南上哭丈夫即位于門外西面北上外兄弟在其南南上賔繼之北上門東北面西上門西北面東上西方東面北上主人即位辟門外兄弟異姓有服者也辟開也凡廟門有事則開無事則閉婦人拊心不哭方有事止讙囂主人拜賔旁三右還入門哭婦人踊先西面拜乃南面拜東面拜也主人堂下直東序西面兄弟皆卽位如外位卿大夫在主人之南諸公門東少進他國之異爵者門西少進敵則先拜他國之賔凡異爵者拜諸其位賔皆即此位乃哭盡哀止主人乃右還拜之如外位矣兄弟齊衰大功者主人哭則哭小功緦麻亦即位乃哭上言賔此言卿大夫明其亦賔爾少進前於列異爵卿大夫也他國卿大夫亦前於列尊之拜諸其位就其位特拜徹者盥于門外燭先入升自阼階丈夫踊徹者徹大斂之宿奠祝取醴北面取酒立于其東取豆籩俎南面西上祝先出酒豆籩俎序從降自西階婦人踊序次也設于序西南直西榮醴酒北面西上豆西面錯立于豆北南面籩俎既錯立于執豆之西東上酒錯復位醴錯于西遂先由主人之北適饌遂先者明祝不復位也適饌適新饌將復奠乃奠醴酒脯醢升丈夫踊入如初設不巾入入於室也如初設者豆先次籩次酒次醴也不巾無菹無栗也菹栗具則有俎有俎乃巾之錯者出立于戶西西上滅燭出祝闔戶先降自西階婦人踊奠者由重南東丈夫踊賔出婦人踊主人拜送哭止乃奠奠則禮畢矣今文無拜衆主人出婦人踊出門哭止皆復位闔門主人卒拜送賔揖衆主人乃就次朔月奠用特豚魚腊陳三鼎如初東方之饌亦如之朔月月朔日也自大夫以上月半又奠如初者謂大斂時無籩有黍稷用瓦敦有蓋當籩位黍稷併於甒北也於是始有黍稷死者之於朔月月半猶平常之朝夕大祥之後則四時祭焉主人拜賔如朝夕哭卒徹徹宿奠也舉鼎入升皆如初奠之儀卒朼釋匕于鼎俎行朼者逆出甸人徹鼎其序醴酒菹醢黍稷俎俎行者俎後執執俎者行鼎可以出其序升入之次其設于室豆錯俎錯腊特黍稷當籩位敦啓會卻諸其南醴酒位如初當籩位俎南黍稷東稷會蓋也今文無敦祝與執豆者巾乃出共爲之也主人要節而踊皆如朝夕哭之儀月半不殷奠殷盛也士月半不復如朔盛奠下尊者有薦新如朔奠薦五榖若時果物新出者徹朔奠先取醴酒其餘取先設者敦啓會面足序出如入啓㑹徹時不復蓋也面足執之令足間鄕前也敦有足則敦之形如今酒敦其設于外如於室外序西南筮宅冡人營之宅葬居也冡人有司掌墓地兆域者營猶度也詩云經之營之掘四隅外其壤掘中南其壤爲葬將北首故也旣朝哭主人皆徃兆南北面免絰兆域也所營之處免絰者求吉不敢純凶命筮者在主人之右命尊者冝由右出也少儀曰賛幣自左詔辭自右筮者東面抽上韇兼執之南面受命韇藏筴之器也兼與筴執之今文無兼命曰哀子某爲其父某甫筮宅度兹幽宅兆基無有後艱某甫其字也若言山甫孔甫矣宅居也度謀也兹此也基始也言爲其父筮葬居今謀此以爲幽冥居兆域之始得無後將有艱難乎艱難謂有非常若崩壞也孝經曰卜其宅兆而安庴之古文無兆基作期筮人許諾不述命右還北面指中封而筮卦者在左述循也旣受命而申言之曰述不述者士禮略凡筮因㑹命筮爲述命中封中央壤也卦者識爻卦畫地者古文述皆作術卒筮執卦以示命筮者命筮者受視反之東面旅占卒進告于命筮者與主人占之曰從卒筮卦者寫卦示主人乃受而執之旅衆也反與其屬共占之謂掌連山歸藏周易者從猶吉也主人絰哭不踊若不從筮擇如初儀更擇地而筮之歸殯前北面哭不踊易位而哭明非常旣井椁主人西面拜工左還椁反位哭不踊婦人哭于堂旣巳也匠人爲椁刋治其材以井構於殯門外也反位拜位也旣哭之則徃施之竁中矣主人還椁亦以旣朝哭矣獻材于殯門外西面北上綪主人徧視之如哭椁獻素獻成亦如之材明器之材視之亦拜工左還形法定爲素飾治畢爲成卜日旣朝哭皆復外位卜人先奠龜于西塾上南首有席楚焞置于燋在龜東楚荆也荆焞所以鑚灼龜者燋炬也所以燃火者也周禮菙氏掌共燋契以待卜事凡卜以明火爇燋遂灼其焌契以授卜師遂以役之族長涖卜及宗人吉服立于門西東面南上占者三人在其南北上卜人及執燋席者在塾西族長有司掌族人親䟽者也涖臨也吉服服玄端也占者三人掌玉兆瓦兆原兆者也在塾西者南面東上闔東扉主婦立于其内扉門罪也席于闑西閾外爲卜者也古文闑作𣙗閾作蹙宗人吿事具主人北面免絰左擁之涖卜即位于門東西面涖卜族長也更西面當代主人命卜卜人抱龜燋先奠龜西首燋在北旣奠燋又執龜以待之宗人受卜人龜示髙以龜腹甲高起所當灼處示涖卜也涖卜受視反之宗人還少退受命受涖卜命授龜冝近受命冝郤也命曰哀子某來日某卜葬其父某甫考降無有近悔考登也降下也言卜此日葬魂神上下得無近於咎悔者乎許諾不述命還即席西面坐命龜興授卜人龜負東扉宗人不述命亦士禮略凡卜述命命龜異龜重威儀多也負東扉俟龜之兆也卜人坐作龜興作猶灼也周禮卜人凡卜事示高揚火以作龜致其墨興起也宗人受龜示涖卜涖卜受視反之宗人退東面乃旅占卒不釋龜告于涖卜與主人占曰某日從不釋龜復執之也古文曰爲日授卜人龜吿于主婦主婦哭不執龜者下主人也吿于異爵者使人告于衆賔衆賔僚友不來者也卜人徹龜宗人吿事畢主人絰入哭如筮宅賔出拜送若不從卜宅如初儀儀禮卷第十二經三千三百九十六字注五千四百五十九字
