body:
  text: 士喪禮第十二士喪禮第十二士喪禮死于適室幠用斂衾復者一人以爵弁服簪裳于衣左何之扱領于帶升自前東榮中屋北面招以衣曰皋某復三降衣于前受用篋升自阼階以衣尸復者降自後西榮楔齒用角柶綴足用燕几奠脯醢醴酒升自阼階奠于尸東帷堂乃赴于君主人西階東南面命赴者拜送有賓則拜之入坐于床東眾主人在其後西面婦人俠床東面親者在室眾婦人戶外北面眾兄弟堂下北面君使人弔徹帷主人迎于寢門外見賓不哭先入門右北面弔者入升自西階東面主人進中庭弔者致命主人哭拜稽顙成踊賓出主人拜送于外門外君使人襚徹帷主人如初襚者左執領右執要入升致命主人拜如初襚者入衣尸出主人拜送如初唯君命出升降自西階遂拜賓有大夫則特拜之即位于西階下東面不踊大夫雖不辭入也親者襚不將命以即陳庶兄弟襚使人以將命于室主人拜于位委衣于尸東床上朋友襚親以進主人拜委衣如初退哭不踊徹衣者執衣如襚以適房為銘各以其物亡則以緇長半幅䞓末長終幅廣三寸書銘于末曰某氏某之柩竹杠長三尺置于宇西階上甸人掘坎于階閒少西為垼于西墻下東鄉新盆槃瓶廢敦重鬲皆濯造于西階下陳襲事于房中西領南上不綪明衣裳用布鬠笄用桑長四寸纋中布巾環幅不鑿掩練帛廣終幅長五尺析其末瑱用白纊幎目用緇方尺二寸䞓裏著組繫握手用玄纁裏長尺二寸廣五寸牢中旁寸著組繫決用正王棘若檡棘組繫纊極二冒緇質長與手齊䞓殺掩足爵弁服純衣皮弁服褖衣緇帶韎韐竹笏夏葛屨冬白屨皆繶緇純組綦繫于踵庶襚繼陳不用貝三實于笲稻米一豆實於筐沐巾一浴巾二皆用綌於笲櫛於簞浴衣於篋皆饌于西序下南上管人汲不說繘屈之祝淅米于堂南面用盆管人盡階不升堂受潘煮于垼用重鬲祝盛米于敦奠于貝北士有冰用夷槃可也外御受沐入主人皆出戶外北面乃沐櫛挋用巾浴用巾挋用浴衣渜濯棄于坎蚤揃如他日鬠用組乃笄設明衣裳主人入即位商祝襲祭服褖衣次主人出南面左袒扱諸面之右盥于盆上洗貝執以入宰洗柶建于米執以從商祝執巾從入當牖北面徹枕設巾徹楔受貝奠于尸西主人由足西床上坐東面祝又受米奠于貝北宰從立于床西在右主人左扱米實于右三實一貝左中亦如之又實米唯盈主人襲反位商祝掩瑱設幎目乃屨綦結于跗連絇乃襲三稱明衣不在筭設韐帶搢笏設決麗于𢯲自飯持之設握乃連𢯲設冒櫜之幠用衾巾柶鬊蚤埋于坎重木刊鑿之甸人置重于中庭參分庭一在南夏祝鬻餘飯盛用二鬲于西牆下幂用䟽布久之繫用靲縣于重幂用葦席北面左衽帶用靲賀之結于後祝取銘置于重厥明陳衣于房南領西上綪絞橫三縮一廣終幅析其末緇衾赬裏無紞祭服次散衣次凡十有九稱陳衣繼之不必盡用饌于東堂下脯醢醴酒幂奠用功布實于簞在饌東設盆盥于饌東有巾苴絰大鬲下本在左要絰小焉散帶垂長三尺牡麻絰右本在上亦散帶垂皆饌于東方婦人之帶牡麻結本在房床笫夷衾饌于西坫南西方盥如東方陳一鼎于寢門外當東塾少南西面其實特豚四鬄去蹄兩胉脊肺設扃鼏鼏西末素俎在鼎西西順覆匕東柄士盥二人以並東面立于西階下布席于戶內下莞上簟商祝布絞衾散衣祭服祭服不倒美者在中士舉遷尸反位設床笫于兩楹之閒衽如初有枕卒斂徹帷主人西面馮尸踊無筭主婦東面馮亦如之主人髺髮袒眾主人免于房婦人髽于室士舉男女奉尸侇于堂幠用夷衾男女如室位踊無筭主人出于足降自西階眾主人東即位婦人阼階上西面主人拜賓大夫特拜士旅之即位踊襲絰于序東復位乃奠舉者盥右執匕卻之左執俎橫攝之入阼階前西面錯錯俎北面右人左執匕抽扃予左手兼執之取鼏委于鼎北加扃不坐乃朼載載兩髀于兩端兩肩亞兩胉亞脊肺在於中皆覆進柢執而俟夏祝及執事盥執醴先酒脯醢俎從升自阼階丈夫踊甸人徹鼎巾待于阼階下奠于尸東執醴酒北面西上豆錯俎錯于豆東立于俎北西上醴酒錯于豆南祝受巾巾之由足降自西階婦人踊奠者由重南東丈夫踊賓出主人拜送于門外乃代哭不以官有襚者則將命擯者出請入告主人待于位擯者出告須以賓入賓入中庭北面致命主人拜稽顙賓升自西階出于足西面委衣如於室禮降出主人出拜送朋友親襚如初儀西階東北面哭踊三降主人不踊襚者以褶則必有裳執衣如初徹衣者亦如之升降自西階以東宵為燎于中庭厥明滅燎陳衣于房南領西上綪絞紟衾二君襚祭服散衣庶襚凡三十稱紟不在筭不必盡用東方之饌兩瓦甒其實醴酒角觶木柶毼豆兩其實葵菹芋蠃醢兩籩無縢布巾其實栗不擇脯四脡奠席在饌北斂席在其東掘肂見衽棺入主人不哭升棺用軸蓋在下熬黍稷各二筐有魚腊饌于西坫南陳三鼎于門外北上豚合升魚鱄鮒九腊左胖髀不升其他皆如初燭俟于饌東祝徹盥于門外入升自阼階丈夫踊祝徹巾授執事者以待徹饌先取醴酒北面其餘取先設者出于足降自西階婦人踊設于序西南當西榮如設于堂醴酒位如初執事豆北南面東上乃適饌帷堂婦人尸西東面主人及親者升自西階出于足西面袒士盥位如初布廣如初商祝布絞紟衾衣美者在外君襚不倒有大夫則告士舉遷尸復位主人踊無筭卒斂徹帷主人馮如初主婦亦如之主人奉尸斂于棺踊如初乃蓋主人降拜大夫之後至者北面視肂眾主人復位婦人東復位設熬旁一筐乃塗踊無筭卒塗祝取銘置于肂主人復位踊襲乃奠燭升自阼階祝執巾席從設于奧東面祝反降及執事執饌士盥舉鼎入西面北上如初載魚左首進鬐三列腊進柢祝執醴如初酒豆籩俎從升自阼階丈夫踊甸人徹鼎奠由楹內入于室醴酒北面設豆右菹菹南栗栗東脯豚當豆魚次腊特于俎北醴酒在籩南巾如初既錯者出立于戶西西上祝後闔戶先由楹西降自西階婦人踊奠者由重南東丈夫踊賓出婦人踊主人拜送于門外入及兄弟北面哭殯兄弟出主人拜送于門外眾主人出門哭止皆西面于東方闔門主人揖就次君若有賜焉則視斂既布衣君至主人出迎于外門外見馬首不哭還入門右北面及眾主人袒巫止于廟門外祝代之小臣二人執戈先二人後君釋采入門主人辟君升自阼階西鄉祝負墉南面主人中庭君哭主人哭拜稽顙成踊出君命反行事主人復位君升主人主人西楹東北面升公卿大夫繼主人東上乃斂卒公卿大夫逆降復位主人降出君反主人主人中庭君坐撫當心主人拜稽顙成踊出君反之復初位眾主人辟于東壁南面君降西鄉命主人馮尸主人升自西階由足西面馮尸不當君所踊主婦東面馮亦如之奉尸斂于棺乃蓋主人降出君反之入門左視塗君升即位眾主人復位卒塗主人出君命之反奠入門右乃奠升自西階君要節而踊主人從踊卒奠主人出哭者止君出門廟中哭主人不哭辟君式之貳車畢乘主人哭拜送襲入即位眾主人襲拜大夫之後至者成踊賓出主人拜送三日成服杖拜君命及眾賓不拜棺中之賜朝夕哭不辟子卯婦人即位于堂南上哭丈夫即位于門外西面北上外兄弟在其南南上賓繼之北上門東北面西上門西北面東上西方東面北上主人即位辟門婦人拊心不哭主人拜賓旁三右還入門哭婦人踊主人堂下直東序西面兄弟皆即位如外位卿大夫在主人之南諸公門東少進他國之異爵者門西少進敵則先拜他國之賓凡異爵者拜諸其位徹者盥于門外燭先入升自阼階丈夫踊祝取醴北面取酒立于其東取豆籩俎南面西上祝先出酒豆籩俎序從降自西階婦人踊設于序西南直西榮醴酒北面西上豆西面錯立于豆北南面籩俎既錯立于執豆之西東上酒錯復位醴錯于西遂先由主人之北適饌乃奠醴酒脯醢升丈夫踊入如初設不巾錯者出立于戶西西上滅燭出祝闔戶先降自西階婦人踊奠者由重南東丈夫踊賓出婦人踊主人拜送眾主人出婦人踊出門哭止皆復位闔門主人卒拜送賓揖眾主人乃就次朔月奠用特豚魚腊陳三鼎如初東方之饌亦如之無籩有黍稷用瓦敦有蓋當籩位主人拜賓如朝夕哭卒徹舉鼎入升皆如初奠之儀卒朼釋匕于鼎俎行朼者逆出甸人徹鼎其序醴酒菹醢黍稷俎其設于室豆錯俎錯腊特黍稷當籩位敦啟會卻諸其南醴酒位如初祝與執豆者巾乃出主人要節而踊皆如朝夕哭之儀月半不殷奠有薦新如朔奠徹朔奠先取醴酒其餘取先設者敦啟會面足序出如入其設于外如於室筮宅冢人營之掘四隅外其壤掘中南其壤既朝哭主人皆往兆南北面免絰命筮者在主人之右筮者東面抽上韇兼執之南面受命命曰哀子某為其父某甫筮宅度茲幽宅兆基無有後艱筮人許諾不述命右還北面指中封而筮卦者在左卒筮執卦以示命筮者命筮者受視反之東面旅占卒進告于命筮者與主人占之曰從主人絰哭不踊若不從筮擇如初儀歸殯前北面哭不踊既井椁主人西面拜工左還椁反位哭不踊婦人哭于堂獻材于殯門外西面北上綪主人徧視之如哭椁獻素獻成亦如之卜日既朝哭皆復外位卜人先奠龜于西塾上南首有席楚焞置于燋在龜東族長涖卜及宗人吉服立于門西東面南上占者三人在其南北上卜人及執燋席者在塾西闔東扉主婦立于其內席于闑西閾外宗人告事具主人北面免絰左擁之涖卜即位于門東西面卜人抱龜燋先奠龜西首燋在北宗人受卜人龜示高涖卜受視反之宗人還少退受命命曰哀子某來日某卜葬其父某甫考降無有近悔許諾不述命還即席西面坐命龜興授卜人龜負東扉卜人坐作龜興宗人受龜示涖卜涖卜受視反之宗人退東面乃旅占卒不釋龜告于涖卜與主人占曰某日從授卜人龜告于主婦主婦哭告于異爵者使人告于眾賓卜人徹龜宗人告事畢主人絰入哭如筮宅賓出拜送若不從卜擇如初儀
